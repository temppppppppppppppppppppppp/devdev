# ============================================================================
# [Phase 5-B-1] Validation & Guard Settings — Single Source of Truth (YAML)
#
# 이 파일의 값은 constants.py 하드코드와 동일한 기본값입니다.
# ConfigManager.get_guard_threshold() / get_validation_policy()로 접근하며,
# 키 누락 시 Python 기본값으로 안전 fallback합니다.
#
# 주의: 값 변경 시 기존 심사 품질에 영향을 줄 수 있습니다.
# ============================================================================

# ── 원고 분량 ────────────────────────────────────────────────
manuscript:
  min_length: 4000           # BLOCKING — 이 미만 자동 REJECT
  warning_length: 4500       # SCORING 감점 시작
  target_length: 5000        # 작가 지시 목표
  max_length: 15000          # 절대 상한

# ── 장면(Scene) 구성 ────────────────────────────────────────
scene:
  target_count: 6            # 목표 장면 수
  min_count: 4               # 최소 장면 수 (blocking)
  min_scene_length: 300      # 장면당 최소 글자

# ── 스코프 검증 ──────────────────────────────────────────────
scope:
  chars_per_scene: 1500      # 장면당 기준 글자수
  overflow_ratio: 1.2        # 초과 비율 임계값

# ── SCORING 검증 ─────────────────────────────────────────────
scoring:
  quality_gate_score: 90
  default_pass_threshold: 70
  genre_thresholds:
    wuxia: 70
    hunter: 68
    investment: 72
    fantasy: 70
    composer: 71
    cooking: 70
    alt_history: 72
    actor: 70
    sports: 69
    medical: 72
  breakdown:
    character_consistency: 15
    emotion_arc: 15
    dialogue_quality: 15
    commercial_appeal: 15
    pattern_diversity: 10
    reader_satisfaction: 10

# ── ADVISORY 검증 ────────────────────────────────────────────
advisory:
  max_suggestions: 5
  pacing_para_limit: 2000

pre_llm:
  repetition_score_threshold: 0.6

# ── CONTINUITY 검증 ──────────────────────────────────────────
continuity:
  personality_proximity: 150  # NPC 이름 주변 탐색 글자수

# [V71] Gemini context usage settings
context:
  mandatory_context_max: 80000
  director_mandatory_max: 40000
  lookback_excerpt_chars: 500
  lookback_total_chars: 4000
  vector_max_results_s4: 16
  vector_max_results_s2: 12
  cache_merge_chars_per_ep: 4000

# ── 재시도 제한 ──────────────────────────────────────────────
retry:
  director_max_attempts: 5
  analyst_max_attempts: 5
  architect_max_attempts: 5
  writer_max_attempts: 5
  blueprint_max_attempts: 12
  cache_ttl_seconds: 86400   # 24시간
  api_timeout_seconds: 300   # 5분

# ── 집필 제한 ────────────────────────────────────────────────
# [xfail-sweep] writing: unused - planned future wiring
writing:
  max_retry_per_episode: 5
  min_episode_loop_guard: 5
  max_failure_streak: 3

# ── 검증 임계값 ──────────────────────────────────────────────
# [xfail-sweep] thresholds: unused - planned future wiring
thresholds:
  tactical_duplicate: 0.98
  pattern_min_hits: 1
  min_tactical_doc_length: 100
  max_tactical_doc_length: 5000
  min_blueprint_length: 500
  max_blueprint_length: 8000
  min_cache_content_length: 1500
  hud_change: 0.1

# ── 패치 모드 ────────────────────────────────────────────────
# [xfail-sweep] patch_mode: unused - planned future wiring
patch_mode:
  rewrite_below: 50          # 미만: 전면 재작성
  patch_below: 80            # 50~80: 부분 수정

# ── 권/아크 설정 ─────────────────────────────────────────────
# [xfail-sweep] volume: unused - planned future wiring
volume:
  arcs_per_volume: 5
  episodes_per_arc: 5
  min_episodes_per_arc: 3
  max_episodes_per_arc: 7

# ── Premium 품질 시스템 ──────────────────────────────────────
premium:
  repetition:
    window_size: 5
    threshold: 3
    min_phrase_length: 5
    clean_score_min: 0.85
  emotion:
    variance_min: 0.5
    history_window: 5
    min_episodes_for_check: 3
    negative_alert_avg: -1.0
    positive_alert_avg: 1.0
    max_history_size: 50
  anchor:
    recent_window: 10
    recency_bonus_threshold: 5
    recency_bonus_score: 10
    extraction_limit: 5
    max_storage: 1000
    compression_threshold: 5000
    compressed_part_size: 2000

# ── 품질 회귀 감지 ─────────────────────────────────────────
quality_regression:
  window: 5                    # 추세 분석 윈도우 (최근 N화)
  min_samples: 2               # 최소 데이터 수 (미만이면 skip)
  drop_threshold: 20           # 직전 대비 N점 이상 하락 시 regression
  warning_threshold: 10        # N점 이상 하락 시 경고 (regression 미만)

# ── NPC 과잉 등장 경고 ────────────────────────────────────────
npc_exposure:
  max_mentions_per_episode: 15   # NPC 1명 기준 최대 언급 횟수 (초과 시 advisory WARNING)
  min_name_length: 2             # 이 미만 글자수 NPC 이름은 skip (1글자 오탐 방지)

# ── 적응형 임계값 제어 ──────────────────────────────────────────
adaptive_threshold:
  floor: 60                      # 임계값 하한 (이 아래로 내려가지 않음)
  floor_hit_reset: 3             # 바닥 N회 연속 도달 시 consecutive_passes 리셋
  cascade_cap_passes: 10         # N연속 통과 후 improving_quality 조정 0으로 고정
  ambiguous_lower: 70            # self-consistency 투표 하한
  ambiguous_upper: 85            # self-consistency 투표 상한
  soft_margin: 2                 # 경계 ±N점 소프트 마진 (확률적 멀티보팅)

# ── 클리프행어 설정 ────────────────────────────────────────────
cliffhanger:
  target_strength: 40            # 이 미만이면 advisory WARNING (비차단)

# ── 크로스 에피소드 반복 감지 ────────────────────────────────────
cross_episode_repetition:
  enabled: true
  lookback_episodes: 5          # 최근 N화 대비 비교
  min_sentence_length: 15       # 이 미만 글자 문장은 핑거프린트 제외
  overlap_warning: 3            # N건 이상 반복 시 WARNING
  overlap_regression: 6         # N건 이상 반복 시 강한 WARNING (regression)

# ── 만족도 좌절-보상 타이머 ────────────────────────────────────
satisfaction:
  frustration_warning_streak: 3    # 좌절 N화 연속 시 WARNING (보상 에피소드 권장)
  frustration_critical_streak: 5   # 좌절 N화 연속 시 강한 WARNING (대리만족 부재 심각)

# ── 기능 플래그 ──────────────────────────────────────────────
feature_flags:
  enable_patch_mode: true
  enable_npc_history: true
  enable_world_state: true
  enable_fact_ledger: true
  enable_chain_links: true
  enable_volume_summaries: true

# Smart Context Retrieval (SC-0~6)
smart_retrieval:
  enabled: false
  stage2_enabled: false
  stage3_enabled: false
  stage4_enabled: false
  director_enabled: false
  stage2_total_budget: 20000
  stage3_total_budget: 30000
  stage4_total_budget: 50000
  director_total_budget: 20000
  max_queries_per_plan: 8
