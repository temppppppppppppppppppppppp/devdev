# ============================================================================
# [Phase 5-B-1] Validation & Guard Settings — Single Source of Truth (YAML)
#
# 이 파일의 값은 constants.py 하드코드와 동일한 기본값입니다.
# ConfigManager.get_guard_threshold() / get_validation_policy()로 접근하며,
# 키 누락 시 Python 기본값으로 안전 fallback합니다.
#
# 주의: 값 변경 시 기존 심사 품질에 영향을 줄 수 있습니다.
# ============================================================================

# ── 원고 분량 ────────────────────────────────────────────────
manuscript:
  min_length: 4000           # BLOCKING — 이 미만 자동 REJECT
  warning_length: 4500       # SCORING 감점 시작
  target_length: 5000        # 작가 지시 목표
  max_length: 15000          # 절대 상한

# ── 장면(Scene) 구성 ────────────────────────────────────────
scene:
  min_scene_length: 300      # 장면당 최소 글자

# ── 스코프 검증 ──────────────────────────────────────────────
scope:
  chars_per_scene: 1500      # 장면당 기준 글자수
  overflow_ratio: 1.2        # 초과 비율 임계값
  min_beats_floor: 1         # [TF7-P2-08] 최소 비트 하한
  min_avg_words: 4           # [TF-39] was 6
  min_word_per_beat: 3       # [TF-39] was 4
  min_diversity: 0.6         # [TF7-P2-08] 최소 다양성 점수
  max_stagnation_hits: 3     # [TF7-P2-08] 정체 허용 최대 횟수

# ── SCORING 검증 ─────────────────────────────────────────────
scoring:
  quality_gate_score: 90              # [TF-28b] Stage 2/3/4 전 스테이지 통일 QualityGate
  default_pass_threshold: 60  # [TF-26] Director 실사용값 반영 (70→60)
  genre_thresholds:
    wuxia: 70
    hunter: 68
    investment: 72
    fantasy: 70
    composer: 71
    cooking: 70
    alt_history: 72
    actor: 70
    sports: 69
    medical: 72
  sanitize_max_chars: 3000   # [TF7-P2-08] sanitize 최대 글자수
  cv_optimal_low: 0.35       # [TF7-P2-08] CV 최적 하한
  cv_optimal_high: 0.55      # [TF7-P2-08] CV 최적 상한
  wuxia_martial_min: 3       # [TF7-P2-08] 무협 무공 묘사 최소 수
  hunter_system_min: 5       # [TF7-P2-08] 헌터물 시스템 언급 최소 수
  breakdown:
    character_consistency: 15
    emotion_arc: 15
    dialogue_quality: 15
    commercial_appeal: 15
    pattern_diversity: 10
    reader_satisfaction: 10

# ── ADVISORY 검증 ────────────────────────────────────────────
advisory:
  max_suggestions: 5
  pacing_para_limit: 2000

pre_llm:
  repetition_score_threshold: 0.6

# ── CONTINUITY 검증 ──────────────────────────────────────────
continuity:
  personality_proximity: 150  # NPC 이름 주변 탐색 글자수

# [V71] Gemini context usage settings
# [감리3차] Gemini 3.x Pro = 1M tokens = 한글 약 500K자. 보수적 제약 정상화.
context:
  max_context_chars: 1000000         # [TF-25-04] smart_truncate 상한 (SSOT — constants.py _LazyThreshold)
  mandatory_context_max: 400000      # [1M-CTX-P0] 200000 → 400000 (모델 용량 80%)
  director_mandatory_max: 400000     # [1M-CTX-P0] 200000 → 400000 (Writer와 동일; 모델 용량 80%)
  director_arc_state_constraints_max: 4000
  director_arc_joint_docs_max: 4000
  director_arc_block_summary_max: 12000
  director_arc_prev_context_max: 24000
  director_arc_constraint_max: 12000
  director_arc_advisory_max: 12000
  lookback_excerpt_chars: 5000       # [1M-CTX-P0] 2000 → 5000 (화별 요약 2.5배)
  lookback_total_chars: 40000        # [1M-CTX-P0] 15000 → 40000 (전체 lookback 2.7배)
  vector_max_results_s4: 50   # [1M-CTX-P0] 20 → 50 — recall 2.5배 향상
  vector_max_results_s2: 40   # [1M-CTX-P0] 16 → 40 — recall 2.5배 향상
  cache_merge_chars_per_ep: 4000
  canonical_facts_budget: 13000   # [Phase1-L0] L0 고정 예산
  timeline_budget: 3000           # [Phase3] 타임라인 고정 예산

# ── 재시도 제한 ──────────────────────────────────────────────
retry:
  director_max_attempts: 10
  analyst_max_attempts: 10
  api_timeout_seconds: 300   # 5분

# ── 패치 모드 ────────────────────────────────────────────────
# [E-1] patch_mode: 점수 기반 수정 모드 분기 (fix_scope 우선, 점수 fallback)
patch_mode:
  rewrite_below: 50          # < 50: previous_best 파기 → 전면 재생성
  # patch_below: 80          # [E-1] 미사용 — fix_scope 기반 라우팅으로 대체됨
  inplace_below: 60          # >= 60: in-place 단일 LLM 수정 허용
  min_patched_length: 2000    # [PF-2] InPlace 패치 최소 글자 수
  inplace_min_success_rate: 30   # [PF-4] inplace 성공률(%) 진단 로그용 (디렉터 주권주의: 스킵 안 함)
  inplace_min_samples: 5         # [PF-4] 통계 최소 샘플 수
  inplace_max_change_ratio: 0.30   # [F-2] 30% 이상 변경 시 Director advisory 주입
  inplace_min_preserve_ratio: 0.70  # [TF-IPG] 원본 대비 70% 미만 축소 시 patch 폐기

# ── Premium 품질 시스템 ──────────────────────────────────────
premium:
  repetition:
    window_size: 5
    threshold: 3
    clean_score_min: 0.85

# ── 품질 회귀 감지 ─────────────────────────────────────────
quality_regression:
  window: 5                    # 추세 분석 윈도우 (최근 N화)
  min_samples: 2               # 최소 데이터 수 (미만이면 skip)
  drop_threshold: 20           # 직전 대비 N점 이상 하락 시 regression
  warning_threshold: 10        # N점 이상 하락 시 경고 (regression 미만)

# ── NPC 과잉 등장 경고 ────────────────────────────────────────
npc_exposure:
  max_mentions_per_episode: 15   # NPC 1명 기준 최대 언급 횟수 (초과 시 advisory WARNING)
  min_name_length: 2             # 이 미만 글자수 NPC 이름은 skip (1글자 오탐 방지)

# ── 적응형 임계값 제어 ──────────────────────────────────────────
adaptive_threshold:
  floor: 60                      # 임계값 하한 (이 아래로 내려가지 않음)
  floor_hit_reset: 3             # 바닥 N회 연속 도달 시 consecutive_passes 리셋
  cascade_cap_passes: 10         # N연속 통과 후 improving_quality 조정 0으로 고정
  ambiguous_lower: 50            # [TF-26] Director 실사용값 반영 (70→50)
  ambiguous_upper: 60            # [TF-26] Director 실사용값 반영 (85→60)
  soft_margin: 2                 # 경계 ±N점 소프트 마진 (확률적 멀티보팅)

# ── 클리프행어 설정 ────────────────────────────────────────────
cliffhanger:
  target_strength: 40            # 이 미만이면 advisory WARNING (비차단)

# ── 크로스 에피소드 반복 감지 ────────────────────────────────────
cross_episode_repetition:
  enabled: true
  lookback_episodes: 5          # 최근 N화 대비 비교
  min_sentence_length: 15       # 이 미만 글자 문장은 핑거프린트 제외
  overlap_warning: 3            # N건 이상 반복 시 WARNING
  overlap_regression: 6         # N건 이상 반복 시 강한 WARNING (regression)

# ── 만족도 좌절-보상 타이머 ────────────────────────────────────
satisfaction:
  frustration_warning_streak: 3    # 좌절 N화 연속 시 WARNING (보상 에피소드 권장)
  frustration_critical_streak: 5   # 좌절 N화 연속 시 강한 WARNING (대리만족 부재 심각)

# ── 장기 일관성(Retrospective) ─────────────────────────────────
retrospective:
  lookback_episodes: 10          # 최근 N화 비교 (LM-post-1: 5→10)

# ── 오케스트레이터 설정 ──────────────────────────────────────
orchestrator:
  use_pre_llm: true                # PreLLM 사전검증 활성화
  use_self_consistency: true       # Self-Consistency 투표 활성화
  consistency_votes: 3             # Self-Consistency 투표 수
  catharsis_max_gap: 3             # 좌절-보상 최대 허용 간격
  use_retrospective: true          # 장기 일관성 검증 활성화
  use_reflexion: true              # Reflexion 시스템 활성화
  use_adaptive_threshold: true     # 적응형 임계값 활성화
  max_parallel_workers: 3          # 병렬 검증 워커 수

# ── 기능 플래그 ──────────────────────────────────────────────
feature_flags:
  enable_patch_mode: true
  enable_state_text_verifier: true   # [V75] actual_truth ↔ 원고 교차 검증

# Smart Context Retrieval (SC-0~6)
smart_retrieval:
  enabled: true
  stage2_enabled: true
  stage3_enabled: true
  stage4_enabled: true
  director_enabled: true
  stage2_total_budget: 50000       # 20000 → 50000 (감리3차: 1M 토큰 기준 정상화)
  stage3_total_budget: 80000       # 30000 → 80000
  stage4_total_budget: 300000      # [1M-CTX-P0] 100000 → 300000 (원고 컨텍스트 3배)
  director_total_budget: 300000    # [1M-CTX-P0] 100000 → 300000 (심사 컨텍스트 3배)
  max_queries_per_plan: 8
  slot_max_chars_default: 3000     # 1500 → 3000 (슬롯당 정보 밀도 향상)
  max_npcs_per_slot: 5          # [TF7-P2-08] 슬롯당 최대 NPC 수
  # [Hybrid-P4] 하이브리드 검색 설정
  retrieval_mode: hybrid         # dense | hybrid | sparse
  dense_k: 20                    # [1M-CTX-P0] 10 → 20 — KNN 후보 수, recall +15~20%
  sparse_k: 10                   # FTS 후보 수
  rrf_k: 60                      # RRF k 파라미터

# ── 세션 로깅 (LOG-1) ──────────────────────────────────────
session_logging:
  enabled: true              # [V73] 활성화 — JSONL 전량 기록
  max_file_mb: 100           # 파일당 100MB
  max_rotations: 10          # 최대 10개 = 1GB 상한
  max_prompt_chars: 200000   # 프롬프트 절삭 상한

# ── Blueprint 사전검증 (TF-49b) ──────────────────────────────────
blueprint_preflight:
  enabled: true
  min_episode: 2              # 1화는 상태 없으므로 skip
  auto_patch_on_fail: true
  save_patched_to_db: true

pattern_tracker:
  lookback_episodes: 5          # 직전 몇 화 원고를 분석할지
  min_expression_freq: 2        # expression_ban 포함 최소 빈도
  enable: true                  # false 시 PatternTracker 전체 스킵

# ── Arc 생성 임계값 ───────────────────────────────────────────
arc:
  ns3b_divergence_threshold: 0.30  # [NS-3-B] arc_end_state vs genre_ext 목표 괴리 허용률
  jaccard_similarity_threshold: 0.50  # [TF-1-04] Stage2 Arc Jaccard 중복 감지 임계값

# ── 투자물 수치 검산 (Codex F) ───────────────────────────────
investment_math:
  python_tolerance: 0.15        # F-1 괴리 허용률 (15%)
  cash_tolerance: 0.05          # 현금 합산 허용률 (5%)
  total_assets_tolerance: 0.05  # 총자산 합산 허용률 (5%)
  arc_boundary_tolerance: 0.01  # Arc 경계 자본 허용률 (1%)
  max_leverage: 10              # 레버리지 상한
  flash_enabled: true           # F-2 Flash 호출 활성화

# ── 품질 게이트 파라미터 ─────────────────────────────────────────
quality:
  cliche_window: 10  # [TF-5-04] 클리셰 감지 윈도우 크기 (최근 N화)
  block_audit_pass_score: 70  # [TF-11-11] Director Block Audit LLM 폴백 임계값

# ── 앙상블 타임아웃 ─────────────────────────────────────────────
ensemble_timeouts_validation:
  consensus_total: 120  # [TF-6-06] ConsensusValidator 전체 합의 타임아웃 (초)

# ── 적응형 점수 클램프 ────────────────────────────────────────────
adaptive_grading:
  base_score_min: 45      # [TF-6-07] 적응형 기본 점수 하한
  base_score_max: 85      # [TF-6-07] 적응형 기본 점수 상한
  length_base_min: 3500   # [TF-6-07] 적응형 분량 기준 하한
  length_base_max: 6000   # [TF-6-07] 적응형 분량 기준 상한
