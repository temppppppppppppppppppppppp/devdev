  - "진기(眞氣)와 내공의 운용"
  - "초식(招式)의 형상화"
  - "강호의 은원(恩怨)"
  - "항렬과 예법"

# ── 경지 위계 (낮음→높음) ──
realm_hierarchy:
  - "입문"
  - "삼류"
  - "이류"
  - "일류"
  - "절정"
  - "초절정"
  - "화경"
  - "현경"
  - "귀신"
  - "선천"

# ── 경지별 사용 불가 기술 ──
realm_technique_limits:
  입문: ["검기", "검강", "이기어검", "비검", "장력", "경공"]
  삼류: ["검강", "이기어검", "비검", "강기", "투경"]
  이류: ["검강", "이기어검", "비검", "투경"]
  일류: ["이기어검", "비검", "투경"]
  절정: ["투경"]
  초절정: []
  화경: []
  현경: []

# ── 부상별 불가 행동 (정규식) ──
injury_action_limits:
  중상:
    - '\d{2,}근.*들'
    - '전력.*질주'
    - '경공.*전개'
    - '내공.*폭발'
  나약:
    - '\d{2,}근.*들'
    - '질주'
    - '도약'
    - '경공'
  기력 저하:
    - '내공.*운용'
    - '진기.*순환'
    - '장력'
    - '검기'
  단전 손상:
    - '내공'
    - '진기'
    - '단전'
    - '기해'

# ── 괄호 현대어 금지 패턴 ──
forbidden_modern_patterns:
  - pattern: '\(\s*약?\s*\d+\.?\d*\s*%\s*\)'
    reason: "퍼센트 표기 금지"
  - pattern: '\d+\.?\d*\s*%'
    reason: "퍼센트 기호 금지"
  - pattern: '\(\s*약?\s*\d+\.?\d*\s*(km|m|cm|mm|kg|g|mg)\s*\)'
    reason: "현대 단위 금지"
  - pattern: '\(\s*약?\s*\d+\.?\d*\s*(킬로미터|미터|센티미터|킬로그램|그램)\s*\)'
    reason: "현대 단위 금지"
  - pattern: '\d+\.?\d*\s*kg(?![가-힣])'
    reason: "현대 단위(kg) 금지 - 근(斤) 사용"
  - pattern: '\d+\.?\d*\s*cm(?![가-힣])'
    reason: "현대 단위(cm) 금지 - 촌(寸) 사용"
  - pattern: '\d+\.?\d*\s*m(?![가-힣km])'
    reason: "현대 단위(m) 금지 - 장(丈)/척(尺) 사용"
  - pattern: '\d+\.?\d*\s*km(?![가-힣])'
    reason: "현대 단위(km) 금지 - 리(里) 사용"
  - pattern: '[일이삼사오육칠팔구십백천만]+\s*킬로그램'
    reason: "한글 현대 단위(킬로그램) 금지 - 근(斤) 사용"
  - pattern: '[일이삼사오육칠팔구십백천만]+\s*킬로미터'
    reason: "한글 현대 단위(킬로미터) 금지 - 리(里) 사용"
  - pattern: '[일이삼사오육칠팔구십백천만]+\s*센티미터'
    reason: "한글 현대 단위(센티미터) 금지 - 촌(寸) 사용"
  - pattern: '[일이삼사오육칠팔구십백천만]+\s*미터(?!법)'
    reason: "한글 현대 단위(미터) 금지 - 장(丈)/척(尺) 사용"
  - pattern: '\(\s*약?\s*\d+\s*(시간|분|초)\s*\)'
    reason: "현대 시간 단위 금지"
  - pattern: '\(\s*[A-Za-z]{2,}\s*\)'
    reason: "영어 주석 금지"
  - pattern: '\(\s*(즉|다시 말해|쉽게 말해|예를 들어)\s*[,\s]'
    reason: "현대식 부연 설명 금지"
  - pattern: '현대의\s*기억'
    reason: "현대인 빙의 표현 금지 - 전생의 기억 사용"
  - pattern: '전생[,\s]*현대'
    reason: "현대인 빙의 표현 금지"
