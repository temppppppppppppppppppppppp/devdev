# ═══════════════════════════════════════════════════════════
# 투자물(INVESTMENT) 장르 가드 설정
# ═══════════════════════════════════════════════════════════

genre_name: "투자물(INVESTMENT)"
check_english: false   # 금융 용어에 영어 많음
check_numbers: false   # 정확한 수치 표기 필수
forbidden_terms:
  - "내공"
  - "진기"
  - "마나"
  - "스킬"
  - "던전"
  - "게이트"
  - "각성"
  - "헌터"
  - "검기"
  - "검강"
  - "초식"
  - "보법"
  - "무림"
  - "강호"
  - "문파"
  - "장로"
  - "마법"
  - "주문"
  - "포션"
  - "엘프"
  - "드워프"
  - "드래곤"
  - "오크"
  - "레벨업"
  - "경험치"
  - "스테이터스"
  - "인벤토리"
  - "버프"
  - "디버프"
  - "상태창"
  - "시스템 창"
  - "퀘스트"
  - "레이드"
  - "기공"
  - "경맥"
  - "혈도"
  - "단전"
  - "비급"

allowed_terms:
  - "PER"
  - "PBR"
  - "ROE"
  - "시가총액"
  - "공매도"
  - "레버리지"
  - "선물"
  - "옵션"
  - "ETF"
  - "IPO"
  - "M&A"
  - "배당"
  - "주가수익비율"
  - "마진콜"
  - "포트폴리오"
  - "리스크"
  - "헤지"
  - "벤처캐피탈"
  - "엔젤투자"
  - "PE"
  - "상장"
  - "비상장"
  - "CB"
  - "BW"
  - "유상증자"
  - "자사주매입"

mandatory_concepts:
  - "투자 전략과 분석의 논리적 근거"
  - "금융 시장의 현실적 메커니즘"
  - "리스크 관리와 포트폴리오 균형"
  - "경제 사건과 시장 반응의 개연성"

# ── 자산 등급 ──
wealth_hierarchy: ["무일푼", "서민", "중산층", "부자", "재벌2세", "재벌", "글로벌재벌"]

# ── 자산별 불가 행동 ──
wealth_action_limits:
  무일푼: ['대규모.*투자', '부동산.*매입', '기업.*인수']
  서민: ['수십억.*투자', '기업.*인수', '글로벌.*펀드']
  중산층: ['대형.*M&A', '글로벌.*헤지펀드']

# ── 투자 유형별 현실적 수익률 범위 (연%) ──
realistic_return_rates:
  주식: {min: -50, max: 100, warning_above: 50}
  부동산: {min: -20, max: 30, warning_above: 20}
  채권: {min: -5, max: 15, warning_above: 10}
  벤처투자: {min: -100, max: 1000, warning_above: 200}
  코인: {min: -90, max: 500, warning_above: 100}

# ── 상태별 불가 행동 ──
status_action_limits:
  파산:
    - '대규모.*투자'
    - '고급.*생활'
    - '기업.*인수'
  수사중:
    - '해외.*도피'
    - '자산.*은닉'
    - '주가.*조작'
  구속:
    - '투자.*활동'
    - '기업.*경영'
    - '자유.*이동'
