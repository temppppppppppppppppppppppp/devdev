# [V70] preflight_checker 프롬프트

PREFLIGHT_ANALYSIS_PROMPT: |
  [V60.12 PREFLIGHT CHECKER - 생성 전 완벽 분석]

  당신은 Arc 생성 전 모든 제약 조건을 분석하는 전문가입니다.
  다음 Arc를 설계하기 위해 이전 Arc들을 철저히 분석하세요.

  ### 분석 대상: Arc 1 ~ Arc {prev_arc_count}

  {prev_arcs_data}

  ### 분석 지시

  1. **아이템 타임라인 완전 분석**
     - 각 Arc에서 획득한 모든 아이템 (언제, 어디서, 어떻게)
     - 현재 주인공이 소지 중인 아이템 전체 목록
     - 소모/분실된 아이템과 그 시점

  2. **수여물/권한 타임라인**
     - 누구에게 무엇을 수여받았는지
     - 수여 후 위상 변화
     - 현재 보유 중인 모든 수여물

  3. **관계 상태 맵**
     - 주요 NPC별 현재 관계 상태
     - 관계 변화 이력 (언제, 왜 변했는지)

  4. **세계 상태**
     - 현재 위치
     - 알려진 정보
     - 진행 중인 갈등/사건 (아직 해결되지 않은 것만)
     - 완결된 갈등/사건 (이미 해결되어 재생성하면 안 되는 것)

  5. **다음 Arc 절대 금지 사항**
     - 이미 획득한 아이템 재획득 시도
     - 이미 수여받은 것 재수여
     - 위치 순간이동
     - 이미 완결된 갈등/사건의 동일 반복
     - 부상 무시

