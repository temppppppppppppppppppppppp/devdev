  {self._d._escape_braces(str(blueprint)[:1500])}

  ### 판정 기준 (완화됨)
  1. 분량 3,500자 이상: OK
  2. 치명적 설정 오류 없음: OK
  3. 최소한의 서사 진행: OK

  [Output Format] JSON Only
  {{
      "verdict": "PASS" 또는 "REJECT",
      "score": 0-100,
      "reason": "판정 사유",
      "critical_issues": ["치명적 문제 (있을 경우)"]
  }}
