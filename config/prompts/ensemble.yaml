  ### [Carryover Authority Packet - authoritative next-arc opening state]
  {carryover_authority_packet}
  - If this packet exists, open the arc from this state first.
  - `state_constraints.arc_start_state.location/equipment/injuries` must match this packet.
  - `tactical_doc` opening must not contradict this packet. If freeform carryover memory conflicts, the packet wins.
  - Items absent from this packet may appear only after explicit acquisition.

  ### [Episode Mission Packet - canonical per-episode mission authority]
  - `episode_details` is the canonical mission packet for episodes {ep_start}~{ep_end}.
  - Emit one ordered `episode_details` entry per episode first, then expand it into `tactical_doc`.
  - If `tactical_doc` and `episode_details` conflict, `episode_details` wins and prose must be rewritten.
  - Each `details` array must contain at least one concrete beat with actor, pressure, or state change.

  ### [Previous Arc Context - carryover reference]
