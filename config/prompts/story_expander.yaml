# [V70] story_expander 프롬프트 (인라인)


ANALYZE_CONCEPT__PROMPT: |
  다음 스토리 컨셉을 분석해서 핵심 요소를 추출하세요.

  ## 컨셉
  {concept}

  ## 출력 (JSON)
  ```json
  {{
    "title_suggestions": ["제목1", "제목2", "제목3"],
    "protagonist": {{
      "background": "배경",
      "unique_edge": "강점/치트키",
      "main_goal": "최종 목표",
      "starting_condition": "시작 상태"
    }},
    "timeline": {{
      "start_era": "시작 시점",
      "story_span": "스토리 기간"
    }},
    "suggested_genre": "investment/wuxia/hunter/fantasy/composer/cooking/alt_history/actor/sports/medical",
    "themes": ["테마1", "테마2"],
    "tone": "작품 톤"
  }}
  ```

GENERATE_PROTAGONIST_DETAIL__PROMPT: |
  주인공 상세 설정을 생성하세요.

  ## 기본 정보
  {json.dumps(proto, ensure_ascii=False)}

  JSON:
  ```json
  {{
    "name": "이름",
    "age": 나이,
    "core": {{"protagonist": "이름", "edge": "강점", "desire": "욕망", "crisis": "위기"}},
    "persona": "성격",
    "speech": {{"tone": "말투"}}
  }}
  ```

GENERATE_EXTENSION_BATCH__PROMPT: |
  기존 스토리를 이어서 Block {start_block}~{start_block+count-1}을 생성하세요.

  ## 장르
  {self.genre}

  ## 최근 블록 흐름
  {recent_context}
  {hint_section}

  ## 요구사항
  - 기존 흐름을 자연스럽게 계승
  - 각 블록에 새로운 갈등/해결 요소 포함
  - 캐릭터 성장과 스토리 진행을 균형있게

  ## 출력 (JSON)
  ```json
  [{{
    "block_id": "Block {start_block}",
    "title": "블록 제목",
    "content": {{
      "context": "배경 설명",
      "event_villain": "갈등/적대 요소",
      "solution": "해결 방향",
      "reward": "결과/보상"
    }}
  }}]
  ```

  정확히 {count}개 블록을 출력하세요.

GENERATE_SKELETON__PROMPT: |
  웹소설 {count}개 블록의 뼈대를 생성하세요.

  컨셉: {self.concept[:500]}
  장르: {self.genre}

  JSON:
  ```json
  [{{"block_id": "Block 1", "title": "제목", "summary": "요약"}}]
  ```

  {count}개 모두 출력.

