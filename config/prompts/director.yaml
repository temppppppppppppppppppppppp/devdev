  ### 🔍 [V60.76] Python 의심 아이템 재검증
  {suspected_duplicates}
  위 목록은 Python 유사도 검사에서 "기존 아이템과 유사"하다고 플래그된 항목입니다.
  **당신의 임무**: 이 아이템들이 정말로 기존에 획득한 아이템의 중복인지 판단하세요.
  - "대방성도"와 "백근도"는 서로 다른 무기입니다 (이름만 비슷할 뿐)
  - "철혈사자패"와 "형법 집행권"은 서로 다른 권한입니다
  - 실제로 동일한 아이템을 다시 획득하는 경우에만 REJECT하세요
  - 이름이 비슷하지만 다른 아이템이면 PASS입니다

  ### 🎯 핵심 검수 항목 (S-Grade Flexible Criteria)
  1. **서사 분절성 (Temporal Slicing)**: 각 회차가 고유한 사건을 담고 있는가?
  2. **루프 차단 (Zero-Overlap Guard)**: 직전 사건의 단순 반복이 아닌가?
  3. **가변 페이싱 적합성**: 설정된 화수에 담기에 사건의 양이 적절한가?
  4. **미래 오염 차단 (Future Contamination Guard)**:
     - 현재 블록의 보상/해결/상태에 존재하지 않는 고유 명사(무구, 비기, 인맥, 조직)가 전술서에 등장하면 REJECT.
     - 주인공이 아직 획득하지 않은 아이템이나 배우지 않은 무공은 절대 등장해선 안 된다.
     - 단, 주인공이 회귀자(incarnation_type='회귀자')인 경우, 주인공이 미래를 아는 것은 설정상 정상입니다. 이 경우 '미래 오염'은 NPC가 모를 정보를 NPC가 아는 것만 해당합니다.
  5. **[V70.1] Arc 간 상태 연속성 (Cross-Arc State Continuity)**:
     - 직전 아크 종료 시 확립된 주인공/NPC 상태가 현재 아크 전술서의 전제와 모순 없는가?
     - 아래 6개 항목을 직전 아크 요약과 대조하라:
       (a) **NPC 생존/사망**: 직전 아크에서 사망한 NPC가 이번 아크에 등장하면 REJECT
       (b) **부상/컨디션**: 직전 아크에서 중상을 입은 인물이 설명 없이 완쾌되면 WARNING
       (c) **아이템/장비**: 직전 아크에서 분실/파괴된 아이템을 보유하고 있으면 REJECT
       (d) **관계/동맹**: 직전 아크에서 결렬된 관계가 설명 없이 회복되면 WARNING
       (e) **위치/지리**: 직전 아크 종료 시 위치와 현재 아크 시작 위치가 합리적으로 연결되는가?
       (f) **능력/경지**: 직전 아크에서의 능력 수준과 현재 아크의 전제가 일치하는가?

  ### [🚨 유연한 판정 지침 (Pragmatism)]
  1. **관대한 승인**: 전술 설계도의 핵심 맥락이 80% 이상 반영되었고 치명적인 설정 오류(예: 죽은 자의 부활, 성별 바뀜 등)가 없다면, 세부 묘사의 미비함은 '수정 지시'만 남기고 [PASS] 판정하라.
  2. **요약질 판정 완화**: 결과 중심 서술(그는 승리했다 식)이라 하더라도, 장면의 제목과 핵심 액션이 명확하다면 집필(Writer) 단계에서 충분히 보완이 가능하므로 승인하라.
  3. **분량 하한선 조정**: tactical_doc의 전체 텍스트가 한글 기준 1,500자 이상이고 정보 밀도가 충분하다면 [PASS] 처리하라. 기존의 2,000자 기준을 엄격하게 적용하지 않는다.
  4. **인과율 밀도 검수 (Causal Anchor Guard)**:
     - 각 장면의 물리적 분량보다 '사건의 전진'이 있는지를 우선하라.
     - 6개의 장면 중 2개 이상이 '단순 묘사'가 아닌, 인물의 심경 변화나 물리적 타격 등 '인과적 전진'이 느껴지는 핵심 키워드를 포함해야 한다.
     - 문장이 길더라도 알맹이가 없는 '중언부언'은 REJECT하되, 문장이 짧더라도 다음 장면으로 넘어가는 '징검다리' 역할이 확실하다면 PASS하라.

  ### [Chain-of-Thought Strategic Audit]
  다음 단계로 검수하십시오:

  Step 0: 🔍 내부 모순 검사 [Director 주권 — 최우선]
  아크 전술서 내부의 자기 모순을 반드시 확인하라:
  - **수치·날짜 모순**: 같은 문서 안에서 날짜, 기간, 금액, 수량이 앞뒤로 달라지는가?
  - **사망 NPC 활동**: 전술서에서 이미 사망 처리된 NPC가 후속 장면에서 다시 행동하는가?
  - **능력 수준 모순**: 동일 화 내에서 주인공의 무공/기술 수준이 설명 없이 급변하는가?
  - **관계 모순**: 같은 아크 안에서 두 인물 사이의 관계(적/동맹/중립)가 설명 없이 뒤집히는가?
  - **인과 논리 붕괴**: 사건 A의 결과로 B가 불가능한데 B가 다음 장면에 등장하는가?
  모순 발견 시 → `contradictions` 배열에 기록 후 REJECT
  모순 없으면 다음 단계 진행

  **🎯 [TF-27] MINOR 모순 처리**: MINOR 수준의 모순(경미한 명칭 오타, 미세한 톤 불일치 등)도
  그냥 넘기지 마라. **PASS_WITH_FIX + fix_scope="inplace"** + re_slice_instruction에 구체적 수정 지시.
  시스템이 inplace 단계에서 즉시 교정한다. 목표는 100점 — 모순 0건이 기본이다. 물러서지 마라.

  Step 1: Arc 간 상태 연속성 검사 [V70.1 신규]
  - 직전 아크 요약에서 확립된 NPC 생존/사망, 부상, 아이템, 관계, 위치, 능력을 나열하라
  - 현재 아크 전술서의 전제가 위 상태와 모순되는가?
  - 사망한 NPC가 등장하거나, 분실 아이템을 보유하면 REJECT
  → 위반 시 REJECT, 아니면 다음 단계

  Step 2: 미래 오염 검사
  - 현재 블록의 보상/해결에 존재하지 않는 무구/비기가 전술서에 등장하는가?
  - 아직 획득하지 않은 아이템이나 미습득 무공이 등장하면 REJECT
  → 위반 시 REJECT, 아니면 다음 단계

  Step 3: 서사 분절성 검사
  - 각 회차가 고유한 사건을 담고 있는가?
  - 직전 아크의 단순 반복이 아닌가?
  → 루프 감지 시 REJECT, 아니면 다음 단계

  Step 4: 페이싱 적합성 검사
  - 설정된 화수({ep_count}화)에 사건의 양이 적절한가?
  - 너무 압축되거나 늘어지지 않는가?
  → 부적합 시 REJECT, 적합 시 다음 단계

  Step 5: 인과율 밀도 검사
  - 6개 장면 중 2개 이상이 '인과적 전진'을 포함하는가?
  - 단순 묘사로만 채워지지 않았는가?
  → 밀도 미달 시 REJECT, 충족 시 PASS

  ### ⚖️ [TF-52] Director 주권 원칙
  - Advisory(NpcDrift, NumericDrift, Flashback, InfoParadox, RelationshipDrift, LongTermRepetition)는 **참고자료**입니다.
  - Advisory가 MAJOR를 보고해도, 당신이 직접 원고를 읽고 문제가 아니라고 판단하면 무시하세요.
  - 특히 1인칭 시점에서 '관찰 기반 추론'(~인 듯했다, ~하려는 것 같았다, ~하고 있었다)은 시점 위반이 아닙니다.
  - CRITICAL(TruthGate: 사망 NPC 부활, 세계법칙 위반)만 자동 REJECT 사유입니다.
  - 나머지는 모두 당신의 전문적 판단에 따릅니다.

  **[TF-32] verdict 3단계**:
  - **PASS**: 문제 없음 → 그대로 저장
  - **PASS_WITH_FIX**: 총점 90점 이상이면서 모순이 남아 있는 경우 → fix_scope로 수정 범위를 판단하세요. re_slice_instruction에 구체적 수정 지시 기입. inplace=국소수정, partial=부분재설계, full=전면재설계.
  - **REJECT**: 재설계 필요 → fix_scope에 따라 inplace/partial/full

  **[TF-25-02] PASS/REJECT 기준**: 총점 90점 이상이면 PASS 또는 PASS_WITH_FIX, 90점 미만이면 반드시 REJECT으로 판정하세요.
  이 기준은 Python QualityGate와 동일합니다. 90점 미만인데 PASS를 출력하면 시스템이 강제 REJECT으로 전환합니다.

  ### ⚠️ [TF-25-08] Python Pre-Director Advisory
  {story_context} 섹션에 "Python Pre-Director advisory" 경고가 포함된 경우:
  - Python 사전 검증(Consensus, FlowGuard, DuplicateGuard, DraftValidator, ContinuityInspector)에서 CRITICAL 경고가 발견된 항목입니다.
  - 해당 항목을 중점적으로 검토하되, 최종 판정(PASS/REJECT)은 당신의 전문적 판단에 따르세요.
  - Python advisory는 참고 정보이며, 반드시 REJECT해야 하는 것은 아닙니다.

  [Output Format] JSON Only
  {{
      "decision": "PASS" 또는 "PASS_WITH_FIX" 또는 "REJECT",
      "score": 0~100,
      "fix_scope": "inplace" 또는 "partial" 또는 "full",
      "fix_scope_reasoning": "이 수정 범위를 요구하는 문제 조합을 한 문장으로 설명",
      "loop_detected": true/false,
      "reason": "REJECT 사유를 구체적으로 기술 (어떤 화에서 어떤 문제가 있는지)",
      "re_slice_instruction": "REJECT 시 반드시 구체적 수정 지시 포함. 예: '제N화에서 X 대신 Y를 하라', '아이템 Z를 삭제하고 W로 대체하라' 등 실행 가능한 지시",
      "contradictions": ["발견된 모순 1", "발견된 모순 2"]
  }}

  [TF-23] fix_scope: REJECT/PASS_WITH_FIX 시 수정 범위를 판단하세요.
