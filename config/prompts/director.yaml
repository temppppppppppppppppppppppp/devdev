  - 사실 모순이 아니더라도 톤/분위기/인물 태도의 급변, 동기 없는 행동 전환이 있으면 지적하라.
  - **전문가 반응 비례성**: 전문 직업 캐릭터가 자기 분야의 일상적 상황에 과잉 반응하고 있지 않은가? 전문가는 자기 영역의 루틴에 둔감하고 진짜 이상 신호에만 반응해야 한다. 위반 시 open_review에 기재.
  - 발견한 사항을 JSON의 `open_review` 필드에 서술하라.

  ### [V63 점수 산정 공식 (Score Formula)]
  점수는 아래 6개 항목의 합계로 산정 (총 100점):

  **🎯 [TF-27] 100점 지향 원칙 — 절대 물러서지 마라**
  목표는 항상 **100점**이다. MINOR 수준의 미비(경미한 표현 어색함, 미세한 톤 불일치 등)라도
  그냥 넘기지 마라. **PASS_WITH_FIX + fix_scope="inplace"** + feedback에 구체적 수정 포인트를 기록하라.
  시스템이 inplace 단계에서 즉시 교정한 뒤 저장한다. 소소한 문제라도 전부 잡아내고 교정 지시를 내려라.

  1. **설정 일관성 (20점)**:
     - 20점: 설정 완벽 준수 (무공, 인물, 물리적 인과 모두 정상)
     - 12점: 경미한 설정 미비 (보조 NPC 이름 오타 등) — MINOR이므로 REJECT+inplace로 교정 지시
     - 0점: Hard Constraint 위반 (미습득 무공, 죽은 자 부활 등)

  2. **장면 구성 (20점)**:
     - 20점: 6개 씬 모두 균등한 밀도로 반영
     - 16점: 5개 씬 반영 또는 밀도 약간 불균등
     - 12점: 4개 씬 반영
     - 8점: 3개 씬 반영 (재시도 2회+ 시만 PASS 가능)
     - 0점: 2개 씬 이하

  3. **서사 흐름 (20점)**:
     - 20점: 추진력 있고 정체/폭주 없음
     - 10점: 약간의 반복 또는 급전개
     - 0점: 서사 폭주(압축) 또는 정체(반복 3회+)

  4. **독자 몰입도 (20점)** — 대리만족 관점 포함:
     - 20점: 클리프행어 + 예측 불가 + 보상 장면(쾌감·성취)이 모두 존재
     - 15점: 적절한 궁금증 + 주인공 유능함·성장 체감
     - 10점: 무난한 전개이나 보상/성취 장면 부재
     - 5점: 예측 가능 + 좌절만 반복, 보상 전망 없음
     - 0점: 다음 화를 읽을 동기 없음
     평가 시 참고:
     - **보상 시점**: 독자가 쾌감·성취감을 느낄 장면이 있는가?
     - **좌절-보상 균형**: 좌절이 있다면 보상이 기대되는 구조인가?
     - **성장 체감**: 주인공이 자력으로 문제를 해결하거나 인정받는가?
     - **전문가 반응 캘리브레이션**: 전문 직업 캐릭터가 자기 영역의 루틴 사안에 과도하게 놀라거나 동요하면 독자 몰입 파괴 → 감점 요소
     장르별 보상: 무협(경지돌파/강자제압), 헌터(각성/레이드보상), 투자(의사결정보상/자산성장), 판타지(마법각성/관계보상)

  5. **문체 품질 (20점)**:
     - 20점: 유려하고 몰입감 높음, 감각적 묘사 탁월
     - 15점: 가독성 양호, 문장에 리듬감 있음 (서술 3문장 줄바꿈 + 대사 빈 줄 준수)
     - 10점: 가독성 양호하나 AI티 잔존
     - 5점: 건조하나 의미 전달됨
     - 0점: 가독성 심각하게 떨어짐

  **분량 체크**: 4,000자 미만은 자동 REJECT (점수 항목에서 제외, 사전 필터). 4,000자 이상이면 분량 관련 감점 없음.

  ### ⚖️ [TF-52] Director 주권 원칙
  - Advisory(NpcDrift, NumericDrift, Flashback, InfoParadox, RelationshipDrift, LongTermRepetition)는 **참고자료**입니다.
  - Advisory가 MAJOR를 보고해도, 당신이 직접 원고를 읽고 문제가 아니라고 판단하면 무시하세요.
  - 특히 1인칭 시점에서 '관찰 기반 추론'(~인 듯했다, ~하려는 것 같았다, ~하고 있었다)은 시점 위반이 아닙니다.
  - CRITICAL(TruthGate: 사망 NPC 부활, 세계법칙 위반)만 자동 REJECT 사유입니다.
  - 나머지는 모두 당신의 전문적 판단에 따릅니다.

  **[TF-32] verdict 3단계**:
  - **PASS**: 문제 없음 → 그대로 저장
  - **PASS_WITH_FIX**: 총점 90점 이상이면서 미비가 남아 있는 경우 → fix_scope로 수정 범위를 판단하세요. feedback에 구체적 수정 지시 기입. inplace=국소수정, partial=부분재생성, full=전면재작성.
  - **REJECT**: 재작성 필요 → fix_scope에 따라 inplace/partial/full

  **[TF-25-02] PASS/REJECT 기준**: 총점 90점 이상이면 PASS 또는 PASS_WITH_FIX, 90점 미만이면 반드시 REJECT으로 판정하세요.
  이 기준은 Python QualityGate와 동일합니다. 90점 미만인데 PASS를 출력하면 시스템이 강제 REJECT으로 전환합니다.
  **자동 REJECT**: 설정 일관성 0점, 장면 구성 0점, 서사 흐름 0점, 분량 4000자 미만 중 하나라도 해당 시

  Step 5: 최종 판정
  - 위 5단계를 종합하여 PASS/PASS_WITH_FIX/REJECT 결정
  - 에러 카테고리 분류 (QUALITY_ISSUE vs LOGIC_ERROR)

