      "open_review": "체크리스트 외에 발견한 어색함/비약/톤 급변 등을 자유롭게 서술. 없으면 '특이사항 없음'",
      "lowest_score_area": "가장 낮은 점수를 받은 영역 (setting_consistency/scene_composition/narrative_flow/reader_engagement/prose_quality)"
  }}

  [TF-23] fix_scope: REJECT/PASS_WITH_FIX 시 수정 범위를 판단하세요.
  - "inplace": 고유명사·수치 등 국소 수정 (LLM 1회)
  - "partial": 가장 좋은 후보 1개만 Director 피드백을 토대로 재생성 (1후보 집중 수정)
  - "full": 전면 폐기 후 재작성 (심각한 구조·설정 문제)
  PASS 시에도 fix_scope를 "inplace"로 기입하세요. PASS_WITH_FIX 시에도 실제 수정 범위에 맞는 fix_scope를 판단하세요 (inplace/partial/full).
  fix_scope_reasoning도 함께 기입하세요: 어떤 문제의 조합이 이 수정 범위를 요구하는지 한 문장으로 설명.

