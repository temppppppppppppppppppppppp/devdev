# [V70] emotion_tracker 프롬프트 (인라인)


GENERATE_RECOMMENDATION__RECOMMENDATION: |
  [🌱 웹소설 특화: 절망 속 희망 씨앗 삽입 필수]
  최근 {n_episodes}화 동안 부정적 감정(절망/좌절)이 지속되고 있습니다.
  웹소설 독자는 3화 이상 부정 감정이 지속되면 이탈합니다.

  [다음 에피소드 필수 요소]
  1. **주인공의 상황은 여전히 어렵지만**
  2. **작은 돌파구/희망 요소를 반드시 포함**:
     - 숨겨진 기연 발견 (고서, 영약, 비기)
     - 예상치 못한 조력자 출현
     - 적의 약점 포착
     - 새로운 깨달음/각성의 실마리
     - 과거 인연의 도움

  [연출 가이드]
  - 에피소드 마지막 20%에 "희망 씨앗" 배치
  - 독자에게 "이제 좀 나아지려나?" 기대감 제공
  - 완전 해결은 아니지만 "가능성"을 보여줌

  [예시 구조]
  - 80%: 절망 심화 (적의 포위, 내공 고갈, 배신 등)
  - 20%: 희망 발견 (바닥에 떨어진 고서 발견 → "이것은...?")

  [금지 사항]
  ❌ 5화 연속 절망 → 독자 우울증 유발
  ❌ 희망 없는 파국 → 독자 이탈
  ✅ 절망 속 작은 빛 → 독자 몰입 유지

GENERATE_RECOMMENDATION__RECOMMENDATION: |
  [⚡ 긴장감 회복 필수]
  최근 {n_episodes}화 동안 긍정적 감정(희망/승리)이 지속되고 있습니다.
  웹소설은 긴장과 이완의 리듬이 필요합니다.

  [다음 에피소드 필수 요소]
  1. **새로운 위기나 장애물 제시**:
     - 더 강력한 적 등장
     - 예상치 못한 배신
     - 시간 제약/데드라인
     - 소중한 것의 위협
     - 과거의 업보 회귀

  2. **승리의 댓가 암시**:
     - 힘을 쓴 후유증
     - 적이 남긴 복선
     - 새로운 적대 세력의 주목

  [연출 가이드]
  - 승리 직후 새로운 문제 발견
  - "한 고비 넘었지만 진짜는 이제부터"
  - 독자: "어? 이제 또 뭐가 나오는 거야?"

  [금지 사항]
  ❌ 5화 연속 승승장구 → 긴장감 제로
  ❌ 위기 없는 평탄함 → 지루함
  ✅ 승리 후 새로운 복선 → 긴장 유지
