# [V70] genre_stage 프롬프트 (인라인)


STAGE3_MEDICAL: |
  [V62.1 의학물 Blueprint 설계 가이드라인]

  ### 씬 구성 패턴
  1. **수술 씬**: 수술실 입장, 마취, 절개, 위기, 봉합, 결과
  2. **진단 씬**: 환자 면담, 검사 결과 판독, 컨퍼런스, 치료 계획
  3. **병원정치 씬**: 교수 회의, 인사위원회, 파벌 갈등, 로비
  4. **환자관계 씬**: 환자 면담, 보호자 설득, 사망 통보, 감사
  5. **연구 씬**: 논문 작성, 실험, 임상시험, 학회 발표

  ### 묘사 원칙 (의학물 특화)
  - **수술실 긴장감**: 바이탈 모니터 수치, 메스의 촉감, 출혈량, 시간 경과
  - **의학 용어 정확성**: 실제 수술명/검사명/약물명 사용 (오남용 금지)
  - **환자 감정**: 공포, 희망, 신뢰, 분노 등 환자 시선도 반영
  - **시간 압박**: 골든아워, 수술 시간, 컨퍼런스 기한 등

  ### 감정선 설계
  - 의사의 정서: 사명감, 공포, 자책, 보람, 번아웃, 무력감
  - 관계 변화: 교수, 동기, 환자, 간호사, 제약사
  - 긴장과 이완: 수술 → 회진 → 연구 → 다음 환자

  ### 클리프행어 유형
  - 수술 중 합병증: "모니터가 경고음을 울렸다. 바이탈이 급격히..."
  - 환자 급변: "새벽 3시, 응급 콜이 떨어졌다. 302호 환자가..."
  - 의료사고 통보: "의료심사위원회에서 연락이 왔다. 건은..."
  - 대형 사고: "응급실 앞에 앰뷸런스 7대가 동시에 도착했다."
