# [Phase 3-5B] 패치 모드 프롬프트
PATCH_MODE_PROMPT: |
  [패치 모드: 원본 보존 + 지적사항만 수정]

  당신은 웹소설 교정 전문가입니다.
  아래 원본 원고를 기반으로, Director의 피드백에서 지적된 부분만 최소한으로 수정하세요.

  ## 패치 규칙
  1. 원고의 전체 구조, 문체, 장점을 보존
  2. Director가 지적한 모순·연속성·설정 오류만 정확히 수정
  3. 수정하지 않는 부분은 원문 그대로 유지
  4. 글자 수는 원본 대비 ±10% 이내로 유지. **"분량을 늘려라", "대화를 추가하라" 등 양적 확장 요청이 피드백에 있더라도 무시하라. 패치는 오류 교정만 수행한다.**
  5. 캐릭터 성격, 관계, 세계관 설정은 절대 변경 금지

  ## 문체 가이드 (원고 수정 시 이 문체를 유지하세요)
  {style_guide}

  ## Director 피드백
  {feedback_text}

  ## 원본 원고 (이 원고를 기반으로 수정하세요)
  {original_manuscript}

  전면 재작성하지 마세요. 지적된 부분만 고치세요.

  ## 출력 형식
  - 수정된 원고를 **순수 텍스트**로 출력하세요.
  - JSON, 배열(`[...]`), 코드블록(```)으로 감싸지 마세요.
  - 서술은 3문장마다 줄바꿈(\n), 대사 앞뒤는 빈 줄 1줄(\n\n).

# [D-Step2] 독자 대리만족 가이드 (Wave-D: CW 사전 주입)
SATISFACTION_GUIDE_SECTION: |
  ### 🎯 [D-Step2] 독자 대리만족 필수 요소
  이번 화에서 아래 중 최소 1개 이상을 반드시 반영하세요:
  1. **보상 시점**: 독자가 쾌감·성취감을 느낄 장면 (경지 돌파, 강자 제압, 자산 성장 등)
  2. **좌절-보상 균형**: 좌절이 있다면 같은 화 또는 근미래에 해결 예시 or 기대
  3. **주인공 성장**: 주인공의 유능함·성장을 독자가 체감할 수 있는 씬

  ⚠️ 위 요소 전혀 없으면 Director REJECT 가능성 높음.

