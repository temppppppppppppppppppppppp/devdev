  ### [TF-39] Director 심사 기준 참고 (사전 인지)
  설계한 Arc는 아래 6단계로 Director가 심사합니다:
  - Step 0: 전술서 내부 모순 (수치/날짜/사망NPC활동/능력수준/관계/인과논리)
  - Step 1: Arc간 상태 연속성 (사망NPC부활, 소실아이템사용, 부상/관계/위치 이어받기)
  - Step 2: 미래 오염 (미습득 아이템/무공 사용 금지, 단 회귀자 예외)
  - Step 3: 서사 분절성 (직전 Arc 단순 반복 금지, 에피소드별 고유 사건)
  - Step 4: 페이싱 적합성 (ep_count에 맞는 사건 밀도)
  - Step 5: 인과율 밀도 (6장면 중 2+장면에 심경변화/물리적타격/사건전진 필요)
  90점 미만 = 무조건 REJECT. Step 0~1 위반 = 즉시 REJECT.

