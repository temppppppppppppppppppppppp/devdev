providers:
  gemini:
    enabled: true
    sdk: "google-genai"
    api_key_env: "GOOGLE_API_KEY"
  anthropic:
    enabled: true
    sdk: "anthropic"
    api_key_env: "ANTHROPIC_API_KEY"
    # AnthropicProvider falls back to CLAUDE_API when ANTHROPIC_API_KEY is absent.
  openai:
    enabled: false
    sdk: "openai"
    api_key_env: "OPENAI_API_KEY"
  vertex_ai:
    enabled: true
    sdk: "google-genai"
    auth_mode: "auto"
    # auth_mode=auto prefers VERTEX_API_KEY and falls back to project/location credentials.
    api_key_env: "VERTEX_API_KEY"
    project_id_env: "VERTEX_PROJECT_ID"
    location_env: "VERTEX_LOCATION"
    credentials_env: "GOOGLE_APPLICATION_CREDENTIALS"
    # Use explicit model prefixes to keep Gemini Developer API and Vertex AI side by side.
    # Example opt-in models:
    # - "vertexai:gemini-3.1-flash-lite-preview"
    # - "vertexai:gemini-2.5-flash"
  anthropic_vertex:
    enabled: false
    sdk: "anthropic"
    project_id_env: "VERTEX_PROJECT_ID"
    location_env: "VERTEX_LOCATION"
    # Claude on Vertex AI uses Vertex credentials, not ANTHROPIC_API_KEY.
    # Prefix convention: "anthropic-vertex:claude-sonnet-4-6"

agents:
  analyst: "vertexai:gemini-3.1-pro-preview"
  manager: "vertexai:gemini-2.5-flash"
  chief_writer: "vertexai:gemini-3.1-pro-preview"
  blueprint_ensemble: "vertexai:gemini-3.1-pro-preview"
  three_phase_blueprint_generator: "vertexai:gemini-3.1-pro-preview"
  state_locked_arc_generator: "vertexai:gemini-3.1-pro-preview"
  block_enricher: "vertexai:gemini-2.5-flash"
  preflight_checker: "vertexai:gemini-2.5-flash"
  state_extractor: "vertexai:gemini-2.5-flash"
  four_phase_arc_generator: "vertexai:gemini-3.1-pro-preview"
  continuity_inspector: "vertexai:gemini-3.1-pro-preview"
  director: "vertexai:gemini-3.1-pro-preview"
  arc_corrector: "vertexai:gemini-2.5-flash"
  arc_critic: "vertexai:gemini-2.5-flash"
  consensus_validator: "vertexai:gemini-2.5-flash"
  unified_arc_validator: "vertexai:gemini-2.5-flash"
  unified_blueprint_validator: "vertexai:gemini-2.5-flash"
  critic: "vertexai:gemini-2.5-flash"
  weaver: "vertexai:gemini-2.5-flash"
  writer: "vertexai:gemini-2.5-flash"

fallback_chain:
  "claude-opus-4-6": "vertexai:gemini-3.1-pro-preview"
  "claude-opus-4-20250514": "vertexai:gemini-3.1-pro-preview"
  "claude-sonnet-4-6": "vertexai:gemini-3.1-pro-preview"
  "claude-sonnet-4-20250514": "vertexai:gemini-3.1-pro-preview"
  "vertexai:gemini-3.1-pro-preview": "vertexai:gemini-2.5-pro"
  "vertexai:gemini-2.5-pro": "vertexai:gemini-2.5-flash"
  "vertexai:gemini-2.5-flash": "vertexai:gemini-2.5-flash"

sub_components:
  four_phase_arc_generator:
    preflight: "vertexai:gemini-2.5-flash"
    ensemble: "vertexai:gemini-3.1-pro-preview"
    validator: "vertexai:gemini-2.5-flash"
  three_phase_blueprint_generator:
    ensemble: "vertexai:gemini-3.1-pro-preview"
    validator: "vertexai:gemini-2.5-flash"

# role_constants follow the same live routing contract as agent defaults.
role_constants:
  pro_main: "vertexai:gemini-3.1-pro-preview"
  flash_main: "vertexai:gemini-2.5-flash"
  emergency: "vertexai:gemini-2.5-pro"
