providers:
  gemini:
    enabled: true
    sdk: "google-genai"
    api_key_env: "GOOGLE_API_KEY"
  anthropic:
    enabled: false
    sdk: "anthropic"
    api_key_env: "ANTHROPIC_API_KEY"
    # AnthropicProvider falls back to CLAUDE_API when ANTHROPIC_API_KEY is absent.
  openai:
    enabled: false
    sdk: "openai"
    api_key_env: "OPENAI_API_KEY"
  vertex_ai:
    enabled: false
    sdk: "google-genai"
    auth_mode: "api_key"
    # auth_mode=api_key keeps Gemini Vertex Express mode isolated from project credentials.
    api_key_env: "VERTEX_API_KEY"
    project_id_env: "VERTEX_PROJECT_ID"
    location_env: "VERTEX_LOCATION"
    credentials_env: "GOOGLE_APPLICATION_CREDENTIALS"
    # auth_mode=auto falls back from api_key_env to project/location+credentials.
    # Use explicit model prefixes to keep Gemini Developer API and Vertex AI side by side.
    # Example opt-in models:
    # - "vertexai:gemini-3.1-flash-lite-preview"
    # - "vertexai:gemini-2.5-flash"
  anthropic_vertex:
    enabled: false
    sdk: "anthropic"
    project_id_env: "VERTEX_PROJECT_ID"
    location_env: "VERTEX_LOCATION"
    # Claude on Vertex AI uses Vertex credentials, not ANTHROPIC_API_KEY.
    # Prefix convention: "anthropic-vertex:claude-sonnet-4-6"

agents:
  analyst: "gemini-3.1-pro-preview"
  manager: "gemini-2.5-flash"
  chief_writer: "gemini-3.1-pro-preview"
  blueprint_ensemble: "gemini-3.1-pro-preview"
  three_phase_blueprint_generator: "gemini-3.1-pro-preview"
  state_locked_arc_generator: "gemini-3.1-pro-preview"
  block_enricher: "gemini-2.5-flash"
  preflight_checker: "gemini-2.5-flash"
  state_extractor: "gemini-2.5-flash"
  four_phase_arc_generator: "gemini-3.1-pro-preview"
  continuity_inspector: "gemini-3.1-pro-preview"
  director: "gemini-3.1-pro-preview"
  arc_corrector: "gemini-2.5-flash"
  arc_critic: "gemini-2.5-flash"
  consensus_validator: "gemini-2.5-flash"
  unified_arc_validator: "gemini-2.5-flash"
  unified_blueprint_validator: "gemini-2.5-flash"
  critic: "gemini-2.5-flash"
  weaver: "gemini-2.5-flash"
  writer: "gemini-2.5-flash"

fallback_chain:
  "claude-opus-4-6": "claude-sonnet-4-6"
  "claude-opus-4-20250514": "claude-sonnet-4-20250514"
  "claude-sonnet-4-6": "gemini-3.1-pro-preview"
  "claude-sonnet-4-20250514": "gemini-3.1-pro-preview"
  "gemini-3.1-pro-preview": "gemini-2.5-pro"
  "gemini-2.5-pro": "gemini-2.5-flash"
  "gemini-2.5-flash": "gemini-2.5-flash"

sub_components:
  four_phase_arc_generator:
    preflight: "gemini-2.5-flash"
    ensemble: "gemini-3.1-pro-preview"
    validator: "gemini-2.5-flash"
  three_phase_blueprint_generator:
    ensemble: "gemini-3.1-pro-preview"
    validator: "gemini-2.5-flash"

# role_constants remain Gemini to limit blast radius outside the core agent map.
role_constants:
  pro_main: "gemini-3.1-pro-preview"
  flash_main: "gemini-2.5-flash"
  emergency: "gemini-3.1-pro-preview"
