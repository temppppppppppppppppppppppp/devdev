providers:
  gemini:
    enabled: true
    sdk: "google-genai"
    api_key_env: "GOOGLE_API_KEY"
  anthropic:
    enabled: false
    sdk: "anthropic"
    api_key_env: "ANTHROPIC_API_KEY"
  openai:
    enabled: false
    sdk: "openai"
    api_key_env: "OPENAI_API_KEY"
  vertex_ai:
    enabled: false
    sdk: "google-genai"
    project_id_env: "VERTEX_PROJECT_ID"
    location_env: "VERTEX_LOCATION"
    credentials_env: "GOOGLE_APPLICATION_CREDENTIALS"
    # Use explicit model prefixes to keep Gemini Developer API and Vertex AI side by side.
    # Example opt-in models:
    # - "vertexai:gemini-3.1-flash-lite-preview"
    # - "vertexai:gemini-2.5-flash"

agents:
  analyst: "gemini-2.5-pro"
  manager: "gemini-2.5-flash"
  chief_writer: "gemini-2.5-pro"
  blueprint_ensemble: "gemini-2.5-pro"
  three_phase_blueprint_generator: "gemini-2.5-pro"
  state_locked_arc_generator: "gemini-2.5-pro"
  block_enricher: "gemini-2.5-flash"
  preflight_checker: "gemini-2.5-flash"
  state_extractor: "gemini-2.5-flash"
  four_phase_arc_generator: "gemini-2.5-pro"  # [Phase2] Arc 방향 결정
  continuity_inspector: "gemini-2.5-pro"      # [Phase2] 250화 연속성 고도 추론
  director: "gemini-2.5-pro"                  # [Phase2] 내각제 원칙: 심판관≥CW
  arc_corrector: "gemini-2.5-flash"
  arc_critic: "gemini-2.5-flash"
  consensus_validator: "gemini-2.5-flash"
  unified_arc_validator: "gemini-2.5-flash"
  unified_blueprint_validator: "gemini-2.5-flash"
  critic: "gemini-2.5-flash"
  weaver: "gemini-2.5-flash"
  writer: "gemini-2.5-flash"

fallback_chain:
  "gemini-3.1-flash-lite-preview": "gemini-2.5-flash"
  "gemini-2.5-pro": "gemini-2.5-flash"
  "gemini-2.5-flash": "gemini-2.5-flash"

sub_components:
  four_phase_arc_generator:
    preflight: "gemini-2.5-flash"
    ensemble: "gemini-2.5-pro"  # [Phase2] Arc 앙상블 선택 = 스토리 핵심
    validator: "gemini-2.5-flash"
  three_phase_blueprint_generator:
    ensemble: "gemini-2.5-pro"
    validator: "gemini-2.5-flash"

# ── [SSOT] 추상 역할 상수 — constants.py AIModels에서 참조 ──────────────────
role_constants:
  pro_main: "gemini-2.5-pro"
  flash_main: "gemini-2.5-flash"  # 경량: module/analysis/summary 전용
  emergency: "gemini-2.5-pro" # 긴급/429 폴백
