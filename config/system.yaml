# ═══════════════════════════════════════════════════════════
# BaseAgent 운영 파라미터 (config/system.yaml)
# 이 파일이 없거나 파싱 실패 시 base_agent.py 하드코딩 폴백 사용
# ═══════════════════════════════════════════════════════════

# Gemini Thinking Level → Budget 토큰 변환
thinking_budget_map:
  minimal: 1024
  low: 4096
  medium: 8192
  high: 16384
  maximum: 24576

# API 호출 설정
api:
  delay: 0.1                 # 호출 간 딜레이 (초)
  timeout: 300               # 호출 타임아웃 (초) — thinking 모델 대응, validation.yaml과 통일
  max_output_tokens: 65536   # [TF9] 데이터 절단 방지 — gemini-2.5-pro 최대값
  # max_context_chars → validation.yaml context.max_context_chars로 이관 [TF-25-04]
  quota_cache_duration: 3600 # 쿼터 소진 캐시 유효시간 (초, 1시간)

# 네트워크 재시도 설정 (야간 무인 운영 대응)
network_retry:
  delay_base: 10             # 기본 대기 (초)
  delay_max: 30              # 최대 대기 (초, 백오프 상한)
  max_retries: 22            # 최대 재시도 (22회 ≈ ~10분)

# API 키 순환 설정
key_rotation:
  min_interval: 10           # 최소 순환 간격 (초)

# JSON 페이로드 제한
retry:
  max_json_payload: 500000   # LLM 응답 JSON 최대 크기 (bytes)

# Context Cache 설정
cache:
  context_max_entries: 50    # 캐시 최대 엔트리 수
  min_content_chars: 50000   # 캐시 대상 최소 글자수

# [TF-26] 앙상블 타임아웃 (초) — 컴포넌트별 차등
ensemble_timeouts:
  arc: {ensemble: 300, single: 240}
  blueprint: {ensemble: 300, single: 240}
  chief_writer: {ensemble: 600, single: 540}
  director_vote: {ensemble: 150, single: 90}
  consensus_vote: {single: 90}
