name: Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run focused PR gate
        run: |
          pytest -v \
            tests/test_arc_retry.py \
            tests/test_audit_benchmark_companion_links.py \
            tests/test_audit_stage34_cache_gate_corpus.py \
            tests/test_audit_stage34_cache_proof.py \
            tests/test_backfill_benchmark_native_post_run_evidence.py \
            tests/test_base_agent.py \
            tests/test_bgr_e5_continuity_contract.py \
            tests/test_bridge_server_desktop_risk_gate.py \
            tests/test_build_execution_roadmap.py \
            tests/test_compare_benchmark_records.py \
            tests/test_control_plane_approval_provenance_ssot.py \
            tests/test_db_manager.py \
            tests/test_desktop_packaging_contract.py \
            tests/test_direct_supervised_semantic_exit.py \
            tests/test_director_modules.py \
            tests/test_failure_analyzer.py \
            tests/test_github_issue_readiness.py \
            tests/test_issue_5_benchmark_snapshot.py \
            tests/test_link_benchmark_companions.py \
            tests/test_ops_validator.py \
            tests/test_post_benchmark_operator_comment.py \
            tests/test_render_benchmark_operator_comment_md.py \
            tests/test_report_benchmark_operator_lines.py \
            tests/test_risk_approval.py \
            tests/test_shipping_reality_live_surface_guide.py \
            tests/test_smoke_fixture_contract.py \
            tests/test_smoke_fixture_tools.py \
            tests/test_stage2_finalizer.py \
            tests/test_stage2_finalizer_lane_d.py \
            tests/test_stage2_finalizer_lane_e.py \
            tests/test_stage2_orchestrator.py \
            tests/test_stage2_orchestrator_lane_b.py \
            tests/test_stage2_orchestrator_lane_d.py \
            tests/test_stage2_orchestrator_lane_f.py \
            tests/test_sweep34.py \
            tests/test_sync_github_issues.py \
            tests/test_sync_temp_queue_state.py \
            --cov=modules --cov-report=xml --cov-report=term-missing
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      - name: Run CI reliability meta smoke
        run: |
          python -m pytest -q \
            tests/test_run_pytest_lowmem.py \
            tests/test_telemetry_dual_instance.py

      - name: Run memory persistence reliability shard
        run: |
          python scripts/run_pytest_lowmem.py \
            --chunk-size 3 \
            --capture=fd \
            --tb=short \
            --log-dir logs/pytest_lowmem/ci-reliability \
            --memory-pause-threshold-percent 99 \
            --memory-resume-threshold-percent 95 \
            --memory-poll-seconds 2 \
            --keep-going \
            tests/test_session_memory_envelope.py \
            tests/test_fact_ledger.py \
            tests/test_world_state_manager.py \
            tests/test_logging_enhancement.py \
            tests/test_logging_phase2.py \
            tests/test_audit_service.py \
            tests/test_bridge_quality_summary.py \
            tests/test_archive_benchmark_record.py \
            tests/test_pass_rate_monitor_rol.py \
            tests/test_stage4_interview_round.py
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install linting tools
        run: |
          pip install flake8 black isort

      - name: Run flake8
        run: |
          flake8 modules/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 modules/ --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

      - name: Check formatting with black
        run: |
          black --check --diff modules/ || true

      - name: Check import sorting
        run: |
          isort --check-only --diff modules/ || true

  desktop-contract:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run desktop contract gate
        run: npm --prefix geuldobi-desktop run test:desktop-contract

  syntax-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install minimal dependencies
        run: |
          pip install google-generativeai chromadb python-dotenv rich

      - name: Check Python syntax
        run: |
          python -m py_compile main_a.py
          python -m py_compile modules/core/*.py
          python -m py_compile modules/domain/agents/*.py
          python -m py_compile modules/validation/*.py
