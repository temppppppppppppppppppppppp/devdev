work_identity:
  work_id: pantech_cyworld_reborn
  work_type: investment_market + tech_startup
  family: blockguide

  one_line_truth: >-
    유통 계열사에 밀려난 오너 3세가 회귀 타임라인 지식을 금융 레버리지·제품 전환·인증 병목 돌파·첫 화면 선점의 4축으로 환전해,
    팬택과 싸이월드를 한 몸의 모바일 생태계로 묶고 모두가 자기 관문을 거치게 만든다.

  protagonist_weapon:
    - 2006~2024 한국 IT 거시 타임라인 지식을 숫자·회의록·로그·계약 뼈대로 환전하는 능력
    - 금융 액션(CB·채권·ABS·JV)과 제품 전환(터치 UI·첫 화면·앱 장터)을 동시에 설계하는 4축 결합 실행력
    - 미시 인물 반응은 모르지만 거시 병목·위기 타이밍을 정확히 선독하는 감각

  tracking_slots:
    - 오너 3세 한량 후보 → 결합 생태계 설계자 → 생활계정 그룹 총수의 서열 상승
    - 팬택 전환권·싸이월드 모바일 전환권·첫 화면·계정·결제·데이터센터의 통제권 회수
    - 차우진 CFO·감사위원회·형제 공세의 봉쇄 카드를 실적·문서·지분으로 무력화하는 방어선 확장
    - 주인공 없이 팬택-싸이월드 결합축이 움직이지 않는 병목 형성

  mandatory_scene_engines:
    - 회귀 지식을 숫자·손익 구조로 환전해 회의실에서 판을 뒤집는 금융 레버리지 장면
    - 통신사 규격 충돌·품질검증·정보통신부 심의 병목을 공개 장면에서 돌파하는 인증 반격 장면
    - 감사·자금 동결·형제 프레임 공세를 실적과 문서로 되받아치는 승계전 역전 장면

  forbidden_flattenings:
    - 회개물 스타트 — 전생 실패의 원인을 주인공의 무능·게으름·자업자득으로 돌리는 것
    - 비굴한 해명 — 차우진·회장·형제 앞에서 인정을 구걸하거나 자기변명하는 것
    - 자기연민 소비 — 전생 고독사 기억을 동력이 아닌 징징거림으로 쓰는 것
    - success → pure punishment spiral — 프론티어 원 승인이나 시연 성공 직후 순수 처벌만 오는 구조
    - 주인공 고유성 없는 대형 성과 — 결과만 크고 왜 윤도현이어야 하는지 인과가 안 보이는 것
    - 활약 후 태도 변화 없음 — 금융 레버리지나 인증 돌파 뒤에도 차우진·이사진·통신사의 대우가 안 바뀌는 것
    - 위기 때 빈손/무대응/무보상 — 감사 자금 동결이나 규격 충돌 앞에서 대응 카드 없이 맞는 것
    - 회귀 지식 만능 예언화 — 미시 인물 반응까지 정확히 맞추거나 slip_up·suspicion_pressure를 무시하는 것
    - 팬택/싸이월드 분리 전개 — 두 축이 한 몸으로 묶이지 않고 각각 독립 부활물로 진행되는 것
    - 단일 자본 투하 즉시 해결 — 자본 한 번 투입으로 제조·소셜·인증·유통이 동시에 풀리는 것

  mandatory_lexicon:
    - 전환사채(CB)
    - 공급망 채권
    - ABS
    - 전환권
    - 첫 화면
    - 계정 체계
    - 결제 흐름
    - 앱 장터
    - 통신사 인증
    - 품질검증센터
    - 312종 충돌 로그
    - 정보통신부 심의
    - 데이터센터 증설권
    - 디지털 계열 분리
    - 지배구조 재편
    - 일촌 그래프
    - 도토리 결제
    - 모바일 주소록
    - suspicion_pressure
    - slip_up

  business_axes:
    - 금융 레버리지 — CB·채권·ABS·JV·M&A로 입장권 매입
    - 제품 전환 — 터치 UI·첫 화면·앱 장터·계정 체계 구축
    - 인증 돌파 — 통신사 규격·품질검증·정보통신부 심의 통과
    - 첫 화면/결제 선점 — 통신사 포털 하청 구조를 뒤집는 플랫폼 장악
    - 승계 정당성 — 디지털 계열 분리·지배구조 재편·ABS 독립 자금선

  control_axes:
    - 팬택 이사회 배석권·전환권
    - 싸이월드 모바일 전환권·일촌 그래프 접근권
    - 프론티어 원 SPC 자금선·CB 통제
    - 품질검증센터 충돌 로그·인증 근거
    - 데이터센터 증설권·저장 병목 해소권
    - 디지털 계열 분리법인 설립·승인권
    - 첫 화면·계정·결제·앱 장터 소유권

  protagonist_evaluation:
    admiration_axes:
      - 거시 타임라인으로 남들보다 먼저 읽고 숫자로 환전함
      - 감정 대신 손익 구조를 들이밀어 비굴하지 않음
      - 감사·규격 충돌·형제 공세를 동시에 맞으면서도 최소 피해 통제
      - 결과로 인정을 강제함 — 차우진의 "숫자만큼은 틀리지 않았다"
      - 단기 손실을 감수하되 반드시 다음 입장권으로 전환함

    forbidden_praise_patterns:
      - 불쌍해서 챙겨준다
      - 오너 3세라서 인정한다
      - 착해서 사람들이 따른다
      - 우연히 잘 풀렸다
      - 참고 견뎌서 대단하다

    observer_tiers:
      - 차우진 CFO — 숫자로 반박당해 태도 수정
      - 오세라 — 터치 UI 실행 파트너로 계산을 바꿈
      - 한유리 — 현재 매출 방어에서 모바일 전환 설계자로 전향
      - 박기태 — 품질검증 데이터를 반격 자산으로 뒤집히며 협력
      - 윤재문 회장 — 실험 예산 승인에서 시험 카드 승격으로
      - 윤태선/윤태민 — 한량 무시에서 위협적 경쟁자 경계로
      - 정민석 — 채권단 실무 정보선에서 지배구조 핵심 협력으로
      - 통신사/규제기관 — 위험 프로젝트 낙인에서 인증 통과 인정으로

    evaluation_thresholds:
      - Block 1 안에 CB 350억 승인 + 차우진 "숫자만큼은 틀리지 않았다" 태도 영수증
      - Block 3까지 팬택 전환권 + 싸이월드 협상권 + 회장 직보 라인의 3종 입장권 확보
      - 큰 피해(시연 실패, 자금 동결) 직후 반드시 반격 자산 또는 다음 입장권 확보

  role_fit_constraints:
    - name: 오세라 독자 완성 금지
      role: 오세라 (팬택 전략기획)
      disallowed_actions:
        - 주인공 대신 결합 생태계 전략을 완성
        - 인증 병목 핵심 돌파 논리를 단독 설계
      exceptions:
        - 터치 UI·하드웨어 전문 영역에서 실행 파트너로 기여

    - name: 한유리 선행 전향 금지
      role: 한유리 (싸이월드 서비스 총괄)
      disallowed_actions:
        - 감화나 동정으로 모바일 전환에 합류
        - 주인공 대신 플랫폼 결합 전략 핵심을 완성
      exceptions:
        - 현재 매출 방어 한계를 자각하고 계산으로 전향

    - name: 차우진 무능화 금지
      role: 차우진 (CFO)
      disallowed_actions:
        - 숫자 논쟁에서 바보처럼 져주기
        - 감사 카드를 명분 없이 남발
      exceptions:
        - 개인 책임 조건 CB 프레임 앞에서 봉쇄 명분을 잃는 구조적 약점

custom_rules:
  - 회귀 지식은 예언 선언이 아니라 숫자·회의록·로그·계약 뼈대로 환전된 뒤에만 장면에 등장한다
  - 외부 시장 전투(통신사·인증·유통)와 가문 승계전(감사·형제·지배구조)은 순차가 아니라 동시 압박으로 겹친다
  - 위기는 피해 연출보다 우선순위 선택권 증명으로 사용한다
  - 반격 예약 없는 손해는 금지 — 돈을 잃으면 증거를, 시연이 깨지면 충돌 로그를, 자금이 동결되면 ABS 우회를 확보한다
  - 설명이 리듬을 깨면 "운이 좋군"으로 절감할 수 있다 — 단 독자는 운이 아님을 느낀다
  - 팬택과 싸이월드는 반드시 한 몸 — 한 축만 살고 다른 축이 죽는 전개 금지
  - slip_up 에스컬레이션과 suspicion_pressure 누적 빈도를 아크별 스케줄대로 지킨다
