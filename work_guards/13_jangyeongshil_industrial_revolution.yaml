work_identity:
  work_id: jangyeongshil_industrial_revolution
  work_type: althistory_possession
  family: blockguide
  one_line_truth: >-
    2026년 기계공학 교수가 1420년 관노 장영실로 빙의해 경험칙 3년을 도면 한 장으로 이기고,
    도면 표준·검수 결재선·제자 라인·자재 배분 4축을 조정 제도에 심어 세종 개인의 총애가 아니라
    조정 제도가 기술 설계권과 검수 최종 결재권을 보장하는 자리를 만들어낸다
  protagonist_weapon:
    - 현대 공학 원리(오리피스/수두/응력/열역학)에서 역산해 15세기 재료 한계 안에서 치수·공차까지 적힌 도면 한 장을 뽑는 설계력
    - 이 시대에 없는 '치수와 공차가 적힌 도면' 표기법 자체를 표준으로 심는 표기법 독점
    - 매 발명을 '발명 → 태도 변화 → 자리 변화 → 다음 문'의 4단 공식으로 즉시 서열 영수증으로 변환하는 권한 회수 엔진
    - 4축 운영 산출 표준(매월 점검 산출표)으로 운영 근거를 제도화하는 운영 설계력
  business_axes:
    - 도면 승인권 / 도면 표준 제정권 (표기법 독점, 영실 없으면 기존 도면 판독 불가)
    - 핵심 부품 검수 최종 결재권 (기술소 제조 직권, 가마 사건 이후 운영 헌법 한 조항으로 잠금)
    - 제자 라인 운영권 / 기술 교범 서문·부록 독점 (김순 문장 후계자, 제자 5명 판독 훈련 통과자)
    - 자재 배분 결재권 (철·청동·수은 등 기술 자재 기술소 경유)
    - 매월 4축 운영 점검 산출표 주재권 (19행까지 확장, 조정 공식 표준 등재)
    - 기술소 '조정의 필수 관청' 정식 등재 (Block 40 관청화 → Block 69 필수 관청 격상)
  control_axes:
    - 도면 표준 제정권 (Block 27 격상 → Block 40 제도 명문화 → Block 69 조정 공식 등재)
    - 검수 결재선 운영 헌법 한 조항 (Block 49 원본 + 외부 변형 3단 + Block 67 ARC-07 확장형 = 5단 누적)
    - 기술소 관청 규칙 (Block 40 '왕명 한시 단서 없음' 명시)
    - 4축 운영 산출 표준 (Block 69 조정 공식 등재, 명칭에 '장영실' 0회)
    - 후계 체제 이원화 — 문장 후계자(김순) + 판독 후계자(제자 5명)
    - 문종 재가 관청 절차 (Block 67 타협안 / Block 69 등재 안건, 새 후원자 배치 금지 원칙)
  mandatory_lexicon:
    - 도면
    - 공차
    - 치수
    - 표기법
    - 오리피스
    - 수두
    - 응력
    - 열역학
    - 역산 설계
    - 자격루
    - 측우기
    - 관노
    - 면천
    - 기술소 제조
    - 검수 결재선
    - 운영 헌법 한 조항
    - 4축 운영 산출 표준
    - 매월 점검 산출표
    - 기술 교범
    - 판독 훈련
    - 조정의 필수 관청
    - 광산 배수 펌프
    - 증기 인쇄기
    - 가마 사건
    - 피로스 승리
  forbidden_flattenings:
    - 왕 총애 미담 (세종을 은인으로 묘사, '성은'/'은혜' 서사)
    - 문명건설 카탈로그 (발명품 나열, '다음에 뭘 만들지?' 질문)
    - 감동 위인전 ('조선의 레오나르도', 위인 서사)
    - 도덕적 거부 ('기술은 사람을 살리는 것' 윤리 수사 — 대신 '숫자가 거부')
    - 자기연민 소비 ('세종 없으면 난 아무것도 못 한다')
    - 장광설 (주인공이 자기 유능함을 직접 해설)
    - 회개물 스타트 / 비굴한 해명
    - 주인공 고유성 없는 대형 성과 (역산 설계 인과 없는 승리)
    - 활약 후 태도 변화 없음 (성과 뒤 서열/권한 영수증 누락)
    - 위기 때 빈손 / 무대응 / 무보상
    - 캐릭터 카탈로그화 (최만리 본격 퇴장 / 명나라 동기 전환 본격화의 과잉 해소)
    - 세종 사후 공개 추모 ('세종 붕어' 블록 narrator 프레임 외에는 '세종' 이름 등장 금지)
    - 세종 헌정 미담 ('세종에게 바치는 도면' 유혹)
    - 신 후원자 배치 (문종/수양대군이 새 세종 역할로 들어오는 것 금지)
    - 정체성 통합 미담 (Block 70 오현석 POV 전환 = '제도의 통합', 정체성 통합 아님)
    - 광산 배수 펌프 재진입 (Block 51 실전 배치로 21블록 누적 payoff 이미 회수)
    - 감동·회고 언어 (quiet 블록에서 '마지막' 내부 기록 금지)
    - 현대 기술 시대착오 (고무·전기·대량생산 재현)
  tracking_slots:
    - 신분 상승 — 관노 → 면천 → 대호군 → 기술소 제조
    - 직위 누적 — 자격루 설계 책임자 → 기술소 관청 제조 → 조정 필수 관청 장
    - 4축 잠금 — 도면 표준 → 자재 배분 → 검수 결재선 → 제자 라인 (Block 13/24/27/34/40/49/50/58)
    - 외부 영역 진입 — 광산(51) → 섬유(52) → 시제 작업장(53) → 인쇄(54)
    - 후계 체제 — 김순 문장 후계자 + 제자 5명 판독 후계자 (Block 64)
    - 세종 의존도 하락 — Block 40 관청화 → Block 49 검수 축 잠금 → Block 59 마지막 보고 → Block 60 각성 → Block 65 세종 사후 → Block 67 문종 타협 → Block 69 조정 필수 관청 등재 → Block 70 에필로그 (Phase0 §4 Post-Patron Independence Lock 8단 누적)
    - 적대 카드 미소진 — 최만리 본격 퇴장 유보 / 명나라 동기 전환 본격화 유보 (ARC 밖 milestone 인계)
    - 4축 운영 산출표 행 수 — Block 50 정례화 → Block 57 13행 → Block 65 16행 → Block 69 18-19행
  mandatory_scene_engines:
    - 매 발명마다 '발명 → 태도 변화 → 자리 변화 → 다음 문' 4단 공식이 같은 블록 안에서 완결 (canon §5.2, 예외 없음 — 발명 블록에 한해 70/70)
    - 오리피스 역산 도면 한 장으로 경험칙 기술자 전원을 이기고 이천의 태도가 '관노 주제에'에서 '이 도면은 어디서 배웠느냐'로 공개 전환 (Block 2)
    - 자격루 설계 책임자 이름 등재 + 면천 + 자재 요청서 자기명의가 Block 1-6 안에 연쇄 확보
    - 가마 사건(ARC-05)으로 검수 결재선이 세종의 은총이 아니라 조정 스스로 만든 안전장치로 잠금 (Block 49 운영 헌법 한 조항 명문화)
    - 4축 독립 엔진 가동 증명 (ARC-06, Block 51-60 외부 영역 4종 진입 + 매월 점검 산출표 정례화)
    - 세종 부재 첫 회기 자체 작동 검증 루프 운영 사고 0건 (Block 65, Phase0 §4 Lock 6단 실증)
    - 4축 운영 산출 표준 조정 공식 기술 표준 등재, 명칭에 '장영실' 0회 (Block 69, 이름의 운영 표준 이전 공식화)
    - 자격루 안의 흔적 5백여 년 후 판독 에필로그 (Block 70, 공차 표기 재료가 물리 실증으로 남음)
  protagonist_evaluation:
    admiration_axes:
      - 경험 3년을 도면 한 장이 이김 (역산 설계의 정확도가 경험칙 태도를 공개 전환)
      - 비굴하지 않음 (관노 신분에서도 설명 대신 결과로 증명)
      - 도면이 말하고 주인공은 입을 닫음 ('운이 좋군'으로 덮어도 되는 침묵의 능력)
      - 매 발명이 '발명'이 아니라 '누가 허락을 구하게 됐나'의 서열 영수증
      - 세종 개인과 완전 분리된 제도 인프라 4축을 조용히 심어 냄 (세종 없이도 돌아가는 엔진)
      - 감정·도덕·장광설 없이 '숫자가 거부'하는 방식으로 군사화 압력 역전 (Block 62-63)
      - 이름의 운영 표준 이전 ('4축 운영 산출 표준' 명칭에 '장영실' 0회 + '5+1' 명단 맨 뒤)
    forbidden_praise_patterns:
      - 불쌍해서 챙겨준다 (세종의 은총으로 올라간다)
      - 착해서 인정한다
      - 나라를 위해서 대단하다 (조선의 산업혁명 서사)
      - 우연히 잘 풀렸다
      - 참고 견뎌서 대단하다
      - 위대한 발명가라서 인정받는다 ('조선의 레오나르도')
      - 세종의 은혜에 보답해서 감동이다
    observer_tiers:
      - 이천 (첫 경쟁자 → 손익 동맹 → 절차 추인 → 공식 증언 → 산출표 분산 보관자 → 교범 7인 작업조 → 10단 누적)
      - 세종 (첫 후원자 → 검증자/공식 지정자 → 시한부 후원 → 마지막 보고 '그래야 한다' → 붕어. '은혜'가 아니라 '검증')
      - 관상감 기술자들 (멸시 → 결과 인정)
      - 정인지 (첫 동맹 → 공식 공동 추진자 → 운영 설계 협력자 → 산출표 분산 보관자 → 교범 7인 작업조 → 10단 누적)
      - 김순 + 제자 라인 (기술학교 수료자 → 회복 제자 → 매월 점검 운영자 → 교범 공동 저자 → 문장 후계자/판독 후계자)
      - 호조/공조/병기창 (외부 부서 → 기술소 의존자, 산출표 9개 부서/영역 목록)
      - 최만리/보수파 (본격 등장 → 탄핵 상소 → 침묵 13블록 연속 → 운영 절차적 무효화. 본격 퇴장 유보)
      - 명나라 (도면 유출 hint → 한양 동선 살핌 → 객사 출입 명문화. 본격 동기 전환 유보)
      - 수양대군 (Block 61 정치 신호 첫 감지 → Block 62 군사화 압력 [defeat] → Block 66-67 3단 대면 구조)
      - 문종 (ARC-07 새 후원자 배치 금지 원칙, 재가 관청 절차 2회만)
      - 후세 연구자 (Block 70 에필로그 5백여 년 후 판독자, 장영실 이름 0회 상태로 공차 표기 인식)
    evaluation_thresholds:
      - Block 1-6 first-block cider ledger 연쇄 확보 (has_cider true × 5블록 연속)
      - Block 2 이천 태도 전환 공개 영수증 + Block 3 이름 등재 + Block 4 면천 확정
      - Block 40 기술소 관청화 '왕명 한시 단서 없음' 명문화
      - Block 49 운영 헌법 한 조항 명문화 ('세종의 은혜가 아니라' 공식 선언)
      - Block 51-54 외부 영역 4종 진입 + Block 50 매월 점검 정례화
      - Block 59 마지막 보고 '그래야 한다' + Block 60 각성 즉각 운영 변환
      - Block 65 세종 부재 첫 회기 '운영 사고 0건' 자체 작동 검증 루프 실운영
      - Block 69 조정 공식 등재 + '5+1' 명단 맨 뒤 한 자리 등재
      - Block 70 5백여 년 후 판독 에필로그 + 오현석 POV 1회성 전환 (정체성 통합 아님, 제도의 통합)
  role_fit_constraints:
    - name: 세종 후원 대행 금지
      role: 세종
      disallowed_actions:
        - 세종이 주인공 대신 정치 문제를 해결해 줌
        - 세종의 은총으로 권한이 부여되는 장면
        - 세종 붕어 후 공개 추모 장면
      exceptions:
        - Block 1-39 전반부 후원 역할 허용 (Block 40 관청화 이후는 점진 철수)
        - Block 18/49 '세종의 은혜가 아니라 검증' 형태의 rule self-declaration 문장은 canon §5 enforcement로 허용
    - name: 이천 대행 금지
      role: 이천
      disallowed_actions:
        - 이천이 영실 대신 핵심 도면 문제 해결
        - 이천이 보호자로 변질
      exceptions:
        - 손익 동맹 기반의 증언·추인·분산 보관은 10단 누적 허용 (Block 22-67)
    - name: 보수파 캐리커처 금지
      role: 최만리 / 보수파
      disallowed_actions:
        - 바보처럼 져주기
        - 동기 없는 악행
        - 본격 퇴장 (캐릭터 카탈로그화, ARC 안 과잉 해소)
      exceptions:
        - 합리적 동기(신분 질서/유학 정통성) 기반 적대 유지
        - 최만리는 본격 퇴장 유보, 운영 절차적 무효화로만 처리
    - name: 수양대군 캐릭터 카탈로그화 금지
      role: 수양대군
      disallowed_actions:
        - 호기심 → 군사화 계산의 점진 빌드업 없이 일방적 악역 등장
        - 5블록 안 과잉 해소
      exceptions:
        - Block 61 정치 신호 첫 감지 → Block 62 defeat → Block 66/67 3단 대면 구조만 허용
    - name: 문종 새 후원자 금지
      role: 문종
      disallowed_actions:
        - 문종이 새 세종으로 들어와 주인공을 보호
        - 문종 재가가 '은총' 형태로 묘사
      exceptions:
        - 관청 절차 재가 2회 (Block 67 타협안 / Block 69 등재 안건)만 허용, 전부 절차 양식으로
    - name: 제자 라인 감화 금지
      role: 김순 / 제자 4명 / 당직 제자
      disallowed_actions:
        - 감화 기반 충성
        - 이유 없는 선의 지원
      exceptions:
        - 도면 표기법 훈련 기반 기능적 종속 + 후계 체제 판단 능력 전수는 허용
custom_rules:
  - canon §5.2 4단 공식 예외 없음 — 매 발명 블록은 같은 블록 안에서 '발명 → 태도 변화 → 자리 변화 → 다음 문' 4필드 완결. non-invention 블록(realization/isolation/defeat/quiet)은 invention="없음" 명시 허용
  - 매 블록의 첫 질문은 '뭘 만들었나'가 아니라 '누가 허락을 구하게 됐나'
  - 세종 개인과의 관계는 '후원자 → 검증자'로만, '은인' 금지. Block 40 관청화 이후는 점진 철수, Block 65 붕어 시 narrator 프레임 외 '세종' 이름 등장 금지
  - 4축 운영 산출 표준 명칭에 '장영실' 0회 유지 (Block 69 이름의 운영 표준 이전 공식화)
  - 광산 배수 펌프 실전 배치 payoff는 Block 51에서 이미 회수 완료 — 재진입 금지, 후속 운영 데이터 참조만 허용
  - 최만리 본격 퇴장 유보 (ARC 밖 milestone 인계, 운영 절차적 무효화로만 처리)
  - 명나라 동기 전환 본격화 유보 (ARC 밖 milestone 인계, hint 4단으로만)
  - 도덕적 거부 금지 — 군사화 압력에는 '숫자가 거부' 형태 (산출표 제출, 민간 인프라 연쇄 정지 일수 × 복구 비용 × 민간 피해 추산)
  - 매 블록의 보상은 이름 등재 / 권한 회수 / 직위 상승 / 접근권 확장 / 서열 변화 중 1종 이상으로 체감
  - 다음 블록은 이전 보상(권한 축 누적)으로만 열림 — 도면 표준 없이 검수 결재선 없음, 검수 결재선 없이 4축 운영 산출 표준 없음
  - 블록당 solution 길이 제한 없음 (도면 설계 근거 + 운영 산출 기술은 장광설과 다른 차원)
  - BI는 생성물이 아니라 동기화 산출물 — plot_roadmap은 TR에서 verbatim copy, 직접 창작 금지 (bi-harness §2.2/§11)
