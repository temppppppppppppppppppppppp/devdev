  family: blockguide
  one_line_truth: "2003년 조선/해운 초호황기에 회귀한 전략실 막내가, 모두가 박수치는 수주 계약을 현재 자료로 해체하고 수주를 살아남는 조건으로 바꿔 그룹의 유동성 붕괴를 막는 no-fantasy 산업 재벌물"
  protagonist_weapon:
    - "전생의 그룹 해체 실무에서 본 보증/수주/M&A 붕괴 순서"
    - "후판 가격, 환율, 납기 패널티, 선박금융 보증을 한 표로 묶는 계약 독해"
    - "호황의 박수보다 자기 생존과 권한 회수를 먼저 보는 효율형 자기중심성"
  business_axes:
    - "조선 수주 조건"
    - "선박금융 보증"
    - "해운 운임 사이클"
    - "해외 조선소 M&A"
    - "엔진/기자재 수직계열화"
  control_axes:
    - "계약조건 재검토권"
    - "도크 capacity 원자료 접근권"
    - "선박금융 배석권"
    - "보증 분리 협상권"
    - "M&A 실사 veto권"
    - "그룹 리스크 조정실"
  tracking_slots:
    - "서준 평가 상승: 말석 실무자 -> 호황을 겁내는 막내 -> 조건표를 만든 사람 -> 리스크 TF장 -> 그룹 필수 통과 관문"
    - "권한 ladder: 발언권 -> 7일 재검토권 -> 원자료 접근권 -> 배석권 -> 재협상권 -> TF장 -> veto권"
    - "산업 chain: 수주 -> 금융 보증 -> 해운 운임 -> 해외 M&A -> 기자재 병목 -> 불황 방어"
    - "자기중심성 tracking: 선의가 아니라 생존 가능성, 권한 회수, 현금흐름 방어, 통제권 확보로 행동한다"
  mandatory_scene_engines:
    - "계약서의 빠진 조항이나 보증 조건을 발견하고 현재 자료로 proof를 만든다"
    - "권한 witness가 proof를 확인해 접근권, 배석권, 재협상권 중 하나를 같은 블록 안에서 준다"
    - "각 블록은 회의실 주사건 외에 현장, 금융팀, 선주, 은행, 기자재, 언론 중 하나의 보조 사건을 가지며, 서준의 이득/효율 선택이 현금흐름 방어로 환전된다"
  forbidden_flattenings:
    - "실존 STX 인물/사건 직접 복제"
    - "상태창, 스킬, 초능력 감정, 미래주가 찍기"
    - "수주를 전부 막는 금욕형 경영물"
    - "주인공이 착해서 그룹을 구하는 미담화"
    - "회의실 말싸움만 이어지는 느린 opening"
    - "보상이 칭찬이나 감탄뿐인 블록"
    - "각 block에 보조 사건이 없는 얇은 episode-beat"
  first_block_reward:
    - "B002: 계약조건 재검토 7일 권한"
    - "B003: 생산 원자료 접근권"
    - "B004: 선박금융 보증 검토 배석권"
    - "B005: 조건부 수주 재협상 기준표"
    - "B006: 선박금융 리스크 TF장"
custom_rules:
  - "각 TR block은 2~6화 분량 episode-bundle이며 주사건 하나와 보조사건 하나 이상을 포함해야 한다"
  - "서준은 착한 사람이 아니라 이득과 효율을 우선하는 자기중심적 인물이다"
  - "proof는 반드시 현재 계약서, 표, 보증 조건, 생산 자료에서 나온다"
  - "same-block cider 없는 블록은 재생성한다"
  - "다음 전장은 이전 전장의 권한 영수증으로만 열린다"
