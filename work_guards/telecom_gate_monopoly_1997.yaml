custom_rules:
  - "1 TR block은 downstream 2~6화 묶음이며, 각 block은 최소 두 개의 구분되는 사건 비트를 포함한다"
  - "강재현의 선택은 profit, efficiency, legal protection, speed, leverage, control, defense, retaliation, survival, next-gate position 중 하나로 읽혀야 한다"
  - "보상은 동석권, 보류권, data-room, 조달선, 오더, pilot code, 법무 메모, 의결권 대리, cashflow, next gate 중 하나로 같은 block 안에 떨어져야 한다"
  - "billing gate는 pilot code, 수수료 테이블, opt-in/민원 처리, 법무 검토 메모 같은 clean receipt 없이는 성립하지 않는다"
  - "모든 새 섹터는 번호, 월 청구서, 단말 유통, 정산, user data, enterprise messaging 중 하나를 통해서만 열린다"
