work_identity:
  work_id: office_checkup_next_day
  work_type: office_power
  family: blockguide
  one_line_truth: B0짜리 말단 사원이 결재선 병목과 숨긴 숫자를 먼저 읽어, 우회 경로와 실데이터 대안으로 관문을 만들고, 모두가 허락을 구하는 조직의 관문이 된다
  protagonist_weapon:
    - 결재선·숫자·사람 배치를 동시에 읽어 병목을 즉시 짚는 조직 역학 조감 감각
    - 사업부장이 막기 어려운 우회 경로를 설계하는 상신 경로 설계력
    - 하룻밤 안에 실데이터 기반 대안을 만드는 실무 속도
  business_axes:
    - 결재선 위치 (Lv1 자료작성권 ~ Lv7 라인선택권)
    - 예산 코드 통제권 (전용 코드 vs 공용 코드)
    - 프로젝트 오너십 / TF 구성 배정
    - 현금흐름 (프로젝트 예산 규모)
  control_axes:
    - 결재선 (안건 통과 최적 경로)
    - CC 라인 (정보 접근 등급)
    - 상신권 (전무/대표이사 직보)
    - TF 실권 (실무 간사 → 실질 지휘)
    - 인사 라인 선택권
  mandatory_lexicon:
    - 결재
    - 상신
    - 배석권
    - CC 라인
    - 전용 코드
    - TF 발령
    - 프로젝트 오너십
    - 물동량
    - 밀어내기
    - 실명 메일
  forbidden_flattenings:
    - 회개물 스타트
    - 비굴한 해명 / 인정 구걸
    - 자기연민 소비
    - success -> pure punishment spiral
    - 주인공 고유성 없는 대형 성과 (결재선·숫자 읽기 인과 없는 승리)
    - 활약 후 태도 변화 없음 (성과 뒤 서열 영수증 누락)
    - 위기 때 빈손 / 무대응 / 무보상
    - 능력을 본인이 장광설로 해설
    - 오세진·장현태를 무능한 악당 캐리커처로 처리
    - 결재선·예산 편성을 추상 권력전으로만 씀
    - MD 적자 은폐를 뭉뚱그려 처리
    - 운빨 생존을 실력처럼 포장
  tracking_slots:
    - 결재선 위치 상승 (Lv1 → Lv7 추적)
    - 저평가 → 고평가 전환 (호칭·자리·CC 변화로 체감)
    - 프로젝트 오너십 / TF 실권 회수
    - 주인공 없이 결재가 최적 경로를 타지 못하는 병목 형성
  mandatory_scene_engines:
    - 결재선·숫자에서 숨은 병목 감지 후 우회 경로 설계 → 상위 결재선에 우회 상신
    - 임원 회의 / 보고 장면에서 외주 보고서·조작 데이터의 인용 지점을 한 줄로 짚는 공개 증명
    - 성과 직후 체감형 보상 부착 (실명 메일 / TF 발령 / 자리 이동 / CC 변경 중 1종 이상)
  protagonist_evaluation:
    admiration_axes:
      - 남들보다 먼저 읽음 (병목·리스크·사람 역학)
      - 비굴하지 않음 (팀장 견제에도 우회로를 찾지 굽히지 않음)
      - 손실을 통제함 (최소 피해로 핵심을 지킴)
      - 결과로 인정을 강제함 (설명이 아니라 실데이터와 성과로 증명)
      - 판을 잘못 읽히게 만드는 여유 (눈치 빠른 사원으로만 보임)
    forbidden_praise_patterns:
      - 불쌍해서 챙겨준다
      - 착해서 인정한다
      - 성실해서 언젠가 보답받는다
      - 우연히 잘 풀렸다
      - 참고 견뎌서 대단하다
    observer_tiers:
      - 같은 팀 동료 (첫 의아함)
      - 전무 (첫 인정자 — 이름을 부르고 배석권을 줌)
      - 오세진 팀장 (경계 → 견제)
      - 장현태 MD사업부장 (적대적 재평가)
      - 대표이사 (최종 인정 권한)
      - 외부 감사 / 컨설팅사 (독립 검증자)
    evaluation_thresholds:
      - 1화 내 첫 사이다 (검진 후 재분석 → 전무 직보 → 배석권)
      - 3화 내 간판 폭발 (임원회의에서 통합안 저지 + 대안 채택)
      - Block 1 완료 시 체감형 보상 4종 동시 부착
      - 큰 피해 뒤 즉시 다음 카드 확보 (반격 예약 없는 손해 금지)
  role_fit_constraints:
    - name: 전무 선행 금지
      role: 전무 (첫 인정자)
      disallowed_actions:
        - 시혁 대신 핵심 추론을 완성
        - 시혁 없이 병목을 독립 해결
      exceptions:
        - 시혁의 실데이터 대안을 보고 판단권을 행사하는 것은 허용
    - name: 팀장 캐리커처 금지
      role: 오세진 (팀장)
      disallowed_actions:
        - 무능해서 지는 장면
        - 이유 없는 악의
      exceptions:
        - 인사평가·CC 라인으로 합리적 견제하는 것은 허용
    - name: 조력자 감화 금지
      role: 조력자
      disallowed_actions:
        - 이유 없는 선의 지원
        - 감화 이전에 붙는 동맹
      exceptions:
        - 계산상 시혁 편에 서는 선택
custom_rules:
  - 위기는 피해 연출보다 우선순위 선택권 증명으로 사용한다
  - 반격 예약 없는 손해는 금지
  - 설명이 리듬을 깨면 운이 좋군으로 절감할 수 있다
  - 능력은 중반까지 본인 미자각 유지 — 독자만 차이를 안다
  - 각 블록의 보상은 실명 인정·TF 실권·자리 이동·CC 상승·예산 발언권·라인 선택권 중 하나로 체감형이어야 한다
  - 다음 블록은 이전 블록의 보상(권한 상승)으로만 열린다
