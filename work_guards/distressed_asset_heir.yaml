work_identity:
  work_id: distressed_asset_heir
  work_type: distressed_asset_business_fantasy
  family: blockguide
  one_line_truth: "돈 많은 집 외동 한도윤이 망한 자산의 장부를 만져 살아 있는 권리와 현금흐름을 보고, 점포가 아니라 돈이 들어오는 순서만 사서 control과 cashflow를 키우는 현대판타지 경영물"
  protagonist_weapon:
    - "장부, 카드 정산표, 임대차 계약, 물류 단가표, 채무 스케줄을 만져 숨은 cashflow와 회수 가능한 권리를 보는 능력"
    - "부실자산을 회사나 점포가 아니라 정산권, 물류권, 상표권, 임대차 옵션, 채권 순서로 쪼개 사는 구조조정 감각"
    - "선의보다 이득, 효율, 방어, 포지션 개선을 우선하는 자기중심적 판단 속도"
    - "통째 인수 책임을 피하고 control point만 싸게 확보하는 딜 설계"
  business_axes:
    - "프랜차이즈 권리 분리 매입"
    - "카드/배달앱 정산 회수"
    - "콜드체인 물류권과 NPL"
    - "단체급식 납품 계약"
    - "상권/부동산 옵션과 PEF 포트폴리오"
  control_axes:
    - "정산 계좌 접근권"
    - "원본 장부/계약서 검토권"
    - "물류 단가표와 공급권"
    - "임대차 우선협상권"
    - "채권자 협상 배석권"
    - "딜 owner 권한"
  mandatory_lexicon:
    - "정산권"
    - "물류권"
    - "상표 사용권"
    - "임대차 우선협상권"
    - "공동구매권"
    - "카드 정산표"
    - "PG 정산"
    - "미수 물류비"
    - "냉장 루트"
    - "단체급식 납품"
    - "NPL"
    - "workout"
    - "권리 묶음"
    - "현금흐름"
    - "receipt"
  forbidden_flattenings:
    - "주식 예언, 코인 예언, 복권, 미래 뉴스 암기만으로 돈 버는 전개"
    - "도윤이 착해서 사람을 구하고 모두 감동하는 선행물"
    - "가족 인정이나 칭찬이 권리 receipt를 대신하는 전개"
    - "점포를 통째로 사서 고생만 하는 구조조정 감동물"
    - "문서 없이 능력 숫자만 보고 정답을 찍는 시스템창 전개"
    - "운영본부장, 임대인, 채권자, 투자자를 바보 악역으로 만드는 전개"
    - "각 block이 사건 하나만 처리하고 보상을 다음 block으로 미루는 느린 페이싱"
    - "부실자산 디테일을 vague consulting 말투로 뭉개는 전개"
    - "도너 작품의 고유명, 장면 순서, 시그니처 투자 구조 복사"
  tracking_slots:
    - "도윤 평가 상승: 도련님 -> 장부를 다시 보게 만든 사람 -> 권리 묶음 owner -> 부실자산 오퍼레이터 -> 독립 운용자"
    - "권한 ladder: 장부 열람 -> 제한 검토권 -> 정산 계좌 control -> 물류/임대차 옵션 -> NPL 협상 배석권 -> 딜 owner"
    - "asset ladder: 망한 국밥 프랜차이즈 -> 콜드체인 NPL -> 단체급식 계약 -> 상권 리츠 -> PEF 포트폴리오"
    - "receipt chain: 권리 서명 -> 현금흐름 회수 -> 비용 재분류 -> 계약 방어 -> 반복 납품 -> 다음 딜 gate"
  first_block_reward:
    - "B002: 통째 인수 함정을 피하고 권리 묶음 분리 매입안으로 제한 검토권을 얻는다"
    - "B003: 카드 정산 누락 계좌를 확인하고 첫 회수 가능 현금흐름을 확보한다"
    - "B004: 적자 냉장 루트를 단체급식 납품 필수 route로 재분류하고 test gate를 연다"
    - "B005: 임대차 우선협상권을 방어해 핵심 점포를 폐업 리스크가 아니라 옵션으로 바꾼다"
    - "B006: 작은 반복 납품 계약을 따내고 콜드체인 NPL 전장 입장권을 얻는다"
  crisis_doctrine:
    - "선독: 버려지는 자산의 장부에서 아직 닫히지 않은 cashflow와 권리 순서를 찾는다"
    - "대비: 원본 장부, 정산표, 계약서, 임대차 조건, 물류 단가표를 확보한다"
    - "최소 피해: 통째 인수 책임을 피하고 살아 있는 권리와 죽은 책임을 분리한다"
    - "즉시 보상: 위기 뒤에는 반드시 권리, 현금흐름, 계약, 접근권, 다음 gate 중 하나가 남아야 한다"
  mandatory_scene_engines:
    - "도윤이 실제 문서를 만져 숨은 현금흐름 또는 회수 가능한 권리를 보고, 현재 자료로 proof를 만든다"
    - "권리와 책임을 분리해 상대가 떠넘기려던 liability를 피하고 control point만 확보한다"
    - "같은 block 안에서 primary deal incident와 secondary complication을 처리해 receipt 또는 leverage-changing danger를 남긴다"
  protagonist_evaluation:
    admiration_axes:
      - "부자집 외동인데 허영이 아니라 계산이 빠르고 실무를 안다"
      - "착해서가 아니라 효율적으로 움직여 돈과 사람의 순서를 동시에 살린다"
      - "통째로 떠안지 않고 필요한 권리만 사는 딜 감각이 있다"
      - "문서, 계약, 정산표로 상대를 움직인다"
    forbidden_praise_patterns:
      - "착해서 인정받는다"
      - "돈 많은 집 아들이라 해결된다"
      - "미래를 알아서 맞혔다"
      - "가족이 감동해서 권한을 준다"
      - "상대가 멍청해서 당했다"
    observer_tiers:
      - "한기석 회장"
      - "윤세라 전략실 실무자"
      - "박문호 창업자"
      - "가맹점주"
      - "임대인"
      - "카드 정산 담당자"
      - "백승환 NPL 투자자"
    evaluation_thresholds:
      - "B002 안에 권리 묶음 분리 매입안과 제한 검토권"
      - "B003 안에 cashflow recovery receipt"
      - "B006 안에 반복 납품 계약과 다음 NPL gate"
      - "각 block 안에 두 사건 비트와 receipt 또는 leverage-changing danger"
  role_fit_constraints:
    - name: "도윤 선행물화 금지"
      role: "한도윤"
      disallowed_actions:
        - "손해를 알면서 사람 좋게 떠안기"
        - "칭찬을 얻기 위해 이익을 포기하기"
        - "문서 proof 없이 감으로 설득하기"
      exceptions:
        - "장기 이익, 방어, 포지션 개선을 위해 단기 손실을 계산해서 받아들이는 행동"
    - name: "상대 바보화 금지"
      role: "조태건 / 임대인 / 채권자 / 백승환"
      disallowed_actions:
        - "기본 계약서도 못 읽는 무능 캐릭터화"
        - "이유 없는 악의와 감정적 방해"
        - "도윤 말 한마디에 바로 굴복하기"
      exceptions:
        - "자기 책임, 손실 회피, 가격 재산정 논리로 합리적으로 반대하기"
custom_rules:
  - "1 TR block은 2~6화 묶음이며, 각 block은 최소 두 개의 구분되는 사건 비트를 포함한다"
  - "도윤의 선택은 profit, efficiency, defense, retaliation, survival, position gain 중 하나로 읽혀야 한다"
  - "보상은 권리, 현금흐름, 계약, 접근권, 우선권, 다음 gate 중 하나여야 한다"
  - "문서 접촉 능력은 힌트를 줄 뿐, 돈은 실행 권한과 운영 개선으로만 현실화된다"
  - "다음 전장은 이전 전장의 receipt로만 열린다"
  - "첫 arc direct line은 반드시 보존한다: 가게는 안 삽니다. 돈이 들어오는 순서만 삽니다."
