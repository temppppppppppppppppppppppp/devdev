work_identity:
  work_id: gatekeeper_heir
  work_type: business_growth
  family: blockguide
  one_line_truth: 돈 대신 권한을 요구하는 후계자가 죽은 자산과 묻힌 사람을 살려 병목을 관문으로 바꾸고, 그룹 전체가 자신의 관문을 거치지 않으면 움직이지 못하는 운영제국을 만든다
  protagonist_weapon:
    - 사람과 자리의 배치 가치를 읽어 최적 조합을 먼저 짜는 배치 조감 능력
    - 그룹 몰락의 순서와 숨은 병목을 기억한 채 다음 섹터의 문을 여는 키를 먼저 아는 정보 우위
    - 죽은 장비·결함 라이브러리·좌천 인재를 재배치해 현장을 복구하는 운영 실행력
  business_axes:
    - 운영권 (계열사 지휘권)
    - 인사 이동권 (사람 배치)
    - 조달·품질·물류·전력·금융 결재 권한
    - 표준·인증·해외 JV 선점
    - 현금흐름 (리스·팩토링·서비스 락인)
  control_axes:
    - 관문 계열사 운영권 (비용센터 → 필수 관문 전환)
    - 섹터 간 통행 경로 (장비→소재→시스템→물류→전력→금융→표준)
    - 회장 직보권과 신뢰 잔고
    - 주력사가 도윤을 거치지 않고는 납품·증설·계약 불가 상태
  mandatory_lexicon:
    - 지휘권
    - 인사 이동권
    - 직보권
    - 관문
    - 운영권
    - 재심
    - 인증
    - 통행료
    - 배치
    - 섹터
  forbidden_flattenings:
    - 회개물 스타트
    - 비굴한 해명 / 인정 구걸
    - 자기연민 소비
    - success -> pure punishment spiral
    - 주인공 고유성 없는 대형 성과 (배치 조감 인과 없는 승리)
    - 활약 후 태도 변화 없음 (성과 뒤 권한·사람·규칙 보상 누락)
    - 위기 때 빈손 / 무대응 / 무보상
    - 형제간 후계전으로 drift
    - 재벌가 치정물 / 감정극으로 drift
    - 거시경제 달력 암기형 회귀로 처리
    - 공신 세대를 무능하거나 탐욕스러운 악당으로 만듦
    - 제조·공급망·금융·표준 전쟁을 감정과 카리스마로만 해결
    - 운빨 생존을 실력처럼 포장
  tracking_slots:
    - 관문 전환 진척 (비용센터 → 필수 관문 섹터 수)
    - 운영권·인사권·결재권 회수 (딜 테이블에서 돈 대신 권한 요구)
    - 저평가 → 고평가 전환 (공신 세대와 주력사의 재평가)
    - 그룹 통행 경로 연결도 (도윤을 거치지 않으면 못 움직이는 정도)
  mandatory_scene_engines:
    - 딜 테이블에서 돈이 아니라 권한(지휘권·인사권·직보권)을 요구하는 장면
    - 죽은 장비·묻힌 인재를 재배치해 현장 복구 → 고객 재심/인증 통과 공개 증명
    - 성과 직후 보상 부착 (현금흐름 / 사람 / 규칙 중 하나 + 다음 섹터 입장권)
  protagonist_evaluation:
    admiration_axes:
      - 남들보다 먼저 읽음 (몰락 순서·병목·배치 최적해)
      - 돈이 아니라 권한을 요구하는 스케일
      - 죽은 것을 살리는 운영 실행력
      - 공신을 적으로 치지 않고 존엄 있는 퇴장을 설계하는 정치력
      - 결과로 인정을 강제함 (재심 통과·현장 복구·인증 획득)
    forbidden_praise_patterns:
      - 불쌍해서 챙겨준다
      - 착해서 인정한다
      - 혈통이 좋아서 당연하다
      - 우연히 잘 풀렸다
      - 참고 견뎌서 대단하다
      - 미래를 외웠으니 당연하다
    observer_tiers:
      - 현장 엔지니어 / 좌천 인재 (첫 재평가)
      - 공신 세대 임원 (경계 → 인정 또는 퇴장)
      - 회장 (신뢰 잔고 상승)
      - 주력사 경영진 (의존도 체감)
      - 외부 고객사 / PEF (독립 검증자)
    evaluation_thresholds:
      - 1화 딜 테이블에서 즉시 고평가 (돈 대신 권한 요구)
      - 3화 내 고객 재심 통과 → 간판 폭발
      - Block 1 완료 시 지휘권·인사권·직보권 확보
      - 큰 피해 뒤 즉시 다음 카드 확보 (반격 예약 없는 손해 금지)
  role_fit_constraints:
    - name: 회장 선행 금지
      role: 회장
      disallowed_actions:
        - 도윤 대신 핵심 판단을 완성
        - 도윤 없이 관문을 독립 전환
      exceptions:
        - 도윤의 증명을 보고 신뢰를 추가하는 것은 허용
    - name: 공신 캐리커처 금지
      role: 공신 세대
      disallowed_actions:
        - 무능해서 지는 장면
        - 탐욕만으로 동기 부여
      exceptions:
        - 이전 시대의 정답을 믿어서 저항하는 것은 허용
    - name: 조력자 감화 금지
      role: 조력자 (윤태석·민경호·오서윤 등)
      disallowed_actions:
        - 이유 없는 선의 지원
        - 감화 이전에 붙는 동맹
      exceptions:
        - 배치 후 실적이 나와서 계산상 도윤 편에 서는 선택
custom_rules:
  - 위기는 피해 연출보다 우선순위 선택권 증명으로 사용한다
  - 반격 예약 없는 손해는 금지
  - 설명이 리듬을 깨면 운이 좋군으로 절감할 수 있다
  - 각 블록의 보상은 현금흐름·사람·규칙 중 하나로 체감형이어야 한다
  - 다음 섹터는 이전 보상으로만 열린다
  - 공신 세대는 존엄을 잃지 않고 물러나야 한다
  - 보이는 재벌에서 보이지 않는 운영제국으로의 진화 축을 유지한다
