work_identity:
  work_id: failed_future_ceo_intern
  work_type: corporate_power
  family: blockguide
  one_line_truth: 파산의 모든 분기점을 기억하는 0권한 인턴이 결재선·KPI·예산 코드·이사회 표결을 한 칸씩 자기 관문으로 옮겨 한라테크를 다시 장악한다
  protagonist_weapon:
    - 전생 13년 CEO 경험에서 나온 결재선·파벌·리스크 병목 선독 능력
    - 인턴급 접점만으로 권한자의 결재선을 타게 만드는 우회 설계력
    - 자기 결정만 선명하고 타인 행동은 흐릿한 제약 아래서도 핵심 분기점을 짚는 판단
  business_axes:
    - 결재선 위치 (인턴→CEO→이사회)
    - KPI 산정식 / 예산 전용 코드
    - 프로젝트 오너십 / TF 실권
    - 시총 (15조→85조) / 지분·스톡옵션
    - 이사회 표결 (한가 31% / 외국인 28% / 국민연금 9%)
  control_axes:
    - 결재선 상승 (수혁이 올리지 않으면 최적 경로를 못 타는 상태)
    - CC 라인 / 정보 접근 등급
    - 프로젝트 오너십 선점 (AI 반도체·배터리 신사업)
    - 인사 라인 선택권 (파벌 사이에서 자기 라인 고르는 힘)
    - 위임장·이사회 표결 관문
  mandatory_lexicon:
    - 결재
    - 승인권
    - 보고선
    - CC 라인
    - KPI
    - 예산 전용 코드
    - 배석권
    - 상신
    - 위임장
    - 지분
    - 스톡옵션
    - TF
  forbidden_flattenings:
    - 회개물 스타트 — 수혁은 파산의 원흉이 아니라 조작된 판 위에서 결정을 내린 사람
    - 비굴한 해명 / 인정 구걸
    - 자기연민 소비 — 미결감은 동력이지 주조감정이 아니다
    - success → pure punishment spiral
    - 주인공 고유성 없는 대형 성과
    - 활약 후 태도 변화 없음
    - 위기 때 빈손 / 무대응 / 무보상
    - 전생 기억을 만능 예언으로 사용
    - 인턴 0권한 제약을 무시한 즉시 해결
    - 재벌가 치정물 / 로맨스 중심화
    - 적대자(정태준·오승재·사라 밀러) 무능 캐리커처화
  tracking_slots:
    - 저평가 → 고평가 전환 (직급·실명 호명·결재선 위치 변화)
    - 결재선·승인권·예산 코드 회수
    - 수혁 없이 못 움직이는 병목 형성
    - 시총 15조→85조 사업 전환 진척
  mandatory_scene_engines:
    - 인턴급 접점에서 권한자 결재선을 타게 만드는 우회 설계 → 공개 성과 → 권한 이동
    - 전생 기억으로 병목/위기 선독 후 최소 피해 통제
    - 승리 직후 실명 호명·배석권·CC 라인·TF 자리 등 체감형 권한 보상 회수
  protagonist_evaluation:
    admiration_axes:
      - 남들보다 먼저 읽음 (전생 기억 + 결재선 구조 이해)
      - 0권한에서도 비굴하지 않음
      - 손실을 통제함 — 최소 피해, 최대 회수
      - 결과로 인정 강제 — 해명 대신 상사가 스스로 재평가
      - 인턴인데 CEO 머리를 쓰는 갭 모에
    forbidden_praise_patterns:
      - 불쌍해서 챙겨준다
      - 착해서 인정한다
      - 성실해서 언젠가 보답받는다
      - 우연히 잘 풀렸다
      - 참고 견뎌서 대단하다
    observer_tiers:
      - 동료 인턴 / 사원
      - 김미선 과장 (인사팀)
      - 최준호 차장 (전략기획실)
      - 정태준 부사장
      - 이사회 / 외부 파트너
    evaluation_thresholds:
      - 3~6화 내 간판 장면 1회 (정태준 실명 호명)
      - 첫 승리 직후 정규직 전환 가능성 + 전략기획실 접근권
      - 큰 피해 뒤 즉시 다음 카드 확보
  role_fit_constraints:
    - name: 상사 선행 금지
      role: 김미선 과장 / 최준호 차장
      disallowed_actions:
        - 주인공 대신 핵심 추론 완성
        - 이유 없는 선의 지원
      exceptions:
        - 계산상 수혁 편에 서는 선택
    - name: 적대자 존엄 유지
      role: 정태준 / 오승재 / 한예린 / 사라 밀러 / 빅터 웨이
      disallowed_actions:
        - 무능 캐리커처화
        - 감정적 악당화
      exceptions:
        - 이전 시대 정답을 믿은 사람으로서의 합리적 행동
custom_rules:
  - 매 블록 보상은 실명 인정·배석권·CC 라인·TF 자리·결재선 상승·인사 이동·스톡옵션/지분 중 하나의 체감형 권한 보상이어야 한다
  - 다음 블록은 이전 블록의 권한 보상으로만 열린다 — 직급을 건너뛴 즉시 해결 금지
  - 위기는 피해 연출보다 우선순위 선택권 증명으로 사용한다
  - 반격 예약 없는 손해는 금지
  - 설명이 리듬을 깨면 운이 좋군으로 절감할 수 있다
  - "전생 기억 제약 3축 지속: 자기 결정만 선명 / 타인 행동 흐릿 / 모르던 부서 정보 없음"
  - 결재선·KPI·예산·이사회 표결은 추상이 아니라 실체 숫자·루프로 장면에 등장한다
