work_identity:
  work_id: laid_off_cashflow_rights_operator
  work_type: modernfantasy_money_rights_operator
  family: blockguide
  one_line_truth: 해고 직전의 정산 담당자가 버려진 계약서와 창고 재고에서 돈줄을 보고, 현금보다 먼저 접근권과 계약권을 사들여 권리 포트폴리오 운영자가 된다
  protagonist_weapon:
    - ERP와 계약서의 어긋난 흐름에서 버려진 권리를 읽는 정산 감각
    - 문서 증거, 현장 확인, 상대방 서명으로 돈줄을 현실화하는 검증력
    - 작은 receipt를 다음 행동권과 운영권으로 바꾸는 협상 감각
    - 선악보다 이득과 효율을 먼저 계산하는 자기중심적 협상 태도
  business_axes:
    - 정산 레인
    - 반품권 / 리퍼브권
    - 미수채권 / 위약금
    - 납품권 / 생산권
    - 브랜드 라이선스
    - 데이터 접근권
    - SPV / 권리 포트폴리오
  control_axes:
    - 데이터 접근권
    - 계약 검토권
    - 거래처 협상권
    - 반품/AS 대행권
    - 납품 우선권
    - 생산 슬롯
    - 결재선 접근권
  mandatory_lexicon:
    - 정산
    - ERP
    - 계정 만료
    - 미수채권
    - 반품권
    - 위약금
    - 재납품 우선권
    - 리퍼브
    - SKU
    - 계약 검토권
    - 데이터 접근권
    - 서명
    - 입금
    - SPV
    - 납품권
    - 생산 슬롯
    - 브랜드 라이선스
  forbidden_flattenings:
    - 1block을 1화짜리 단일 사건처럼 느슨하게 처리
    - 1block 안에 새 사건 또는 다음 actionable gate가 없음
    - 돈줄이 숫자 UI로 뜨고 바로 입금됨
    - AI가 판단과 돈벌이를 대신함
    - 주식/코인 찍기만으로 돈을 벌어 권리 구조가 사라짐
    - 보상이 현금/감탄에서 끝남
    - 계약 없이 능력만으로 거래가 성사됨
    - helper가 감정 리액션용으로만 소비됨
    - 장면이 회계 설명으로만 흐르고 물건/사람/서명이 없음
    - 주인공이 착한 해결사로 남의 손실부터 구함
    - 주인공이 악역 흉내만 내고 이득/효율 계산을 잃음
    - 재벌가 내부 후계 분쟁으로 둔갑함
    - 거래처/상사/감사/법무가 무능 캐리커처로만 소비됨
  tracking_slots:
    - 주인공 지위 상승 (해고 예정자 -> 정산 해결사 -> SPV 대표 -> 권리 포트폴리오 운영자)
    - 보상 단위 상승 (현금 -> 접근권 -> 계약권 -> 독점권 -> 생산권)
    - 증거 carrier 이동 (ERP -> 창고 -> 거래처 서명 -> 내부 감사 receipt -> 결재선)
    - opening observer shift (1block 안에 최소 두 사건을 압축하고, 무시 -> 계산상 협조까지 이동)
  mandatory_scene_engines:
    - 돈줄 이상 징후 감지 -> 문서 증거 확보 -> 현장 확인 -> witness 검증 -> 계약 receipt 획득
    - 성과 직후 체감형 보상 부착 (해고 보류, 데이터 접근권, 계약 검토권, 납품 우선권 중 1종 이상)
    - 이전 보상으로만 다음 돈줄에 접근하고, 1block 안에서 첫 사건 receipt와 두 번째 사건 gate를 함께 착지
  protagonist_evaluation:
    admiration_axes:
      - 남들이 폐기/반품/보류로 보는 것을 권리 묶음으로 먼저 읽음
      - 현금 합의 앞에서도 다음 행동권을 요구함
      - 선의가 아니라 자기 이득과 효율을 기준으로 거래 조건을 고름
      - 문서와 현장을 모두 통과시켜 결과로 인정받음
      - 작은 권리를 묶어 큰 운영권으로 바꿈
    forbidden_praise_patterns:
      - 불쌍해서 도와준다
      - 성실해서 언젠가 보답받는다
      - 운 좋게 대박났다
      - AI가 똑똑해서 돈 벌었다
      - 재벌/상사가 봐줘서 살아났다
      - 착해서 손해를 감수한다
    observer_tiers:
      - 상사 / 구조조정 담당자
      - 내부 감사 신입
      - 창고 현장 반장
      - 거래처 실무자
      - 법무 / 계약 담당자
      - 제조사 validator
      - 결재권자 / 투자자
    evaluation_thresholds:
      - 첫 block 안에 첫 visible receipt가 있어야 한다
      - 첫 block 안에 별도 사건 1개 또는 다음 actionable gate가 있어야 한다
      - 첫 visible receipt는 현금 단독이 아니라 접근권 또는 계약 검토권을 포함해야 한다
      - 각 arc 종료 시 다음 돈줄 접근권이 열려야 한다
      - 큰 손해 뒤에는 반격 예약 또는 다음 카드가 즉시 남아야 한다
  role_fit_constraints:
    - name: AI 자동 해결 금지
      role: AI / 자동화 도구
      disallowed_actions:
        - 최종 투자 판단을 대신함
        - 자동 매매로 돈을 벌어 옴
        - 주인공 검증 없이 정답을 확정함
      exceptions:
        - 검색, 비교, 리스크 표시, 계약 초안 정리는 허용
    - name: 조력자 감화 금지
      role: 감사 / 창고 / 법무 / 제조사 helper
      disallowed_actions:
        - 이유 없는 선의 지원
        - 감탄 리액션만 하고 증거 carrier 역할을 하지 않음
      exceptions:
        - 계산상 주인공 편에 서는 선택은 허용
    - name: 적대자 무능화 금지
      role: 상사 / 거래처 / 경쟁자
      disallowed_actions:
        - 멍청해서 지는 장면
        - 이유 없는 악의
      exceptions:
        - 기존 관행과 손익 계산을 믿어 합리적으로 오판하는 것은 허용
custom_rules:
  - 돈줄은 예언이 아니라 문서와 현장의 어긋남으로 발견된다
  - 이긴 장면은 반드시 서명, 입금, 접근권, 계약권, 독점권, 생산권 중 하나의 receipt를 남긴다
  - 현금 보상만으로 끝나는 블록은 실패로 본다
  - 1block은 2~6화 분량의 planning bundle이므로 최소 두 사건을 압축한다
  - 주인공의 기준은 착함/악함이 아니라 이득, 효율, 다음 권한이다
  - 다음 gate는 이전 gate의 receipt로만 열린다
  - 주인공은 재벌가 내부자가 아니라 외부 권리 운영자로 성장해야 한다
