custom_rules:
  - "1 TR block은 downstream 2~6화 episode-bundle이다"
  - "모든 TR block에는 주 사건 1개와 별도 부 사건 1개 이상이 있어야 한다"
  - "부 사건은 다음 섹터 gate가 되어야 하며 장식이면 FAIL"
  - "도윤의 모든 행동은 immediate benefit과 cost가 보여야 한다"
  - "대가 없는 선의, 감정형 보복, 체면형 손실 감수는 금지한다"
  - "권리 보존은 도윤의 정보 우위, 접근권, 옵션, 정산권, 퇴로 확보로 돌아와야 한다"
  - "첫 block direct line 후보: 회사는 안 삽니다. 서버실 열쇠와 결제권만 사죠"
  - "BI는 TR 70블록과 source handoff gate PASS 전까지 생성하지 않는다"
