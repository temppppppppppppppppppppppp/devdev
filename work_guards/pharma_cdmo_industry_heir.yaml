work_identity:
  work_id: pharma_cdmo_industry_heir
  family: blockguide
  work_type: pharma_cdmo_industry_tycoon
  one_line_truth: IMF 직후 부도난 제약공장을 산 회귀자가 신약 천재가 아니라 GMP, 생산기록, 병원 납품권, 콜드체인, 의료 데이터, 원료소재, 공급망 금융을 장악해 모든 산업의 생산 표준이 된다.
  protagonist_weapon:
    - 미래 제약/바이오 공급망 사고와 산업 성장 경로에 대한 기억
    - 품질문서, 인증, 납품, 온도기록, 청구 데이터의 실제 통제력을 보는 눈
    - 선악보다 이득과 효율을 먼저 계산하는 자기중심성
  business_axes:
    - 제약 CDMO
    - GMP/품질보증
    - 병원 납품/청구 데이터
    - 콜드체인
    - 원료의약품/정밀화학
    - 소비재 안전표준
    - 공급망 금융
  control_axes:
    - 품질문서 접근권
    - 감사 대응권
    - 병원 구매실 직통선
    - 글로벌 CDMO audit ticket
    - 온도기록 데이터
    - 생산권 담보
    - 국가 표준 조건표
  forbidden_flattenings:
    - 신약 천재가 단번에 치료제를 개발한다
    - 사람을 살렸으니 모두 감동한다
    - 공장 인수만 하고 감사/납품/계약 사건이 없는 얇은 block
    - GMP나 콜드체인을 용어 장식으로만 사용한다
    - 착해서 손해를 감수한다
    - 바이오 안에서만 머물고 전 산업 표준으로 확장하지 않는다
  tracking_slots:
    - visible pressure -> execution -> public proof -> private receipt -> observer shift -> next gate의 기본 loop
    - 모든 TR block은 2~6화 episode-bundle이며 최소 2개 사건축 또는 전환을 포함한다
    - reward는 현금보다 인증권, 문서권, 납품권, 계약권, 데이터권, 공급망 금융권으로 환전된다
    - 바이오 CDMO proof가 콜드체인, 병원 데이터, 원료소재, 소비재 안전표준, 금융 조건표로 확장된다
  mandatory_scene_engines:
    - 공장 인수 압력이 품질문서 확보, 실사 대응, 감사 proof, private receipt로 이어지는 장면
    - 병원 긴급 납품 위기가 장기 납품권, 구매실 직통선, 데이터 접근권으로 환전되는 장면
    - 콜드체인 또는 배치기록 사고가 온도기록/편차보고/책임선 재배치로 해결되는 장면
  protagonist_evaluation:
    admiration_axes:
      - 남들이 폐공장으로 보는 것을 인증권과 생산권으로 본다
      - 환자 미담보다 납품권, 데이터, 장기계약을 먼저 계산한다
      - 식약처, 병원, 글로벌 제약사를 각각 다른 receipt gate로 다룬다
      - 미래 지식을 신약 정답지가 아니라 공급망 우선순위와 책임선 설계에 쓴다
      - 돈을 생산 표준과 산업 통제권으로 바꾼다
    forbidden_praise_patterns:
      - 착해서 공장을 살렸다
      - 신약 천재라서 모두 이겼다
      - 회귀빨로 찍었더니 맞았다
      - 환자를 살려 모두 감동했다
    observer_tiers:
      - 품질보증팀장 윤세린
      - 식약처 감사관 오민석
      - 대학병원 구매실장 박도현
      - 대기업 제약 전무 한재국
      - 글로벌 제약사 외주생산 담당 리처드 케인
  evaluation_thresholds:
      - Block 001 안에 공장 인수 압력과 식약처 실사 조기 통보가 동시에 열려야 한다
      - Block 002 안에 품질문서 확보와 책임선 재배치 실행이 visible해야 한다
      - Block 003 안에 첫 GMP proof 또는 병원 납품 proof가 visible해야 한다
      - Block 004~005 안에 private receipt와 글로벌 audit ticket이 열려야 한다
      - Opening 001~005 안에 품질문서 접근권, 실사 대응 대표자 지위, 병원 구매실/납품 gate, 글로벌 CDMO audit ticket, 주인공 평가 변화가 모두 선명해야 한다
mandatory_rules:
  - 모든 TR block은 2~6화 분량 episode-bundle로 읽고, 같은 block 안에 최소 2개 사건축 또는 전환을 넣는다.
  - 주인공 행동은 immediate gain과 cost가 보여야 한다.
  - 대가 없는 선의, 환자 미담, 공짜 구원은 금지한다.
  - reward는 돈보다 인증권, 문서권, 납품권, 계약권, 데이터권, 공급망 금융권으로 남겨야 한다.
  - public proof는 private receipt로 잠근다.
  - 각 block은 same-block cider receipt가 있어야 한다.
slot_catalog:
  pressure_slots:
    - 부도 공장
    - 식약처 실사
    - 병원 긴급 납품
    - 불량 배치
    - 콜드체인 사고
    - 보험 심사 보류
  execution_slots:
    - 공장 인수
    - 품질문서 확보
    - 생산 책임선 재배치
    - 긴급 납품
    - 장기계약 전환
    - 표준 양식 배포
  proof_slots:
    - 감사 통과
    - 병원 납품 성공
    - 폐기율 감소
    - 보험코드 반영
    - 글로벌 audit 통과
  receipt_slots:
    - 구매실 직통선
    - 품질책임자 임명
    - LOI
    - 장기 납품계약
    - 데이터 접근권
    - 공급망 금융 조건표
custom_rules:
  - opening TR 2~6 안에 공장 인수, 감사 proof, 병원 납품 receipt, 글로벌 audit ticket이 모두 보여야 한다.
  - Block 001은 회귀와 공장 입찰뿐 아니라 식약처 실사 조기 통보까지 열어야 한다.
  - 회귀 지식은 정답지가 아니라 우선순위 선택권으로 쓴다.
  - 착하지 않아도 된다. 악하지 않아도 된다. 반드시 효율적이어야 한다.
  - 바이오 CDMO는 첫 독점 엔진이고, 최종 이미지는 국가 산업 표준 운영자다.

firefly_runtime_contract:
  one_line_truth: 신약을 발명하지 않는 회귀자가 품질문서, 감사 대응권, 병원 납품 gate, 온도기록, 의료 데이터, 원료소재, 공급망 금융권을 receipt로 잠그며 산업 표준 운영자가 된다.
  tracking_slots:
    - pressure: 운영/규제/납품 압박이 먼저 보인다.
      execution: 강태오는 돈, 인력, 문서, 책임선을 골라 비용을 지불한다.
      public_proof: 감사 기록, 병원 접수, 온도기록, 계약서, 재실사 메모처럼 외부자가 확인 가능한 증거가 남는다.
      private_receipt: 문서권, 대표자 지위, 구매실 직통선, audit ticket, 데이터 접근권, 공급망 금융 조건표 중 하나가 같은 block 안에서 강태오 손에 들어온다.
      observer_shift: 윤세린, 오민석, 박도현, 한재국, 리처드 케인이 태오를 공장주가 아니라 표준 운영자로 재분류한다.
      next_gate: 다음 regulated gate를 마지막에 연다.
    - 모든 block은 2~6화 episode-bundle로 읽되, proof와 receipt를 다음 block으로 미루지 않는다.
    - 현금 보상은 보조 신호다. 주 보상은 인증권, 문서권, 납품권, 계약권, 데이터권, 공급망 금융권이다.
  mandatory_scene_engines:
    - 공장 인수 장면은 부동산 획득이 아니라 품질문서 접근권과 실사 대응 대표자 지위 획득으로 끝난다.
    - 감사 장면은 합격/불합격 감정이 아니라 공적 proof가 병원 납품 gate나 글로벌 audit ticket으로 환전되는 구조여야 한다.
    - 병원 납품 장면은 환자 미담이 아니라 구매실 직통선, 약제위원회 시간표, 최소발주, 구매 데이터 접근권으로 끝난다.
    - 콜드체인 장면은 차가운 배송 묘사가 아니라 온도기록 원장, 편차보고, 책임자 서명, 데이터권으로 끝난다.
  forbidden_flattenings:
    - 신약 천재가 치료제를 발명해서 해결한다.
    - 환자 사연이나 선의가 계약/권리 receipt를 대체한다.
    - public proof만 있고 private receipt가 없다.
    - GMP, CDMO, 콜드체인, 데이터가 전문용어 장식으로만 나온다.
    - block이 고통/압박만 남기고 same-block cider receipt 없이 끝난다.
  evaluation_thresholds:
    - B1 receipt: 품질문서 접근권과 실사 대응 대표자 지위가 찍힌다.
    - B2 receipt: 배치기록/편차보고 원본과 품질책임자 대행권이 찍힌다.
    - B3 receipt: 조건부 감사 기록과 병원 대체 샘플 요청권이 찍힌다.
    - B4 receipt: 병원 구매실 직통선과 온도기록 원장이 찍힌다.
    - B5 receipt: 글로벌 샘플 문서 검토 및 설비 예비 방문 ticket이 찍힌다.
    - 매 block 말미에는 누가 강태오를 다시 계산했는지와 다음 gate가 함께 보여야 한다.
  fun_ledger_defaults:
    success: 권리/문서/데이터/계약이 실제로 강태오 쪽으로 이동한다.
    recognition: 호감이 아니라 실무자와 적대자가 '맡기거나 막아야 할 운영자'로 재평가한다.
    reward: 인증권, 문서권, 납품권, 계약권, 데이터권, 공급망 금융권 중 하나를 receipt로 남긴다.
    cost: 현금 유출, 생산 중단, 감시 부담, 큰 매각 기회 포기처럼 즉시 비용을 붙인다.
    expectation: 다음 regulated gate를 짧고 구체적으로 연다.
