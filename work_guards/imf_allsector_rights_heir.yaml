work_identity:
  work_id: imf_allsector_rights_heir
  work_type: imf_allsector_chaebol_rights_rollup
  family: blockguide
  one_line_truth: "1997년 IMF 직전으로 돌아온 재벌 후계자가 단일 섹터가 아니라 냉장물류, 회선/PC방, 통신, NPL, 부품소재, 도심 부동산, IP에서 버려진 권리를 사들여 자기 권한으로 묶는 no-fantasy 권리 회수 경영물"
  protagonist_weapon:
    - "회귀 전 잔여자산 정리 경험으로 어떤 권리가 헐값에 버려졌는지 아는 기억"
    - "현재 원장, 계약서, 채권 약정, 회선 계약, 인증 파일을 읽어 proof를 만드는 권리 실사력"
    - "선의나 복수보다 이득과 효율을 우선하는 자기중심적 판단"
    - "돈보다 먼저 매각 보류권, 해지 보류권, 실사권, 우선매수권, TF 권한을 요구하는 태도"
  business_axes:
    - "냉장물류/유통: 콜드체인 입찰 자격과 숙련 shift"
    - "PC방/초고속인터넷/게임 유통: 회선 장기계약, 결제망, 유통권"
    - "PCS/통신단말: 컨소시엄, 대리점망, 단말 할부채권"
    - "NPL/워크아웃: 담보권, 전환권, 우선매수권"
    - "반도체 부품소재: 납품 인증, 공정 know-how, 설비 납기"
    - "도심 호텔/오피스: 전력, 통신, 냉각, 장기 임차권"
    - "엔터/IP: 저작권, 편성권, 광고 inventory, 게임/음악 유통권"
  control_axes:
    - "비상자산 매각 회의 발언권"
    - "원본 손익표/계약서/채권 약정 접근권"
    - "매각/해지/폐쇄 보류권"
    - "30일 권리 실사권"
    - "우선매수권/우선협상권"
    - "채권단/은행 협상 배석권"
    - "sector TF owner"
    - "지주회사 재편 안건권"
  mandatory_lexicon:
    - "버려진 권리"
    - "매각 보류권"
    - "계약 해지 보류권"
    - "권리 실사권"
    - "콜드체인 입찰 자격"
    - "회선 장기계약"
    - "게임 유통권"
    - "NPL 담보권"
    - "우선매수권"
    - "납품 인증"
    - "전력/통신/냉각 권리"
    - "광고 inventory"
  forbidden_flattenings:
    - "한 섹터만 길게 파고 다른 섹터를 장식으로 미루는 전개"
    - "모든 섹터를 백화점식으로 나열만 하고 권한 사다리로 연결하지 않는 전개"
    - "회귀 지식으로 미래 주가나 뉴스만 찍는 전개"
    - "주인공이 착해서 사람을 구하는 미담형 전개"
    - "권리 proof 없이 말싸움으로 결재를 뒤집는 전개"
    - "임원/은행/현장 책임자를 바보 악역으로 만드는 전개"
    - "reward가 현금, 칭찬, 감탄으로만 닫히는 전개"
    - "IMF를 감상적 배경으로만 쓰고 계약/채권/회선/인증 문서를 장면화하지 않는 전개"
    - "시스템창, 가치 UI, 초능력 감정, 마법적 미래판독"
  tracking_slots:
    - "태준 평가 상승: 도련님 -> 시간을 빼앗은 사람 -> 권리 실사 담당자 -> 섹터 TF owner -> 지주회사 재편 설계자"
    - "권한 ladder: 발언권 -> 원본 자료 접근권 -> 매각/해지 보류권 -> 30일 권리 실사권 -> 우선매수권 -> 사장단 안건권"
    - "sector proof chain: 냉장물류 -> 회선/PC방 -> 통신 -> NPL -> 부품소재 -> 도심 인프라 -> IP"
    - "self-interest ledger: 모든 도움과 보류는 태준의 권한, 지분 명분, 정보 우위, 실행권으로 회수되어야 한다"
  first_block_reward:
    - "TR Block 001: 남서 냉장창고 매각 결재가 멈추고 원본 손익표/인증 파일 접근권이 열린다"
    - "TR Block 001 side event: 전산실 회선 장기계약 해지가 보류되고 PC방/게임 유통권 표지가 열린다"
    - "TR Block 001 receipt: 매각 보류권, 계약 해지 보류권, 30일 권리 실사권 협상 테이블"
  crisis_doctrine:
    - "선독: 회귀 전 팔려 나간 권리의 순서를 기억한다"
    - "대비: 현재 계약서와 원장, 채권 약정, 인증 파일을 먼저 확보한다"
    - "최소 피해: 단기 현금 대신 더 큰 권리를 보존하되, 왜 그것이 태준에게 이득인지 명시한다"
    - "즉시 보상: 매 block마다 자료, 권리, 권한, 우선권, 다음 gate 중 하나를 지급한다"
  mandatory_scene_engines:
    - "주 사건 + 별도 부 사건 동시 진행. 모든 TR block은 2~6화 episode-bundle 밀도를 가져야 한다"
    - "계약서나 원장에서 빠진 column을 현재 자료로 증명한다"
    - "authority witness가 proof를 보고 제한 권한을 준다"
    - "helper는 감탄자가 아니라 회계/현장/계약/채권/통신 근거 하나를 검증한다"
    - "섹터 성과는 다음 섹터 gate 또는 지주회사 권한으로 환전된다"
  protagonist_evaluation:
    admiration_axes:
      - "선해서가 아니라 이득과 효율을 정확히 계산해서 움직인다"
      - "남들이 자산으로도 보지 않는 권리를 자기 통제권으로 바꾼다"
      - "현재 자료로 증명하고, 권한으로 회수한다"
      - "사람을 살리더라도 숙련자산과 계약권 보존이라는 이득을 먼저 말한다"
    forbidden_praise_patterns:
      - "착해서 인정받는다"
      - "재벌가 후계자라 봐준다"
      - "미래를 알아서 맞혔다"
      - "임원이 멍청해서 당했다"
      - "사람을 아껴서 모두 감동했다"
    observer_tiers:
      - "강문식 회장"
      - "최도겸 CFO"
      - "윤세라 회계 helper"
      - "박기웅 전산실 helper"
      - "권오찬 현장소장"
      - "사장단 회의"
      - "은행/채권단/외부 매수자"
    evaluation_thresholds:
      - "TR Block 001 안에 매각 보류와 회선 해지 보류를 동시에 얻는다"
      - "TR 2~6 안에 cold-chain proof와 PC방/회선권 next gate가 모두 체감된다"
      - "각 arc 종료 시 권리 receipt와 다음 섹터 gate가 남는다"
  role_fit_constraints:
    - name: "회장 즉시 굴복 금지"
      role: "강문식"
      disallowed_actions:
        - "한마디에 전권을 넘기기"
        - "감동해서 태준을 믿기"
        - "무능한 고집만 부리기"
      exceptions:
        - "proof를 본 뒤 제한 권한을 주고 결과 조건을 거는 행동"
    - name: "CFO 바보화 금지"
      role: "최도겸"
      disallowed_actions:
        - "기본 현금흐름도 못 보는 인물화"
        - "이유 없는 악의"
        - "태준 말에 바로 굴복"
      exceptions:
        - "IMF 현금 압박 때문에 매각을 밀어붙이는 합리적 반대"
    - name: "helper 감탄자화 금지"
      role: "윤세라 / 박기웅 / 권오찬"
      disallowed_actions:
        - "놀라기만 하기"
        - "근거 없이 태준 편 들기"
      exceptions:
        - "자신의 문서와 현장 근거가 태준의 방향과 맞을 때 조건부 협조"
custom_rules:
  - "1 TR block은 downstream 2~6화 episode-bundle이다"
  - "모든 TR block에는 주 사건 1개와 별도 부 사건 1개 이상이 있어야 한다"
  - "부 사건은 다음 섹터 gate가 되어야 하며 장식용 잡담이면 FAIL"
  - "태준의 모든 행동은 immediate benefit과 cost가 보여야 한다"
  - "대가 없는 선의, 감정형 보복, 체면형 손실 감수는 금지한다"
  - "권리 보존은 태준의 정보 우위, 권한, 지분 명분, 퇴로 확보로 돌아와야 한다"
  - "첫 block direct line 후보: 창고를 사자는 게 아닙니다. 창고에 붙은 권리를 사자는 겁니다"
  - "BI는 TR 70블록과 source handoff gate PASS 전까지 생성하지 않는다"
