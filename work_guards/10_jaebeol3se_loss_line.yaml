work_identity:
  work_id: jaebeol3se_loss_line
  work_type: investment
  family: blockguide
  one_line_truth: 오너 일가에서 밀려 말석에 박힌 재벌 3세가 각 부서 숫자를 한 줄의 손실선으로 먼저 읽어, 회사 안 권한과 시장 바깥 수익을 함께 독식한다
  protagonist_weapon:
    - 각 부서가 따로 들고 있는 숫자를 한 줄의 손실선으로 묶어 읽는 감각
    - 말석에서 세 부서 보고서를 동시에 듣는 자리의 정보 우위
    - 공개 신호를 누구보다 먼저 연결해 포지션을 설계하는 속도
  business_axes:
    - 리스크 회의 배석·의결 (내부 손실 방어의 제도적 자리)
    - 보험 재협상 (갱신안 리스크 판독 → 조건 우위)
    - 고객사 실사 대응 (원가 연쇄 방어)
    - 공개 신호 기반 외부 포지션 (해운·보험시장·공급망 공개 지표)
  control_axes:
    - 배석권 (리스크 회의 정식 참석)
    - 서명권 (긴급 헤지 실행 공동 서명)
    - 열람권 (보험 갱신안·클레임 준비금 대시보드)
    - 직보 라인 (회장 주간 메모)
    - 의결권 (리스크 위원회 정식 위원)
  mandatory_lexicon:
    - 손실선
    - 배석권
    - 서명권
    - 열람권
    - 의결권
    - 직보 라인
    - 갱신률
    - 스크랩률
    - 슬롯 취소
    - 포지션
    - 헤지
    - 선매입
  forbidden_flattenings:
    - 회개물 스타트
    - 비굴한 해명 / 인정 구걸
    - 자기연민 소비
    - success -> pure punishment spiral
    - 주인공 고유성 없는 대형 성과 (손실선 판독 인과 없는 승리)
    - 활약 후 태도 변화 없음 (성과 뒤 서열 영수증 누락)
    - 위기 때 빈손 / 무대응 / 무보상
    - 능력을 본인이 장광설로 해설
    - 내부 데이터를 근거로 외부 포지션 잡는 구조 (insider-trading 금지)
    - 내부 레인과 외부 레인 데이터 출처 혼선 (dual-lane 혼선 금지)
    - asset-first reward narration (자산 수치가 보상의 얼굴이 됨)
    - 보상 순서 역전 (평가 수정 → 권한 → 자본 순서 절대)
    - 순수 퇴사물·자산자랑물·회개물로 둔갑
    - 사촌 형을 무능/탐욕 캐리커처로 만듦
    - 운빨 생존을 실력처럼 포장
  tracking_slots:
    - 저평가 -> 고평가 전환 (리스크 표 도련님 -> 손실선을 먼저 읽는 놈)
    - 권한 축 상승 (말석 -> 배석 -> 서명 -> 의결)
    - 파일럿 운용금 규모 (0 -> 50억 -> 확대)
    - 사촌 형 경계 수위 상승 (무시 -> 침묵 -> 경계 -> 대응)
  mandatory_scene_engines:
    - 각 부서 보고서의 개별 숫자를 손실선 하나로 묶어 기존 낙관 보고를 회의실에서 뒤집는다
    - 공개 데이터만으로 상대방의 제안·보고의 숨은 리스크를 정확히 찍는다
    - 성과 직후 평가 수정 → 권한 보상이 체감형으로 붙는다 (배석권/서명권/열람권/의결권/직보 라인 중 1종 이상)
  protagonist_evaluation:
    admiration_axes:
      - 남들보다 먼저 읽음 (손실 연쇄를 개별 뉴스 단계에서 먼저 감지)
      - 비굴하지 않음 (말석에서도 사촌 형 보고를 정면으로 뒤집음)
      - 손실을 통제함 (위기에서 최소 피해 + 즉시 회수 벡터)
      - 결과로 인정을 강제함 (숫자와 장부를 증거로 꺼냄)
      - 공개 데이터의 연결로 승부함 (내부 정보 특권이 아닌 감각)
    forbidden_praise_patterns:
      - 불쌍해서 챙겨준다
      - 착해서 인정한다
      - 성실해서 언젠가 보답받는다
      - 우연히 잘 풀렸다
      - 참고 견뎌서 대단하다
      - 재벌이니까 결국 돈으로 해결한다
    observer_tiers:
      - 전략금융실 실무자 (말석 옆자리)
      - 보험 담당 임원 임재훈 (갱신안 오류 찍힘 → 침묵)
      - 사촌 형 도현석 (무시 → 침묵 → 경계 → 대응)
      - CFO 강태호 (견제 → 계산 전환 → 동석 요청)
      - 회장 (직보 라인 부여 → 위원 승격)
    evaluation_thresholds:
      - 1화 내 첫 사이다 (사촌 형 낙관 보고를 trigger set A로 뒤집음)
      - 3화 내 간판 폭발 (18일 예측 적중 → 배석권·서명권·열람권 확보)
      - 각 ARC 완료 시 권한 축 1단계 이상 상승
      - 큰 피해 뒤 즉시 다음 카드 확보 (반격 예약 없는 손해 금지)
  role_fit_constraints:
    - name: 사촌 형 캐리커처 금지
      role: 도현석 (사촌 형)
      disallowed_actions:
        - 무능해서 지는 장면
        - 이유 없는 악의
      exceptions:
        - 숫자를 따로 봤기 때문에 연결을 못 본 사람으로서 합리적으로 견제하는 것은 허용
    - name: 조력자 감화 금지
      role: 조력자 전원
      disallowed_actions:
        - 이유 없는 선의 지원
        - 감화 이전에 붙는 동맹
      exceptions:
        - 계산상 도진우 편에 서는 선택
    - name: CFO 선행 금지
      role: 강태호 (CFO)
      disallowed_actions:
        - 도진우 대신 손실선을 독립 완성
        - 이유 없는 후원
      exceptions:
        - 도진우 숫자를 보고 계산으로 판단을 바꾸는 것은 허용
custom_rules:
  - 평가 수정 → 권한 → 자본 순서는 절대다 — 자본이 앞에 서면 asset-first로 드리프트한다
  - 내부 데이터는 손실 방어와 권한 회수 전용, 외부 포지션은 공개 신호 전용 — 두 레인의 출처를 절대 섞지 않는다
  - 위기는 피해 연출보다 우선순위 선택권 증명으로 사용한다
  - 반격 예약 없는 손해는 금지
  - 설명이 리듬을 깨면 운이 좋군으로 절감할 수 있다
  - 회사는 감옥이 아니라 관제탑이다 — 주인공은 관제탑을 떠나지 않는 사람이다
