work_identity:
  work_id: hoegui_surgeon
  work_type: medical_authority
  family: blockguide
  one_line_truth: 65세 정년퇴직 외과 과장이 28세 R1으로 돌아가, 3만 건 수술 판독력으로 교수의 오판을 수술 전에 읽고 차트에 기록으로 남겨, 적중이 반복되면서 서열은 그대로인데 실질적 수술 결정권이 뒤집힌다
  protagonist_weapon:
    - 30년 3만 건 수술에서 축적한 합병증 패턴 판독력 — 영상 소견, 혈액 수치, 환자 자세 하나로 수술 중 변수를 수술 전에 읽는다
    - 차트 노트 — R1이 유일하게 공식적으로 남길 수 있는 문서. 사전 기록이 적중의 증거가 된다
    - 28세 체력(손 떨림 0) + 65세 판단력의 물리적 조합
  business_axes:
    - 차트 판독 적중 (수술 전 합병증 패턴 감지)
    - 컨퍼런스/M&M 공식 기록 (판독력의 공적 증거화)
    - 집도권 상승 (보조 → 단독 → 고난도 → 특수)
    - 권한 토큰 누적 (직보선/배정권/발표권/설계권/호출권)
  control_axes:
    - 과장 직보선 (의사결정자 직통)
    - 고난도 케이스 사전 배정 (케이스를 먼저 보는 권한)
    - 컨퍼런스 발표권 (공식 석상 발언)
    - 수술 계획 사전 설계권 (접근법을 먼저 올리는 권한)
    - 타과 협진 호출권 (타과가 R1을 지명)
    - M&M 회의록 기재 (판독력의 공식 문서화)
    - 수술 교육 체계 재편권 (제도화)
  mandatory_lexicon:
    - 차트 기록
    - 판독
    - 합병증 패턴
    - 변이 혈관
    - 접근법
    - 집도권
    - 1st assist
    - M&M 컨퍼런스
    - 회의록
    - 직보선
    - 사전 설계권
    - 협진 호출
    - 케이스 배정
    - 수련 체계
  forbidden_flattenings:
    - 무보상 희생 미담 펌프 (착해서 대신 뒤집어쓰는 전개, 감동만 남고 권한 변화 없는 전개, 자기희생이 주인공 소모로만 끝나는 전개)
    - 감동 의사물 (돈 없는 환자 무료 수술, 환자 가족 눈물 감사, 과로 미담)
    - 환자 구조 자체가 첫 승리인 구조 (첫 승리는 판독 적중에 따른 평가 수정)
    - 의료 윤리 딜레마 (살릴까 말까 고민은 엔진이 아니다)
    - 회개물 스타트
    - 비굴한 해명 / 인정 구걸
    - 자기연민 소비 / 전생 실패를 내 탓으로 소비
    - success -> pure punishment spiral
    - 주인공 고유성 없는 대형 성과 (판독 인과 없는 수술 성공)
    - 활약 후 태도 변화 없음 (성과 뒤 권한 보상 누락)
    - 위기 때 빈손 / 무대응 / 무보상
    - 능력을 본인이 장광설로 해설
    - 규모 과시가 인과보다 앞서는 전개 (세계 최초/교과서 등재가 판독 적중보다 먼저 오지 않는다)
    - 적대자를 멍청한 악당으로 처리 (강태준은 경험 500건 기준의 합리적 판단자)
    - 수술 전문 용어를 감정과 카리스마로만 처리
    - 보상이 생존/칭찬/감사 수준에 그침
  tracking_slots:
    - 권한 누적 (갈고리 → 직보선 → 배정권 → 발표권 → 설계권 → 호출권 → 집도권 → 과장 → 왕좌)
    - 저평가 → 고평가 전환 (갈고리 R1 → 차트가 맞는 R1 → 회의록의 R1 → 타과가 찾는 R1)
    - 적대자 전환 (강태준: 묵살 → 위계 문제 → 인사 공작 → 실적 의존 → 인정)
    - 조력자 계산 전환 (조영채: 계산 → 직보선 → 방어 → 추천)
    - 제도화 진척 (개인 관행 → 교육위 → 학회 제안 → 표준 프로토콜)
  mandatory_scene_engines:
    - 수술 전 차트 판독에서 합병증 패턴을 감지하고 기록으로 남기는 장면
    - 수술 중 또는 컨퍼런스/M&M에서 사전 기록이 적중했음이 공개 확인되는 장면
    - 성과 직후 권한 토큰 회수 (직보선/배정권/발표권/설계권/호출권/집도권 중 하나 이상)
    - 적대자 또는 주변인의 태도가 계산 전환으로 바뀌는 장면
  protagonist_evaluation:
    admiration_axes:
      - 남들보다 먼저 읽음 (합병증 패턴을 수술 전에 감지)
      - 비굴하지 않음 (묵살당해도 차트에 기록을 남긴다 — 구걸이 아니라 증거 생산)
      - 손실을 통제함 (출혈 발생 시 준비된 대안 한 줄로 통제)
      - 결과로 인정을 강제함 (차트 기록 날짜가 증거)
      - 서열이 아니라 판독력이 말한다
    forbidden_praise_patterns:
      - 불쌍해서 챙겨준다
      - 착해서 인정한다
      - 성실해서 언젠가 보답받는다
      - 우연히 맞았다
      - 참고 견뎌서 대단하다
      - 환자를 살려서 감동이다
    observer_tiers:
      - 동기 R1 박세진 (직접 목격)
      - 치프 한정우 (위계 → 태도 전환)
      - 조영채 과장 (계산 전환 → 직보선 → 추천)
      - 강태준 교수 (묵살 → 경계 → 공작 → 의존 → 인정)
      - 박정민 교수 (M&M에서 반박 불가 → 판독 체계 수용)
      - 김수현 내과 펠로우 (타과 첫 협진 호출)
      - 이상훈 라이벌 (데이터 검증 → 경쟁 → 양립)
      - 나경태 병원장 (이용 시도 → 압박 → 퇴장)
      - 권혁수 학회 중진 (학회 표준 지지)
    evaluation_thresholds:
      - 1화 내 공개 묵살 + 차트 기록 (고유 역량 노출)
      - 3화 내 출혈 적중 → 한 줄 통제 → 컨퍼런스 기록 확인 (간판 폭발)
      - Block 10 완료 시 직보선 + 배정권 + 발표권 + 1st assist 확보
      - 큰 피해 뒤 즉시 다음 카드 확보 (반격 예약 없는 손해 금지)
  role_fit_constraints:
    - name: 강태준 캐리커처 금지
      role: 강태준 (지도교수)
      disallowed_actions:
        - 무능해서 지는 장면
        - 이유 없는 악의
        - 서동혁 판독이 맞았는데 계속 멍청하게 반대
      exceptions:
        - 경험 500건 기준의 합리적 판단으로 저항하는 것은 허용
        - 수련 체계 위계를 지키려는 논거는 합리적
    - name: 조력자 감화 금지
      role: 조영채 / 정소연
      disallowed_actions:
        - 이유 없는 선의 지원
        - 감화 이전에 붙는 동맹
        - 서동혁이 착해서/대단해서 도와준다
      exceptions:
        - 계산상 서동혁 편에 서는 선택 (판독이 맞으면 내 환자 생존율이 올라간다)
    - name: 병원장 단순악 금지
      role: 나경태
      disallowed_actions:
        - 순수 악의로 은폐
        - 비합리적 탐욕
      exceptions:
        - 병원 운영과 자기 재임 기간의 리스크 관리 차원의 은폐는 합리적 동기로 허용

sacrifice_policy:
  allowed:
    - 주인공이 환자를 위해 위험/책임을 감수한다
    - 단 의학적 명분과 기록/판단 근거가 있어야 한다
    - 책임을 선점하는 형태여야 한다 (떠넘김 당하는 것이 아니라 자기가 먼저 잡는 것)
  mandatory:
    - 희생 직후 반드시 평가 수정, 호출권, 케이스 배정권, 발표권, 직보선 같은 권한 영수증이 붙어야 한다
  forbidden:
    - 감동만 남고 권한 변화 없음
    - 착한 희생이 주인공 소모로 끝남
    - 보상 없는 희생이 반복됨

custom_rules:
  - 차트 기록이 먼저 맞았다는 사실이 권력의 원천이다
  - 서열은 그대로인데 실질적 결정권이 뒤집히는 구조를 유지한다
  - 보상은 생존/칭찬이 아니라 권한 토큰 회수
  - 위기는 피해 연출보다 판독 적중 증명으로 사용한다
  - 반격 예약 없는 손해는 금지
  - 수술 전문 용어는 구체적으로 (변이 간동맥, 담관 변이, 접근법 등 실명)
  - 적대자는 이전 시대의 경험치를 가진 합리적 판단자로 대우
  - 설명이 리듬을 깨면 수술장 적중으로 대체
  - 회귀 기억은 예언이 아니라 3만 건 수술 경험의 패턴 데이터베이스다 — 미래 예지 금지
  - Arc 3 이전까지 규모 확대(세계 최초/교과서 등재) 금지 — 인과 적중의 반복이 먼저
