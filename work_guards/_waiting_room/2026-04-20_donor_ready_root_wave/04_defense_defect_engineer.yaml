work_identity:
  work_id: defense_defect_engineer
  work_type: defense_business
  family: blockguide
  one_line_truth: 버림패 막내아들이 결함선 한 줄로 시험평가권·규격 문구·정비권·수출금융을 자기 손에 묶어, 방사청·군·해외 파트너가 준영을 안 거치면 납품도 수출도 못 굴리는 방산 후계 관문이 된다
  protagonist_weapon:
    - 접촉 대상의 구조 결함·원가 누수·비리·돈줄 병목을 붉은 선으로 판독하는 결함선/비리선 감각
    - 결함선 판독을 안전 명분으로 포장해 시험 순서·규격 문구·정비권·SPV를 재배치하는 병목 장악 설계력
    - 14년치 승계전·납품·수출·규제 실패 순서를 기억한 회귀자의 타이밍 감각
  business_axes:
    - 시험평가권 (방사청 → 시험평가대대 → 성적서 → 규격 채택 → 양산)
    - 규격 문구 (초안 한 문장이 수년치 납품 구조를 잠그는 삽입 메커니즘)
    - 정비권 / 정비거점 (반복 현금흐름 독점)
    - 수출금융 패키지 (정책금융 + 보증 + 현지 은행)
    - 차명 SPV (우회 인수·부실 자산 흡수)
    - 지분 (개인 영향 지분 1.4% → 19.6%)
  control_axes:
    - 시험평가 접근권 (시험 순서·일정 통제)
    - 규격 채택 결정권 (방사청 초안 의견권 → 확정 문구 삽입)
    - 정비권 (아부다비·리야드 전진 MRO)
    - 결재선 / 이사회 거부권
    - 감사장부 열람권 (양면 협상 칼날)
    - 오프셋 조항 통제 (현지 생산·교육·부품표준)
  mandatory_lexicon:
    - 시험평가
    - 규격 문구
    - 성적서
    - 결재선
    - 정비권
    - 수출금융
    - 차명 SPV
    - 오프셋
    - 결함선
    - 비리선
    - 지분
    - 열처리
    - 협력사 채권
  forbidden_flattenings:
    - 회개물 스타트
    - 비굴한 해명 / 인정 구걸
    - 자기연민 소비
    - success -> pure punishment spiral
    - 주인공 고유성 없는 대형 성과 (결함선 판독 인과 없는 승리)
    - 활약 후 태도 변화 없음 (성과 뒤 서열 영수증 누락)
    - 위기 때 빈손 / 무대응 / 무보상
    - 능력을 본인이 장광설로 해설
    - 방산을 애국심 감동물로 처리
    - 시험평가권·규격 문구·정비권을 추상 로비나 막연한 권력전으로 때움
    - 결함선을 만능 예지로 사용 (접촉 대상만, 미래 정답 없음, 과다 사용 시 오판)
    - 안전을 진짜 목적처럼 위장해 자기이익 엔진(승계·규격 독점)을 흐림
    - 하성우·민태수·윤문희를 무능한 악당 캐리커처로 만듦
    - 기술 설명으로 장면을 메움 (전장은 시험권·규격권·정비권·지분·수출금융)
    - 운빨 생존을 실력처럼 포장
  tracking_slots:
    - 개인 영향 지분 상승 (1.4% → 4.8% → 8.9% → 13.7% → 19.6%)
    - 시험평가권·규격권·정비권 회수 (권한 축 누적 추적)
    - 저평가 → 고평가 전환 (가문·방사청·군·해외의 하준영 해석 변화)
    - 준영 없이 납품도 수출도 못 굴리는 병목 형성도
  mandatory_scene_engines:
    - 접촉 대상에서 결함선/비리선 발화 → 안전 명분으로 시험 순서·규격 문구·정비권 재배치 설계
    - 병목 장악 후 공개 증명 (시험 통과·규격 삽입·감사 폭로 카드)
    - 성과 직후 체감형 보상 부착 (지분·운영권·시험권·규격권·정비권 중 1종 이상)
  protagonist_evaluation:
    admiration_axes:
      - 남들보다 먼저 읽음 (결함선·비리선·돈줄 병목을 접촉 즉시 판독)
      - 비굴하지 않음 (승계 4순위에서도 거래 조건을 내걸음)
      - 손실을 통제함 (안전 명분으로 최소 피해 통제 + 병목 전환)
      - 결과로 인정을 강제함 (48시간 내 증거 + 공개 증명)
      - 안전과 자기이익의 이중구조를 유지하는 냉정함
    forbidden_praise_patterns:
      - 불쌍해서 챙겨준다
      - 착해서 인정한다
      - 나라를 위해서 대단하다
      - 우연히 잘 풀렸다
      - 참고 견뎌서 대단하다
    observer_tiers:
      - 전략조정실 실무진 (첫 의아함)
      - 비서실장 정해윤 (관찰자 → 조건부 인정)
      - 윤소라 소령 (의심 → 거래 → 실무 동맹)
      - 하성우 장남 (멸시 → 경계 → 적대적 재평가)
      - 방사청 박성우 (견제 → 규격 동반자)
      - 아버지 하도진 (유예 → 인정)
      - 민태수 CFO (계산적 관찰 → 최종전 쿠데타)
    evaluation_thresholds:
      - 1화 내 이사회 붉은 선 발화 → 매각 저지 거래 (첫 사이다)
      - 3화 내 간판 폭발 (시험 일정 역전 + 규격 초안 방사청 진입)
      - Block 1 완료 시 지분 1.4% → 2.6% + 시험평가 접근권 + 감사장부 확보
      - 큰 피해 뒤 즉시 다음 카드 확보 (반격 예약 없는 손해 금지)
  role_fit_constraints:
    - name: 아버지 선행 금지
      role: 하도진 (회장)
      disallowed_actions:
        - 하준영 대신 핵심 병목을 독립 해결
        - 이유 없는 승계 선물
      exceptions:
        - 48시간 증거를 보고 조건부 결재하는 것은 허용
    - name: 적대자 캐리커처 금지
      role: 하성우 / 민태수 / 윤문희
      disallowed_actions:
        - 무능해서 지는 장면
        - 이유 없는 악의
      exceptions:
        - 이전 시대의 정답을 쥔 사람으로서 합리적으로 견제하는 것은 허용
    - name: 조력자 감화 금지
      role: 윤소라 / 고준명 / 이가연
      disallowed_actions:
        - 이유 없는 선의 지원
        - 감화 이전에 붙는 동맹
      exceptions:
        - 계산상 하준영 편에 서는 선택
custom_rules:
  - 안전은 명분이고 목적은 승계와 규격 독점이다 — 안전이 진짜 목적처럼 위장되면 안 된다
  - 위기는 피해 연출보다 우선순위 선택권 증명으로 사용한다
  - 반격 예약 없는 손해는 금지
  - 설명이 리듬을 깨면 운이 좋군으로 절감할 수 있다
  - 각 블록의 보상은 지분·운영권·시험권·규격권·정비권 중 하나로 체감되어야 한다
  - 다음 블록은 이전 보상(권한·병목 장악)으로만 열린다 — 시험평가권 없이 규격 삽입권은 없다
  - 결함선 남용 금지 — 접촉 제약·오판 위험을 살아있는 리스크로 운용한다
