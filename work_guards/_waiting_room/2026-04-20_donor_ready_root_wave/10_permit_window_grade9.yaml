work_identity:
  work_id: permit_window_grade9
  work_type: office_power
  family: blockguide
  one_line_truth: 민원과로 좌천된 9급 주무관이 도면의 누락에서 사고와 소송의 연쇄를 읽어, 사용승인 홀드와 보완명령과 예산 코드를 쥐고 건설사와 시장을 자기 창구 앞에 줄 세운다
  protagonist_weapon:
    - 감사관실에서 축적한 은폐 파일 기억과 현장 경험으로 도면의 미세 누락에서 사고-소송-정치 연쇄를 읽는 위험 독해력
    - 도면과 민원 기록에서 병목을 탐지하고 보완명령·점검 타이밍을 선점하는 행정 무기 운용력
    - 현장 실사로 예측을 공개 증명해 정치권이 무시 못할 형태로 위기를 전환하는 증명 실행력
  business_axes:
    - 사용승인 홀드 (승인 지연이 곧 협상력)
    - 보완명령 (다음 개발권의 입장권)
    - 특별점검 트리거 (독자 발동권)
    - 예산 코드 연결 (인허가-예산 연동)
    - 도면 검증 표준화 (도면이 올라오는 길목 장악)
  control_axes:
    - 사용승인 홀드권 (도장을 멈추는 권한)
    - 보완명령 발행권 (사업 진행의 관문)
    - 특별점검 독자 발동권 (현장 직접 개입)
    - 예산 코드 연결권 (재무 경로 통제)
    - 시장 직보 라인 (의사결정자 직통)
    - TF 실무 간사 → 도시안전관 (직제 상승)
  mandatory_lexicon:
    - 사용승인
    - 보완명령
    - 특별점검
    - 예산 코드
    - 도면 검증
    - 홀드
    - 직보
    - 관문
    - 조건표
    - 발동권
  forbidden_flattenings:
    - 공익 헌신형 공무원 미담
    - 민원인 감동 드라마
    - 인허가를 추상 정치싸움으로만 처리
    - 개발 비리를 막연한 정의감으로 해결
    - 회개물 스타트
    - 비굴한 해명 / 인정 구걸
    - 자기연민 소비
    - success -> pure punishment spiral
    - 주인공 고유성 없는 대형 성과 (위험 독해 인과 없는 승리)
    - 활약 후 태도 변화 없음 (성과 뒤 권한 보상 누락)
    - 위기 때 빈손 / 무대응 / 무보상
    - 적대자를 멍청한 악당으로 처리
    - 인허가 전문 용어를 감정과 카리스마로만 해결
    - 도면/소방/배수/예산을 구체 없이 추상적으로만 언급
    - 보상이 생존/칭찬/감사 수준에 그침
  tracking_slots:
    - 권한 누적 (접수권 → 홀드권 → 검증권 → 발동권 → 코드 연결권 → 조례권 → 총괄권 → 관문)
    - 저평가 → 고평가 전환 (욕받이 → 사인 구하는 대상)
    - 적대자 계산 전환 (저항 → 수용 또는 퇴장)
    - 시스템 제도화 진척 (개인 역량 → 절차 → 조례 → 직제)
  mandatory_scene_engines:
    - 도면에서 병목 탐지 → 승인 홀드 또는 보완명령으로 전환하는 장면
    - 현장 실사에서 예측이 적중해 공개 증명되는 장면
    - 성과 직후 권한 회수 (홀드권/명령권/점검권/코드권/직제 중 하나 + 다음 전장 입장권)
    - 적대자가 기훈에게 사인을 구하러 오는 역전 장면
  protagonist_evaluation:
    admiration_axes:
      - 도면에서 남들이 못 보는 연쇄를 읽음
      - 비굴하지 않음 (국장·건설사 압박에도 도장 정지 유지)
      - 현장에서 증명함 (예측 → 적중의 인과)
      - 결과로 권한을 강제함 (칭찬이 아니라 권한 회수)
      - 막은 사람이 아니라 다시 열 조건을 가진 사람
    forbidden_praise_patterns:
      - 정의로워서 존경한다
      - 시민을 위해 희생해서 대단하다
      - 착해서 인정한다
      - 우연히 맞았다
      - 참고 견뎌서 대단하다
    observer_tiers:
      - 현장 실무자 / 소장 (첫 적중 목격)
      - 서정아 (행정 실무 계산 전환)
      - 조은비 (전문가 간 검증 협력)
      - 이종혁 / 국장 라인 (저항 → 인정)
      - 건설사 (저항 → 수용)
      - 시장 (의존도 체감)
    evaluation_thresholds:
      - 1화 도장 정지 즉시 고유 역량 노출
      - 3화 내 밤비 적중 → 간판 폭발
      - Block 1 완료 시 보완명령권·직보·TF 간사 확보
      - 큰 피해 뒤 즉시 다음 카드 확보 (반격 예약 없는 손해 금지)
  role_fit_constraints:
    - name: 시장 선행 금지
      role: 시장
      disallowed_actions:
        - 기훈 대신 핵심 판단을 완성
        - 기훈 없이 인허가 체계를 독립 개선
      exceptions:
        - 기훈의 증명을 보고 직제를 만들어주는 것은 허용
    - name: 적대 관료 캐리커처 금지
      role: 이종혁
      disallowed_actions:
        - 무능해서 지는 장면
        - 탐욕만으로 동기 부여
      exceptions:
        - 이전 시대의 정답을 믿어서 저항하는 것은 허용
    - name: 조력자 감화 금지
      role: 서정아
      disallowed_actions:
        - 이유 없는 선의 지원
        - 감화 이전에 붙는 동맹
      exceptions:
        - 계산 전환이 먼저 보인 뒤 신뢰가 쌓이는 것은 허용
    - name: 건설사 멍청 금지
      role: 박준호 / 강태원
      disallowed_actions:
        - 단순 탐욕 악당
        - 비합리적 저항
      exceptions:
        - 속도가 수익인 건설업 논리에 따른 합리적 저항은 허용

custom_rules:
  - 도장을 찍는 말단이 아니라 도장을 멈추는 말단이다
  - 막은 사람이 아니라 다시 열 조건을 가진 사람 프레임 유지
  - 보상은 생존/칭찬이 아니라 권한 회수
  - 위기는 피해 연출보다 위험 독해력 증명으로 사용
  - 반격 예약 없는 손해는 금지
  - 인허가 전문 용어는 구체적으로 (사용승인, 보완명령, 예산 코드 등 실명)
  - 적대자는 이전 시대의 정답을 가진 사람으로 대우
  - 설명이 리듬을 깨면 현장 적중으로 대체
