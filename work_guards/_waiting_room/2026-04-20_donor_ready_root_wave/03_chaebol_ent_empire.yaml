work_identity:
  work_id: chaebol_ent_empire
  work_type: entertainment_empire
  family: blockguide
  one_line_truth: 쓰레기로 떠넘겨진 소형 엔터 자회사의 낙하산 대표가, 스타의 터질 타이밍과 맞는 자리를 읽는 감각으로 배치·패키지·접점을 묶어 업계가 따라 할 수밖에 없는 구조를 만든다
  protagonist_weapon:
    - 사람의 재능이 터질 타이밍과 맞는 자리를 읽는 선천적 감각 (스타 감지)
    - 발굴이 아니라 배치 — 맞는 포지션에 놓는 설계력
    - 개별 자산을 묶어 패키지·접점·시장 구조로 확장하는 산업 설계 능력
  business_axes:
    - 인재 포트폴리오 (배우·아이돌·셰프·크리에이터)
    - 현금흐름 (행사 부킹·광고·유통·커머스)
    - IP 자산 라인
    - 사업 라인 확장 (엔터·F&B·팬덤 플랫폼·글로벌 라이선싱)
    - 세령컬처웍스 기업가치 (120억→6800억)
  control_axes:
    - 인재 계약권 / 캐스팅 결정권
    - 행사·무대·접점 배치권
    - 패키지 설계권 (개별 자산을 묶는 구조)
    - 자회사 경영 자율권 (아버지 간섭 vs 독립)
    - 업계 표준 선점 (비대칭 전략→시장 기준)
  mandatory_lexicon:
    - 배치
    - 부킹
    - 계약
    - 캐스팅
    - 패키지
    - 접점
    - 라이선싱
    - 기업가치
    - 표준
  forbidden_flattenings:
    - 회귀 서사 삽입 — 권태하는 회귀자가 아니다, 미래 기억 일절 금지
    - 비굴한 해명 / 아버지 인정 구걸
    - 자기연민 소비
    - success → pure punishment spiral
    - 주인공 고유성 없는 대형 성과 — 배치 인과 없는 폭발적 성공 금지
    - 활약 후 태도 변화 없음
    - 위기 때 빈손 / 무대응 / 무보상
    - 엔터를 감동물·아이돌 성장기·음악 해설물로 흘림
    - 주인공이 자기 유능함을 해설
    - 적대자(권도현·한도윤·대형 기획사) 멍청한 캐리커처화
  tracking_slots:
    - 낙하산 쓰레기 → 사람 볼 줄 아는 놈 → 업계 표준 설계자로 재평가
    - 인재 포트폴리오 확장 (배치 성공 → 다음 인재 접근권)
    - 비대칭 전략이 시장에서 먼저 통하는 증명 누적
    - 자회사 자율권 확보 (아버지·한도윤 간섭 벽 후퇴)
  first_block_reward:
    - 평가 수정 — '사고만 치는 낙하산'에서 '사람은 볼 줄 아는 놈'으로 첫 재평가 등록
    - 접근권 — 7억 부킹은 돈이 아니라 업계가 태하의 다음 판단을 한 번 더 보겠다는 입장권
    - 결정권 — 120억 조건부 자본은 돈이 아니라 캐스팅/배치를 결정할 수 있는 제한적 결정권
    - 자율권 씨앗 — 한도윤의 완전 무시가 불완전 무시로 바뀐 감시 벽의 첫 후퇴
  crisis_doctrine:
    - 선독 — 누가 웃고 있는지, 어디서 무대가 비는지, 어떤 인재가 방치됐는지를 읽는다
    - 대비 — 빈손으로 들어가지 않고, 최소한 배치 카드와 증명 무대를 쥐고 들어간다
    - 최소 피해 — 전부를 구하는 대신 가장 비싼 proof만 살린다
    - 즉시 보상 — 피해나 압박 뒤에는 반드시 다음 입장권/태도 변화/부킹/계약/권한 조각이 남아야 한다
  mandatory_scene_engines:
    - 업계가 안 보는 포지션에 인재를 배치 → 비대칭 무대에서 공개 증명 → 태도 변화 회수
    - 스타 감지 감각이 현장에서 바로 통하는 순간 (인과가 선명한 proof scene)
    - 개별 성공을 묶어 패키지·접점 구조로 확장하는 설계 장면
    - 위기 선독 후 배치 카드로 최소 피해 통제 → 즉시 다음 입장권 회수
  protagonist_evaluation:
    admiration_axes:
      - 남들이 못 보는 사람의 맞는 자리를 먼저 읽음
      - 낙하산이라는 시선 앞에서 비굴하지 않음
      - 결과로 입을 막음 — 해명 대신 현장 증명
      - 개별 히트가 아니라 구조를 남김
      - 버린 사람·안 보는 시장에서 먼저 가져감
    forbidden_praise_patterns:
      - 불쌍해서 챙겨준다
      - 재벌이라서 인정한다
      - 운 좋게 잘 걸렸다
      - 착해서 인정한다
      - 참고 견뎌서 대단하다
    observer_tiers:
      - 서민재 (세령컬처웍스 실무)
      - 업계 관계자 / 방송 PD
      - 한도윤 (경영관리실장 / 감시자)
      - 경쟁 대형 기획사
      - 권도현 (아버지 / 세령그룹 회장)
    evaluation_thresholds:
      - Block 1 내 강이현 즉석 무대 proof scene 1회
      - 첫 배치 성공 직후 '사람은 볼 줄 아는 놈' 평가 수정
      - 후속 부킹·계약·자본 유입으로 다음 전장 입장권 확보
      - 큰 피해 뒤 반드시 다음 카드(접근권/태도 변화/부킹/권한 조각) 즉시 회수
  role_fit_constraints:
    - name: 조력자 선행 금지
      role: 서민재 / 강이현
      disallowed_actions:
        - 주인공 대신 핵심 판단 완성
        - 이유 없는 선의 지원
      exceptions:
        - 계산상 태하 편에 서는 선택
    - name: 적대자 존엄 유지
      role: 권도현 / 한도윤 / 대형 기획사
      disallowed_actions:
        - 무능 캐리커처화
        - 감정적 악당화
      exceptions:
        - 기존 시장의 정답을 쥔 사람으로서의 합리적 행동
custom_rules:
  - 권태하는 회귀자가 아니다 — 미래 기억, 시간 역행, 두 번째 기회 서사 일절 금지
  - 강점은 발굴이 아니라 배치다 — 사람을 찾는 것과 맞는 자리에 놓는 것을 구분한다
  - 각 블록 보상은 인재 확보·계약·자본·접근권·서열 변화 중 하나로 체감되어야 한다
  - 다음 블록은 이전 보상(인재·접점·구조)으로만 열린다
  - 감정 호소가 아니라 결과와 구조로 말한다
  - 반격 예약 없는 손해는 금지
  - 위기는 선독→대비→최소 피해→즉시 보상 순서로만 처리한다 — 맞고 버티기, 운빨 돌파, 빈손 진입 금지
