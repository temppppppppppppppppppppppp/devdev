work_identity:
  work_id: chaebol_allowance_zero
  work_type: support_system_cashflow
  family: blockguide
  one_line_truth: 카드 잘린 재벌 3세가 장례식장 뒷문에서 시작해 밥차·린넨·셔틀·영수증·정산 레인을 한 칸씩 손에 옮겨, 가문이 먼저 자기 현금흐름망에 의존하는 구조를 만든다
  protagonist_weapon:
    - 어느 현장에 어떤 지출이 언제 터지고 누가 돈줄을 쥐면 조직이 흔들리는지 기억한 회귀자의 하부 운영망 누수 지도
    - 새벽 뒷문에서 밑단 누수·유령업체·정산 병목을 회의실보다 먼저 읽는 현장 감각
    - 소액·즉시 개입으로 반복 매출 포지션을 박아 넣는 재배치 속도
  business_axes:
    - 반복 현금흐름 (장례·급식·호텔 BOH·공장·병원·전국망의 운영비 흐름)
    - 정산 레인 (정산 포털·구매 코드·승인 도장·미수금)
    - 구매 코드 통제 (표준화된 발주·정산 양식)
    - 계약 구조 (외주 재편·공급망 장악·정산선 통합)
  control_axes:
    - 계약권 (운영 지원 계약 체결·갱신)
    - 승인권 (정산 승인·구매 코드 발행)
    - 정산권 (정산 레인·월말 정산서 표준양식)
    - 현장 대체 불가능성 (해당 라인이 멈추면 계열사가 멈추는 구조)
    - 결재선 접근권 (CFO 직면 → 그룹 결재선)
  mandatory_lexicon:
    - 반복매출
    - 정산 레인
    - 구매 코드
    - 승인 도장
    - 결재선
    - 영수증
    - 누수
    - 유령업체
    - 린넨
    - 밥차
    - 셔틀
    - 백오브하우스
    - 폐기물 코드
    - 운영비
    - 가동률
  forbidden_flattenings:
    - 회개물 스타트
    - 비굴한 해명 / 인정 구걸
    - 자기연민 소비
    - success -> pure punishment spiral
    - 주인공 고유성 없는 대형 성과 (누수 판독·재배치 인과 없는 승리)
    - 활약 후 태도 변화 없음 (성과 뒤 서열 영수증 누락)
    - 위기 때 빈손 / 무대응 / 무보상
    - 능력을 본인이 장광설로 해설
    - 순수 투자물·주식물·시장 매매물로 둔갑
    - 가문의 공짜 구제금·무상 지원·치정 화해로 위기 넘김
    - 장례/급식/호텔/공장/병원 운영축을 하나의 generic operations로 뭉갬
    - 현장 누수·정산 병목·위생 사고를 추상 권력전·카리스마 한마디로 때움
    - 유령업체·가격 후려치기를 단일 악당 개인 악행으로 캐리커처화
    - 서도윤·윤석진·노현주·백도현을 무능/탐욕 캐리커처로 만듦
    - 운빨 생존을 실력처럼 포장
  tracking_slots:
    - 반복 현금흐름 규모 상승 (0원 → 연환산 12억 → 38억 → 76억 → 154억 → 전국망)
    - 저평가 → 고평가 전환 (망나니 도련님 → 하부 운영망을 읽는 사람)
    - 계약권·승인권·정산권·현장 대체 불가능성 회수 (권한 축 누적)
    - 가문 역의존도 상승 (가문이 먼저 윤재이 인프라에 줄 서는 구조)
  mandatory_scene_engines:
    - 밑단 현장 누수·유령업체·정산 병목 감지 → 소액/즉시 개입으로 반복 매출 포지션 확보
    - 정산 레인·구매 코드·결재선 표준화로 관문 전환 → 공개 성과(반복 현금흐름·납기 방어·위생 통과)로 증명
    - 성과 직후 체감형 보상 부착 (다음 운영 전장 입장권·계약권·승인권·정산권·형의 눈빛 변화 중 1종 이상)
  protagonist_evaluation:
    admiration_axes:
      - 남들보다 먼저 읽음 (누수·유령업체·붕괴 순서를 새벽 뒷문에서 먼저 감지)
      - 비굴하지 않음 (현금 0원 상태에서도 거래 조건을 내걸음)
      - 손실을 통제함 (현장 사고·납기 위기에서 최소 피해 + 관문 전환)
      - 결과로 인정을 강제함 (반복매출 숫자와 장부를 증거로 꺼냄)
      - 밑바닥에서 시작하는 여유 (밥차 한 대·꽃값·영수증부터 잡는 스케일)
    forbidden_praise_patterns:
      - 불쌍해서 챙겨준다
      - 착해서 인정한다
      - 성실해서 언젠가 보답받는다
      - 우연히 잘 풀렸다
      - 참고 견뎌서 대단하다
      - 재벌이니까 결국 돈으로 해결한다
    observer_tiers:
      - 현장 실무자 (장례식장 밥차·세탁실 인력)
      - 유수리 (정산 감각 동반자)
      - 형 서도윤 (멸시 → 눈빛 전환 → 경계)
      - CFO 윤석진 (무시 → 숫자 앞 침묵 → 견제)
      - 노현주 (유언장 칼 → 규칙 위의 재평가)
      - 배정호 / 최문갑 / 정채린 / 민가온 (각 전장 실무 동맹)
    evaluation_thresholds:
      - 1화 내 첫 사이다 (밥차 펑크 즉흥 대응 → 재배치 성공)
      - 3화 내 간판 폭발 (장례 특수 끝 후 첫 월 반복매출 증명 → 형의 눈빛 전환)
      - 각 ARC 완료 시 다음 운영 전장 입장권 체감형 보상
      - 큰 피해 뒤 즉시 다음 카드 확보 (반격 예약 없는 손해 금지)
  role_fit_constraints:
    - name: 형 선행 금지
      role: 서도윤 (장남)
      disallowed_actions:
        - 윤재이 대신 현장 누수를 독립 해결
        - 이유 없는 화해 / 무상 지원
      exceptions:
        - 윤재이 숫자를 보고 계산으로 판단을 바꾸는 것은 허용
    - name: 적대자 캐리커처 금지
      role: 서도윤 / 윤석진 / 노현주 / 백도현
      disallowed_actions:
        - 무능해서 지는 장면
        - 이유 없는 악의
      exceptions:
        - 이전 시대의 정답을 믿은 사람으로서 합리적으로 견제하는 것은 허용
    - name: 조력자 감화 금지
      role: 유수리 / 배정호 / 최문갑 / 정채린
      disallowed_actions:
        - 이유 없는 선의 지원
        - 감화 이전에 붙는 동맹
      exceptions:
        - 계산상 윤재이 편에 서는 선택
custom_rules:
  - 상속보다 매일 돌아가는 돈의 길목을 먼저 쥔다 — 지분율·시세·매매가 아니라 반복 현금흐름·정산 레인·구매 코드가 무기다
  - 위기는 피해 연출보다 우선순위 선택권 증명으로 사용한다
  - 반격 예약 없는 손해는 금지
  - 설명이 리듬을 깨면 운이 좋군으로 절감할 수 있다
  - 각 블록의 보상은 계약권·승인권·정산권·현장 대체 불가능성·결재선 접근권·구매 코드 접근권 중 하나의 체감형 권한 보상이어야 한다
  - 다음 운영 전장은 이전 전장의 보상으로만 열린다 — 장례 장악 없이 호텔 BOH 진입은 없다
  - 회귀 기억은 예언이 아니라 협력사 붕괴 순서·누수 지도·재배치 감각의 현장 지식이다 — 시장 시세 예언 금지
