work_identity:
  work_id: manual_meridian_archivist
  work_type: wuxia
  family: wuxguide
  one_line_truth: >-
    내공 없는 외문 서고지기가 비급 속 끊긴 경맥 한 줄을 읽는 유일한 눈으로
    죽은 무공을 되살려, 장로의 빚과 장서각 열쇠와 강호 정통성을 자기 손에 쥔다
  protagonist_weapon:
    - 비급 속 끊긴 경맥과 오기된 운기 순서를 붉은 흔적으로 읽는 유일한 눈
    - 복원 5단계(결맥 탐지→원본 대조→운기 재구성→대리 시연→공개 증명)를 처음부터 끝까지 집행하는 정밀함
    - 경맥의 이치를 관통해 상대 무공의 약점을 실시간으로 읽는 침점법
  business_axes:
    - 경지 진행 (후천초기→화경, 복원 감각 7단계 병렬)
    - 장서각 접근 범위 (외문 비고→봉인각→원로원 금고)
    - 정통성 판정 권위 (문파 내→문파 간→강호 전체)
    - 보호채무 축적 (복원할수록 장로 빚·열쇠·권위 누적)
  control_axes:
    - 장서각 열쇠 위계 (임시→정식→봉인각→원로원 금고)
    - 강호 비급 검증 인장 독점 (여운의 인장이 정통성 증표)
    - 위서 판별 독점 (여운 없이 진위 판정 불가)
    - 복원 실적 기반 보호채무 (장로들이 여운의 보호를 거부할 수 없는 구조)
  mandatory_lexicon:
    - 결맥
    - 붉은 흔적
    - 복원
    - 비급
    - 운기 순서
    - 경맥
    - 위서
    - 장서각
    - 봉인각
    - 열쇠
    - 보호패
    - 정통성 판정
    - 침점법
    - 대교란
    - 결맥 인장
  forbidden_flattenings:
    - 회개물 스타트
    - 비굴한 해명 / 인정 구걸
    - 자기연민 소비 (성인군자형 호구 포함)
    - success → pure punishment spiral
    - 살렸더니 감시당했다 구조 (보상은 문이 열리는 것)
    - 주인공 고유성 없는 대형 성과
    - 활약 후 태도 변화 없음
    - 위기 때 빈손 / 무대응 / 무보상
    - 복원을 한 줄 기적으로 처리 (5단계 생략 금지)
    - 복원을 단순 퍼즐 풀이나 퀴즈쇼로 축소
    - 비급 필사 오류를 추상적으로 처리 (유형을 구체적으로)
    - wuxia에 business-power vocabulary 이식
    - 위서 판별을 직감이나 천재적 감으로 처리 (결맥 대조 논리로 증명)
    - 여운이 강한 검사가 되는 전개 (검을 쓰는 자가 아니라 살리는 자)
  tracking_slots:
    - 외문 서고지기 → 비급 총관 → 강호 정통성 최고 권위 → 문파의 기준점
    - 비웃음(외문 잡역의 참견) → 경탄 → 의존(복원 없이 정통성 주장 불가)
    - 장서각 열쇠 등급 상승 (임시→정식→봉인각→원로원 금고)
    - 복원할수록 빚·열쇠·판정 권위가 누적되는 축적형 구조
  mandatory_scene_engines:
    - 복원 5단계(결맥 탐지→원본 대조→운기 재구성→대리 시연→공개 증명)가 온전히 구동되며 죽은 무공이 살아나는 장면
    - 위서 판별에서 두 비급을 나란히 놓고 결맥 차이를 읽어 진위를 증명하는 공개 판정 장면
    - 복원 성공 직후 보상이 즉시 붙는 장면 (열쇠 등급 상승, 보호패, 접근권, 서열 변화)
  protagonist_evaluation:
    admiration_axes:
      - 남들이 먼지로 보는 비급에서 끊긴 경맥을 읽음
      - 비굴하지 않음 — 서고지기의 참견을 비웃어도 결과로 증명
      - 검을 쓰는 것이 아니라 검을 살리는 유일한 존재
      - 복원 한 줄로 장로를 빚쟁이로, 문파를 의존자로 만듦
      - 결과로 인정을 강제함 — 설명 대신 복원된 검세가 증명
    forbidden_praise_patterns:
      - 불쌍해서 챙겨준다
      - 착해서 인정한다
      - 성실해서 언젠가 보답받는다
      - 우연히 잘 풀렸다
      - 참고 견뎌서 대단하다
    observer_tiers:
      - 한설 장로 (첫 복원 대상 → 보호자 → 최대 후원자)
      - 도연화 (약초 조력자 → 연인)
      - 설화진 (정치적 경쟁자 → 피해자 고백 → 비극적 퇴장)
      - 곽유정 (후원하는 척 → 감시 → 적대 → 최종전에서 복원당함)
      - 묵리 (지식 교환 → 대교란 피해자 → 전면 동지)
      - 강호 전체 (무명 서고지기 → 비급 감정사 → 정통성 최고 권위)
    evaluation_thresholds:
      - 1~3화 내 계승비무 복원 + 장로 보호 + 열쇠·보호패·진입권 3종
      - 복원 직후 비웃음→경탄 전환이 찍힘
      - 큰 피해(접근권 박탈·붉은 흔적 약화) 뒤 즉시 새 감각 각성 또는 외부 경로 확보
  role_fit_constraints:
    - name: 장로 대행 금지
      role: 한설 장로 / 백사검 장문인
      disallowed_actions:
        - 주인공 대신 비급 복원을 완성
        - 정치적 문제를 장로가 직접 해결해 줌
      exceptions:
        - 보호채무로 여운의 안전을 지키는 것은 허용 (열쇠 제공 포함)
    - name: 조력자 감화 선행 금지
      role: 묵리 / 이청하 / 풍잔운
      disallowed_actions:
        - 이유 없는 선의 지원
        - 감화 이전에 여운 편에 서기
      exceptions:
        - 복원 실적과 정보 교환의 계산상 여운 편에 서는 선택
    - name: 적대자 바보 패배 금지
      role: 곽유정 / 설화진
      disallowed_actions:
        - 바보처럼 져주기
        - 동기 없는 악행
      exceptions:
        - 곽유정은 합리적 동기(정통성 독점)에 기반한 적대자로 유지
        - 설화진은 정치적 경쟁자→도구였던 피해자의 비극적 전환
custom_rules:
  - 복원은 항상 자기이익(접근권·보호패·정통성·정보·경지)과 연결된다 — 선의만의 복원 금지
  - 위기는 피해 연출보다 접근 경로 확보와 정통성 방어로 사용한다
  - 반격 예약 없는 손해는 금지
  - 살렸더니 문이 열렸다의 보상 벡터를 전 Arc에서 유지
  - 복원 5단계를 건너뛰면 반드시 실패 또는 부작용이 발생한다
  - 강하지 않지만 정확한 — 파워 배틀이 아니라 경맥 약점을 읽는 정밀 전투를 유지
