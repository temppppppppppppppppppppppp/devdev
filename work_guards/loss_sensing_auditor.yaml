work_identity:
  work_id: loss_sensing_auditor
  family: blockguide
  work_type: office_power_semiconductor_audit
  one_line_truth: 좌천된 감사팀 대리가 손실선과 책임 귀속을 먼저 읽고, 회사를 구하는 척 모든 위기를 감사 보류권과 직보선과 veto 권한으로 환전해 그룹 리스크 관문이 된다
  protagonist_weapon:
    - 계약서와 숫자에서 예상 손실, 책임 귀속, 막는 비용, 권한 회수 가능성을 동시에 읽는 손실선 감지
    - 회사를 구하기 전에 자기에게 돌아올 권한과 비용을 먼저 계산하는 이득/효율 우선 판단
    - 문서 사건을 현장 사건이나 외부 압박과 연결해 공개 proof로 바꾸는 감사 설계력
  business_axes:
    - 인수 실사
    - 반도체 품질/수율
    - 공급망 대체선
    - 고객사 납기 패널티
    - 법무 계약 조항
    - 이사회 리스크 보고
  control_axes:
    - 감사 보류권
    - CEO 직보선
    - 품질 데이터룸 열람권
    - 리스크 TF 실무간사
    - 공급망 veto
    - 그룹 리스크전략실 조건표
  mandatory_lexicon:
    - 감사 보류권
    - 손실선
    - 책임 귀속
    - CEO 직보선
    - 품질 데이터룸
    - 수율 리포트
    - 열화 테스트
    - 납기 패널티
    - 에스크로 조항
    - 공급망 대체선
    - 리스크 조건표
    - veto
  forbidden_flattenings:
    - 회사를 착해서 구하는 내부고발자 스타트
    - 비굴한 해명이나 인정 구걸
    - 자기연민 소비
    - 회의 하나만 길게 늘리는 meeting-only block
    - proof only and no authority receipt
    - 기술 설명만 있고 권한 이동이 없는 반도체 뽕
    - 활약 후 태도 변화 없음
    - 위기 때 빈손/무대응/무보상
    - donor 고유 skin 직접 복제
  tracking_slots:
    - 좌천된 도장 라인 -> 감사 보류권 -> CEO 직보선 -> 그룹 리스크 관문
    - 손실선 감지 -> 공개 proof -> 사적 권한 영수증 -> 다음 전장 ticket
    - 각 block의 primary incident와 distinct additional incident 분리
    - 회사 손실 감소가 태준의 권한 상승으로 환전되는지
  mandatory_scene_engines:
    - 계약서/품질 리포트/회의록에서 손실선을 읽고 책임 귀속표를 만드는 장면
    - 문서 proof를 시험동 사고, 고객사 압박, 공급망 병목 같은 별도 사건과 연결해 공개 표면에 올리는 장면
    - 첫 승리 직후 감사 보류권, 직보선, 데이터룸, TF 실권, veto 중 하나가 태준에게 붙는 장면
  generalized_loop_law:
    primary_reward_model: reward as right-to-act
    loop_chain:
      - entry_pressure
      - execution
      - public_proof
      - private_receipt
      - observer_shift
      - next_gate
    success_conditions:
      - 현재 block 안에서 태준의 headway가 visible해야 한다
      - reward는 칭찬이 아니라 권한, 접근권, 보호, signboard, next gate 중 하나여야 한다
      - 최소 1개 observer 또는 gatekeeper의 태도 변화가 보여야 한다
      - ending은 hollow cliffhanger가 아니라 다음 전장 입장권이어야 한다
  protagonist_evaluation:
    admiration_axes:
      - 남들보다 먼저 손실과 책임선을 읽음
      - 착한 척하지 않고 자기 이득을 먼저 계산함
      - 피해를 막되 비용과 권한을 동시에 회수함
      - 적대자의 책임 회피 구조를 역이용함
      - 대형 계약을 자기 조건표 없이는 못 지나가게 만듦
    forbidden_praise_patterns:
      - 회사에 충성해서 대단하다
      - 착해서 모두를 구했다
      - 불쌍해서 챙겨준다
      - 우연히 기술 결함을 맞혔다
      - 참다 보니 보답받았다
    observer_tiers:
      - 감사팀 선임/직속 상사
      - 품질본부와 구매실 실무 gatekeeper
      - CFO 라인
      - CEO 직보 라인
      - 이사회 투자/감사위원
      - 글로벌 장비사와 고객사
    evaluation_thresholds:
      - TR 2~6 안에 손실선 감지, 시험동 proof, CEO 재평가, 권한 receipt, 다음 공급망 ticket이 모두 visible해야 한다
      - 각 block은 2~6화 episode-bundle로서 primary incident 외 distinct additional incident를 최소 1개 포함해야 한다
      - 첫 승리 직후 태준 실명 호출과 감사 보류권 또는 데이터룸 접근권이 붙어야 한다
      - 큰 손실이나 양보 뒤에도 같은 block 안에 보호, 정보, 다음 카드 중 하나가 남아야 한다
  role_fit_constraints:
    - name: CEO 선행 금지
      role: 윤해림 CEO
      disallowed_actions:
        - 태준을 호감이나 선의로 밀어주기
        - 태준 대신 핵심 손실선을 완성하기
      exceptions:
        - 태준이 제시한 손실 회피 비용이 더 싸다는 계산 때문에 직보선을 여는 것은 허용
    - name: 조력자 감화 금지
      role: 법무팀/구매실 조력자
      disallowed_actions:
        - 이유 없는 충성
        - 감정적 정의감만으로 태준 편에 서기
      exceptions:
        - 태준 조건표가 자기 부서의 책임 방패가 되는 계산으로 붙는 것은 허용
    - name: 적대자 바보화 금지
      role: CFO/품질본부 적대자
      disallowed_actions:
        - 명백한 증거를 보고도 아무 대책 없이 져주기
        - KPI와 책임 회피 동기 없이 악행하기
      exceptions:
        - 단기 성과와 책임 전가를 우선해 장기 리스크를 과소평가하는 것은 허용
custom_rules:
  - 주인공의 모든 구조적 도움에는 immediate gain과 cost가 있어야 한다
  - 각 TR block은 2~6화 분량이며 최소 1개 additional incident를 가진다
  - 반격 예약 없는 손해는 금지한다
  - 기술 설명이 길어지면 손실액, 책임 귀속, 권한 이동 중 하나로 즉시 환전한다
  - donor 구조는 loop grammar로만 쓰고 donor skin은 쓰지 않는다
