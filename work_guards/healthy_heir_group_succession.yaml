work_identity:
  work_id: healthy_heir_group_succession
  work_type: chaebol_group_management
  family: blockguide
  one_line_truth: "회귀 전 그룹 붕괴를 본 외동 후계자가, 선의나 복수가 아니라 이득과 효율로 손실 뒤의 권리를 회수하고 제한 권한을 쌓는 no-fantasy 조기승계 경영물"
  protagonist_weapon:
    - "회귀 전 붕괴 순서 기억으로 위험 범위를 좁히되, proof는 현재 자료에서만 만드는 판단력"
    - "손익표, 원장, 계약서, 인증, 입찰 자격을 한 단위로 묶어 손실의 이름을 바꾸는 실사 감각"
    - "현금보다 접근권, 보류권, 진단권, 상신권을 먼저 회수하는 효율형 후계자 태도"
    - "감정 비용과 낭비 시간을 줄이며 필요한 자료와 권한만 잘라 요구하는 자기중심적 효율"
  business_axes:
    - "물류/유통 현금흐름 방어와 콜드체인 입찰 자격"
    - "건설/PF 만기표, 담보 재평가, 은행 재협상"
    - "금융/IR 시장 신뢰, 공시 순서, 신용등급 방어"
    - "제조/소재 capex 순서, 설비 납기, 인증 일정"
    - "바이오/신사업 생산권, 우선협상권, 공급 조건"
  control_axes:
    - "사장단 회의 발언권"
    - "원본 손익표/원장/계약서 접근권"
    - "현장 출입권"
    - "폐쇄안 보류권"
    - "14일 손실 분류표 작성권"
    - "90일 경영진단권"
    - "회장 직보권"
    - "사장단 안건 상신권"
    - "IR/은행/거래처 미팅 배석권"
    - "sector TF owner 권한"
    - "조기 승계 공식 절차"
  mandatory_lexicon:
    - "입찰 자격"
    - "적자 센터"
    - "원장 예외코드"
    - "계약서 별첨"
    - "냉장 인증"
    - "폐쇄 결재"
    - "14일 손실 분류표"
    - "90일 경영진단권"
    - "사장단 안건"
    - "PF 만기표"
    - "IR Q&A"
    - "capex schedule"
    - "생산권 term sheet"
    - "권한 영수증"
    - "조기 승계"
  forbidden_flattenings:
    - "visible value UI / 시스템창 / 스킬명 / 초능력 감정"
    - "회귀 지식으로 미래 정답만 찍는 전개"
    - "미래 주가 암기나 뉴스 베팅만으로 돈 버는 전개"
    - "할아버지를 무능한 꼰대나 악역으로 만들기"
    - "임원, 은행, 시장, 현장 책임자를 바보 캐리커처로 만들기"
    - "주인공이 할아버지를 공개 망신 주는 proof"
    - "사원 보호를 감동 대사로만 처리하고 손실 구조를 흐리는 전개"
    - "reward가 돈, 칭찬, 감탄으로만 닫히는 전개"
    - "섹터별 성공이 조기 승계 명분으로 누적되지 않는 백화점식 에피소드"
    - "재벌가 막장 상속전쟁, 출생 비밀, 로맨스 질투가 business-power 판단을 덮는 전개"
    - "물류/PF/IR/capex/생산권을 vague consulting으로 뭉개기"
    - "활약 후 태도 변화 없음"
    - "위기 때 빈손 / 무대응 / 무보상"
  tracking_slots:
    - "도윤 평가 상승: 외동 손자 -> 자료와 시간을 빼앗은 사람 -> 섹터 TF owner -> 그룹 리스크를 자기 권한으로 환전하는 후계자 -> 조기 승계자"
    - "권한 ladder: 발언권 -> 원본 자료 접근권 -> 폐쇄 보류권 -> 90일 경영진단권 -> 사장단 안건 상신권 -> 전략실 공동권한"
    - "서문석 trust ladder: 말 끊지 않음 -> 자료 재확인 -> 제한 권한 -> 사람 맡김 -> 시장 앞 동석 -> 명예로운 은퇴"
    - "sector proof chain: 물류/유통 -> 건설/PF -> 금융/IR -> 소재/제조 -> 바이오/신사업, 각 arc는 외부 영수증 1개 이상을 남긴다"
  first_block_reward:
    - "B002: 폐쇄안에서 빠진 column을 짚고 폐쇄 결재 보류와 원본 손익표 호출권을 얻으며 PF 보증 자동연장 통지를 같은 검토 메모에 붙인다"
    - "B003: 남부 냉장센터가 입찰 자격을 가진 적자 센터로 재분류되고, PF 은행 판단 기한표 제출 지시까지 끌어낸다"
    - "B004: 14일 손실 분류표 조건으로 원장/계약서/현장 출입권과 PF 만기표 날짜 열 제한 열람권을 동시에 얻는다"
    - "B005: 오세진의 원장 예외코드 확인으로 일부 손실이 회수 가능한 권리 후보로 바뀌고, PF 담보 기준일 불일치가 다음 안건 별첨으로 오른다"
    - "B006: 현장 재측정과 거래처 조건 확인으로 폐쇄 보류가 공식 경영 판단이 되며, 90일 경영진단권과 PF 긴급 안건 작성권이 동시에 열린다"
  crisis_doctrine:
    - "선독: 회귀 전 붕괴 순서와 현재 보고서의 작은 누락이 겹치는 지점을 찾는다"
    - "대비: 원본 자료, 원장, 계약서, 현장 기록, 외부 조건을 먼저 확보한다"
    - "최소 피해: 사람을 자르기 전에 손실 단위, 계약 조건, 인증 유지 비용을 다시 나누되, 이유는 선의가 아니라 숙련자산과 계약권 보존이다"
    - "즉시 보상: 위기 뒤에는 반드시 접근권, 보류권, 진단권, 안건, 다음 gate 중 하나가 남아야 한다"
  mandatory_scene_engines:
    - "보고서의 빠진 column이나 별첨 누락을 발견하고, 회귀 기억을 말하지 않은 채 현재 자료로 proof를 만든다"
    - "authority witness가 proof를 확인해 제한 권한을 주고, helper는 감탄자가 아니라 회계/현장/법률/시장 근거 하나를 검증한다"
    - "섹터 성과는 반드시 조기 승계 명분, 외부 receipt, 또는 다음 섹터 gate로 환전된다"
  protagonist_evaluation:
    admiration_axes:
      - "착해서가 아니라 자기 이득과 그룹 효율을 정확히 계산해서 일을 잘한다"
      - "할아버지를 이기려 하지 않고 할아버지가 결재할 수밖에 없는 증거를 만든다"
      - "손실표 뒤의 권리와 숙련자산을 동시에 본다"
      - "현금보다 책임질 수 있는 권한을 먼저 요구한다"
      - "빠르지만 무례하지 않고, 정중하지만 느리지 않다"
    forbidden_praise_patterns:
      - "착해서 인정받는다"
      - "재벌가 외동이라서 봐준다"
      - "미래를 알아서 맞혔다"
      - "할아버지를 눌러서 이겼다"
      - "임원이 멍청해서 당했다"
      - "사람을 아껴서 모두 감동했다"
      - "선해서 회사를 구한다"
    observer_tiers:
      - "서문석 회장"
      - "회장실 비서실장"
      - "물류 계열사 사장"
      - "오세진 회계 helper"
      - "현장 물류 책임자"
      - "사장단 회의"
      - "은행/기관투자자/시장"
    evaluation_thresholds:
      - "B002 안에 현재 자료 기반 첫 proof와 폐쇄 결재 보류"
      - "B004 안에 90일 경영진단권 협상 테이블"
      - "B006 안에 공식 경영 판단과 다음 사장단 안건"
      - "각 arc 종료 시 public proof 또는 external receipt 1개 이상"
  role_fit_constraints:
    - name: "할아버지 악역화 금지"
      role: "서문석"
      disallowed_actions:
        - "손자를 질투해서 막기"
        - "무능한 고집만 부리기"
        - "한 번에 굴복하기"
        - "공개 망신 뒤 체면을 잃고 퇴장하기"
      exceptions:
        - "손자가 사람을 지킬 수 있는지 검증하기 위해 더 어려운 조건을 주는 행동"
    - name: "임원 바보화 금지"
      role: "계열사 사장 / CFO / 사장단 / 은행 담당자"
      disallowed_actions:
        - "기본 자료도 못 읽는 무능 캐릭터화"
        - "이유 없는 악의와 감정적 방해"
        - "한마디에 바로 굴복하기"
      exceptions:
        - "자기 KPI와 리스크를 지키려는 합리적 방어"
    - name: "helper 감탄자화 금지"
      role: "오세진 / 현장 책임자 / 법률/IR helper"
      disallowed_actions:
        - "주인공에게 놀라기만 하기"
        - "근거 없이 주인공 편 들기"
      exceptions:
        - "자신의 전문 근거가 도윤의 방향과 맞을 때 조건부 협조"
custom_rules:
  - "회귀는 위험 범위를 좁히는 장치일 뿐, proof는 반드시 현재 자료에서 나온다"
  - "도윤은 권력을 요구하는 것이 아니라 자기 이득과 그룹 효율이 맞아떨어지는 권한을 요구한다"
  - "각 block 보상은 권한/접근권/보류권/안건/신뢰/다음 gate 중 하나로 남아야 한다"
  - "사원 보호는 숙련자산/인증/계약권 보존 이득으로 증명해야 하며 감동 대사로 대체하지 않는다"
  - "TR 2~6은 하나의 웹소설 1block이다. 이 구간 안에는 주 사건 외에 부 사건 하나 이상이 반드시 조기 점화되어야 한다"
  - "현재 opening 부 사건은 PF 보증 자동연장 통지와 은행 판단 기한이다"
  - "섹터가 바뀌어도 조기 승계 명분과 그룹 보전이라는 중심축을 잃지 않는다"
  - "첫 arc direct line은 반드시 보존한다: 적자 센터가 아닙니다. 입찰 자격을 가진 적자 센터입니다."
  - "no-fantasy lane을 지키기 위해 시스템창, 가치 숫자, 초능력 판독, 예언 선언을 금지한다"
  - "다음 전장은 이전 전장의 권한 영수증으로만 열린다"
  - "반격 예약 없는 손해는 금지한다"
  - "빠름은 무례가 아니라 낭비 제거로 보여준다"
