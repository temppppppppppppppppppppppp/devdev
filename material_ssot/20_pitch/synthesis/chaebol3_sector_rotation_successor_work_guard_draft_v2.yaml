work_identity:
  status_note: "2026-05-17 Doksik-taste reset 이후 이 v2 guard는 current writer-facing seed가 아니다. 은행/문서/공장 중심의 연구 guard로만 보존한다."
  supersession_note: "새 기획은 독식하는 재벌 3세 계열의 돈, 사람, 할아버지, 전담팀, 빠른 판 확장 맛을 우선한다. 이 파일의 접근/열람/절차형 표현을 새 작가-facing 재료에 옮기지 않는다."
  work_id: chaebol3_sector_rotation_successor
  work_type: modernfantasy_chaebol_regression_international_group_restoration
  family: blockguide
  one_line_truth: "1985년 붕괴 직전으로 돌아온 해문그룹 직계 손자가 LC, 은행 보류, 부산 협력업체 급여, 텔렉스 회신 같은 현재 장면 증거로 어른들의 도장 흐름을 멈추고, 돈을 그룹명 복원과 후계 접근권으로 바꾼다."
  protagonist_weapon:
    - "미래 청산소송 기록, 경매 공고, 채권단 메모에서 본 문서 번호와 책임 흐름을 현재 폴더의 LC, 선적, 급여, 은행 보류 조건으로 알아보는 감각"
    - "미래사를 설명하지 않고 도장, 텔렉스, 급여, 선적 마감, 은행 책임 범위처럼 지금 방 안 사람이 무시하기 어려운 비용만 제시하는 실행력"
    - "큰돈을 먼저 버는 대신 72시간 보류, 회의 폴더 진입, 텔렉스 접근, 위기 셀 참관, 내부 예산처럼 후계자 접근권으로 환전하는 장악력"
  business_axes:
    - "1984~1985년 국제그룹형 채권은행 압박과 강제 계열 정리"
    - "수출 LC, 선적 마감, 부산 협력업체 급여, 은행 지급정지와 보증 사슬"
    - "1986~1988년 신발/스포츠웨어/서울올림픽 인지도 회복"
    - "이후 반도체 공급망, CDMA, 브로드밴드, IMF 부실자산, 글로벌 공급망, 배터리와 AI 인프라로 이어지는 섹터 gate"
  control_axes:
    - "bank_hold"
    - "telex_access"
    - "supplier_payroll"
    - "grandfather_condition"
    - "public_name_restoration"
    - "sector_gate_rotation"
  mandatory_lexicon:
    - "해문그룹"
    - "문도윤"
    - "문태섭"
    - "문준하 아들"
    - "산업은행 여신관리부"
    - "수출금융 긴급철"
    - "L/C 확인 요청"
    - "선적 마감"
    - "부산 협력업체 급여"
    - "72시간 보류"
    - "텔렉스 회신"
    - "처분안 결재란"
    - "위기 셀"
    - "공개 이름 복원"
  forbidden_flattenings:
    - "국제그룹/Kukje 역사 설명이나 정치 음모 해설이 현재 복도, 폴더, 도장, 텔렉스보다 먼저 나오는 opening"
    - "LC 한 장으로 그룹을 구하거나 은행과 할아버지가 즉시 항복하는 one-document miracle"
    - "문도윤이 미래사를 강의하거나 세계 최고 그룹 선언, 잡스/머스크/손정의 같은 장기 ladder를 1화 초반에 언급"
    - "어른들이 책임, 체면, 은행 노출, 급여, 선적 비용 없이 주인공을 믿어 주는 무료 인정"
    - "문준하 아들 굴욕만 길어지고 같은 단위 안에 폴더 경로, 도장 지연, 의자, 텔렉스 접근 중 하나도 움직이지 않음"
    - "돈이나 수익 숫자가 보상이고 사람의 호칭, 절차, 회의 입장, 파일 열람권, 내부 예산으로 환전되지 않음"
    - "섹터가 바뀌어도 계속 회장실 회의와 설명문으로만 처리되고 방, 저항자, 증거물, 접근권이 회전하지 않음"
    - "실제 역사/실존 인물을 주인공 칭찬용 꼭두각시로 쓰거나 실명 사건을 그대로 법정 재연"
  writer_facing_language_firewall:
    status: "binding_for_new_or_touched_writer_packets"
    rule: "아래 표현은 audit에서 금지 예시로만 쓴다. 작가-facing 기획안, 회차 카드, S4 투입 메모, 원고 seed에는 쓰지 않는다."
    blocked_terms:
      - "파일 접근권"
      - "파일 열람권"
      - "열람 시간"
      - "access token"
      - "next gate"
      - "reward token"
      - "receipt"
      - "context fill"
      - "payload"
      - "operator"
      - "harness"
      - "proof ladder"
    translate_as_story:
      - "전담팀이 붙는다"
      - "할아버지가 웃다가 멈춘다"
      - "팀장이 남기로 한다"
      - "어른들이 더 이상 도련님 장난이라고 못 한다"
      - "돈의 크기 때문에 회의실 말투가 바뀐다"
      - "사촌 라인이 도윤을 위험한 손자로 본다"
  tracking_slots:
    - "문준하 아들 취급 -> 메모 작성자 -> 텔렉스실 접근자 -> 72시간 보류 책임자 -> 위기 셀 참관자 -> 첫 계열사 복원 담당자"
    - "LC 번호 -> 은행 보류 -> 부산 급여/선적 회신 -> 할아버지 조건부 승인 -> 공개 이름 복원 -> 다음 섹터 gate"
    - "미래 청산 기억 -> 현재 폴더/도장/텔렉스 검증 -> 어른 행동 변화 -> 제한 권한 -> 다음 방 입장"
    - "각 섹터는 새 방, 새 저항자, 새 증거물, 새 접근권으로 회전하고 보상은 항상 돈에서 권한으로 변환된다"
  mandatory_scene_engines:
    - "무시받는 직계 손자가 현재 폴더의 묻힌 문서 번호나 마감일 하나를 찾아 도장 순서, 회의 폴더 위치, 사람 동선을 바꾸는 장면"
    - "72시간 보류나 소액 권한을 받은 뒤 텔렉스, 부산 급여, 선적, 외부 구매자 회신처럼 방 밖 증거가 주인공 판단을 검증하는 장면"
    - "수익이나 손실회피가 개인 승리로 끝나지 않고 직원 급여, 팀 태도, 할아버지 조건, 위기 셀 접근, 공개 이름 복원, 다음 섹터 파일로 전환되는 장면"
  first_block_reward:
    - "EP001/B1-B2: 박윤재가 도장용 표지를 뒤로 밀고 문도윤 메모를 은행 회의 폴더 첫 장 뒤에 끼운다"
    - "EP001/B2: 인주 뚜껑이 닫히고 문도윤은 복도 대기에서 텔렉스실 의자로 이동한다"
    - "EP001/B2: 산업은행 김태완 차장이 멈춘 처분안 결재란 앞에서 LC 번호를 두드리며 누가 썼는지 묻는다"
    - "EP002: 72시간 보류는 인정이 아니라 조건이다; 실패하면 문도윤은 회장실 복도 접근권을 잃는다"
    - "EP003: 부산 공장/협력업체/구매자 회신이 외부 증인으로 들어와 즉시 매각보다 보류가 싸다는 가격표를 만든다"
  crisis_doctrine:
    - "선독: 가족 모욕이나 정치 해설보다 폴더 밑장, LC 번호, 선적 마감, 급여 메모를 먼저 본다"
    - "대비: 미래사 예언 대신 72시간 보류, 회신 조건, 책임자 이름, 비공개 내부 메모, 실패 시 접근권 박탈 조건을 세운다"
    - "최소 피해 통제: 첫 승리는 그룹 구원이 아니라 도장 지연과 텔렉스 접근이며 은행과 할아버지는 조건으로만 움직인다"
    - "즉시 보상: proof 직후 폴더, 도장, 의자, 텔렉스, 호칭, 회의 질문, 급여 회신 중 하나가 반드시 움직인다"
  protagonist_evaluation:
    admiration_axes:
      - "남들이 가문 심부름꾼으로 보는 자리에서 은행과 회장의 책임 비용을 먼저 읽는다"
      - "미래를 안다고 떠들지 않고 지금 방의 도장 흐름과 문서 순서를 바꿀 만큼만 말한다"
      - "돈을 벌기 전에 절차, 회의, 텔렉스, 위기 셀 같은 접근권을 얻는다"
      - "어른을 멍청하게 만들지 않고 어른이 자기 책임을 지키려다 주인공 메모를 채택하게 한다"
      - "신발/스포츠웨어, 반도체, CDMA, IMF, 글로벌 공급망으로 넘어갈 때마다 새 사람과 새 물건으로 권한을 만든다"
    forbidden_praise_patterns:
      - "불쌍한 문준하 아들이라 봐준다"
      - "어린데 기특해서 회장이 믿어 준다"
      - "미래를 맞혀서 천재로 인정받는다"
      - "LC가 있어서 그룹이 바로 산다"
      - "실존 기업가가 주인공을 보자마자 칭찬한다"
    observer_tiers:
      - "회장 비서실장"
      - "산업은행 여신관리부 차장"
      - "문성필 같은 계열 이해관계자"
      - "문태섭 회장"
      - "부산 공장/협력업체 책임자"
      - "수출 구매자"
      - "위기 셀 실무자"
      - "후계 경쟁자"
    evaluation_thresholds:
      - "EP001 안에 몸/날짜 rupture, 폴더 job frame, 문준하 아들 dismissal, 도장 압박, 묻힌 LC 발견이 모두 있어야 한다"
      - "EP001 끝 전 폴더 이동, 도장 지연, 의자/텔렉스 접근, 은행 어른 질문 중 최소 3개가 보여야 한다"
      - "EP002 안에 72시간 보류가 조건부로 열려야 하며 칭찬이나 항복이 아니라 실패 조건을 동반해야 한다"
      - "EP003 안에 부산/구매자/급여 중 하나가 외부 증인으로 들어와 다음 위기 셀 권한을 열어야 한다"
  role_fit_constraints:
    - name: "비서실 공짜 지원 금지"
      role: "박윤재/회장 비서실"
      disallowed_actions:
        - "문도윤 말을 믿고 바로 회장에게 올린다"
        - "행사와 은행 회의 책임을 계산하지 않고 감정적으로 돕는다"
      exceptions:
        - "메모가 도장 사고, 회의 책임, 은행 노출을 줄일 때 폴더 경로와 대기 위치를 바꾼다"
    - name: "은행 무능화 금지"
      role: "산업은행 김태완 차장/채권은행"
      disallowed_actions:
        - "LC 번호만 보고 바로 보류를 승인한다"
        - "정치/법률 장광설에 설득된다"
      exceptions:
        - "은행 책임 범위, 부산 급여 실패, 외국 구매자 취소, 상부 문책 위험이 확인될 때 72시간 확인 절차를 연다"
    - name: "할아버지 즉시 항복 금지"
      role: "문태섭 회장"
      disallowed_actions:
        - "손자를 바로 인정하거나 후계자로 세운다"
        - "자기 판단이 틀렸다고 감정적으로 사과한다"
      exceptions:
        - "외부 회신과 은행 조건이 맞을 때 실패 시 접근권 박탈, 보고 의무, 공개 금지 조건을 붙여 위기 셀 참관을 허락한다"
    - name: "섹터 유명인 꼭두각시 금지"
      role: "Jobs/Son/Musk/한국 대기업 총수 등 later gate"
      disallowed_actions:
        - "주인공을 칭찬하기 위해 등장한다"
        - "자기 회사 문제를 주인공에게 배운다"
      exceptions:
        - "주인공이 공급, 자본, 물류, 부품, 결제, 배터리 같은 실제 필요 gate를 들고 들어올 때만 formidable counterparty로 만난다"
  s4_handoff_filter:
    operator_only:
      - "Phase0"
      - "TR 1-10"
      - "TR70"
      - "BI"
      - "range-complete"
      - "immediate-use"
      - "B1-B2/EP labels"
      - "production status labels"
      - "validator/audit wording"
    s4_expose:
      - "도장용 표지가 뒤로 밀린다"
      - "문도윤의 짧은 메모가 은행 회의철 첫 장 뒤로 들어간다"
      - "인주 뚜껑이 닫히고 도장 순서가 멈춘다"
      - "복도에 서 있던 문도윤에게 텔렉스실 의자가 배정된다"
      - "산업은행 김태완 차장이 멈춘 결재란 앞에서 LC 번호를 두드리며 누가 썼는지 묻는다"
      - "72시간 보류는 칭찬이 아니라 실패 조건이 붙은 확인 절차다"
      - "부산 급여, 선적 마감, 외국 구매자 회신이 다음 장면의 외부 증거다"
    rule: "이 guard 원문을 Firefly S4에 그대로 넘기지 않는다. S4에는 s4_expose의 장면 물건, 사람 행동, 조건부 접근권만 compact writer seed로 번역해서 넘긴다."
custom_rules:
  - "이 v2 guard가 v1보다 우선한다. v1의 2008 NDF, VIP 등록 파일, 30일 제한 계좌, 감사 배지는 International Group baseline의 canon이 아니다"
  - "EP001은 그룹 구원이 아니라 절차 변경을 지급한다. 독자의 첫 보상은 어른들이 문도윤 때문에 도장과 폴더 경로를 바꾼다는 감각이다"
  - "EP002는 칭찬 금지, 조건부 72시간 보류만 허용한다. 실패 조건과 접근권 박탈 조건이 없으면 과보상이다"
  - "EP003은 방 밖 증거가 필요하다. 부산 급여, 선적, 외국 구매자 회신 중 하나가 실제 사람 비용으로 들어와야 한다"
  - "Phase0는 이 guard와 70/71/72/73/75/78/79를 읽고 재시작한다. 기존 2008 Phase0를 패치해서 쓰지 않는다"
  - "TR 1-10 전까지 생산 단위는 Phase0와 first-arc scene-ready packet이다. 생산 TR70과 생산 BI는 계속 금지다"
  - "이 guard는 final Phase0, immediate-use, range-complete, production BI, production TR70을 승인하지 않는다"
