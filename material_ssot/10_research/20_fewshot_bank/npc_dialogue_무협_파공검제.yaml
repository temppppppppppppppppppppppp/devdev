# 파공검제 NPC 대사 뱅크
# 100화 전문 분석 기반 (2026-03-17)
# 아키타입별 3-5개 대사 발췌 + 말투 패턴 분석

아키타입:

  사부_장로:
    설명: "주인공을 가르치거나 이끄는 윗세대 고수"
    캐릭터:
      - 이름: "남궁검"
        역할: "남궁세가 가주, 외조부"
        대사:
          - episode: "EP02"
            원문: "타인의 속내를 함부로 재단하지 마라. 관계에 있어 실수하는 첫걸음이다."
          - episode: "EP02"
            원문: "네 아비는 대살성이 아니었다. 세상이 뭐라 해도 그 말은 믿어도 된다. 내가 직접 보았으니."
          - episode: "EP06"
            원문: "너는…… 네 아비를 꼭 닮았구나. 그러나 네 아비도 지고 말았다. 그 세상에. 그 강호에."
          - episode: "EP85"
            원문: "쯧. 아직 멀었군. 그러고도 네가 소가주가 되려는 것이더냐?"
          - episode: "EP95"
            원문: "이리 죽을 아이가 아니다. 죽음에서도 돌아온 아이다."
        말투_분석: >
          극단적으로 짧은 문장. 감탄사·감정어 완전 배제. 긍정/부정을 직접 말하지 않고
          원칙으로 대체. 제자(손주)에 대한 인정을 절대 언어로 표현하지 않고 행동으로만
          드러냄. 냉혹하게 보이지만 마지막 말에 속내가 드러남. 전형적인 냉엄한 노고수(老高手) 화법.

      - 이름: "비량"
        역할: "교관"
        대사:
          - episode: "EP23"
            원문: "만약 죄 없는 내 생도들을 건드린다면…… 전 그게 누구든 용서할 생각이 없습니다."
          - episode: "EP30"
            원문: "아무리 급해도 선을 넘으면 안 되지."
        말투_분석: >
          평소에는 건들건들하고 속없어 보이는 어투를 유지하다가 핵심 순간에만 차갑고
          간결한 진성을 드러냄. 낭창한 외면과 냉철한 내면의 낙차가 핵심.
          비정통 교관형 사부.

  주인공_귀환자_천재:
    설명: "전생 경험을 가진 귀환자 주인공"
    캐릭터:
      - 이름: "남궁천 (진천랑)"
        역할: "주인공, 귀환자"
        대사:
          - episode: "EP01"
            원문: "어차피 뒈지기 직전이니까 어디 한번 따져나 보자."
          - episode: "EP04"
            원문: "자살할 때 용기가 필요한 줄 아냐? 자살에 필요한 건 용기가 아니라 포기다. 진짜 용기는 살아가는 데만 필요한 거다."
          - episode: "EP21"
            원문: "불나방은 모닥불을 보고 달려들지. 맹수는 불을 보면 도망치고. 우리 교관은 어느 쪽일까?"
          - episode: "EP44"
            원문: "태어날 때부터 불공평한 세상에서 공평한 걸 찾으려고 하다니. 아직 유아기를 벗어나지 못했구나."
          - episode: "EP96"
            원문: "누구 마음대로 실격이래!"
        말투_분석: >
          구어체와 비속어를 전략적으로 사용. 도발적이지만 상대의 논리를 정확히 꿰뚫어
          역으로 제압. 생사를 넘나든 전생 경험이 배어 있어 '죽음을 경험한 자의 초연함'이
          어투 전반에 깔림. 질문에 반문으로 대응하는 습관. 내면독백은 현대 구어체,
          대화는 무협 격식체를 혼용.

  적대_고수:
    설명: "주인공의 적 또는 라이벌 고수"
    캐릭터:
      - 이름: "모용강"
        역할: "정협관 일인자"
        대사:
          - episode: "EP34"
            원문: "내 얼굴에 뭐가 묻었나?"
          - episode: "EP35"
            원문: "한심하군. 기회를 발로 차다니."
          - episode: "EP62"
            원문: "남궁천, 시답잖은 상대는 빨리 정리하고 올라와라. 대진표를 보니 그다음 상대는 내가 되겠군. 기다리고 있겠다."
        말투_분석: >
          극도로 절제된 어투. 감정이 최소한으로 드러나는 짧은 문장들. 자존심이 강하고
          자신의 우위를 당연시함. 경어(~오)를 쓰지만 내용은 완전한 비하.

      - 이름: "독고진"
        역할: "독고세가"
        대사:
          - episode: "EP49"
            원문: "듣자 하니 원래 공식 호구는 저기 앉은 남궁천이라던데. 어떻소? 이번 기회에 다시 호구 자리 넘겨줄 생각 없소?"
        말투_분석: >
          표면적으로는 정중한 문체(~하시오 어체)를 유지하지만 내용은 명백한 모욕과 도발.
          계획적 음모꾼답게 감정 표출이 절제되어 있다가 계획이 틀어지면 노출됨.

      - 이름: "묵천악"
        역할: "맹주 (사적 발언)"
        대사:
          - episode: "EP47"
            원문: "허허, 노부가 우리 용봉들을 기다리게 했구나."
          - episode: "EP95"
            원문: "사람들은 진실에 별로 관심이 없다네. 진실처럼 보이는 행동에만 관심을 가질 뿐."
          - episode: "EP85"
            원문: "만에 하나 잘못된다면 최소한 시체가 떠들어대는 일은 없어야 할 걸세."
        말투_분석: >
          공개 발언은 온화한 장문(자축, 격려, 명분)이고 내면은 냉혹한 단문(배제, 조작).
          인자한 표면과 칼날 같은 속셈의 극단적 대비. '허허', '노부' 등 고전적 장로 어체 사용.
          칭찬 속에 압박을 삽입.

  동문_사형제:
    설명: "주인공과 함께 수련하는 동기, 동료"
    캐릭터:
      - 이름: "팽수혁"
        역할: "동기, 자존심 강한 동료"
        대사:
          - episode: "EP35"
            원문: "이 몸이 너와 같은 조가 되려고 왔다!"
          - episode: "EP36"
            원문: "나는 결코 네 곁에 머물면서 뭔가 건질 게 있을까 봐 이러는 게 아니다! 이건 절대적 진심이다!"
          - episode: "EP63"
            원문: "넌 산 정상을 오르면서 중간에 지나쳐 가는 언덕 이름까지 하나하나 기억하냐?"
          - episode: "EP77"
            원문: "젠장! 누가 이길 것 같냐고! 그놈과 나 중에!"
        말투_분석: >
          자존심이 강하고 직선적. 남궁천에 대한 인정을 절대 직접 표현하지 않고 핑계와
          역설로 포장. '절대' '결코' 같은 강한 부정어를 반복적으로 사용하지만 행동은
          그 반대. 폭발적 감정 분출이 특징.

      - 이름: "윤종승"
        역할: "동기, 성장형 동료"
        대사:
          - episode: "EP10"
            원문: "강해진 방법을 알고 싶다. 나도 너처럼 강해지고 싶어."
          - episode: "EP40"
            원문: "반드시 강해질 거야. 나도 달라질 수 있다는 걸 보여주겠어."
          - episode: "EP53"
            원문: "불안하다. 내가 아무런 힘이 되지 못하는 것 같아서."
          - episode: "EP42"
            원문: "난 호구 아니야! 이 개새끼들아아아!"
        말투_분석: >
          처음에는 겁쟁이 발언이 지배적이다가 점점 직선적이고 솔직한 감정 표현으로 진화.
          욕설을 쓰기 시작하는 시점이 성장의 분기점. 자기혐오와 성장 의지가 교차.

  문파_장문인:
    설명: "문파나 맹의 수장으로서 공적 발언"
    캐릭터:
      - 이름: "묵천악"
        역할: "맹주 (공식 발언)"
        대사:
          - episode: "EP37"
            원문: "이 평화를 유지하기 위해서 많은 심혈을 기울였다네."
          - episode: "EP95"
            원문: "본 맹은 그 어떤 역경에도 결코 흔들리지 않는다는 것을 보여줄 것이오!"
        말투_분석: >
          공식 연설에서는 웅변·열거·반복 구조. 감정을 과장 연출. "사마외도", "신룡",
          "봉황" 등 상징어 활용으로 청중의 감정 조작. 적대 고수와 동일 인물이지만
          공적/사적 발언이 완전히 이중적.

  정파_사파_인사:
    설명: "정파 또는 사파 소속 인물"
    캐릭터:
      - 이름: "유현"
        역할: "화산파, 정파 무인"
        대사:
          - episode: "EP31"
            원문: "도움을 받아버린 입장에서 지켜만 볼 순 없어서 말입니다."
          - episode: "EP34"
            원문: "소협의 무위에 진심으로 감탄했습니다."
        말투_분석: >
          포권·존댓말·정중한 간접 표현을 일관되게 사용하는 정석 정파 어투.

      - 이름: "진득랑"
        역할: "금왕, 만금상회주"
        대사:
          - episode: "EP75"
            원문: "도박은 찍는 거고, 투자는 계산하는 것이지요."
          - episode: "EP73"
            원문: "잠룡을 타고 승천하느냐, 잠룡의 몸부림에 휩쓸려 버리느냐의 문제지."
        말투_분석: >
          모든 말을 비즈니스·투자 논리로 환원. 감정 표현이 있을 때는 딸을 향할 때만.
          포권이나 예절 표현을 적극 사용해 예의를 갖추되 내용은 냉정.

      - 이름: "귀왕"
        역할: "사파 인물"
        대사:
          - episode: "EP18"
            원문: "거, 누구신데 남의 걸 함부로 처드셨어요? 어엉?"
        말투_분석: >
          경어와 욕설을 번갈아 사용하는 혼용형. 겉은 거칠지만 쉽게 굴복하는 단순한 캐릭터.

  여성_캐릭터:
    설명: "여성 주요 인물"
    캐릭터:
      - 이름: "진소홍"
        역할: "금왕의 딸"
        대사:
          - episode: "EP35"
            원문: "그야 소문보단 내 눈을 믿으니까. 네가 압도적으로 일 위 하는 모습을 봤는데, 이왕이면 너한테 투자해야지."
          - episode: "EP58"
            원문: "잠룡. 남궁천은 분명 잠룡이다."
          - episode: "EP93"
            원문: "이대로 죽으면 귀신이 되어서라도 널 저주할 거야!!"
          - episode: "EP65"
            원문: "제 자신을 믿기로 했으니까요. 남궁천을 믿는 게 아니에요. 저는 아버지가 가르쳐 주신 대로 저를 믿는 거예요."
        말투_분석: >
          감정보다 판단을 앞세우는 냉정하고 현실적인 어투. 금융·투자 비유를 사용하는 것이 독특.
          감정과 이성이 충돌할 때 내면 독백이 활성화됨.

      - 이름: "당예설"
        역할: "적랑단주"
        대사:
          - episode: "EP34"
            원문: "기다리기도 지루한데 올해는 그냥 한 명 모자란 상태로 종료할까?"
          - episode: "EP35"
            원문: "어머, 실수."
          - episode: "EP55"
            원문: "세상은 원래 불공평하고 억울한 거야. 그래서 본 맹이 존재하지."
        말투_분석: >
          고위직의 권위와 여성적 가벼움을 교차시키는 특이한 어투. 중요한 결정을 아주 가볍게 말하고,
          도발적 행동을 '실수'로 포장. 장난스러운 외표 아래 예리한 판단력.

      - 이름: "백리향"
        역할: "적대 여성 캐릭터"
        대사:
          - episode: "EP08"
            원문: "아니, 지금 네 기분 말고 병신아. 이 손모가지 그었을 때 기분이 어땠냐고. 지옥에서 네 아빠 얼굴은 보고 왔니?"
          - episode: "EP10"
            원문: "남궁세가가 고개도 못 들게 만들 생각이에요."
        말투_분석: >
          상큼한 존댓말과 신랄한 조롱을 자유롭게 오가는 이중 화법. 친절한 척하면서 가장
          아픈 부분을 정확히 찌름. 미모와 잔인함의 결합이 캐릭터 정체성.
