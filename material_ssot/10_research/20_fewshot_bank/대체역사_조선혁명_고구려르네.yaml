# 대체역사 장르 Few-Shot 성공 예시 뱅크
# 소스: 조선혁명군주 (50화), 고구려 르네상스 (50화)
# 생성일: 2026-03-17

시대_묘사:
  - source: "조선혁명군주 ep001"
    grade: "★★★"
    excerpt: |
      오래되어서 올이 풀리고 색이 바래 버렸지만 반듯하게 정성을 들여서 풀을 먹인 모시적삼과 치마를 두른 그녀는 분명 미현이었다.
    reason: "조선시대 평민 여성의 의복(모시적삼, 치마)을 구체적 질감(올 풀림, 색 바램, 풀 먹임)과 함께 묘사하여 시대적 생활상을 자연스럽게 전달한다."

  - source: "조선혁명군주 ep002"
    grade: "★★★"
    excerpt: |
      정갈하게 빗어 가른 가르마 밑으로 단호해 보이는 두 눈동자가 원범을 노려보고 있었다.
    reason: "순원왕후의 외양을 조선시대 궁중 여인의 머리 양식(가르마)과 결합해 권위적 인물의 첫인상을 시대감 있게 전달한다."

  - source: "고구려 르네상스 ep005"
    grade: "★★★"
    excerpt: |
      이곳은 1,300년 전 당나라 서쪽 끝 안서도호부였다.
      도호부의 치소(治所)가 있는 구자(龜兹)성.
      타클라마칸 사막과 천산산맥 사이에 끼어 있는 곳이었다.
    reason: "8세기 당나라 서역의 지리적 배경(안서도호부, 구자성, 타클라마칸, 천산산맥)을 정확한 역사 용어와 함께 간결하게 제시하여 독자를 시공간 속으로 즉시 안착시킨다."

역사_분기점_장면:
  - source: "조선혁명군주 ep001"
    grade: "★★★"
    excerpt: |
      "임금이 되고 싶으냐?"
      침침한 구중궁궐 속에서 유독 순원왕후의 두 눈동자만이 안광을 뿜으며 원범을 노려보고 있었다.
      이 한 번의 대답이 그가 아는 역사를 어긋나게 할지도 모를 일이었다.
      식은땀이 등을 타고 흘러내리고 있었다.
      "조선의 왕이 되고 싶으냐?"
      "저는 강화도로 돌아가고 싶습니다."
    reason: "원래 역사에서 철종이 왕위에 오르는 순간을 회귀 주인공의 내면 긴장(역사 변경 가능성, 식은땀)과 결합시켜 역사 분기점의 팽팽한 긴장감을 극대화한다."

  - source: "조선혁명군주 ep006"
    grade: "★★★"
    excerpt: |
      "영의정 김좌근을 역모혐의로 체포한다. 숙위사는 이 자를 당장 포박하여 의금부로 압송하라."
      부호군 표철주는 김좌근의 명령을 듣지 못한 듯 굳은 표정으로 김좌근의 말을 중간에 끊으면서 말하였다.
      표철주의 명령이 떨어지기 무섭게 숙위사 군병 둘이 김좌근을 포박하였다.
    reason: "세도정치 체제의 전복이라는 역사 분기점을 편전 현장에서의 극적 반전으로 실현한다. 김좌근이 자기 부하라 믿었던 숙위사가 자신을 체포하는 장면이 권력 역전을 한 순간에 보여준다."

  - source: "고구려 르네상스 ep005"
    grade: "★★"
    excerpt: |
      '왜 하필 고선지 장군이야?'
      그리고 내가 그 유명한 고선지 장군이란다.
      고구려로 전생할 거면 광개토호태왕, 을지문덕, 연개소문 뭐 이런 양반들도 많은데 왜 하필…….
      이 시기 고구려는 이미 망했고.
      고선지 장군은 탈라스에서 역사에 길이 남을 패배를 당한 것도 모자라 모함을 받아 처형당할 텐데.
    reason: "주인공이 회귀한 시점이 이미 고구려 멸망 이후라는 독특한 설정을 통해, 전형적 회귀물의 '유리한 시점 선택' 공식을 뒤집는 역사 분기점의 긴장감을 만든다."

정치_외교_협상:
  - source: "조선혁명군주 ep002"
    grade: "★★★"
    excerpt: |
      "왕대비마마. 마마에게 이 조선의 왕은 어떤 존재입니까?"
      원범은 그녀의 시선은 아랑곳하지 않고 계속해서 대화를 이어나갔다.
      신정왕후는 당황한 기색이 역력했다.
      "주상께서는 못 알아들을 말씀을 하십니다 그려."
      신정왕후는 의아하다는 듯이 그를 바라보며 말했다.
      이 궁궐에 들어와서 나를 대하는 모든 이들의 시선은 단 하나였다.
      경멸과 조롱의 시선들.
      그러나 지금 신정왕후의 시선은 경멸과 조롱의 시선이 아니었다.
      원범의 물음이 신정왕후를 긴장시키고 있었다.
    reason: "허수아비 왕이 풍양조씨 신정왕후에게 정치적 제안을 하는 장면. 경멸에서 경계로 바뀌는 시선 변화를 통해 세력 균형의 미묘한 전환을 보여준다."

  - source: "조선혁명군주 ep030"
    grade: "★★★"
    excerpt: |
      "우리 조선은 청과 국경을 맞대고 있는 상황이고 이미 조선의 군대가 사쓰마로 향한 것을 잘 알고 있을 것이오. 조선이 사쓰마와 전쟁을 벌이고 있는 중차대한 상황에서 청의 흠차대신 이홍장은 우리 조선에게 귀국들과의 조약을 파기할 것을 요구하였소. 조건은 모두 들으신 것처럼 조선과 귀국들 간의 조약을 모두 파기하고 청의 주관 하에 조약을 다시 맺으라는 것이오. 조선으로서는 청의 요구를 무시할 수가 없는 상황이오. 그렇다고 귀국들과의 신의를 헌 신짝 버리듯 한 순간에 버릴 수도 없는 것 아니겠소? 조선의 왕인 내가 어찌하면 좋겠소?"
    reason: "청의 이홍장을 역이용하여 서구 열강 공사들을 한자리에 모아놓고 순진한 척 연기하는 고도의 외교 전략. 약소국이 강대국들의 이해관계를 충돌시켜 자주권을 확보하는 과정을 사실감 있게 그린다."

  - source: "고구려 르네상스 ep030"
    grade: "★★"
    excerpt: |
      "그것보다 염세를 거두면 시중 가격이 오를 터이니 서역에서 소금을 들여와 싼 값에 판매한다면 큰 이문을 거둘 수 있지 않겠습니까?"
      결국 밀매를 하자는 말이었다.
      고액의 염세가 부과되면 소금의 시장 가격은 당연히 뛸 터.
      서역에서 싸게 소금을 들여와 밀매를 한다면 분명 큰돈이 될 것이었다.
      "하하하! 아주 위험한 자로군. 그게 가능하다고 보느냐!"
    reason: "태감 고력사라는 권력자를 소금 전매제와 비전(어음) 시스템으로 포섭하는 과정. 8세기 당나라 정치 생리와 경제 메커니즘을 협상 대화 속에 자연스럽게 녹여낸다."

전쟁_전투:
  - source: "조선혁명군주 ep045"
    grade: "★★★"
    excerpt: |
      "절대 물러서지 마라! 탕! 타당! 탕!"
      이미 운암현에서는 전투가 한창이었다.
      표철주는 아군 병사들을 독려하고 있었다.
      광무2호로 연발 사격을 하고 광무3호, 천자1호의 화력으로 수백, 수천 이상의 적들을 쓰러뜨렸지만 저들은 끝없이 밀려 들었다.
      이미 적들은 이곳 운암현에 표철주와 근위대가 매복하고 있음을 파악하였는지 포병 전력을 집중하여 근위대 병력에 큰 타격을 주고 있었다.
      적들은 이미 싸늘하게 식어버린 청군의 시체를 울타리 삼아 조선혁명군 근위대의 총탄을 막아내며 계속해서 전진하고 있었다.
    reason: "2천 대 4만6천이라는 극단적 전력 차이 속에서 벌어지는 결사항전. 시체를 울타리 삼아 전진하는 청군의 묘사가 전장의 참혹함과 절박함을 동시에 전달한다."

  - source: "조선혁명군주 ep025"
    grade: "★★★"
    excerpt: |
      "천자1호는 슈세이칸에 화력을 집중하라!"
      이명운 함장의 명령에 이순신함 좌측의 천자1호 36문이 일제히 슈세이칸을 향해 포격을 시작했다.
      "나대용함은 가고시마항을 포격한다! 다시는 저곳에서 일본의 증기 함선이 출항하지 못하도록 해야 한다!"
      나대용함의 110파운드 암스트롱포 5문과 40파운드 암스트롱포 10문도 포격을 시작했다.
      이미 가고시마항과 슈세이칸은 불길에 휩싸인 지 오래였다.
    reason: "실제 사쓰에이 전쟁(1863)을 모티프로 한 해전 장면. 함선명, 화포 제원, 전술적 판단이 결합되어 대체역사 해전의 생동감을 극대화한다."

  - source: "고구려 르네상스 ep040"
    grade: "★★"
    excerpt: |
      내 명령에 따라 적을 에워싸고 괴롭히던 청룡대와 비호대가 둘로 갈라졌다.
      그리고 일제히 엄청난 길이의 마삭(馬槊 : 기병창)을 들고 적진을 향해 돌진하는 개마대.
      초원의 아침 햇살이 1백 개마대가 입은 찰갑과 마갑을 더욱 빛나 보이게 만들었다.
      절로 감탄사가 나오는 이 장관.
    reason: "고구려 중갑기병(개마무사)의 돌진을 아침 햇살에 반사되는 찰갑과 마갑 이미지로 시각화하여 역사적 병종의 위용을 장르적 쾌감으로 전환한다."

화_도입부:
  - source: "조선혁명군주 ep001"
    grade: "★★★"
    excerpt: |
      "미현아~, 혁빈아~"
      원범은 혼잣말을 내뱉으며 소주를 병째 들이켰다.
      연거푸 몇 모금을 마셨는데도 술에 취하질 않았다.
      사진 속의 미현이와 혁빈이는 그런 원범을 보며 속없이 웃고 있었다.
      다시는 만날 수 없는 두 사람.
      원범은 슬픈 표정으로 팔찌를 매만지며 가을비에 젖은 시커먼 한강을 내려다봤다.
    reason: "프롤로그 첫 장면으로서 주인공의 상실감(가족 사망), 자살 암시(한강), 핵심 소품(팔찌)을 동시에 제시하여 독자를 단번에 서사에 몰입시킨다."

  - source: "고구려 르네상스 ep001"
    grade: "★★★"
    excerpt: |
      -태왕께서는 이십 세에 천제의 명을 받아 창업의 뜻을 세우셨다.
      -가장 먼저 초원을 평정하시고
      -중원의 주인이 되셨으며
      -뒤이어 남방과 서역을 모두 발아래 두셨으니
      태왕의 발자취 모두가 곧 역사였다.
    reason: "사관의 기록체 문장으로 시작하여 작품 전체의 스케일(초원-중원-남방-서역 정복)을 첫 장면에서 선언한다. 연대기 형식의 도입부가 대체역사물의 웅장함을 효과적으로 설정한다."

  - source: "고구려 르네상스 ep002"
    grade: "★★"
    excerpt: |
      2020년 2월, 대전 한국군사과학기술연구소.
      "너무 일찍 왔나?"
      드디어 첫 출근 날이다.
      정확히 말하자면 신입 연구원 교육 1일차.
      오랜 백수 생활을 끝내고 입사한 곳은 바로 한국군사과학기술연구소.
      내 덕후 체질에 딱 들어맞는 곳에 정말 운 좋게 합격했다.
      그것도 수석으로.
    reason: "현대 시점의 평범한 첫 출근 장면으로 시작하여 주인공의 성격(덕후, 자신감)을 자연스럽게 노출한다. 회귀 전 현대 파트의 가벼운 톤이 이후 8세기 전개와 대비 효과를 만든다."

클리프행어:
  - source: "조선혁명군주 ep001"
    grade: "★★★"
    excerpt: |
      '내가 조선의 강화도령, 철종이라고?'
    reason: "1화 마지막에 주인공의 정체가 철종임을 한 줄로 드러내어, 강화도의 무명 유배인이 곧 조선의 왕이 된다는 거대한 서사적 전환을 암시한다."

  - source: "조선혁명군주 ep011"
    grade: "★★★"
    excerpt: |
      "전하, 공학원에 화재가 발생하였습니다."
      '공학원?'
      불안감이 엄습했다.
      "피해 정도는?"
      나는 다급한 표정으로 물었다.
      "공학원 연구원 둘이 사망하였고 화재가 비밀 서고 일부를 태우는 바람에 광무1호의 설계도와 제작일지가 소실되었습니다."
      '분명 불에 탄 것이 아니다. 이건 누군가가 일부러 빼돌린 것이 틀림없다.'
    reason: "지부상소로 유생들과 대립하는 와중에 핵심 군사기술(광무1호 설계도)이 탈취되는 이중 위기를 화 말미에 배치하여 배후세력에 대한 궁금증을 극대화한다."

  - source: "고구려 르네상스 ep025"
    grade: "★★"
    excerpt: |
      "생각해 둔 바가 있습니다. 일이 빠르게 진척될 수도 있으니 미리 경당 학생들 중에서 쓸만한 아이들을 선별해 두셔야 할 것입니다."
      이미 고구려를 재건하겠다는 뜻을 세운 그때부터 준비해둔 수가 있었다.
      지금의 '그'라면 나를 만날 수밖에 없도록 만들 수가.
