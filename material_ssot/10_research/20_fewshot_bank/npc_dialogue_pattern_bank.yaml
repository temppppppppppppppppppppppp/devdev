# ============================================================
# NPC 대사 패턴 뱅크 — 투자/재벌물 장르
# 출처: 금수저생활백서, 금수저 투자백서, 독식하는 재벌 3세
# 생성일: 2026-03-17
# 목적: AI 글쓰기 시스템의 캐릭터 아키타입별 대사 생성 학습
# ============================================================

archetypes:

  # ──────────────────────────────────────────────
  # 1. 재벌 회장 (Patriarch / Authority Figure)
  # ──────────────────────────────────────────────
  재벌_회장:
    description: >
      그룹 총수. 절대 권력자이면서도 자식에 대한 기대와 실망이 교차하는 인물.
      평소에는 냉철하고 과묵하지만, 분노 시 욕설과 물리적 위협도 서슴지 않는다.
      사업 이야기에서는 날카로운 질문으로 상대를 시험하고,
      만족할 때도 직접적 칭찬 대신 "나쁘지 않다" 수준의 절제된 인정을 한다.

    dialogue_excerpts:
      - text: >
          "이 망할 놈의 자식! 내가 사고 치지 말고 죽은 듯이 있으라고 했지!
          이 자식이. 이젠 내 말도 무시하겠다는 거야!"
        source: "금수저생활백서 ep002"
        context: "막내아들의 음주 사고 소식에 야구 방망이를 들고 방에 들이닥친 장면"

      - text: >
          "아무리 내 자식이라도 제 몫을 못하고 기생충처럼 빌붙어 살려는 것들은 용납 안 해.
          알겠냐. 너희들도 마찬가지니까 명심하는 것이 좋을 거야."
        source: "금수저생활백서 ep003"
        context: "가족 회의 석상에서 모든 자녀에게 경고하는 장면"

      - text: >
          "좋아. 속는 셈 치고 이번 한 번은 그냥 넘어가 주마. 하지만 또다시 이번 일 같은
          사고를 치거나 제대로 출근하지 않는다는 소리가 들리면 그땐 정말 국물도 없을 줄 알아라.
          매번 말로만 끝내니까 내가 못 그럴 것 같지. 이번에도 똑같을지 확인하고 싶으면 어디 한번 해봐."
        source: "금수저생활백서 ep003"
        context: "막내가 진심으로 사과하자 한 발 물러서지만 여전히 위협의 여지를 남기는 장면"

      - text: >
          "사내가 일을 추진하는 데 그만한 자신감은 있어야지. 하지만 말이야.
          만에 하나 결과가 좋지 않다면…… 그에 따른 책임을 질 자신도 있어야 할 거야."
        source: "금수저생활백서 ep006"
        context: "새 광고 기획안을 보고받으며 냉정하게 평가하는 장면"

      - text: >
          "겨우 한 번 성과를 냈을 뿐이야. 너무 호들갑 떨진 말도록 해."
        source: "금수저생활백서 ep007"
        context: "비서실장이 막내를 칭찬하자 냉정한 기준을 유지하는 장면"

    speech_pattern_analysis:
      말투_특징:
        - "반말 + 하라체 혼용: '~하거라', '~해라', '~알겠냐'"
        - "짧고 단호한 명령문 선호: '나가봐라', '말해보거라', '갖고 와 봐라'"
        - "분노 시 걸쭉한 욕설 사용: '망할 놈의 자식', '이 자식이'"
        - "인정할 때도 절제된 표현: '나쁘지 않아', '그건 그렇지'"
        - "질문형으로 상대를 시험: '~할 자신이 있냐?', '성공시킬 자신이 있냐?'"
      호칭_패턴:
        - "자녀에게: '이 자식', '이놈', '네 녀석' (화날 때) / 이름 호명 (평시)"
        - "비서에게: '자네', 직함 호칭"
        - "자녀가 부르는 호칭: '아버지', '회장님'"
      감정_표현_방식:
        - "분노: 물리적 행동(야구 방망이, 소파 팔걸이 치기) + 호통"
        - "만족: 직접 말하지 않고 행동으로(기획안 허락, 고개 끄덕임)"
        - "고민: '흐음', 턱을 매만지는 동작, 의자에 비스듬히 기대기"
        - "경고: 조건부 인정 후 위협('좋아. 하지만~')"
      key_phrases:
        - "그거나 이거나"
        - "좋아. 어디 한번 해봐"
        - "속는 셈 치고"
        - "국물도 없을 줄 알아라"
        - "네가 책임지고"
        - "알아서 주의하거라"
        - "돈을 벌려면 물 들어올 때 노를 저야 되니까"
        - "피는 못 속이는 것 같다" # (비서의 칭찬에 대한 반응)

  # ──────────────────────────────────────────────
  # 2. 주인공 (회귀자 / 금수저 전환자)
  # ──────────────────────────────────────────────
  주인공_회귀자:
    description: >
      미래 지식이나 전생 경험을 가진 주인공. 윗사람에게는 공손하되 당당하고,
      아랫사람에게는 친근하면서도 리더십을 발휘한다. 핵심은 "확신에 찬 어조"로,
      주변이 의심할 때도 흔들리지 않는 모습을 보인다.
      전생의 직장인 감각과 현생의 금수저 위치가 충돌하는 이중성이 특징.

    dialogue_excerpts:
      - text: >
          "광고가 뭡니까. 소비자들이 보고 제품을 구매하도록 유도하는 건데.
          이건 전혀 그런 것이 없잖아요. 원점에서 광고 시안을 재검토할 거니까.
          회의를 소집해 줘요."
        source: "금수저생활백서 ep004"
        context: "처음으로 업무에 적극 개입하며 기존 기획을 뒤엎는 장면"

      - text: >
          "이대로라면 최악의 실패작이 되고 말 겁니다. 내 말이 틀렸다고 생각하는
          사람이 있으면 어디 이야기를 해봐요."
        source: "금수저생활백서 ep004"
        context: "팀원들의 반발에도 확신을 가지고 밀어붙이는 장면"

      - text: >
          "확인해 보면 바로 들통날 일인데요. 제가 왜 뻔히 들여다보이는 거짓말을
          하겠습니까."
        source: "금수저생활백서 ep005"
        context: "아버지의 의심에 눈을 피하지 않고 당당하게 대응하는 장면"

      - text: >
          "크게 벌려면 공포에 사라는 말도 있잖아요. 난 오히려 지금이 적기라고 봐요."
        source: "금수저 투자백서 ep016"
        context: "시장 폭락 중 역발상 투자를 결정하며 확신을 드러내는 장면"

      - text: >
          "나도 나름 사활을 걸고 있거든. 그런 사람 둘이 손잡으면 뭘 못 하겠어."
        source: "금수저생활백서 ep010"
        context: "경쟁적인 누나에게 협력을 제안하는 장면"

    speech_pattern_analysis:
      말투_특징:
        - "윗사람에게: 존댓말이지만 비굴하지 않음 (~겠습니까, ~입니다)"
        - "아랫사람에게: 부드러운 존댓말 (~해요, ~합시다) — 위압적이지 않은 리더십"
        - "확신 표현: '~할 겁니다', '확신이 없다면 가져오지도 않았을 겁니다'"
        - "독백/혼잣말: 반말+비속어 혼용 ('시발! 이거 정말 죽이잖아')"
        - "유머와 농담으로 분위기 전환하는 능력"
      호칭_패턴:
        - "아버지(회장)에게: '아버지', '회장님' (상황에 따라 전환)"
        - "형제에게: '형', '누나' (반말)"
        - "직원에게: '~씨', '~대리', '~부장님' (존칭 유지)"
      감정_표현_방식:
        - "압박 상황: 표면적 침착 + 내면 독백으로 긴장 표현"
        - "성공 시: 절제된 미소, 속으로 환호"
        - "분노 시: 상대를 직시하며 냉정하게 밀어붙임 (폭발이 아닌 압박)"
      key_phrases:
        - "어떻게든 해봐야지"
        - "이대로라면"
        - "확인해 보면 바로 들통날 일"
        - "기왕이면"
        - "처음부터 다시 합시다"
        - "출시일 연기는 없습니다"
        - "공포에 사라"

  # ──────────────────────────────────────────────
  # 3. 비서 / 실장 (Secretary / Chief of Staff)
  # ──────────────────────────────────────────────
  비서_실장:
    description: >
      회장의 최측근으로 회장 가문과 회사 사이의 완충 역할.
      극도로 공손하면서도 상황 판단이 빠르고, 필요할 때 소신 발언을 하되
      "주제넘었습니다" 식의 자기 검열을 곁들인다.
      도련님/아가씨에게도 격식을 차리되 잔소리와 충고를 아끼지 않는다.

    dialogue_excerpts:
      - text: >
          "회, 회장님! 진정하십시오. 아이고 그래도 이러시면 안 됩니다!"
        source: "금수저생활백서 ep002"
        context: "야구 방망이를 든 회장을 말리는 장면"

      - text: >
          "도련님 뭐 하십니까. 얼른 붙잡으세요.
          그냥 맞으시면 뼈가 부러질 수도 있습니다. 어서 잡으세요."
        source: "금수저생활백서 ep002"
        context: "도련님이 맞을 상황에서 의자를 방패로 제공하며 현실적 조언"

      - text: >
          "회장님 기분이 저기압인 거 알고 계시죠. 여기서 또 일을 벌이시면
          정말 호적에서 이름이 파이실지도 모릅니다."
        source: "금수저생활백서 ep002"
        context: "도련님 외출 시 상황을 경고하는 장면"

      - text: >
          "투자 결정은 고객께서 하시는 건데 제가 너무 주제넘었습니다."
        source: "금수저 투자백서 ep016"
        context: "자신의 조언이 선을 넘었다고 느꼈을 때의 자기 검열"

      - text: >
          "도련님이 원한다면 언제든지 본사에 자리를 마련하겠습니다.
          최소한의 보고만 받도록 하겠습니다."
        source: "독식하는 재벌 3세 ep016"
        context: "회장에게 손자의 근황을 보고하며 충성과 배려를 동시에 보이는 장면"

    speech_pattern_analysis:
      말투_특징:
        - "극존칭 일관: '~하십시오', '~하겠습니다', '~이십니까'"
        - "완곡한 반대: '그렇습니다만……', '말씀하신 대로 하겠습니다만'"
        - "상황 보고 시 간결하고 정확: 수치, 사실 위주"
        - "감정 절제: 놀라움도 '허어', '헉' 수준의 최소 반응"
      호칭_패턴:
        - "회장에게: '회장님'"
        - "자녀에게: '도련님', '아가씨', '이사님' (회사에서)"
        - "외부인에게: '본부장님' (직함 기반)"
      감정_표현_방식:
        - "걱정: 눈치를 살피며 조심스럽게 의견 제시"
        - "놀람: 절제된 반응 후 즉시 상황 분석으로 전환"
        - "충성: 명시적 표현 없이 행동으로 보여줌 (의자 방패, 정보 사전 준비)"
      key_phrases:
        - "진정하십시오"
        - "어렵지 않은 일이군요"
        - "주제넘었습니다"
        - "알겠습니다"
        - "그렇습니다만……"
        - "확인하겠습니다"
        - "최소한의 보고만 받도록 하겠습니다"

  # ──────────────────────────────────────────────
  # 4. 적대자 (형제 / 경쟁자)
  # ──────────────────────────────────────────────
  적대자_형제_경쟁자:
    description: >
      주인공의 형제 중 경쟁 관계에 있는 인물, 또는 라이벌 재벌가의 인물.
      대놓고 비아냥거리거나 무시하는 말투가 특징.
      자존심이 강하고 시기심이 드러나며, 권력 서열을 언어적으로 확인하려 한다.
      주인공이 반격하면 당황하여 분노하는 패턴을 보인다.

    dialogue_excerpts:
      - text: >
          "혼자 망나니 짓을 하며 돌아다니든 말든 상관 안 하는데 집안에 피해를 주진
          말아야지. 아무튼 뭐 하나 제대로 하는 게 없는 놈이라니까."
        source: "금수저생활백서 ep003"
        context: "둘째 형이 가족 회의에서 주인공을 대놓고 비아냥거리는 장면"

      - text: >
          "버릇없는 자식! 형한테 말본새가 그게 뭐야.
          운 좋게 광고 하나 히트쳤다고 눈에 뵈는 게 없냐?"
        source: "금수저생활백서 ep009"
        context: "엘리베이터에서 주인공에게 시비를 거는 장면"

      - text: >
          "이게 뭐 하는 짓이야! 감히 날 위협해?"
        source: "금수저생활백서 ep009"
        context: "주인공의 반격에 당황하고 분노하는 장면"

      - text: >
          "오랜만이야. 어머. 내가 너한테 그런 걸 일일이 말하고 다녀야 되니."
        source: "금수저생활백서 ep011"
        context: "라이벌 재벌가 딸이 은근히 약을 올리는 장면 (손아영)"

      - text: >
          "미리 말 못 해줘서 미안합니다."
        source: "금수저생활백서 ep011"
        context: "경쟁자가 교묘하게 기선을 제압한 뒤 가식적으로 사과하는 장면"

    speech_pattern_analysis:
      말투_특징:
        - "다혈질 형제: 반말 + 욕설 ('버릇없는 자식', '이 자식 봐라')"
        - "교활한 경쟁자: 공손한 존댓말 속에 가시 ('미안합니다' 뒤의 비웃음)"
        - "비아냥: '~라니까', '~게 뭐야', '뭐 하나 제대로 하는 게 없는'"
        - "위협: 서열 강조형 ('형한테', '감히')"
      호칭_패턴:
        - "동생에게: '야', '너 이 자식', 이름 직접 호명 ('박재성')"
        - "경쟁자에게: 이름 호명 + 반말 (동급 재벌가끼리)"
      감정_표현_방식:
        - "시기심: 타인의 성공을 '운'으로 격하 ('운 좋게 하나 히트쳤다고')"
        - "분노: 물리적 행동(벽 치기, 이갈이) + 고성"
        - "교활함: 표면적 미소 + 내면의 계산"
        - "당황: 주춤 + 즉각적 분노 전환"
      key_phrases:
        - "뭐 하나 제대로 하는 게 없는 놈"
        - "운 좋게"
        - "감히"
        - "형한테 말본새가 그게 뭐야"
        - "눈에 뵈는 게 없냐"
        - "내가 너한테 그런 걸 일일이 말하고 다녀야 되니"

  # ──────────────────────────────────────────────
  # 5. 조력자 (팀원 / 부하직원)
  # ──────────────────────────────────────────────
  조력자_팀원_부하:
    description: >
      주인공의 직속 부하이자 충성스러운 팀원. 초반에는 낙하산 상사에 대한
      불만을 숨기지 못하다가 점차 실력을 인정하게 된다.
      상사에 대한 분노를 대신 표현해주는 역할, 막내의 애환,
      보너스에 즉각 반응하는 현실적 모습이 특징.

    dialogue_excerpts:
      - text: >
          "팀장님, 어떻게 됐습니까? 아니, 본부장 이 새끼는 정말 너무한 거 아닙니까!
          낙하산이면 그냥 가만히 있을 것이지. 제대로 아는 것도 없으면서 하는 일마다
          다 망치기만 하고! 정말 일할 맛이 안 납니다."
        source: "금수저생활백서 ep001"
        context: "프로젝트 폐기 소식에 상사 대신 분통을 터트리는 이동수 대리"

      - text: >
          "출근을 다 하고 웬일이래. 그러게 오늘은 해가 서쪽에서 떴나.
          저럴 거면 회사를 왜 나오는지 몰라."
        source: "금수저생활백서 ep004"
        context: "낙하산 본부장의 출근에 직원들이 수군거리는 장면"

      - text: >
          "캬, 역시 금수저! 재벌 3세라 그런지 씀씀이가 다르네요."
        source: "금수저생활백서 ep005"
        context: "택시비 10만원씩 받은 직원들의 즉각적 태세 전환"

      - text: >
          "대리님, 완전 찍힌 거 아니에요? 사람이 갑자기 저렇게 바뀔 수가 있나.
          오늘 말하는 거 보니까 완전 똑 부러지던데."
        source: "금수저생활백서 ep005"
        context: "변화한 본부장에 대해 팀원끼리 수근거리는 장면"

      - text: >
          "본부장님 최곱니다! 본부장님 사랑합니다! 최고예요!"
        source: "금수저생활백서 ep008"
        context: "성과금 200% 발표에 환호하는 팀원들"

    speech_pattern_analysis:
      말투_특징:
        - "상사에게: 존댓말 (~습니까, ~습니다) 기본이지만 감정 폭발 시 비속어 섞임"
        - "동료끼리: 편한 반말 + 농담 ('완전 찍힌 거 아니에요?')"
        - "태세전환: 보너스/혜택 앞에서 즉각적 칭찬 모드"
        - "불만 표출: '~하는 거 아닙니까', '정말 ~하다니까'"
      호칭_패턴:
        - "상사: '본부장님', '팀장님'"
        - "동료: '대리님', '~씨', 이름 호명"
      감정_표현_방식:
        - "분노: 상사 대신 대리 분출 ('본부장 이 새끼는')"
        - "기쁨: 과장된 환호 ('우와아~!', '캬!')"
        - "불안: 눈치 살피기 ('뭐 하나 제대로 하는 게 없으면서')"
        - "인정: 점진적, 뒤에서 인정하되 앞에서는 쉽게 안 함"
      key_phrases:
        - "어떻게 됐습니까"
        - "정말 너무한 거 아닙니까"
        - "캬, 역시"
        - "완전 찍힌 거 아니에요"
        - "하아. 알겠습니다"
        - "본부장님 최곱니다"
        - "일할 맛이 안 납니다"

  # ──────────────────────────────────────────────
  # 6. 외부 전문가 (증권맨 / 변호사 / 외국인)
  # ──────────────────────────────────────────────
  외부_전문가:
    description: >
      금융, 법률, 투자 분야의 전문가. 정확한 수치와 팩트 기반 대화를 하되,
      고객(재벌가)에 대한 공손함을 유지한다. 전문 용어를 쓰면서도
      상대가 이해할 수 있도록 번역하는 능력이 있다.
      외국인 전문가의 경우 번역체 느낌의 공손한 한국어가 특징.

    dialogue_excerpts:
      - text: >
          "수익금은 주식 포지션으로 전부 다시 넣어줘요.
          파트장님한테 말씀을 드려야 되겠지만 이미 10배까지 레버리지를 사용하실 수 있게
          승인이 난 상태이니 별다른 문제는 없을 겁니다."
        source: "금수저 투자백서 ep016"
        context: "투자은행 직원(콕스)이 고객의 투자 지시를 처리하는 장면"

      - text: >
          "이대로 간다면 자칫 영국이 IMF 구제금융을 받게 될 수도 있다는 이야기도
          있습니다. 투자 결정은 고객께서 하시는 건데 제가 너무 주제넘었습니다."
        source: "금수저 투자백서 ep016"
        context: "투자 위험을 경고하면서도 고객의 결정권을 존중하는 장면"

      - text: >
          "경구용 비만 치료제를 개발 중이라는 회사?"
        source: "금수저 투자백서 ep001"
        context: "구둣방 노인(은퇴 전문가)이 한마디로 회사를 정확히 파악하는 장면"

      - text: >
          "이건 투자 수익 내역서 아닙니까. 총 수익률 31.12%, 수익금액 3억 1,120만
          달러…… 레버리지를 써서 투자를 하신 것 같습니다."
        source: "금수저 투자백서 ep016"
        context: "비서실장이 투자 수익 서류를 분석하며 보고하는 장면"

      - text: >
          "안 봐도 훤하다. 또 어디서 이상한 이야기 듣고 온 거겠지.
          그래서 넌 빈 수레가 요란한 거야. 아무것도 제대로 아는 건 없으면서
          남들이 '이거 좋다' 하면 무작정 따라간단 말이지."
        source: "금수저 투자백서 ep001"
        context: "노련한 투자 전문가(구둣방 노인)가 주식 초보를 질타하는 장면"

    speech_pattern_analysis:
      말투_특징:
        - "수치와 팩트 위주: '31.12%', '3억 1,120만 달러'"
        - "조건부 표현 선호: '~한다면', '~할 수도 있습니다'"
        - "전문 용어 자연스러운 삽입: '레버리지', '포지션', 'ERM'"
        - "노련한 전문가: 비유를 활용한 교훈 전달 ('빈 수레가 요란하다')"
      호칭_패턴:
        - "고객에게: '고객님', 직함 호칭"
        - "노인→청년: '이놈아', '너' (친밀+훈계)"
      감정_표현_방식:
        - "경고: 데이터 기반 우려 표명 후 결정은 고객에게 위임"
        - "확신: 역사적 사례 인용 + 논리적 근거"
      key_phrases:
        - "안 봐도 훤하다"
        - "빈 수레가 요란하다"
        - "투자 결정은 고객께서 하시는 겁니다"
        - "주제넘었습니다"
        - "별다른 문제는 없을 겁니다"

  # ──────────────────────────────────────────────
  # 7. 가족 (어머니 / 배우자 / 조부모)
  # ──────────────────────────────────────────────
  가족_따뜻한_관계:
    description: >
      주인공에게 무조건적 애정을 보이는 가족. 재벌물에서는 주로 조부모(할아버지)가
      이 역할을 맡으며, 엄격한 회장의 이미지와 손자 앞에서의 부드러운 이미지가
      극명하게 대비된다. 일상적 걱정(밥, 건강, 안전)을 입에 달고 산다.

    dialogue_excerpts:
      - text: >
          "아이고! 우리 민재 왔구나? 음식이 입맛에는 맞고? 내가 우리 민재 먹이려고
          대한민국에서 요리 제일 잘한다는 요리사만 불러서 만들었어."
        source: "독식하는 재벌 3세 ep001"
        context: "손자를 본 할아버지가 연회장에서 태도가 180도 바뀌는 장면"

      - text: >
          "출장이 길었지? 나도 빨리 오고 싶었는데 코쟁이 놈들이 어찌나 깐깐한지.
          우리 민재 얼마나 컸나 한번 보자."
        source: "독식하는 재벌 3세 ep001"
        context: "연회장 수백 명 앞에서 손자에게 달려가는 할아버지"

      - text: >
          "한눈팔지 말고 운전 조심해서 해. 그러는 놈이 지난번에 넘어져서 무릎이 다
          깨졌냐? 아무튼 조심하란 소리야."
        source: "금수저 투자백서 ep001"
        context: "구둣방 노인이 배달 청년에게 잔소리하는 장면 (사실상 보호자 역할)"

      - text: >
          "민재가 어련히 알아서 하겠지. 그래도 부품 공장에 너무 오래 있게 하진 말게나.
          서로 부대끼고 지내야 태우그룹에 더 잘 스며들지 않겠나?"
        source: "독식하는 재벌 3세 ep016"
        context: "손자의 성장을 위해 험한 길을 허락하되 걱정을 숨기지 못하는 장면"

      - text: >
          "이놈아! 장사하는 사람이 가게를 어떻게 비우고 가?
          전기 스쿠터인데 뭔 기름값이야."
        source: "금수저 투자백서 ep001"
        context: "투덜거리면서도 따뜻한 대화를 주고받는 유사 가족 관계"

    speech_pattern_analysis:
      말투_특징:
        - "애칭 사용: '우리 민재', '우리 강아지' 등"
        - "질문형 걱정: '입맛에는 맞고?', '얼마나 컸나?'"
        - "잔소리=사랑: 반복적 주의 당부 ('조심해', '한눈팔지 마')"
        - "과거 회상형 대화: '전에도 ~했잖아'"
        - "격식 없는 반말: '~했지?', '~하란 소리야'"
      호칭_패턴:
        - "손자에게: '우리 민재', 이름 호명 + 반말"
        - "주변에게 손자 언급: '우리 손자 녀석'"
        - "비혈연 보호자: '이놈아' (친밀한 꾸짖음)"
      감정_표현_방식:
        - "기쁨: 과장된 반응 ('아이고!', 달려감, 포옹)"
        - "걱정: 반복적 잔소리 + 혀 차기"
        - "자부심: 간접적 자랑 ('우리 민재 먹이려고 최고만 불렀어')"
        - "사랑: 물리적 접촉(안기, 머리 쓰다듬기) + 과잉보호 경향"
      key_phrases:
        - "우리 민재"
        - "아이고"
        - "조심하란 소리야"
        - "어련히 알아서 하겠지"
        - "이놈아"
        - "입맛에는 맞고?"

# ============================================================
# 공통 패턴 노트
# ============================================================
common_patterns:

  재벌물_장르_대사_특징:
    - "권력 서열이 대화 구조를 결정함: 회장 > 장남 > 차남 > 막내"
    - "같은 인물이 상대에 따라 말투가 극적으로 변함 (회장이 임원에게 vs 손자에게)"
    - "침묵과 시선 교환이 대사만큼 중요한 커뮤니케이션 수단"
    - "'흐음', '흠', '……' 등 반응음이 감정의 결정적 전환점을 나타냄"
    - "비즈니스 대화에서도 가족 관계(아버지/형)가 상시 개입"
    - "능력 인정은 직접 말로 하지 않고 '기회를 주는 것'으로 표현"

  호칭_시스템:
    집안_내부:
      - "회장 → 자녀: 이름 호명 or '이 자식' (화날 때)"
      - "자녀 → 회장: '아버지' (사적) / '회장님' (공적)"
      - "형제간: '형', '누나' + 반말 (불화 시에도 호칭은 유지)"
      - "비서 → 자녀: '도련님', '아가씨', '이사님'"
    회사_내부:
      - "상사 → 부하: '~씨', 직함 호칭 + 존댓말 (금수저 주인공의 특징)"
      - "부하 → 상사: '본부장님', '팀장님'"
      - "동료끼리: 직함 + 존댓말 or 편한 반말 (친밀도에 따라)"

  감정_표현_패턴:
    분노_단계:
      - "1단계: 미간에 주름 → 시선 고정"
      - "2단계: 목소리 톤 변화 ('나지막한 목소리'가 오히려 위험 신호)"
      - "3단계: 물리적 행동 (소파 치기, 서류 던지기)"
      - "4단계: 욕설 + 퇴장 명령 ('나가봐라')"
    인정_단계:
      - "1단계: '흠' + 침묵"
      - "2단계: '나쁘지 않아' / '그건 그렇지'"
      - "3단계: 기회 부여 ('한번 해봐')"
      - "4단계: 뒤에서 비서에게 칭찬 (본인 앞에서는 절대 안 함)"
