<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Wuxia Studio V60 - Pipeline Visualizer</title>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 100%);
            min-height: 100vh;
            color: #fff;
        }
        .header {
            padding: 15px 30px;
            background: rgba(0,0,0,0.3);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            font-size: 1.5rem;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header p { color: #888; font-size: 0.85rem; }
        .container {
            display: flex;
            height: calc(100vh - 70px);
        }
        #network {
            flex: 1;
            background: rgba(0,0,0,0.2);
        }
        .sidebar {
            width: 380px;
            padding: 15px;
            background: rgba(0,0,0,0.3);
            border-left: 1px solid rgba(255,255,255,0.1);
            overflow-y: auto;
        }
        .info-card {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .info-card h3 {
            color: #00d4ff;
            margin-bottom: 10px;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .info-card p {
            color: #aaa;
            font-size: 0.85rem;
            line-height: 1.5;
        }
        .info-card ul {
            margin: 8px 0 0 18px;
            color: #ccc;
            font-size: 0.8rem;
        }
        .info-card li { margin: 4px 0; }
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            color: #aaa;
        }
        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        .view-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }
        button {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s;
        }
        .btn-primary {
            background: linear-gradient(90deg, #7b2cbf, #00d4ff);
            color: #fff;
            grid-column: span 2;
        }
        .btn-stage {
            background: rgba(123, 44, 191, 0.3);
            color: #d4a5ff;
            border: 1px solid rgba(123, 44, 191, 0.5);
        }
        .btn-stage:hover, .btn-stage.active {
            background: rgba(123, 44, 191, 0.6);
            color: #fff;
        }
        button:hover { transform: translateY(-1px); }
        #node-detail { display: none; }
        #node-detail.active { display: block; }
        .tag {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
            margin-right: 4px;
            margin-bottom: 4px;
        }
        .tag-stage { background: #7b2cbf; }
        .tag-agent { background: #00d4ff; color: #000; }
        .tag-validator { background: #4caf50; }
        .tag-db { background: #ff9800; color: #000; }
        .tag-io { background: #e91e63; }
        .tag-loop { background: #9c27b0; }
        .current-view {
            padding: 8px 12px;
            background: rgba(0,212,255,0.2);
            border-radius: 6px;
            color: #00d4ff;
            font-size: 0.9rem;
            margin-bottom: 12px;
            text-align: center;
        }
        .step-list {
            counter-reset: step;
            list-style: none;
            margin: 0;
            padding: 0;
        }
        .step-list li {
            counter-increment: step;
            position: relative;
            padding-left: 28px;
            margin: 8px 0;
            font-size: 0.8rem;
            color: #ccc;
        }
        .step-list li::before {
            content: counter(step);
            position: absolute;
            left: 0;
            top: 0;
            width: 20px;
            height: 20px;
            background: #7b2cbf;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            color: #fff;
        }
        .model-badge {
            display: inline-block;
            padding: 2px 6px;
            background: rgba(0,212,255,0.2);
            border-radius: 4px;
            font-size: 0.7rem;
            color: #00d4ff;
            margin-left: 5px;
        }
        .cost-badge {
            display: inline-block;
            padding: 2px 6px;
            background: rgba(76,175,80,0.2);
            border-radius: 4px;
            font-size: 0.7rem;
            color: #4caf50;
        }
        .flow-indicator {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.75rem;
            color: #888;
            margin: 5px 0;
        }
        .flow-indicator .arrow { color: #7b2cbf; }
    </style>
</head>

    function showNodeDetail(nodeId) {
        const detail = nodeDetails[nodeId];
        const detailCard = document.getElementById('node-detail');

        if (!detail) {
            detailCard.classList.remove('active');
            return;
        }

        detailCard.classList.add('active');
        document.getElementById('detail-title').textContent = detail.title;

        const tagClasses = {
            'stage': 'tag-stage', 'agent': 'tag-agent', 'validator': 'tag-validator',
            'db': 'tag-db', 'output': 'tag-stage', 'io': 'tag-io', 'loop': 'tag-loop'
        };

        let tagsHtml = detail.tags.map(tag =>
            `<span class="tag ${tagClasses[tag] || 'tag-stage'}">${tag}</span>`
        ).join('');
        document.getElementById('detail-tags').innerHTML = tagsHtml;
        document.getElementById('detail-desc').innerHTML = detail.desc;

        const listEl = document.getElementById('detail-list');
        listEl.innerHTML = '';
        detail.items.forEach(item => {
            const li = document.createElement('li');
            li.textContent = item;
            listEl.appendChild(li);
        });
    }
