# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      # Run the linter
      - id: ruff
        args: [--fix]
      # Run the formatter
      - id: ruff-format
  - repo: local
    hooks:
      - id: check-utf8-hygiene
        name: check utf8 hygiene
        entry: python scripts/check_utf8_hygiene.py
        language: system
        pass_filenames: true
        files: '(^AGENTS\.md$|^\.pre-commit-config\.yaml$|^\.editorconfig$|.*\.(bat|cfg|css|csv|html|ini|js|json|jsonl|jsx|log|md|ps1|psm1|py|scss|spec|sql|toml|ts|tsx|txt|yaml|yml)$)'
