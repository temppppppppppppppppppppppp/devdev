# 무협/자하검신 장르 Few-Shot 성공 예시 뱅크
# 출처: 자하검신 ep001~ep050
# 생성일: 2026-03-17
# 상태: 초안 -- 사용자 최종 선별 후 확정
# 용도: CW 프롬프트에 positive few-shot으로 주입 (무협 장르용)

# ========================================
# 장르 DNA (CW 모방 원칙)
# ========================================
genre_dna:
  전투_묘사: "의성어+신체 반응+내공 운용을 삼위일체로 구성. '파앙-!' 같은 효과음 후 결과 묘사. 초식명은 한자 병기."
  회귀자_시선: "현재 상황을 전생 경험과 대비하여 독백. '전생에서는 ~했지' 식의 내면 서술로 정보 전달."
  사제_관계: "경어와 반말의 혼용으로 친밀도 표현. 사형은 부드럽게, 주인공은 건방지게. 전음(傳音)으로 속내 교환."
  긴장_이완: "전투/음모 장면 직후 음식이나 일상 장면으로 전환. '참새 튀겨 먹으면 좋지' 같은 유머."
  한자_무공: "초식명/별호/지명에 한자 병기 필수. 탈혼대법(脫魂大法), 자하검신(紫霞劍神) 등."
  짧은_호흡: "한 줄에 하나의 동작/정보. 의성어 단독 행 허용. 문단 간 공백으로 템포 조절."
  권력_역학: "장문인-장로-대사형-사형-사제의 위계가 모든 대화에 내포. 호칭 하나로 관계 드러냄."

# ========================================
# 카테고리 1: 전투 묘사
# ========================================
전투_묘사:
  - id: combat-01
    source: ep002 (2화)
    rating: "★★★"
    why: "사형제 간 생사결의 비장미. 검격 묘사와 감정선이 교차하며 '무심한 얼굴로 울었다'는 역설적 표현이 극적. 관전자 시선으로 아름다움과 비극성 동시 전달."
    text: |
      까앙!

      힘과 힘이 부딪치고, 절정이라는 말로도 설명할 수 없는 상승의 묘리가 거듭 펼쳐졌다.

      구양적이 행하는 일참(一斬)은 두 갈래 풍파를 불렀으며, 사형의 검봉에 맺힌 진기는 폭풍과 마주한 구절초(九節草)처럼 꺾임을 반복함에도 굴복하지 않았다.

      "어째선지 눈을 뗄 수가 없군."

      한데 지켜보던 부관조차 탄복하며 마음을 졸였다.

      두 사형제가 벌이는 생사결은 힘과 힘 이전에, 긴 시간 동안 쌓아 온 인연에 대한 결자해지였다.

      '이제 끝을 내야 하는데.'

      구양적은 무심한 얼굴로 울었다. 칼끝이 이리저리 흔들려 단숨에 목숨을 취할 수 있는 것을 주저했다.

  - id: combat-02
    source: ep006 (6화)
    rating: "★★★"
    why: "촌경 응용 전투. 기술적 설명이 유장명의 감탄을 통해 자연스럽게 전달. 의도적으로 흔적을 남기지 않는 전략적 전투."
    text: |
      파앙-!

      내공이 순간 일점으로 솟구치고 장절하게 그어진 직선이 자맹을 관통해, 그의 입가에서 핏물이 터져 나왔다.

      "커, 윽!"

      자맹의 고개가 푹 숙여지고, 상체를 가리던 옷이 터졌다.

      그럼에도 구양적의 주먹은 아직 복부에 닿지도 않은 상태였다.

      뒤에서 지켜보던 유장명은 작게 감탄했다.

      '촌경의 술수를 저렇게 늘려서 쓸 수 있었던가!'

      촌경은 발경법의 하나로, 짧은 움직임으로도 피부를 뚫고 내부에까지 충격을 주는 술수였다.

      하지만 구양적은 촌경을 다르게 사용했다.

      자맹에게 직접 닿기도 전에, 작게 응축한 내공을 선학장의 형태로 쏘아 낸 것이다.

  - id: combat-03
    source: ep013 (13화)
    rating: "★★★"
    why: "검기 발현 장면. 양지현의 칠상권 vs 구양적의 자하진기 검기 충돌. '반탄력으로 되돌렸다'는 기술적 디테일과 경지 차이 표현이 탁월."
    text: |
      구양적은 어금니를 앙다물며, 자하진기를 검으로 흘려보냈다.

      스스슷…….

      검면 위로 자그맣게 흐르는 보라색 자하진기.

      자하진기는 흐르는 것으로 끝나지 않고 칼날 위로 새로운 날을 돋웠다.

      "……!"

      "맙소사."

      가만히 지켜보고 있던 현검진인과 무당파의 원로들이 벌떡 일어났다.

      파앙!

      양지현은 몸이 뒤로 밀려나는 듯한 감각에 휩싸였다.

      거기에 부닥친 칠상권은 힘을 잃었다. 오히려 반탄력을 가지고 시전자를 밀어내기까지 했다.

  - id: combat-04
    source: ep022 (22화)
    rating: "★★"
    why: "하진악의 천류화운검 절초 묘사. 열기 기반 검법의 독특한 표현. 다수 적의 합격진을 일격으로 무력화하는 장면."
    text: |
      "……천류백열(天流白熱)."

      천류화운검의 절초가 펼쳐짐과 무섭게 여섯 검객이 펼친 검법이 검로를 잃었다.

      아니, 녹아내렸다고 하는 게 정확했다.

      하진악을 향해 치달아 가던 검로가 일거에 무너져 내렸다.

      공기가 매우 뜨겁게 데워져, 도저히 검을 휘두를 수 없을 만큼 비대해져 버렸기 때문이다.

  - id: combat-05
    source: ep050 (50화)
    rating: "★★★"
    why: "유장명의 각성 전투. 매화검법 연속 초식 나열로 절정의 미학. '매화만리향'이라는 절초명의 시적 아름다움과 감정 폭발의 조화."
    text: |
      "매영조하(梅影造河)."

      매화가 만든 그림자가 강을 만들어, 선이 이대제자에게 침습함을 막고.

      "매향성류(梅香成流)."

      매화에서 발해진 향기가 물결을 이룬다.

      하나하나가 유장명이 빚어낸 검기, 서로를 맞무는 조화.

      유장명의 검이 춤을 춘다.

      "매인설한(梅忍雪寒)."

      맞물린 매화가 서로 얽혀 일대 장관을 이루고, 눈의 차가움마저 견딜 만큼 단단해진다.

      끝내, 철금산이 펼친 절기는 끈 떨어진 연처럼 바닥에 뒹굴었다.

# ========================================
# 카테고리 2: 경지 돌파/수련
# ========================================
경지_돌파_수련:
  - id: cult-01
    source: ep003 (3화)
    rating: "★★★"
    why: "반년 수련 성과를 거목 격파로 시각화. 의기상인/일류무인 경지 설명을 호사가의 말로 자연스럽게 전달. 다른 문파 수련법 나열로 세계관 확장."
    text: |
      파앙-!

      바람을 밀어 치고 뻗어진 주먹은 목심(木心)을 꿰뚫고 내부를 관통했다.

      "역시 무리였나."

      그야말로 완벽한 일초였는데, 구양적이 아쉽다는 웃음을 머금은 그때.

      콰직, 꽈지지직……!

      점차 거목이 기울어지더니.

      콰콰쾅!

      팔 척이 넘는 먼지구름이 부옇게 올라왔다.

      지금 펼친 일수(一手)는 적어도 육 년 뒤에나 도달할 경지였다.

      떠들기 좋아하는 호사가들은 지금의 경지를 이렇게 불렀다.

      의기상인(意氣傷人).

      혹은 일류무인(一流武人).

  - id: cult-02
    source: ep030 (30화)
    rating: "★★"
    why: "절정 경지에 대한 심층 설명. 두 가지 돌파 경로(내공 확대 vs 깨달음)를 대화로 전달. '쾌와 중'이라는 구양적의 무학 철학 노출."
    text: |
      절정에 다다르기까지 크게 두 가지 방법이 있다.

      막대한 내공으로 소주천을 하여, 단전이라는 흐름을 임독양맥으로 확대시키는 것.

      그리고 순수한 깨달음으로 초식의 경계를 넓히는 일이었다.

      대부분은 전자의 방법을 택했다.

      깨달음이란 유장명의 말마따나 가히 우연찮게 찾아오거나 수없이 쌓아 온 수련으로 인해 오는 법이니까.

      '하지만…… 무림에 이름을 남긴 고수는 늘 깨달음으로 절정이 되었다고들 하지.'

# ========================================
# 카테고리 3: 사제/문파 관계
# ========================================
사제_문파_관계:
  - id: sect-01
    source: ep002 (2화)
    rating: "★★★"
    why: "화산파 부흥 의지 선언. '사형제끼리 서로 죽일 일은 없는 문파'라는 선언이 전생 비극과 대비되어 감동적. 목검을 땅에 꽂는 시각적 연출."
    text: |
      "전 무림을 호령하는 화산. 적어도 그 정도는 되어야 하지 않겠습니까."

      "……!"

      푸욱!

      구양적은 젖은 땅에 목검을 꽂아 넣으며 재언(再言)했다.

      "적어도 사형제들끼리 서로 죽일 일은 없는 문파. 아니, 누구도 건드릴 수 없는 대도무문(大道武門)으로 거듭나게 할 겁니다."

      그 말을 하면서 구양적은 무너진 암자를 보며 피식 웃었다.

      "앞으로 갈 길이 멀었지만요."

  - id: sect-02
    source: ep008 (8화)
    rating: "★★"
    why: "조훈과의 사형제 관계. 조훈이 벌 대신 받겠다고 나서는 장면으로 사제 간 유대 표현. 장문인의 감동과 구양적의 당황이 대비."
    text: |
      "사형은 저 때문에, 저를 위해서 그러신 거잖아요."

      구양적은 피식 웃었다.

      "뭐, 틀린 말은 아니다만. 설마 그래서 너도 죄를 나눠 지겠다는 거냐?"

      "아, 안 되나요?"

      "착각하지 마라. 내가 내키는 대로 행동한 것뿐이야."

  - id: sect-03
    source: ep017 (17화)
    rating: "★★★"
    why: "하진악과의 첫 대면. 대사형의 냉정한 평가와 구양적의 건방진 자신감이 팽팽한 긴장감 생성. 전음을 통한 이면 대화 기법."
    text: |
      "내가 들은 이야기에 따르면, 사제는 분명 재능이 있고 나이에 비해 무학 수준이 뛰어난 사람이라지?"

      "적어도 제 나이대에선, 저를 이길 자가 없다고 생각합니다."

      "……대단한 자신감이군."

      그렇게 말하는 하진악의 얼굴에는 딱히 비꼬는 기색이 없었다.

      오히려 살짝 고개를 끄덕이며 구양적이 가진 강함을 인정해 주었다.

      "적어도 오만은 아닌 것 같구나."

# ========================================
# 카테고리 4: 음모/암투
# ========================================
음모_암투:
  - id: scheme-01
    source: ep019 (19화)
    rating: "★★★"
    why: "요안의 남자(흑막) 첫 등장. 나비가 타죽는 묘사로 공포감 극대화. 백운환이 비굴해지는 모습으로 위계 표현. '심장이 정지했다'는 극단적 위압."
    text: |
      어둠 속에서 한 쌍의 안광이 떠올랐다.

      그것이 가히 요안(妖眼)에 가까운 것이라, 있는 힘껏 날갯짓하던 나비조차도 그 인력(引力)을 이기지 못해 꺼꾸러졌다.

      풀썩, 치지지직.

      그렇게 떨어진 나비는 허공에 별안간 나타난 잿불에 지져져, 한 차례 푸들대다가 죽었다.

      "내 인내심은 그다지 신뢰할 게 못 되는데 말이야."

      놀랍게도, 강북의 사도패주(邪道覇主)라 불리는 흑룡방주 백운환이 비굴한 표정을 짓고 있었다.

  - id: scheme-02
    source: ep005 (5화)
    rating: "★★"
    why: "금환상회 횡령 추궁. 장부를 뒤지며 주판질하는 구양적과 떠는 회주의 대비. 전음으로 사형과 전략 조율하는 이중 대화."
    text: |
      "열 냥에 삼 전, 차익이 넉 냥."

      따악, 딱.

      열 손가락으로 주판을 사정없이 긁어 대면서 셈하는 것도 모자라, 순식간에 계산을 마치는 저 계산력.

      화산파의 누구도 건드릴 생각도 못 했던 금환상회의 목을 단숨에 쳐 버린 결단력.

      "잘도 많이 빼먹었군?"

      마치 모든 걸 알고 왔다는 듯.

      구양적의 웃음도 날카롭기 그지없어, 회주를 서늘하게 만들기 충분했다.

# ========================================
# 카테고리 5: 화 도입부
# ========================================
화_도입부:
  - id: open-01
    source: ep001 (1화)
    rating: "★★★"
    why: "첫 화 오프닝. 대천수라와의 최후 결전으로 시작. 대화 먼저, 설명은 최소화. 독자를 즉시 전투 한가운데 투입하는 인 메디아스 레스(in medias res) 기법."
    text: |
      "대업이 얼마 남지 않았거늘, 이제 와서 불복하는 이유가 무어냐?"

      마종(魔種), 혹은 대천수라(戴天修羅)라 불리는 존재가 눈을 부릅떴다.

      그는 이해하지 못할 것이다.

      구양적(歐陽適)이라는 무인을.

      구양적이 어떤 마음으로 자신에게 홀로 맞서려 드는지를, 절대 알지 못한다.

      구양적은 한눈에도 비범해 보이는 검을 움켜쥔 채 빙긋 웃었다.

      "당연히 당신들이 마음에 들지 않아서가 아니겠어?"

  - id: open-02
    source: ep003 (3화)
    rating: "★★"
    why: "시간 점프 도입부. '반년 뒤'로 시작해 수련 결과를 바로 보여줌. 호흡-집중-일격 패턴."
    text: |
      반년 뒤, 화산과 인접한 산.

      "……후우."

      숨을 한 차례 내쉰 구양적은 오성(五成) 공력을 주먹에 담았다.

      그 앞에는 감히 올려다보기조차 힘든 거목이 서 있었다.

  - id: open-03
    source: ep011 (11화)
    rating: "★★★"
    why: "악역 시점 도입. 흑룡방 소속 섬서삼악의 잔혹한 장면으로 시작. 긴장감과 위기감 극대화. 종남파 제자의 고통 묘사가 생생."
    text: |
      "……화산파의 참가자는?"

      "아직 하산하지 않았다고 합니다."

      "헤헤, 미리 거기서 기다리고 있으면 안 될까? 형님들?"

      그곳에서 흑룡방(黑龍幇) 소속의 무인 셋이 폐건물 안에서 대기하고 있었다.

      아니, 정확하게는 한 명이 더 있었다.

      "너, 너희들…… 대종남파의 제자에게 감히!"

  - id: open-04
    source: ep016 (16화)
    rating: "★★"
    why: "대사형 귀환 도입. 함성으로 시작해 인물의 위상을 한 줄로 보여줌. '차후 장문인이 될 남자'라는 서술이 복선."
    text: |
      저벅, 저벅.

      푸른빛이 감도는 검은 머리칼이 인상적인 남자가 화산파에 들어선 순간.

      "대사형을 뵙습니다!"

      우레와 같은 함성이 젊은 도인에게서 퍼져 나왔다.

# ========================================
# 카테고리 6: 클리프행어
# ========================================
클리프행어:
  - id: cliff-01
    source: ep001 (1화)
    rating: "★★★"
    why: "회귀 직후 비무 제안. 사형의 의심과 호기심이 만나는 지점에서 끊음."
    text: |
      "간만에 비무나 한번 하자."

      그 말에 구양적이 짙은 미소를 지었다.

  - id: cliff-02
    source: ep007 (7화)
    rating: "★★★"
    why: "구룡대전 배첩 등장. 백단현의 분노와 새로운 이벤트 동시 제시."
    text: |
      "당장 이리로 불러들이거라!"

      그의 책상 위에 정중한 서체로 쓰인 배첩이 올려져 있었다.

      -구룡대전(九龍對戰) 참여 요망(參與要望).

  - id: cliff-03
    source: ep020 (20화)
    rating: "★★★"
    why: "하진악 부상 암시. '섬뜩한 소리'라는 청각 클리프행어. 무슨 일인지 모르는 상태로 끊어 궁금증 극대화."
    text: |
      구양적이 고개를 갸우뚱거린 그때.

      푸욱!

      섬뜩한 소리가 울려 퍼졌다.

# ========================================
# 카테고리 7: 정보 전달
# ========================================
정보_전달:
  - id: info-01
    source: ep003 (3화)
    rating: "★★★"
    why: "다른 문파 수련법을 구양적의 경험으로 자연스럽게 설명. 소림 표주박 수련, 하북팽가 일만번 휘두르기 등. 설명이 아니라 '해봤다'는 체험으로 전달."
    text: |
      소림처럼 뾰족한 표주박으로 우물에서 물 떠오기라든가, 하북팽가의 하루 일만 번 휘두르기 같은 수련법이었다.

      뾰족한 표주박으로 물을 뜨는 것까진 누구나 할 수 있다. 하지만 단 한 방울도 들리지 않으려면 자세가 흐트러져서도, 쉬어서도 안 됐다.

      하북팽가의 일만 번?

      설렁설렁 휘두르면 두 시진 안에도 끝낼 수 있었다.

      그러나 하북팽가가 그런 수련법을 시키는 까닭은 따로 있었다.

      도 빼고 아무것도 보이지 않는 망 아(忘我) 상태에서 자신의 한계를 느끼고, 무공에 대한 진지함과 치열함을 느끼라는 취지였다.

  - id: info-02
    source: ep009 (9화)
    rating: "★★"
    why: "계율원의 역할 설명. 표주를 나간 도인을 감시하는 시스템을 송묵의 사고 과정으로 전달. 사파와 정파의 차이도 함께 설명."
    text: |
      표주를 나간 도인의 행적을 주도면밀하게 분석하여, 장문인에게 직접 보고하는 것.

      머리가 좋아야 하는 건 당연한 일이고, 무력 또한 누구에게도 꿀리지 않을 만큼 강해야 했다.

      때문에 계율원은 다른 전당(殿堂)보다 큰 목소리를 낼 수 있었다.

  - id: info-03
    source: ep012 (12화)
    rating: "★★"
    why: "구룡대전의 성격과 정치적 의미 설명. 현검진인의 관점에서 대문파-중소문파 관계를 자연스럽게 전달."
    text: |
      적어도 서로 아군이라는 모습을 보여 줄 필요가 있었다.

      그래서 만들어진 것이 구룡대전.

      아홉의 용이 서로 뒤엉키며 우열을 가리듯, 대문파와 중소문파 가릴 것 없이 경합하는 행사였다.

# ========================================
# TASK 2: NPC 대화 패턴
# ========================================
npc_dialogue_patterns:

  사부_장로:
    archetype: "사부/장로 (백단현, 송묵, 곽운패)"
    speech_pattern: |
      - 경어 미사용, 하대어 사용 (~거라, ~느냐, ~하거라)
      - 감정 표현이 직접적 (분노: "이놈!", 감동: 눈물)
      - 수염 매만지기, 헛기침 등 습관 동작
      - 훈계 시 도가적 명언 인용
      - 제자 호칭: 이름 직호 또는 "적아", "진악아"
    examples:
      - source: ep001
        text: "네 이놈, 구양적! 평소 친 사고로도 모자라 이제는 네 사형과 주먹다짐을 하고 있었느냐!"
      - source: ep004
        text: "네가 상계의 일을 알기나 하느냐? 그리고 강호행이라니. 네 실력으로 나갔다가는 산적에게도 목숨을 잃을 게다."
      - source: ep008
        text: "사형제 간에 그런 일이 있었을 줄이야. 어쩐지! 나가기 전에 조훈의 이야기를 하더니만!"
      - source: ep009
        text: "흘흘, 이 나이쯤 되면 심술밖에 늘지 않는다네."
      - source: ep016 (곽운패)
        text: "이놈! 어디 감히 어른을 놀리려 드느냐!"

  주인공_구양적:
    archetype: "주인공 (회귀자/혈견 유형)"
    speech_pattern: |
      - 장로/사형에게는 존대하나 건방진 뉘앙스 (~습니다만, ~지 않습니까)
      - 적에게는 반말+욕설 (시발, 대가리, 병신)
      - 전음 시 더 솔직하고 직설적
      - 자조적 유머 (자기 비하 + 상황 비꼼)
      - 핵심을 먼저 말하고 설명은 나중에
    examples:
      - source: ep002
        text: "적어도 사형제들끼리 서로 죽일 일은 없는 문파. 아니, 누구도 건드릴 수 없는 대도무문(大道武門)으로 거듭나게 할 겁니다."
      - source: ep004
        text: "다른 건 몰라도 실력으로 꿀리지 않을 자신은 있습니다."
      - source: ep011
        text: "어머니 뱃속부터 꿰뚫어 봤다고 할까?"
      - source: ep021
        text: "너…… 이런 시발 새끼."
      - source: ep040
        text: "일반 양민들은 적이 아니었나 봐?"

  적대_고수:
    archetype: "적대 고수 (대천수라, 투광, 백청일)"
    speech_pattern: |
      - 상대를 깔보는 어투 (본좌, ~하거늘)
      - 위압적 단문 (끝이다, 살!)
      - 패배 임박 시 경악+감탄 혼재
      - 사파 무인은 더 구어체적 (~냐, ~마)
    examples:
      - source: ep001 (대천수라)
        text: "가능하면 끝까지 같은 편으로 남고 싶었건만."
      - source: ep021 (투광)
        text: "네놈은 대체 무엇이냐?"
      - source: ep040 (백청일)
        text: "이봐, 아무리 도인이라지만 모든 목숨의 가치가 같다고 말하진 않겠지?"
      - source: ep040 (백청일)
        text: "나는 네가 재미있는 놈이라 해 줬는데, 너는 나를 미친놈이라 말하는구나."

  동문_사형제:
    archetype: "동문/사형제 (유장명, 조훈)"
    speech_pattern: |
      - 유장명: 부드러운 경어 + 도가적 어투 (~거라, ~아니더냐). 화나면 조목조목 논리적으로 압박.
      - 조훈: 존대+어린이 말투 (~요, ~에요). 순수하고 감탄사 多.
    examples:
      - source: ep001 (유장명)
        text: "하하, 그래. 오늘따라 유독 조용하니 걱정이 되어서 와 보았다."
      - source: ep015 (유장명)
        text: "그저 여기 참석한 후기지수들이 구양 사제보다 무공의 재능이 없었을 뿐입니다."
      - source: ep003 (조훈)
        text: "구양 사형, 정말 대단하세요!"
      - source: ep008 (조훈)
        text: "사형은 저 때문에, 저를 위해서 그러신 거잖아요."

  문파_장문인:
    archetype: "문파 장문인/진인 (백단현, 현검진인)"
    speech_pattern: |
      - 공식석상: 격식 있는 한문 어투
      - 사적 자리: 감정 노출 허용 (울기도 함)
      - 결정 시: "내 ~하마", "~하거라" 식 선포
    examples:
      - source: ep004 (백단현)
        text: "좋다! 내 너희의 외출을 허하마!"
      - source: ep012 (현검진인)
        text: "개전(開戰)하라!"
      - source: ep045 (백단현)
        text: "아무리 사적인 자리라고 한들, 목적이 공적이지 않느냐. 호칭을 바로 하거라."

  정파_사파_인사:
    archetype: "정파/사파 인사 (형우, 철금산, 양지현)"
    speech_pattern: |
      - 정파 중소문파: 체면 중시, 격식 차림 (~하오, 본인)
      - 사파: 직설적, 저속한 표현도 사용 (~냐, 죽여 버리겠다)
      - 양지현(공동파): 어색한 공대 + 투지
    examples:
      - source: ep012 (양지현)
        text: "나는 공동파의 양지현(梁至賢)이라고 하네."
      - source: ep015 (형우)
        text: "저자에게 발목이 부러진 정락의 사부, 건현문에 속한 형오라고 하오!"
      - source: ep050 (철금산)
        text: "진악이가 병석에 누우니 어디 여우가 호랑이 노릇을 하려고 드는구나."

  여성_캐릭터:
    archetype: "여성 캐릭터"
    speech_pattern: |
      - ep001~050 범위 내 주요 여성 캐릭터 부재.
      - 바보의 어머니, 백천의 아내 등 간접 언급만 존재.
      - 40-50대 남성 독자 타겟의 무협물 특성상 여성 비중 극히 낮음.
    examples: []

# ========================================
# TASK 3: 클리프행어 분석 (ep001~ep050)
# ========================================
cliffhanger_analysis:
  - ep: 1
    last_lines: "\"간만에 비무나 한번 하자.\" / 그 말에 구양적이 짙은 미소를 지었다."
    pattern: "대결_제안"
    hook: "STRONG"
  - ep: 2
    last_lines: "'내가 왜 혈견이었는지 보여 주지.' / 구양적의 눈빛이 집념으로 가득해 있었다."
    pattern: "각오_선언"
    hook: "MEDIUM"
  - ep: 3
    last_lines: "뒤늦게 조훈이 소리를 질러 봤지만, 구양적의 신형은 흔적도 없이 사라져 있었다."
    pattern: "갑작스런_퇴장"
    hook: "MEDIUM"
  - ep: 4
    last_lines: "구양적에게 혈견이라 불리게 만들었던 진득한 미소가 감돌기 시작했다."
    pattern: "위험한_미소"
    hook: "STRONG"
  - ep: 5
    last_lines: "구양적의 주먹에 어찌나 큰 힘이 들어갔던지, 피부가 하얗게 질릴 정도였다."
    pattern: "전투_임박"
    hook: "STRONG"
  - ep: 6
    last_lines: "\"그쪽도 괜한 연기는 그만두시지요.\" / 움찔. / 그것으로 회주의 운명은 정해졌다."
    pattern: "운명_선고"
    hook: "MEDIUM"
  - ep: 7
    last_lines: "\"당장 이리로 불러들이거라!\" / 배첩: 구룡대전(九龍對戰) 참여 요망."
    pattern: "새_이벤트_등장"
    hook: "STRONG"
  - ep: 8
    last_lines: "피잉! / 날카로운 소리가 계율원 안쪽에서부터 울려 퍼진다."
    pattern: "기습/위기"
    hook: "STRONG"
  - ep: 9
    last_lines: "\"제가 꼭 가겠습니다!\" / 참현을 떠올리니 손에 쥔 칼이 목검처럼 느껴질 지경이었다."
    pattern: "목표_확정"
    hook: "MEDIUM"
  - ep: 10
    last_lines: "\"너, 뭐 하는 놈이냐?\""
    pattern: "새_인물_조우"
    hook: "STRONG"
  - ep: 11
    last_lines: "\"우승은 쉽겠군.\" / 구양적이 나직이 흘린 말에 구룡대전의 열기가 훅 끓어올랐다."
    pattern: "도발_선언"
    hook: "STRONG"
  - ep: 12
    last_lines: "이 한마디로, 구룡대전의 서막이 열렸다."
    pattern: "이벤트_시작"
    hook: "MEDIUM"
  - ep: 13
    last_lines: "만통자. / 그 단어가 나오고부터 구양적은 계속 얼어붙어, 현검진인이 하는 말을 제대로 들을 수 없었다."
    pattern: "과거_연결_충격"
    hook: "STRONG"
  - ep: 14
    last_lines: "\"다음.\""
    pattern: "초단문_여운"
    hook: "MEDIUM"
  - ep: 15
    last_lines: "건현문의 형우 외 세 명, 섬서이악에게 살해당함. / 금환상회주 백천, 저(著)."
    pattern: "비보_도착"
    hook: "STRONG"
  - ep: 16
    last_lines: "화운적하검(火雲赤霞劍) 하진악. / 그가 구양적 앞에 있었다. / 전생에선 돌아오지 않았었던, 지금 이 시점에서."
    pattern: "운명_변경_복선"
    hook: "STRONG"
  - ep: 17
    last_lines: "\"바쁘시지 않다면 지금 여기서 증명해 보이겠습니다.\""
    pattern: "대결_제안"
    hook: "STRONG"
  - ep: 18
    last_lines: "\"지금 당장 그들을 구출해야 합니다!\" / 구양적의 시선이 하진악에게 못 박힌 듯 움직이지 못했다."
    pattern: "긴급_위기"
    hook: "STRONG"
  - ep: 19
    last_lines: "구양적은 곧바로 복면인에게 달려들었다. / 그의 손에는 어느새 마시고 있던 찻잔이 들려 있었다."
    pattern: "기습_전투_시작"
    hook: "STRONG"
  - ep: 20
    last_lines: "푸욱! / 섬뜩한 소리가 울려 퍼졌다."
    pattern: "청각_충격"
    hook: "STRONG"
  - ep: 21
    last_lines: "\"니들 다, 뒈졌어.\" / 참현이 뽑혀짐과 동시에 자하진기의 검기가 덧씌워지기 시작했다."
    pattern: "반격_시작"
    hook: "STRONG"
  - ep: 22
    last_lines: "쿠콰콰콰콰쾅-! / 이변이 일어났다."
    pattern: "폭발/이변"
    hook: "STRONG"
  - ep: 25
    last_lines: "구양적의 시선이 웃고 있는 하진악을 바라보다, 씁쓸히 숙여졌다."
    pattern: "감정_여운"
    hook: "MEDIUM"
  - ep: 30
    last_lines: "매화의원으로 향하는 길에 인기척이 흘렀다."
    pattern: "미지_인물_접근"
    hook: "MEDIUM"
  - ep: 35
    last_lines: "\"나는 바보예요.\" / \"그래도 날 버리지 말아 줘요.\" / 한 줄기 눈물이 뺨을 타고 흘렀다."
    pattern: "감정_여운"
    hook: "MEDIUM"
  - ep: 40
    last_lines: "백청일의 얼굴 위로 여러 감정이 뒤섞였다."
    pattern: "반응_미완"
    hook: "STRONG"
  - ep: 45
    last_lines: "천둔(天遁). / 도를 닦던 여동빈이 화룡진인에게 배웠다던 검법의 이름이었다."
    pattern: "보물_발견"
    hook: "STRONG"
  - ep: 50
    last_lines: "점차 땅거미가 지는 석양 속. / 한 인마가 옅은 흙먼지를 만들며 화산으로 가는 길을 주파하고 있었다."
    pattern: "귀환_질주"
    hook: "MEDIUM"

# ========================================
# TASK 3 요약: 클리프행어 패턴 분류
# ========================================
cliffhanger_pattern_summary:
  전투_임박_또는_시작: "ep5, ep8, ep11, ep17, ep19, ep21 -- 가장 빈번. 전투 직전 또는 첫 일격에서 끊음."
  비보_충격_이변: "ep13, ep15, ep20, ep22 -- 예상 못한 사건 발생. 효과음(푸욱, 쿠콰쾅)으로 끊기도."
  새_인물_이벤트: "ep7, ep10, ep16, ep30 -- 새 인물 등장 또는 새 이벤트 제시."
  감정_여운: "ep2, ep25, ep35, ep50 -- 전투 후 또는 감정적 장면의 여운. 상대적으로 MEDIUM."
  각오_선언_도발: "ep1, ep4, ep9, ep14 -- 주인공의 결의 또는 도발로 마무리."
  훅_강도_통계: "STRONG 약 65%, MEDIUM 약 35%. 전투/위기 기반 STRONG이 압도적."

# ========================================
# TASK 4: 화 간 연결 패턴 (주요 전환)
# ========================================
episode_connection_patterns:
  - transition: "ep01→ep02"
    connection_type: "직접_연속"
    time_gap: "없음 (비무 직후)"
    carryover: "유장명과의 비무 → 전생 회상 삽입 후 현재 비무 재개"

  - transition: "ep02→ep03"
    connection_type: "시간_점프"
    time_gap: "반년"
    carryover: "면벽 결과 → 수련 성과 보여줌. 구양적의 성장이 연결고리."

  - transition: "ep03→ep04"
    connection_type: "직접_연속"
    time_gap: "같은 날"
    carryover: "조훈 만남 → 장문인 면담. 문파 재정 의심이 연결고리."

  - transition: "ep04→ep05"
    connection_type: "직접_연속"
    time_gap: "수 시간"
    carryover: "외출 허가 → 금환상회 도착. 백천 합류."

  - transition: "ep05→ep06"
    connection_type: "직접_연속"
    time_gap: "없음"
    carryover: "자맹 전투 → 처리. 금환상회 건이 한 덩어리 아크."

  - transition: "ep07→ep08"
    connection_type: "직접_연속"
    time_gap: "수 시간"
    carryover: "화산 귀환 → 백단현 질책 → 계율원주 송묵 등장."

  - transition: "ep09→ep10"
    connection_type: "직접_연속"
    time_gap: "없음"
    carryover: "송묵과 대련 → 참현 소식 → 구룡대전 결정."

  - transition: "ep10→ep11"
    connection_type: "시점_전환"
    time_gap: "2시간 역행"
    carryover: "구양적 시점 → 섬서삼악(적) 시점. 같은 시간대를 다른 각도로."

  - transition: "ep11→ep12"
    connection_type: "직접_연속"
    time_gap: "없음"
    carryover: "두절광 처리 → 구룡대전 도착. 소문이 연결고리."

  - transition: "ep15→ep16"
    connection_type: "시간_점프"
    time_gap: "며칠"
    carryover: "구룡대전 종료 → 화산 귀환. 비보가 다음 아크 트리거."

  - transition: "ep16→ep17"
    connection_type: "직접_연속"
    time_gap: "없음"
    carryover: "하진악 귀환 → 구양적 면담. 새 아크(흑룡방) 시작."

  - transition: "ep19→ep20"
    connection_type: "직접_연속"
    time_gap: "없음"
    carryover: "하산 → 습격 시작. 전투 아크가 ep19~25까지 연속."

  - transition: "ep25→ep26"
    connection_type: "직접_연속"
    time_gap: "수 시간"
    carryover: "전투 종료 → 귀환 행렬. 하진악 생사 → 매화동 아크."

  - transition: "ep30→ep35"
    connection_type: "시간_점프"
    time_gap: "수일~수주"
    carryover: "화산 내 수련/회복 → 장안 잠입 아크. 흑룡방 추적."

  - transition: "ep40→ep45"
    connection_type: "시간_점프"
    time_gap: "수주"
    carryover: "백청일 전투 → 화산 복귀 → 종남파 침투. 개방 문제 부상."

  - transition: "ep45→ep50"
    connection_type: "시간_점프"
    time_gap: "수일"
    carryover: "종남파 잠입 → 화산 위기(철금산). 유장명 각성 아크."

# ========================================
# TASK 4 요약: 연결 패턴 분류
# ========================================
connection_pattern_summary:
  직접_연속: "전체의 약 60%. 전투 아크 내에서 특히 밀집. 시간 간격 없이 장면 이어짐."
  시간_점프: "약 25%. '반년 뒤', '며칠 뒤', '열흘째' 등 수련/이동 기간 생략."
  시점_전환: "약 15%. 적 시점(흑룡방, 섬서삼악)으로 전환해 위기감 조성. ep10~11, ep18~19 등."
  연결_장치: |
    - 전서구/비보: 아크 전환 트리거 (ep15, ep21)
    - 소문: 평판 변화로 다음 사건 연결 (ep7, ep11)
    - 인물 등장/귀환: 새 아크 시작 신호 (ep16 하진악, ep40 백청일)
    - 수련 결과: 시간 점프 후 첫 장면에서 성장 보여줌 (ep3, ep30)
