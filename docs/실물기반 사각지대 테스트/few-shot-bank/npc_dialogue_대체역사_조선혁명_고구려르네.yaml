# NPC 대사 뱅크 -- 대체역사 장르
# 소스: 조선혁명군주 (50화), 고구려 르네상스 (50화)
# 총 7개 아키타입, 양 작품 캐릭터 교차 수록

왕_황제:
  characters:
    - name: "순원왕후 김씨"
      source: "조선혁명군주"
      speech_pattern: "위엄과 냉철함을 갖춘 존대 궁중어체. 차디찬 시선과 단호한 어투로 상대를 압도하며, 비웃음이나 경고를 은근히 섞는다. 짧고 간결한 질문으로 상대를 시험하고, 찻잔을 들거나 시선을 거두는 등 비언어적 행동으로 심리전을 구사한다."
      examples:
        - episode: "ep001"
          line: "이름이 원범이라지?"
        - episode: "ep001"
          line: "네 아비도, 그리고 너조차도 서자라는 것이 참으로 기구하구나."
        - episode: "ep001"
          line: "임금이 되고 싶으냐?"
        - episode: "ep001"
          line: "오늘 내가 너를 선택하면 너는 내 아들이 될 것이고, 그렇지 않다면 너를 낳아 준 어미가 있는 강화도로 너를 돌려보낼 것이다."
        - episode: "ep010"
          line: "우리 대의 은원은 우리 대에서 끝내십시다, 주상."

    - name: "태왕 (이대호/고선지)"
      source: "고구려 르네상스"
      speech_pattern: "즉위 후의 태왕 모드. 반말과 존대를 자유자재로 오가며, 유머와 위엄을 동시에 구사한다. 번왕들에게는 자애로운 척하면서도 불충에 대해 단호하게 꼬집고, 격식을 파격적으로 깨는 호탕한 언변이 특징이다."
      examples:
        - episode: "ep001"
          line: "짧게 하지, 짧게. 대막리지! 그냥 충성 맹세 받고 만세 외치면 끝나는 것 아닌가?"
        - episode: "ep001"
          line: "짐이 분명 번왕들에게 우리말을 배워두라고 한 것 같은데......? 갈마덕! 자네도 우리말을 할 줄 모르나?"
        - episode: "ep001"
          line: "번왕들이 짐의 말을 귓등으로도 듣지 않는 이깟 사소한 일이 무슨 큰일이라도 된다고. 벌써 훌훌 털어 버렸네."
        - episode: "ep001"
          line: "아무래도 흉금을 터놓고 이야기를 나누려면 황궁보다는 탁 트인 곳이 좋겠어. 정확히 일각 후에 유격훈련장에서 보는 것으로 하지."

주인공_회귀자_빙의자:
  characters:
    - name: "이원범/철종"
      source: "조선혁명군주"
      speech_pattern: "현대인(40대 가장)이 조선 왕의 몸에 빙의한 캐릭터. 사적인 대화에서는 현대적 반말과 속마음 독백을 쓰고, 공적 자리에서는 위엄 있는 왕의 어투를 구사한다. 봉이(미현)에게는 다정하고 약속을 강조하며, 신하들에게는 전략적으로 약한 척하거나 단호하게 돌변한다. 내면 독백에서 역사 지식을 활용한 계산이 드러난다."
      examples:
        - episode: "ep001"
          line: "봉이야. 지금부터 내가 하는 말을 잘 들어야 해."
        - episode: "ep001"
          line: "봉아, 지금 널 데리고 가면 네가 위험해져. 5년만 기다려줘. 5년 뒤에 널 데리러 올게."
        - episode: "ep001"
          line: "저는 강화도로 돌아가고 싶습니다."
        - episode: "ep003"
          line: "나는 백성의 나라를 세울 것이다. 이씨, 김씨, 조씨의 나라가 아닌 백성의 나라."
        - episode: "ep011"
          line: "성리학을 버려서 이 나라 조선의 근간인 백성을 살릴 수 있다면 나는 백번이고 성리학을 버릴 것이다."

    - name: "이대호/고선지"
      source: "고구려 르네상스"
      speech_pattern: "현대 20대 청년(군사과학연구소 연구원)이 8세기 고선지 장군 몸에 빙의. 독백에서는 완전한 현대 구어체와 덕후 감성을 드러내고, 대외적으로는 상황에 따라 고풍스런 어투를 사용한다. 오지랖이 강하고 틀린 것을 참지 못하며, 유머와 자기비하가 섞인 독백이 특징이다. 전략적 상황에서는 도발적이고 자신감 넘치는 말투를 구사한다."
      examples:
        - episode: "ep002"
          line: "여기 양력계수 계산이 틀렸네. 자유유동 밀도에 대한 무차원 계수부터 잘못 됐고. '버킹엄의 파이 정리'가 좀 복잡하기는 하지."
        - episode: "ep005"
          line: "이미 멸망한 고구려를 되살리지 못할 것도 없지. 이왕 이렇게 된 거 덕질의 제왕으로 남아주마!"
        - episode: "ep006"
          line: "나를 이 꼴로 만든 놈이 고작 너 따위였다는 말이지?"
        - episode: "ep008"
          line: "아버님, 각지에 흩어져 있는 유민들을 규합하고 군대를 양성하자면 군자금이 필요합니다."
        - episode: "ep010"
          line: "이 따위 허접한 전술이 통할 것이라고 보느냐!"

신하_대신:
  characters:
    - name: "신정왕후 조씨 (왕대비)"
      source: "조선혁명군주"
      speech_pattern: "노련한 정치인의 어투. 점잖은 말투 속에 날카로운 경고를 숨기며, 존대를 유지하면서도 은근히 자신의 지분을 상기시킨다. 친한 척 하는 말투와 경계의 어투를 능숙하게 오간다."
      examples:
        - episode: "ep002"
          line: "주상께서 이 늦은 시각에 저를 찾아 이 먼 곳까지 오신다는 기별을 받고 사실 좀 놀랐습니다."
        - episode: "ep002"
          line: "주상께서 제게 바라시는 게 있으신가 봅니다."
        - episode: "ep002"
          line: "이제 이 뒷방 늙은이가 좀 바빠지겠습니다."
        - episode: "ep007"
          line: "아무튼 이렇게 추상같은 주상께서 어찌 그 몇 년간을 참고 지내셨을꼬. 주상은 정말 무서운 분입니다. 허허허."
        - episode: "ep007"
          line: "항상 자중하셔야 합니다. 정치라는 게 그렇지 않습니까? 새벽이 오고 날이 밝으면 또 저녁이 오고 밤이 깊어가는......"

    - name: "김문근 (영은부원군)"
      source: "조선혁명군주"
      speech_pattern: "왕의 장인이지만 실권 없는 인물의 비굴한 말투. 형식적 충성어를 쓰면서도 속으로는 권력욕이 끓고 있으며, 원범의 회유에 속아 감정을 드러내는 모습을 보인다."
      examples:
        - episode: "ep002"
          line: "그게 무슨 말씀이신지요?"
        - episode: "ep002"
          line: "전하는 이 조선의 지존이십니다. 어찌 그런 말씀을 하십니까?"
        - episode: "ep002"
          line: "전하. 신 김문근, 전하를 위해 성심을 다할 것입니다. 지존께서 어찌 그런 말씀을 하시옵니까? 거두어 주시옵소서."
        - episode: "ep004"
          line: "괘념치 마시옵소서."
        - episode: "ep004"
          line: "전하, 종묘사직을 지키는데 어찌 사사로운 욕심을 앞세우겠습니까? 신은 금위대장으로서의 역할에 성심을 다할 것입니다."

    - name: "내각총리 조인영"
      source: "조선혁명군주"
      speech_pattern: "노련한 원로대신의 중후한 궁중어체. 격식을 차리면서도 실질적인 정책 건의를 서슴지 않으며, 반대편에 대해서는 강경하게 논박한다."
      examples:
        - episode: "ep004"
          line: "신 영중추부사 조인영 아뢰옵니다. 중전께옵서 왕후의 자리에 오르신지 벌써 세 해가 지나고 있사오나 안타깝게도 후사를 이을 왕자를 생산하지 못하셨으니 왕실의 번성과 종묘사직의 안녕을 위해 하루빨리 후궁을 들이시는 것이 맞다 사료되옵니다."
        - episode: "ep005"
          line: "전하, 신 삼정이정청 도제조 조인영 아뢰옵나이다. 어제 전하께서 이르신 바에 따라 삼정의 문란과 관련된 자들을 조사한 결과 경상우도 탐관들과 결탁한 자들이 있었사옵니다."
        - episode: "ep005"
          line: "아니, 김문근 네 이놈! 어찌 지엄한 편전에 군사를 들이는 것이냐? 정녕 역모를 저지를 셈인가?"
        - episode: "ep010"
          line: "전하, 이번 기회에 교육제도 또한 개편하시는 것이 어떠하겠습니까?"

적국_인물:
  characters:
    - name: "김좌근 (영의정)"
      source: "조선혁명군주"
      speech_pattern: "세도정치의 실질적 권력자로서 거만하고 방자한 어투. 왕에게도 훈계하듯 말하며, 위기 상황에서는 강압적으로 돌변한다. 패배 후에는 차디찬 조롱이나 체념적 허탈함을 보인다."
      examples:
        - episode: "ep005"
          line: "전하, 암행어사라니요? 어찌 의정부의 수장인 저와 상의도 없이 암행어사를 경상우도에 보내신 것이옵니까?"
        - episode: "ep005"
          line: "전하, 신은 그저 다급한 일처리로 인해 면밀한 조사가 이루어지지 않을 수 있음을 저어한 것이옵니다. 어찌 신하된 자로서 전하의 성심을 어지럽힐 수 있겠습니까? 뜻대로 하소서."
        - episode: "ep006"
          line: "부호군, 먼저 용상에 계신 전하를 아래로 뫼시어라. 이제 저 자리는 더 이상 금상의 자리가 아니니......"
        - episode: "ep006"
          line: "하하하, 주상. 저 소리가 들리시오? 바로 금위영의 군사들이외다. 이제 곧 1천의 금위영 군사들이 이곳 편전으로 몰려올 것입니다. 고작 200명의 숙위사로 그들을 막을 수 있다고 보시오?"

    - name: "마영춘"
      source: "고구려 르네상스"
      speech_pattern: "토욕혼 유민촌의 건달 두목 말투. 비릿한 미소와 함께 상대를 깔보는 조롱투가 기본이며, 열등감이 자극되면 감정조절을 못하고 폭발한다. 위협과 허세가 섞인 삼류 악역의 전형적 언변."
      examples:
        - episode: "ep006"
          line: "하하하! 그렇게 콧대 높던 촌장 댁 자제분께서 이제 아주 바보천치가 다 되었어. 내 투계장에서 돈을 잃어 주시겠다는데 나야 나쁠 게 없지."
        - episode: "ep006"
          line: "웬만하면 저 멧돼지 놈 말을 듣지 그래? 지금이라도 무릎 꿇고 사정을 하면 이번 투계는 없던 것으로 해주지."
        - episode: "ep007"
          line: "하하하! 미치기는 아주 제대로 미친 게로구나. 좋다. 그럴 리는 없겠지만 만약 네놈이 이긴다면 그리 하지."
        - episode: "ep007"
          line: "분명 저 싸움닭의 날개에 겨자 가루를 묻혀 둔 것이 틀림없어!"
        - episode: "ep009"
          line: "어떻게 절도사까지 데려다 놓고 망신을 당할 기특한 생각을 하셨을까?"

    - name: "이홍장 (청나라 북로군부장군)"
      source: "조선혁명군주"
      speech_pattern: "중화 상국의 오만함이 깃든 거침없는 어투. 조선을 속국으로 취급하며 일방적으로 요구를 관철하려 하고, 군사적 판단에서는 냉정하고 단호한 지휘관의 면모를 보인다."
      examples:
        - episode: "ep030"
          line: "전하, 이리 환대해 주시니 정말 감사드립니다."
        - episode: "ep030"
          line: "청은 조선의 상국입니다. 당연히 조선이 타국과 국교를 맺은 때에는 상국인 청의 허락을 받으셔야 할 텐데 지난 수년 간 조선은 서양의 양이들과 국교를 맺으면서 청의 허락을 받지 않았습니다."
        - episode: "ep040"
          line: "믿고 맡길 만한 녀석들이 없군. 일단 매매성에 머물고 있는 러시아의 규모와 의도가 파악 되는대로 지원군 병력 모두 박작성으로 간다. 서전에서 승기를 잡아야 한다."
        - episode: "ep045"
          line: "보름이면 충분하다. 우리는 안주성을 치지 않고 바로 평양성으로 간다."

무장_장수:
  characters:
    - name: "광문 (검계 수장/조선혁명군 대장)"
      source: "조선혁명군주"
      speech_pattern: "거지 출신으로 검계 수장에 오른 입지전적 인물. 백성의 입장에서 직설적이고 거칠게 말하되, 왕에게도 거침없이 책망한다. 신뢰를 얻은 뒤에는 격식을 갖춘 충성어로 전환된다."
      examples:
        - episode: "ep003"
          line: "백성들의 고혈을 쥐어짠 돈으로 김문근이나 김좌근에게 줄을 대면 손 쉽게 지방 수령 자리 하나는 얻을 수 있는 세상 아닙니까?"
        - episode: "ep003"
          line: "그럴 힘이 지금의 주상에게는 있습니까?"
        - episode: "ep003"
          line: "제가 무엇을 해 주길 원하십니까?"
        - episode: "ep006"
          line: "전하, 신 조선혁명군 대장 겸 익문사 사령 광문 아뢰옵니다. 총융청과 어영청, 훈련도감 모두 지휘부를 의금부로 압송하였습니다."

    - name: "표철주 (숙위사 부호군/근위대장)"
      source: "조선혁명군주"
      speech_pattern: "무골의 거친 말투. 예절이나 격식보다 행동을 앞세우며, 권세가에게도 주먹이 먼저 나간다. 짧고 직설적인 문장을 구사하고, 비릿한 표정과 함께 위협적인 한 마디를 던진다."
      examples:
        - episode: "ep004"
          line: "제1대대장, 준비는 다 되었는가?"
        - episode: "ep006"
          line: "영의정 김좌근을 역모혐의로 체포한다. 숙위사는 이 자를 당장 포박하여 의금부로 압송하라."
        - episode: "ep006"
          line: "이봐! 영의정 나으리. 나는 시끄러운 건 딱 질색이거든."

    - name: "고사계 장군"
      source: "고구려 르네상스"
      speech_pattern: "고구려 유민촌 촌장이자 아버지로서의 근엄한 어투. 아들에 대한 걱정과 실망, 그리고 고구려 혼에 대한 자부심이 공존한다. 짧고 묵직한 문장으로 훈계하며, 결정적 순간에는 목소리가 작아지지만 눈빛은 날카로워진다."
      examples:
        - episode: "ep005"
          line: "깨어났느냐?"
        - episode: "ep008"
          line: "우리가 비록 지금은 망국의 유민 신세이지만 네 몸 속에는 고구려의 피가 흐르고 있거늘 어찌 이리도 몸가짐을 가벼이 하는 것이냐?"
        - episode: "ep008"
          line: "모정을 느끼지 못하고 자란 것이 마음에 걸려 오냐오냐 키운 것이 불찰이었구나."
        - episode: "ep008"
          line: "목숨을 걸어야 하는 일이다. 네가 정녕 감당할 수 있겠느냐?"

    - name: "모용조"
      source: "고구려 르네상스"
      speech_pattern: "토욕혼 출신 무장의 거친 사투리 섞인 말투. '~게유', '~구만', '~수다' 등 독특한 어미를 사용하며, 투덜거리면서도 충성스럽다. 덕전이와는 앙숙 관계로 놀려대는 말투가 특징."
      examples:
        - episode: "ep035"
          line: "여기 도대체 뭐가 있다는 게유? 온통 바위랑 나무뿐이구만."
        - episode: "ep035"
          line: "이 바위 말이우? 그냥 바위 아니우?"
        - episode: "ep035"
          line: "이 바위를 가져다가 포차로 쏘아 올리기라도 하겠다는 게유? 이것을 가지고 산을 내려가는 데만도 며칠은 걸리겠수다."
        - episode: "ep025"
          line: "멧돼지 놈 주둥이가 호강했으니 질질 짤만도 하지 않겠수."

궁녀_내시:
  characters:
    - name: "철인왕후 김씨 (중전)"
      source: "조선혁명군주"
      speech_pattern: "왕에게 일방적으로 헌신하는 조용하고 공손한 궁중어체. 감정을 극도로 절제하며, 왕의 작은 관심에도 크게 감격한다. 눈동자가 떨리는 등 비언어적 감정 표현이 두드러진다."
      examples:
        - episode: "ep002"
          line: "전하, 오늘은 비가 내리기에 신첩이 따뜻한 차를 준비하였습니다."
        - episode: "ep002"
          line: "전하께서 좋아하시니 신첩도 정말 기쁩니다."

    - name: "상선 민규현 (정인복/재정부장)"
      source: "조선혁명군주"
      speech_pattern: "원범의 최측근으로 비밀을 공유하는 내시 출신 참모. 조용하고 조심스러운 어투로 보고하며, 재정 분야에서는 논리적이고 체계적인 설명을 구사한다."
      examples:
        - episode: "ep030"
          line: "일단 이홍장과 사신단 일행을 모화관으로 들게 하였습니다. 전하, 이제 어떻게 하시겠습니까?"
        - episode: "ep007"
          line: "전하, 신 재정부장 민규현 아뢰옵니다. 전하께서 하교하신 바대로 지방 관아에서 이루어지던 환곡제를 폐지하고 재정부의 재정으로 각 지방 관아마다 관영 은행을 설치하여 백성들로 하여금 춘궁기에 환곡미 대신 상평통보를 변통하여 곡식을 구매하게 하였습니다."
        - episode: "ep007"
          line: "전하, 조선의 앞날이 달린 일 아니겠습니까? 그리하여 각 부처 부장들이 매일같이 토론하여 만들어 낸 방안입니다."

평민_상인:
  characters:
    - name: "봉이/조미현 (조귀인)"
      source: "조선혁명군주"
      speech_pattern: "천민 출신의 소박하고 순수한 말투. '오라버니'라는 호칭을 사용하며 새침하면서도 애절한 감정을 직설적으로 표현한다. 궁에 들어온 뒤에도 원범과 단둘이 있을 때는 강화도 시절의 말투를 유지한다."
      examples:
        - episode: "ep001"
          line: "오라버니, 또 나무 안하고 여기서 자고 있던 거야?"
        - episode: "ep001"
          line: "오라버니, 근데 미현이가 누구야?"
        - episode: "ep001"
          line: "사실은 뭐? 똑바로 말 안하면 나 정말 화 낼 거야."
        - episode: "ep001"
          line: "오라버니, 나도 데리고 가면 안 돼?"
        - episode: "ep008"
          line: "오라버니, 무슨 생각해?"

    - name: "정덕전 (덕전)"
      source: "고구려 르네상스"
      speech_pattern: "고구려 유민 몸종의 충직하면서도 투박한 말투. '~습니다요', '~입니다요' 등 독특한 존칭 어미를 사용하며, 도련님에 대한 걱정과 충성이 모든 대사에 묻어난다. 멧돼지 같은 외모와 달리 순한 성격."
      examples:
        - episode: "ep005"
          line: "도련님, 정신이 드십니까요? 저 덕전입니다요. 저를 알아보시겠습니까요?"
        - episode: "ep006"
          line: "도련님, 괜찮으십니까요? 어디서 토욕혼 망아지 새끼들이 감히 도련님께! 어느 놈부터 모가지를 비틀어 줄까?"
        - episode: "ep006"
          line: "하루에도 수백 명이 몰려드니 아마 이곳이 구자성에서 가장 많은 돈이 오가는 곳일 것입니다요."
        - episode: "ep008"
          line: "도련님, 투계장에 이렇게 자주 발걸음하시면 소인이 곤란합니다요."
        - episode: "ep050"
          line: "뒤로 물러서는 놈은 내 직접 이 맥도로 머리를 쪼개버릴 테니까 무조건 그 자리에서 버틴다! 죽더라도 버티란 말이야!"

    - name: "을수"
      source: "고구려 르네상스"
      speech_pattern: "빚에 팔려 온 고구려 유민 소년의 비굴하면서도 순박한 말투. 감사와 눈물이 자주 섞이며, 자신 때문에 남이 피해를 입는 것을 극도로 두려워한다."
      examples:
        - episode: "ep007"
          line: "도련님, 제발 그러지 마십시오. 저 따위가 무엇이라고 저 때문에 그런 수모를 자처하십니까?"

    - name: "이항로 (유생 대표)"
      source: "조선혁명군주"
      speech_pattern: "조선 후기 대학자의 비장하고 절절한 상소 어투. 목을 내놓고 간한다는 각오가 담긴 결사적 어조로 성리학 수호를 외친다."
      examples:
        - episode: "ep011"
          line: "전하, 서원을 철폐하시다니요? 이는 이 나라 조선의 근간인 성리학을 버리시는 것이옵니다. 명을 거두어 주시옵소서."
        - episode: "ep011"
          line: "전하, 신 이항로 목을 내놓고 간하옵니다. 성리학은 이 나라 조선의 근간입니다. 성리학을 버리시면 이 나라 조선을 버리시는 것이옵니다."

    - name: "석원경"
      source: "고구려 르네상스"
      speech_pattern: "고선지의 의형제로서 격식을 차리면서도 친밀한 호칭('형님')을 쓰는 젊은 무인의 말투. 의구심이 있어도 형님에 대한 신뢰가 바탕에 깔려 있다."
      examples:
        - episode: "ep005"
          line: "형님, 축국을 하시다 기절하셨는데 충격이 꽤나 컸나 봅니다. 아우도 못 알아보시고."
        - episode: "ep009"
          line: "형님, 정말 통할까요?"
        - episode: "ep010"
          line: "형님, 정말 그것이 가능할까요?"

    - name: "흥선군 이하응"
      source: "조선혁명군주"
      speech_pattern: "상갓집 개로 위장하며 세상을 속이는 야심가의 이중적 말투. 술 취한 척하면서도 눈빛은 또렷하며, 진심을 드러낼 때는 결연한 충성 서약을 한다. 내무부장이 된 뒤에는 체계적이고 구체적인 정책 보고를 한다."
      examples:
        - episode: "ep005"
          line: "전하, 저는 그저 시서화와 술을 즐기는 한량일 뿐이옵니다. 어찌 그런 참람한 말씀을 하시옵니까?"
        - episode: "ep005"
          line: "신 이하응, 하나만 여쭙겠나이다. 정녕 저들을 상대할 수 있으시겠습니까?"
        - episode: "ep005"
          line: "신 이하응, 어찌 사사로운 욕심으로 이렇듯 모진 세월을 상갓집 개로 지내왔겠나이까? 신 이하응은 지금부터 전하를 위해 견마지로를 다할 것입니다."
