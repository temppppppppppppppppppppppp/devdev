# 대체역사 few-shot 예시 뱅크
# 분석 대상: 고려는 천조국이 되기로 하였습니다 (ep001~ep050) + 눈 떠보니 갑신정변 (ep001~ep050)
# 총 100화 분석 기반, 카테고리별 대표 장면 선별

카테고리:

  시대_묘사_의복_건축_언어:

    - grade: "★★★"
      source: "고려천조국"
      episode: 6
      excerpt: |
        태조 왕건의 고향. 동부, 서부, 남부, 북부, 중부 5개의 부(部)와 안정방, 덕산방, 법왕방, 흥국방, 앵계방 등의 35방(坊), 그리고 344개의 리(里)로 이루어진 도시. 추정 가호 15만 호(戶). 추정 인구만 해도 무려 4~60만 명에 달하는 거대 도시가 바로 상도(上都) 개경이었다.
      reason: >
        14세기 고려 수도 개경의 행정구역 수치와 인구 추산을 정확하게 나열하여
        도시 규모를 실감나게 전달한다. 수치 기반 묘사가 추상적 형용 없이도
        독자에게 개경의 거대함을 체감시키는 탁월한 예시.

    - grade: "★★★"
      source: "고려천조국"
      episode: 10
      excerpt: |
        언뜻 보아도 수천의 사람들이 무기와 갑마(甲馬), 기치, 의장물을 가지고 해안가에 늘어서 있고, 구경꾼이 담장같이 둘러서 있었다. 먼 바다에서부터 가까운 바다까지 크고 작은 배들이 서해의 섬들을 배경으로 길게 늘어섰고, 배들과 포구 사이로 작은 배들이 오갔다.
      reason: >
        고려 국제 무역항 벽란도의 풍경을 시각적으로 재현한다.
        갑마, 기치, 의장물 같은 시대 용어와 함께 '담장같이 둘러서 있었다'는
        비유가 군중의 밀도를 효과적으로 전달. 고려의 국제성이 간접적으로 드러남.

    - grade: "★★★"
      source: "갑신정변"
      episode: 5
      excerpt: |
        일렁이는 화톳불. 능허정이 보이는 길을 지나 의풍각을 지난다. 홍문관, 진선문을 넘어, 숙장문으로, 또 그곳에서 북쪽으로 움직여 희정당을 향했다. 전기와 조명이 들어오려면 약간의 시일이 남은 시기이니만큼 밤의 창덕궁은 고요했다.
      reason: >
        창덕궁 건축물 명칭(능허정, 의풍각, 홍문관, 진선문, 숙장문, 희정당)을
        동선 순서대로 나열하며 야간 궁궐의 정적과 공간감을 동시에 전달한다.
        '전기와 조명이 들어오려면'이라는 시대 표지가 자연스럽게 삽입됨.

    - grade: "★★"
      source: "갑신정변"
      episode: 19
      excerpt: |
        한지로 마감된 벽과 천장, 그리고 마찬가지로 한지로 칠한 뒤 여러 번 기름을 먹여 노랗게 변한 바닥의 모습이 눈에 들어온다. 그다음으로 자리 옆에 놓인 경상과 서안, 서안 옆으로는 아름다운 파도 물고기 무늬 필통과 포도무늬 벼루가 있다. 서안 뒤쪽으로 자리한 보료와 책가도 병풍.
      reason: >
        조선 양반가 방의 내부 구조를 실물 디테일(한지, 경상, 서안, 필통 문양,
        벼루, 보료, 책가도 병풍)로 세밀하게 묘사한다. 시각·촉각 정보가 풍부하여
        독자가 조선 말기 실내 공간을 선명하게 상상할 수 있음.

    - grade: "★★"
      source: "고려천조국"
      episode: 46
      excerpt: |
        풀을 베어다 지붕을 덮어 겨우 비바람을 막은 집은 크기도 작았으며 그 모습 또한 허술하기 그지없었다. 집의 크기는 서까래로 양쪽을 잇대어 놓은 정도에 불과했고 서까래와 기둥을 이은 줄을 제외하면 마땅히 사람의 손을 탄 곳도 없어 보였다.
      reason: >
        개경 바깥 고려 서민의 참혹한 주거 환경을 적나라하게 묘사.
        수도의 화려함과 대비되어 개혁의 필요성을 체감케 한다.
        구체적 건축 요소(서까래, 기둥, 줄)를 사용한 묘사가 리얼리즘을 강화.

  역사_분기점_장면:

    - grade: "★★★"
      source: "고려천조국"
      episode: 4
      excerpt: |
        "금일, 궐에서 역모를 발견했다." 사람들의 얼굴이 얼어붙는다. "고려가 자주국이 되어야 한다 생각하는 자는 옥좌의 좌측으로 서라. 허나 그렇지 않다 생각하는 자는 우측에 그대로 남아도 좋다."
      reason: >
        실제 역사(1356년 병신정변)를 2년 앞당겨 기철 일당을 숙청하는 핵심 분기점.
        '좌측으로 서라'는 물리적 선택이 역사적 선택을 상징하는 극적 장치.
        짧은 선언이 신하들의 공포와 긴장감을 극대화.

    - grade: "★★★"
      source: "고려천조국"
      episode: 5
      excerpt: |
        "내가 원하는 것은 이 나라 고려의 완전한 자주다. 만약 원이 그것을 방해한다면 나는 원을 배격할 것이다. 만약 왜가 그것을 방해한다면 나는 왜를 짓밟을 것이다. 만약 하늘이 그것을 방해한다면 그래, 하늘을 배격해야겠지."
      reason: >
        회귀한 공민왕의 비전이 집약된 선언. 역사적 공민왕의 소극적 개혁을
        전면적 자주 선언으로 전환하는 핵심 분기. '하늘을 배격'까지의 에스컬레이션이
        주인공의 각오와 대체역사의 스케일을 단번에 제시.

    - grade: "★★★"
      source: "갑신정변"
      episode: 3
      excerpt: |
        "꼼짝 마!" 나는 빠르게 리볼버를 꺼내며 뒤로 돌았다. 물론 총구는 병사들을 향해 있다. "역모입니다." 순간 침묵이 찾아왔다. 사방의 온도가 5도 정도는 낮아진 느낌이었다. "역모라고?!" 그것은 부르투스를 확인한 카이사르의 목소리와 같았다.
      reason: >
        갑신정변의 실행을 저지하기 위해 주인공이 반란군에서 이탈하는 결정적 순간.
        리볼버라는 실물 소품과 카이사르 비유가 시대와 감정을 동시에 압축.
        '온도가 5도 낮아진 느낌'이라는 체감 묘사가 현대인 시점의 강점.

    - grade: "★★★"
      source: "갑신정변"
      episode: 14
      excerpt: |
        콰아아아아아아아아앙- 화염의 신이 강림했다. 이명이 귀를 꿰뚫고 천지가 흔들리는 듯한 느낌이 몸을 뒤흔들었다. 나폴레옹이 포도달 13일에 벌어진 전투에서 포도탄을 쏘아 왕당파군을 제압했다는 말이 이해가 가는 광경이다.
      reason: >
        드므(궁궐 소화수 그릇)를 급조 화포로 사용해 일본군을 격파하는 장면.
        현대 역사 지식(나폴레옹)과 고전적 전투가 충돌하며 대체역사의
        독특한 쾌감을 만든다. 감각 묘사(이명, 천지 흔들림)가 전투의 물리적 충격을 전달.

  정치_외교_협상:

    - grade: "★★★"
      source: "고려천조국"
      episode: 15
      excerpt: |
        "저는 태후 마마를 유폐할 생각입니다." "가문과 종묘사직 두 가지 모두를 동시에 잡는 방법도 있다는 말씀입니다." "태후께서 저와 손을 잡으시면 됩니다."
      reason: >
        모후 유폐라는 협박에서 시작해 동맹 제안으로 전환하는 3단계 협상.
        왕가 내부의 권력 역학을 치밀하게 보여주며, 협박→양보→제안이라는
        고전적 협상 구조를 왕실 맥락에 녹여냄.

    - grade: "★★★"
      source: "갑신정변"
      episode: 29
      excerpt: |
        "15년, 아니 10년쯤 걸리겠군. 그렇지 않소?" "조선도 청이 조선에 득세하는 건 바라지 않는다는 말이오." "손해배상금이라고도 한다오. 영국의 차관을 일본의 지급 보증으로 중개해 주시오."
      reason: >
        다케조에 신이치로에게 일본의 정한론 일정표를 꿰뚫어 보여주며
        역으로 차관 보증을 요구하는 외교전. 미래 지식을 카드로 사용하되
        상대방의 전략적 이해관계에 맞춰 제안하는 실전적 협상 예시.

    - grade: "★★"
      source: "갑신정변"
      episode: 41
      excerpt: |
        "아라사, 아니, 러시아랑 이야기해 보도록 하지요." 그 순간, 영국 총영사 아스톤의 두 눈이 풀렸다. 그것은 영국인의 본능이었다.
      reason: >
        러시아 카드로 영국의 그레이트 게임 트라우마를 자극하여
        차관 지급보증을 이끌어내는 외교 전략. 단 두 문장으로
        국제정치의 힘학관계를 압축. '영국인의 본능'이 효과적 표현.

    - grade: "★★"
      source: "고려천조국"
      episode: 20
      excerpt: |
        "오늘 죽을 자의 이름." "원래 과(過)는 공(功)으로 덮는 것일세. 그리고 자네에게는 기회가 있고."
      reason: >
        반역 공모자를 야간 급습으로 포섭 전환하는 인사 기술.
        암살 목록이라는 채찍과 공적 기회라는 당근이 극적으로 교차.

  전쟁_전투:

    - grade: "★★★"
      source: "고려천조국"
      episode: 22
      excerpt: |
        빠르게 말을 몰아 앞으로 나아간 최영이 창을 들었다. 그러고는 온몸의 근육을 쥐어짜며 앞으로 몸을 폈다. 일순, 그의 손에 있던 창이 사라진 것 같은 착각이 들었다. 그리고 잠시 뒤, 전장에 서 있는 모두는 알게 되었다.
      reason: >
        최영이 홀로 적진에 돌입해 총사직 김용을 투창으로 사살하는 장면.
        '창이 사라진 것 같은 착각'이라는 속도감 묘사가 무장의 전설적 무용을
        영화적으로 전달. 결과를 직접 서술하지 않고 '모두는 알게 되었다'로
        여운을 남기는 기법이 인상적.

    - grade: "★★★"
      source: "갑신정변"
      episode: 8
      excerpt: |
        군가를 흥얼거리는 적병들의 모습은 마치 뱀과 같았다. 어스름이 져 있을 무렵 하얀 바닥을 기어오는 검은 짐승. 그 행렬이 움직일 수록 주변 대기가 떨린다. 그들은 우리의 죽음을 바라고 있는 자들이다. 마치 춤추듯 그림자들이 움직이고, 횃불들은 승냥이의 눈처럼 맹렬하게 타올랐다.
      reason: >
        일본군 야간 접근을 뱀, 짐승, 승냥이 등 동물 이미지로 묘사.
        시각(그림자, 횃불)과 청각(군가)이 교차하며 공포감을 조성.
        '대기가 떨린다'는 표현이 적군의 위압감을 체감적으로 전달.

    - grade: "★★"
      source: "고려천조국"
      episode: 23
      excerpt: |
        종이에 물감이 번지듯, 빛이 어둠을 몰아내듯 군사들이 군호를 연호하며 앞으로 나아간다. 누가 밀어서 움직이는 것이 아니다. 그들 또한 알고 있었다. 승리가 눈앞에 있다.
      reason: >
        최영의 활약 후 전세가 기울며 용호군이 돌격하는 장면.
        '종이에 물감이 번지듯'이라는 비유가 군세의 확산을 시각적으로 전달.
        '누가 밀어서 움직이는 것이 아니다'가 장병의 사기를 체감시킴.

  화_도입부:

    - grade: "★★★"
      source: "고려천조국"
      episode: 1
      excerpt: |
        2000년. 미국 루이지애나주의 라파이엣에 사는 2살짜리 어린아이. 제임스 라이닝거가 이런 말을 했다. '이건…… 예전에 제가 타던 비행기니까요.' 전생을 기억하는 아이.
      reason: >
        실존 전생기억 사례(제임스 라이닝거)로 시작하여 회귀물의 설정을
        현실 세계에 정착시킨다. 팩트 기반 도입이 판타지 설정의 신뢰성을 높이며
        독자의 관심을 즉시 붙잡는 탁월한 후크.

    - grade: "★★★"
      source: "갑신정변"
      episode: 1
      excerpt: |
        사람들은 누구나 후회를 한다. 그것이 이제 막 꼬꼬마 딱지를 뗀 급식 잼민이라도. '아 휘바, 나도 회귀하고 싶다.' 아무튼, 그런 사소한 모순을 견딜 수 있어야 하는 것이 회귀자의 품격이다.
      reason: >
        웹소설 장르 메타 유머('급식 잼민', '회귀자의 품격')로 시작해
        독자의 장르 기대감을 충족시키면서 주인공의 상황을 설정.
        자기 패러디적 도입이 장르 독자에게 즉각적 친밀감을 형성.

    - grade: "★★"
      source: "고려천조국"
      episode: 7
      excerpt: |
        '전쟁이란 자국의 의지를 상대 국가에게 강요하기 위한 폭력적인 행위이며, 다른 수단에 의한 정치의 연속이다.' 프로이센의 군사학자 카를 폰 클라우제비츠의 저서, 전쟁론의 나오는 구절이다.
      reason: >
        클라우제비츠 인용으로 화의 주제(외교와 전쟁)를 선제적으로 제시.
        현대 지식인이 과거에 갇힌 설정의 주인공 캐릭터성을 인용 하나로 강화.

    - grade: "★★"
      source: "갑신정변"
      episode: 19
      excerpt: |
        나처럼 유배를 온 사람도 드물 것이다. 옆으로 호위하는 군사들을 데리고 가마에 탄 채 움직인다. 원래대로라면 목에 칼을 차고 개 떨듯이 떨면서 천 리 길을 걸어야 했겠지만, 그딴 건 없다. 이거 다 요식행위라니까.
      reason: >
        유배라는 무거운 상황을 유머러스하게 뒤집는 도입.
