# 투자물/현판 장르 Few-Shot 성공 예시 뱅크
# 출처: 금수저생활백서, 금수저 투자백서, 독식하는 재벌 3세
# 생성일: 2026-03-17
# 상태: 초안 — 사용자 최종 선별 후 확정
# 용도: CW 프롬프트에 positive few-shot으로 주입 (신규 시스템 구축 필요)

# ========================================
# 장르 DNA (CW 모방 원칙)
# ========================================
genre_dna:
  감정_절제: "감정 형용사 대신 신체 반응/행동으로 전달. '울컥 가슴이 북받쳐 올랐다' 정도로 한 줄 처리."
  대화_정보: "금융/비즈니스 지식을 소크라테스식 문답으로 전달. 독립 설명 단락 없이 대화 속에서 소화."
  온도차: "주인공의 담담함 vs 주변의 경악으로 쾌감 생성. '소소하게 10억 달러' 식의 언더스테이트먼트."
  짧은_호흡: "한 줄에 하나의 정보. 웹소설 가독성 최적화. 과잉 묘사 없음."
  권력_역학: "모든 대화에 '누가 위이고 누가 아래인가'가 내포. 논리와 비유로 밀어붙이는 대화."

# ========================================
# 카테고리 1: 화 도입부
# ========================================
화_도입부:
  - id: open-01
    source: 금수저생활백서 4화
    rating: "★★★"
    why: "간결한 장소 설정 두 줄, 재벌가 배경 자연 노출, 슈퍼카+구겨진 옷의 현실감, 판타지와 현실의 균형"
    text: |
      서울 마포 공덕 오거리.

      전철역 근처에 겉면이 유리로 장식된 30층짜리 고층 빌딩이 우뚝 세워져 있었다.

      바로 재계 서열 10위인 제일 그룹 본사 사옥이었다.

      람보르기니 가야르도 한 대가 지하 주차장으로 미끄러져 들어갔다.

      "이거 옷이 다 구겨졌네."

      재성은 힘겹게 차에서 내려 구겨진 옷깃을 손으로 탈탈 털며 중얼거렸다.

      "멋지긴 한데 승차감도 엉망이고 데일리로 쓰기에는 별로야."

      영화에서 보면 멋진 주인공이 선글라스를 쓴 채 슈퍼카를 타고 등장했지만 역시 그건 영화일 뿐 현실은 달랐다.

  - id: open-02
    source: 독식하는 재벌 3세 1화
    rating: "★★★"
    why: "짧은 문장 나열로 상황 전달 후 '나는 재벌 3세였다' 반전 훅. 감정 서술 없이 사실만 나열하는데 비참함이 전달됨"
    text: |
      책상과 침대가 전부인 좁은 고시원.

      쓰레기통을 가득 채우고 있는 라면 봉지.

      그 흔한 라면조차 없어 배를 곯고 있는 게 지금 내 상황이었다.

      "쿨럭!"

      입을 가린 손에서 피가 묻어 나온다.

      영양실조 때문인가? 아니면 이 좁은 공간에서 며칠째 나가지 않아서일까?

      이런 지금의 내 모습을 봐서는 연상되지 않겠지만, 나는 재벌 3세였다.

      그것도 형제 하나 없는 3대 독자.

  - id: open-03
    source: 금수저 투자백서 1화
    rating: "★★★"
    why: "외부→건물→방→인물 순 카메라 줌인. 너구리 굴 속어로 증권가 분위기 압축. 허름한 구둣방 노인의 깔끔한 외양이 반전 복선"
    text: |
      서울특별시 영등포구 여의도동.

      흔히 여의도 증권가라고 불리는 이곳에는 한국거래소를 비롯해 금융감독원, 한국은행 등 금융 관련 주요 기관들은 물론이고 대형 증권사와 투자은행, 자산운용사 등등 여러 금융회사가 모여 있었다.

      한국의 맨해튼이라는 별명답게 하늘 높이 솟은 고층 빌딩들이 빽빽하게 들어차 있고 이른 새벽부터 밤늦게까지 사람들이 바쁘게 오가며 활기차게 돌아갔다.

      지하철 여의도역 3번 출구 앞, 이름만 들으면 알만한 대형 증권사 빌딩들이 나란히 마주 보며 서 있는 200m 남짓 되는 골목이 하나 있다.

      증권맨들 사이에서 속칭 너구리 굴로 불리는 곳이다.

  - id: open-04
    source: 독식하는 재벌 3세 4화
    rating: "★★"
    why: "날짜 한 줄→사건 한 줄→의미 두 줄→현장 전환. 팩트만으로 긴장감 생성"
    text: |
      1990년 3월 27일.

      일본의 대출총량제가 실행되었다.

      대출 규제를 강화해 부동산 가격 상승을 막고자 하는 의도였다.

      선한 의도였지만, 버블 경제의 끝을 알리는 신호탄이 되어 버렸다.

# ========================================
# 카테고리 2: 협상/비즈니스 장면
# ========================================
협상_비즈니스:
  - id: biz-01
    source: 금수저생활백서 4화
    rating: "★★★"
    why: "질문으로 상대 논리를 유도한 뒤 역전시키는 화법. 감정 대립이 아닌 논리 압박"
    text: |
      "이번 광고에 책정된 예산이 내가 알고 있기로 50억이 넘는 걸로 아는데 맞습니까?"

      "그렇습니다."

      "적지 않은 돈을 들여서 광고하는 이유가 뭐라고 생각합니까?"

      "그야 소비자들한테 신제품을 알리고 더 많은 물량을 팔기 위해서이지 않겠습니까."

      "제대로 잘 알고 있군요."

      작게 머리를 끄덕인 재성은 이내 정색을 하며 말했다,

      "그런데도 단지 일정이 촉박하다는 이유로 더 나은 광고를 만들 수 있는데 이대로 내보내겠다는 겁니까."

  - id: biz-02
    source: 금수저생활백서 8화
    rating: "★★★"
    why: "수직 권력 관계 속 협상. 회장의 날카로운 반론 + 주인공의 논리 응수. '그거나 이거나' 같은 건조한 대사가 분위기 전달"
    text: |
      "그러니까 날 보고 돈을 내놓으라 이거냐?"

      "성과금입니다."

      "그거나 이거나."

      재성은 소파에 삐딱하게 앉은 박경수 회장의 시선을 피하지 않은 채 당당하게 말했다.

      "블루 DMB폰 매출을 보시면 아시겠지만 성과금을 받을 자격이 충분하다고 생각합니다."

      "광고가 꽤나 인기를 끌고 있다는 보고는 받았다. 하지만 그건 부수적인 것일 뿐 애초에 소비자들의 기호를 충족시킬 수 있는 제품이었다고 생각하지는 않느냐. 그렇다면 제품을 만들어낸 개발팀의 공이 더 크겠지."

      날카로운 지적에 재성은 내심 역시 호락호락하지 않다고 생각하며 차분히 말을 받았다.

      "물론 다른 여러 부서들의 노력이 합쳐져 이루어낸 일이겠지요. 그러나 아무리 좋은 제품을 개발해 냈어도 소비자들한테 선택받지 못한다면 그게 무슨 소용이겠습니까."

  - id: biz-03
    source: 독식하는 재벌 3세 10화
    rating: "★★★"
    why: "대화+내면독백 교차. '줄다리기를 시전하는 척' '아는 척은 여기까지' 로 전략적 의도 공유. '소소하게 10억 달러'의 언더스테이트먼트"
    text: |
      "저도 시나리오를 보니 영국이 질 수밖에 없는 싸움이긴 하더군요. 그런데 백기를 얼마나 빨리 드는지가 관건이죠."

      약간의 줄다리기를 시전했다.

      줄다리기를 시전하는 척을 하며 우리도 알 만큼 알고 있다는 사실을 보여 주기 위함이었다.

      "ERM이라면 유럽 환율 메커니즘을 말하시는 거죠? 확실히 허점이 많은 제도입니다."

      아는 척은 여기까지.

      "그럼 얼마를 투자할지로 대화 주제를 바꿔 볼까요. 일단은 소소하게 10억 달러 정도만 넣어 볼까 합니다."

  - id: biz-04
    source: 금수저 투자백서 6화
    rating: "★★★"
    why: "레버리지 협상. 양측 프로. 수수료/마진콜 용어를 협상 맥락에서 자연 소화. 마지막 '내심 코웃음'으로 이중성"
    text: |
      "10배 레버리지 계약을 원하신다고 들었는데 그건 곤란할 것 같습니다."

      "이유가 뭐죠?"

      "저희와 첫 거래이기도 하고 무엇보다 레버리지가 늘어나면 그만큼 부담이 커지기 때문입니다."

      "레버리지 열 배가 그리 이례적인 조건은 아닐 텐데요. 월가에서도 손꼽히는 투자 은행이라 배짱도 두둑할 줄 알았는데 그건 아닌 모양이네요."

      "레버리지를 열 배로 설정하는 대신 수수료를 7%로 올리고 그중 두 달 치는 먼저 선납하도록 하죠."

      "8%. 수용하기 어렵다면 이번 계약은 없던 걸로 하죠."

      손익을 다 따져봐 놓고는 마치 크게 양보를 하는 듯한 모습이었다.

      석원은 내심 코웃음을 쳤으나 겉으론 전혀 티를 내지 않고 미소를 지으며 폴슨이 내민 손을 맞잡았다.

# ========================================
# 카테고리 3: 긴장감 조절
# ========================================
긴장감_조절:
  - id: tension-01
    source: 금수저생활백서 10화
    rating: "★★★"
    why: "'슴슴한 맛'의 정수. 대사 교환만으로 부자간 권력 역학, 탐색, 인정의 조짐 전달. 과잉 묘사 대체"
    text: |
      "네 형들하고 경쟁하려는 것이냐?"

      "당장 그런 생각은 없습니다."

      "아니라는 말은 안 하는구나."

      "세상일이 어떻게 될지는 아무도 모르는 법이니까요."

      "많이 바뀌었구나."

      "이제는 그럴 때도 되었으니까요."

      침묵 속에 서로 마주 보는 두 사람의 눈빛에는 많은 것이 오고 갔다.

  - id: tension-02
    source: 독식하는 재벌 3세 5화
    rating: "★★★"
    why: "1,400억 베팅 순간에 '휴가라 생각하고 쉬세요'. 공포 vs 여유의 온도차가 장르 쾌감"
    text: |
      "원유 급등에 베팅은 다 하셨죠?"

      "도련님의 말씀대로 레버리지를 최대한 이용해 원유 급등에 베팅했습니다. 벌써 10분 사이에 3억 원이 날아갔습니다."

      "오늘은 휴가라 생각하고 그냥 쉬세요."

      "무려 2억 달러를 베팅했습니다! 한화로 1,400억 원이 넘는 금액입니다."

      "2억 달러가 1,400억밖에 안 해요? 와, 환율 좋다. 그리고 뭐가 걱정이에요. 지금까지 잘해 왔으면서."

  - id: tension-03
    source: 금수저 투자백서 11화
    rating: "★★★"
    why: "과거 회상으로 서스펜스 지연 후 '오늘이었다' 한 줄로 현재 복귀. 전화 통화만으로 실시간 긴장감. '입술을 혀로 적셨다' 한 줄 감정"
    text: |
      오 부장이 말한 9월 16일이 바로 오늘이었다.

      띠리릭! 띠리릭!

      요란하게 울리는 벨소리에 상념에서 벗어난 석원은 얼른 테이블 위에 올려둔 휴대폰을 집어 들었다.

      "여보세요."

      [파운드가 1.3850달러를 깨고 아래로 내려왔습니다!]

      "남겨둔 4억 달러를 전부 다 매도해요!"

      [잔고를 모두 말씀입니까?]

      "그래요."

      대답을 들은 석원은 휴대폰을 귀에 댄 채 긴장감에 바짝 마른 입술을 혀로 적셨다.

# ========================================
# 카테고리 4: 화 마무리/클리프행어
# ========================================
클리프행어:
  - id: cliff-01
    source: 금수저생활백서 3화
    rating: "★★★"
    why: "주인공 시점에서 벗어나 회장 내면을 슬쩍 보여주는 시점 전환 클리프행어"
    text: |
      박경수 회장의 시선은 다른 이들처럼 서재를 빠져나가는 재성의 뒷모습에 머물렀다.

      "흠. 이번에는 정말로 반성하고 뉘우치려는 건가……."

      하지만 이내 그는 어림도 없다는 듯 고개를 흔들었다.

      "아니야. 성급하게 믿기에는 아직 이르지."

  - id: cliff-02
    source: 독식하는 재벌 3세 21화
    rating: "★★★"
    why: "맥주 건배의 여유→속보 한 줄로 급반전. 앞서 체결한 파생상품 복선이 여기서 터짐"
    text: |
      나는 격려의 의미로 한 팀장의 손에 맥주 한 캔을 들려 주었고.

      가볍게 건배를 한 후 시원하게 맥주를 들이켰다.

      그 순간.

      지이잉! 지이잉!

      한 팀장과 내 휴대폰에 문자와 전화가 쏟아졌고, 나는 본능적으로 TV를 틀었다.

      한창 드라마가 나올 시간이었지만, 드라마는 멈추었고 속보가 진행되고 있었다.

      [고베 대지진 발생. 규모 7.3]

  - id: cliff-03
    source: 금수저 투자백서 4화
    rating: "★★★"
    why: "'만찬에 초대하는 종소리' 비유로 예고. 마지막 한 줄 '그 역시 뛰어들 계획이었다'로 기대감 극대화"
    text: |
      이 기사는 전 세계 헤지펀드들을 만찬에 초대하는 종소리나 마찬가지였다.

      "한때는 거친 초원을 호령했던 사자였을지 몰라도 힘이 빠지고 늙어 버린 지금은 탐욕스러운 하이에나들의 먹잇감에 불과할 뿐이지."

      곧 영국을 덮치게 될 거대한 폭풍우에 그 역시 뛰어들 계획이었다.

# ========================================
# 카테고리 5: 캐릭터 대화
# ========================================
캐릭터_대화:
  - id: dialog-01
    source: 금수저생활백서 5화
    rating: "★★★"
    why: "사이드 캐릭터 티격태격으로 딱딱한 분위기 전환. '간장 종지만도 못하다' 표현이 캐릭터 개성"
    text: |
      "대박. 우리 본부장님 좀 멋지지 않아요?"

      "아, 그만 웃어. 지금 바로 준다는 것도 아닌데 뭘 실실거리는 거야."

      권혁재 대리의 말에 장하나는 흥, 하며 눈을 흘겼다.

      "사람이 잘하는 건 좀 칭찬도 하고 그래요. 언제까지 계속 삐딱하게 굴 거예요?"

      "내가 뭘."

      "처음에 본부장님한테 좀 깨졌다고 계속 꽁해 있잖아요, 지금."

      "아니거든!"

      "어휴 속이 어떻게 간장 종지만도 못하담."

  - id: dialog-02
    source: 독식하는 재벌 3세 2화
    rating: "★★★"
    why: "재벌가 조손 대화. 17살 연기+전략적 요청. '강아지/할애비' 호칭이 캐릭터 어조. 독백 한 줄이 깊이 추가"
    text: |
      "할아버지 저 부탁이 있어요."

      "우리 강아지 소원이라면 뭐든지 들어줘야지. 장난감? 게임기?"

      "저 제대로 금융 공부 좀 해 보려고요."

      "그래서 오늘 태우증권을 찾아갔던 거니? 하긴 조만간 고등학생이 되니 슬슬 금융 공부를 시작하긴 해야겠지."

      내 모든 일정이 할아버지에게 보고가 된다.

      전생에는 감시라고 느껴졌지만, 지금은 3대 독자인 나를 위한 사랑이라고 느껴졌다.

  - id: dialog-03
    source: 금수저 투자백서 14화
    rating: "★★★"
    why: "회장-비서실장 대화. '본능적으로 사회생활 스킬 발휘' + 속마음 괴리가 직장인 독자 공감"
    text: |
      "갑자기 거액을 파운드화에 투자했다고 해서 의아했었는데 이제 와서 보니 이렇게 될 걸 예상하고 베팅한 게 아닐까 싶어."

      물론 그게 아니더라도 은근히 자식 자랑을 하고 싶어 하는 듯한 박태홍 회장의 시선에 길성호 실장은 본능적으로 사회생활 스킬을 발휘했다.

      "저도 그렇게 생각합니다. 하버드에서 경영학을 공부하고 계신 둘째 도련님이니 저희가 미처 알지 못한 부분을 보시고 먼저 행동하신 것 아니겠습니까."

      '어째 지난번하고 말씀이 많이 다르시지 않나.'

      저도 모르게 딴지를 걸고 싶은 말이 목구멍까지 올라왔지만 오랜 사회생활로 다져진 생존 본능에 입이 저절로 움직였다.

      "피는 못 속인다는 말이 괜히 있겠습니까."

  - id: dialog-04
    source: 독식하는 재벌 3세 21화
    rating: "★★★"
    why: "조손 정면 충돌. 속담/비유('콩고물 vs 떡', '태조→이방원')로 밀어붙이는 논리. 감정 흥분 없이 냉정한 대화"
    text: |
      "콩고물만 묻혀 먹었으면 저도 이렇게까지는 안 했죠. 콩고물이 아니라 떡을 훔쳐 먹고 있었습니다."

      "망나니라도 되려는 게냐?"

      "할아버지는 태우그룹의 창립자십니다. 조선으로 비유하면 태조 이성계가 되시겠죠. 그리고 일찍 돌아가신 아버지가 이방원이 되어 태우그룹의 관행을 끊어 버렸어야 합니다."

      "그래서 네가 이방원이 되겠다는 게냐?"

      "태우그룹의 발전을 위해서라면 망나니가 아니라 더 심한 것도 할 수 있습니다."

# ========================================
# 카테고리 6: 정보 전달
# ========================================
정보_전달:
  - id: info-01
    source: 금수저생활백서 7화
    rating: "★★★"
    why: "소크라테스식 문답으로 인터넷 마케팅 설득. '부장님은 하루에 몇 시간이나' 질문 하나가 시대/세대/전략 동시 전달"
    text: |
      "우리가 이번 광고에서 주 타깃층으로 잡고 있는 연령대가 어디죠."

      "20대와 30대 젊은 층입니다."

      "부장님은 보통 하루에 몇 시간이나 인터넷을 하십니까?"

      "……업무 시간을 제외하면 한 시간도 안 될 겁니다."

      "그러실 것 같았습니다. 그럼 여기 앉아 있는 2~30대 팀원분들에게 묻지요. 인터넷을 하루에 얼마나 접속하죠?"

      "컴퓨터에 익숙하고, 눈을 뜨고 일어나 다시 잠자리에 들기까지 수도 없이 인터넷에 접속하시는 분들이 대다수일 겁니다. 우리의 타깃층에 맞춰보자면, 오히려 TV보다 인터넷이 더 낫지 않을까요?"

  - id: info-02
    source: 독식하는 재벌 3세 4화
    rating: "★★★"
    why: "지정학을 질문-답변으로. '적보다 배신한 동료가 더 밉다', '시어머니보다 시누이' 속담으로 독자 눈높이 맞춤"
    text: |
      "이라크는 전쟁으로 5천억 달러 이상의 부채를 지게 되었는데 가만히 있을까요?"

      "5천억 달러면, 500조 원에 달하는 금액이에요. 이라크 내부에서 쿠데타가 일어나도 전혀 이상하지 않은 금액이죠."

      "지금 이라크는 누굴 가장 미워할까요?"

      "이란이지 않겠습니까?"

      "아니죠. 원래 적보다 배신한 동료가 더 미운 법이죠."

      "배신한 동료라고 하면 설마 쿠웨이트를 말씀하시는 겁니까?"

      "때리는 시어머니보다 말리는 시누이가 더 밉다는 말씀이십니까?"

      "지금 이라크는 흔들리고 있어요. 역사적으로, 흔들리는 내부를 결속하기 위해 외부에 적을 만들기 마련이죠."

  - id: info-03
    source: 금수저 투자백서 4화
    rating: "★★★"
    why: "독일 통일→국채→금리→ERM 붕괴를 구두닦이 대화로 풀어냄. '환자에게 금식 시킨 꼴' 비유가 핵심"
    text: |
      "사실 영국 영란은행을 침몰시킨 범인은 해밀턴이 아니라 독일 분데스방크야."

      "독일이 통일된 것하고 영국 파운드가 무슨 상관이 있어요?"

      "아주 상관이 많지. 라인강의 기적을 이룬 서독하고 달리 동독은 무너지기 직전의 폐가나 마찬가지였거든."

      "정부에 돈이 부족하다면 국채를 발행해서 빌려야 되겠죠?"

      "딩동댕! 맞았어."

      "건강이 안 좋아 병원에 입원한 환자한테 영양제를 놔주는 것이 아니라 금식을 시켜 버린 꼴인 거지."

      "그렇게 피 냄새를 진하게 풍기는 걸 해밀턴을 선두로 한 헤지펀드들이 놓치지 않고 달려든 거야."

# ========================================
# 카테고리 7: 복합 (캐릭터 깊이 + 감정)
# ========================================
복합:
  - id: complex-01
    source: 독식하는 재벌 3세 13화
    rating: "★★"
    why: "조 단위 돈을 굴리는 주인공이 라면을 '귀한 음식'이라 부르는 아이러니. 전생 비참함을 감정 호소 없이 사실로만 전달"
    text: |
      "왜 안 먹어요? 입맛이 없어요?"

      "도련님은 라면을 너무 자주 드시는 것 같습니다."

      "귀한 음식이니 자주 먹어 줘야죠."

      "라면이 귀한 음식이라니요?"

      나는 라면이 얼마나 소중한 음식인지 전생을 통해 깨달았다.

      어쩌다 돈이 생기면 나는 라면부터 쟁여 두었다.

      그러고도 돈이 남으면 김밥 한 줄을 사서 라면과 함께 먹곤 했었고, 내 생에 가장 맛있는 음식이 라면에 김밥이었다.

  - id: complex-02
    source: 금수저 투자백서 3화
    rating: "★★"
    why: "금액 충격을 그룹 수출액과 비교해 체감. '어. 얼마라고?' 한 마디가 재벌 회장의 놀람을 과장 없이 전달"
    text: |
      "그래, 얼마쯤인데?"

      [1억 9천만 달러요.]

      "……뭐?"

      박태홍 회장이 수화기를 꽉 움켜쥐고 되물었다.

      "어. 얼마라고?"

      [대수롭지 않게] 1억 9천만 달러요. 세금을 떼면 크게 줄어서 대충 1억 1,970만 달러 정도 될 거라고 하더라고요.

      작년 대흥 그룹의 수출액은 9억 7천만 달러에 머물렀다.

      그런데 그룹 수출액의 10%에 해당하는 거액을 받았다니?
