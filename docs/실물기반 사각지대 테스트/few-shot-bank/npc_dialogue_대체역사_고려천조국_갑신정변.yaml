# NPC 대사 패턴 뱅크 - 대체역사 2작품
# 작품 1: 고려는 천조국이 되기로 하였습니다 (ep001~ep050)
# 작품 2: 눈 떠보니 갑신정변 (ep001~ep050)
# 장르: 대체역사 (회귀/빙의)
# 분석 기준: 100화 전체 대사 발췌 및 말투 분석

archetypes:

  왕_황제:
    description: "왕/황제 아키타입 - 고려 공민왕 + 조선 고종"
    speech_pattern_analysis: |
      [공민왕 (고려천조국)]
      - 회귀자로서 현대 한국어와 고려 왕의 어투가 혼재
      - 독백은 현대적('~하겠지', '~인 거다'), 공식 발언은 왕언('~할 것이다', '~이니라')
      - 감정적이되 이성적 판단을 드러내는 이중 구조
      - 자주독립에 대한 열정이 어투에 녹아있음
      - 결정적 순간에는 짧고 단정적인 선언문 형태
      [고종 (갑신정변)]
      - 극도로 절제된 단문. 감정을 드러내지 않는 건조한 화법
      - 명령조이나 때로 친근한 한마디를 건냄 ('머리 안 아픈가?')
      - 처벌과 보호를 동시에 담는 교묘한 판결 화법
      - 왕답게 결론만 제시하고 과정은 생략하는 경향
    dialogue_excerpts:
      - source: "고려천조국"
        episode: 5
        character: "공민왕 (왕기)"
        quote: "내가 원하는 것은 이 나라 고려의 완전한 자주다. 만약 원이 그것을 방해한다면 나는 원을 배격할 것이다."
        context: "이제현과의 심야 문답에서 자주 비전을 선언"

      - source: "고려천조국"
        episode: 9
        character: "공민왕"
        quote: "우물쭈물하다간 아무것도 이루지 못한다. 그리고…… 역사는 승자의 것이다."
        context: "군사 개혁을 독촉하며 신하들에게"

      - source: "고려천조국"
        episode: 46
        character: "공민왕"
        quote: "이 모든 것이 무엇 때문이라 생각하느냐? ……모두 나의 죄다."
        context: "서민의 참혹한 삶을 목격한 뒤 자책하며"

      - source: "갑신정변"
        episode: 18
        character: "고종"
        quote: "머리 안 아픈가?"
        context: "가마에서 내려 김덕령에게 건네는 말. 담백하면서도 친근"

      - source: "갑신정변"
        episode: 18
        character: "고종"
        quote: "단, 종사 김덕령의 죄는 명백하다. 그는 삭탈관직하고 유배에 처한다. 유배지는 그의 가택으로 하겠다."
        context: "처벌과 동시에 보호의 의중을 담은 교묘한 판결"

  주인공_회귀자_빙의자:
    description: "주인공 아키타입 - 회귀/빙의한 현대인이 과거 왕/인물로 살아가는 이중 화법"
    speech_pattern_analysis: |
      [공민왕 (고려천조국)]
      - 내면 독백: 완전한 현대 한국어 ('~인 거다', '~해야겠지')
      - 공식 발언: 왕의 권위를 담은 선언체 ('~할 것이다', '~이니라')
      - 가까운 신하에게: 반존대 혼합 ('~하는 것이 어떻겠느냐?')
      - 결정적 순간에 짧고 강한 단언 사용
      - 미래 지식을 암시적으로 활용하되 직접 언급은 피함
      [김덕령 (갑신정변)]
      - 내면 독백: 극도로 현대적 (인터넷 밈, 게임 용어, 비속어)
      - 대외 발언: 상황에 따라 19세기 조선어와 현대어를 자유 전환
      - 유머와 냉소를 오가는 이중 화법이 핵심 스타일
      - 외교/정치 장면에서는 날카롭고 계산적인 어투로 전환
      - 위기 시 비속어로 돌아가는 본능적 화법 ('좆됐네', '빌어먹을')
    dialogue_excerpts:
      - source: "고려천조국"
        episode: 4
        character: "공민왕"
        quote: "금일, 궐에서 역모를 발견했다."
        context: "기철 숙청 직전의 결정적 선언"

      - source: "고려천조국"
        episode: 7
        character: "공민왕"
        quote: "요동을 병략한다."
        context: "신하들 앞에서 요동 정벌을 선포. 경악하는 신하들"

      - source: "고려천조국"
        episode: 23
        character: "공민왕"
        quote: "너의 근본을 내가 아니까."
        context: "적대 세력의 본질을 꿰뚫어보며"

      - source: "갑신정변"
        episode: 1
        character: "김덕령"
        quote: "아 휘바, 나도 회귀하고 싶다."
        context: "1화 도입부 내면 독백. 장르 메타 유머"

      - source: "갑신정변"
        episode: 3
        character: "김덕령"
        quote: "나 GOP 출신이야!"
        context: "전투 중 세계관 파괴 대사. 현대군 경험의 유머러스한 드러냄"

      - source: "갑신정변"
        episode: 29
        character: "김덕령"
        quote: "당신들은 왜 안 된다고만 하시오."
        context: "다케조에에게 외교적 압박을 가하며"

      - source: "갑신정변"
        episode: 30
        character: "김덕령"
        quote: "정정당당하게 선동과 날조로 갈 겁니다."
        context: "여론전 전략을 선언하며. 주인공 성격의 압축"

  신하_대신:
    description: "신하/대신 아키타입 - 왕을 보좌하는 고위 관료들"
    speech_pattern_analysis: |
      [이제현 (고려천조국)]
      - '~이옵니다' 체계적 경어 사용
      - 겸양하면서도 솔직한 발언이 공존
      - 배짱 있는 간언과 왕에 대한 기대감이 교차
      - 유교적 교양이 묻어나는 표현
      [민영익 (갑신정변)]
      - 격식체와 친근함이 혼재 (비교적 젊은 고관)
      - 재물에 민감한 실용적 화법
      - 위기 시 감정이 드러나는 경향
      [심순택 (갑신정변)]
      - 노련한 조율자의 화법. 갈등을 중재하는 표현
      - '자자, 그러지들 마시고' 식의 유화적 어투
    dialogue_excerpts:
      - source: "고려천조국"
        episode: 5
        character: "이제현"
        quote: "전하께서 바라시는 것은 원나라를 배격하는 것이옵니까?"
        context: "왕의 진의를 확인하는 직설적 질문"

      - source: "고려천조국"
        episode: 25
        character: "이제현"
        quote: "전에 전하께서 말씀하시지 않으셨습니까? 지금은 난세입니다. 그렇다면…… 그것에는 그에 맞는 길이 있는 법이지요."
        context: "왕의 과거 발언을 인용하며 새로운 제안을 정당화"

      - source: "고려천조국"
        episode: 30
        character: "이제현"
        quote: "익숙함은 언제나 반대를 불러일으킵니다. 그것이…… 세상 아닙니까."
        context: "개혁에 대한 저항을 관조적으로 설명"

      - source: "갑신정변"
        episode: 7
        character: "민영익"
        quote: "자네 때문에 큰일 났네! 아니, 도대체 얼마나 돈이 들어가는지 알기나 하는가!"
        context: "김덕령의 무모한 계획에 재정적 우려를 폭발"

      - source: "갑신정변"
        episode: 23
        character: "심순택"
        quote: "자자, 그러지들 마시고, 차라도 한 잔 마십시다."
        context: "신하들 간 갈등을 중재하며"

  적국_인물:
    description: "적국/적대 인물 아키타입 - 고려의 원(元), 조선의 일본·청"
    speech_pattern_analysis: |
      [기철 (고려천조국)]
      - 원의 위세를 업은 권력자의 여유로운 발언
      - 궁지에 몰렸을 때 급격한 패닉 화법으로 전환
      - '상국'(원)을 방패로 사용하는 말버릇
      [다케조에 (갑신정변)]
      - 외교적 공손함 뒤에 오만함을 숨기는 일본식 화법
      - 주로 짧고 건조한 문장으로 반응
      [원세개 (갑신정변)]
      - 직설적이고 거침없는 권력자 화법
      - 조선을 깔보는 태도가 대사에 자연스럽게 묻어남
    dialogue_excerpts:
      - source: "고려천조국"
        episode: 4
        character: "기철"
        quote: "상국에서 100만 대군을 몰아 상도로 들이칠 겁니다!"
        context: "숙청 직전 원의 위세로 협박"

      - source: "고려천조국"
        episode: 4
        character: "기철"
        quote: "다들 무엇 하는 것이냐! 비켜라!! 왕은 미쳤다!!"
        context: "궁지에 몰려 패닉 상태. 권력자의 위엄이 무너지는 순간"

      - source: "갑신정변"
        episode: 7
        character: "다케조에"
        quote: "한심한 자들. 스스로는 자신들을 지식인이라 여기는 것 같았지만 본국 사람들에 비하면 얼치기들일 뿐이야."
        context: "개화파를 평가하며. 일본의 조선 경시 태도가 드러남"

      - source: "갑신정변"
        episode: 24
        character: "원세개"
        quote: "차 맛이 쓰군."
        context: "조선의 차에 대한 불만. 조선 경시를 은유적으로 표현"

      - source: "갑신정변"
        episode: 40
        character: "이노우에 가오루"
        quote: "30년간 동래에서의 독점적인 경제적 지위를 원합니다."
        context: "부드러운 어조로 약탈적 요구를 포장"

  무장_장수:
    description: "무장/장수 아키타입 - 전장의 지휘관·무인들"
    speech_pattern_analysis: |
      [최영 (고려천조국)]
      - 간결하고 단정적인 군인다운 직설화법
      - 충심이 묻어나는 경어 사용
      - 전투 시에는 행동으로 말하고 언어는 최소화
      - 비유를 쓸 때는 동물/자연 이미지 선호
      [이제마 (갑신정변)]
      - 과묵하지만 세심한 화법
      - 존대하되 담백. 감정 표현 절제
      - 실용적 조언 중심의 발언
    dialogue_excerpts:
      - source: "고려천조국"
        episode: 6
        character: "최영"
        quote: "바뀌는 것이 없었사옵니다. 아무것도."
        context: "왕에게 군 현황을 보고하며. 개탄이 담긴 짧은 문장"

      - source: "고려천조국"
        episode: 22
        character: "최영"
        quote: "쥐는 사람을 물지만 호랑이에게는 밟혀 죽는 법입니다."
        context: "반란군의 위협을 무시하며. 동물 비유의 전형"

      - source: "고려천조국"
        episode: 27
        character: "최영"
        quote: "전하께서 명을 내리셨으니 놈들은 내일 해를 보지 못할 것이옵니다."
        context: "적 소탕 명령에 대한 자신만만한 답"

      - source: "고려천조국"
        episode: 34
        character: "최영"
        quote: "분명 장강의 앞물이 뒷물에 밀려나는 것은 세상의 이치. 전쟁 또한 그런 것일 뿐이라 생각합니다."
        context: "전쟁관을 담은 관조적 발언"

      - source: "갑신정변"
        episode: 6
        character: "이제마"
        quote: "뒤춤에 차 두시지요. 나중에 전투가 격화되면 목이 마르실 겝니다."
        context: "수통을 건네며. 과묵한 무인의 세심함"

  궁녀_내시:
    description: "궁녀/내시 아키타입 - 궁중 내부 인물들"
    speech_pattern_analysis: |
      [정영 (고려천조국)]
      - 충직하고 소심한 내시의 전형적 화법
      - 왕의 건강과 안전을 최우선시하는 걱정 표현
      - '~이옵니다' 정중체 일관
      [유재현 (갑신정변)]
      - 여성스러움과 남성스러움의 경계에 있는 독특한 화법
      - 신중하고 낮은 목소리. 짧은 문장에 깊은 의미
      - 충성심이 말투 자체에 배어 있음
    dialogue_excerpts:
      - source: "고려천조국"
        episode: 2
        character: "정영"
        quote: "찾아계시옵니까 전하."
        context: "왕을 모시는 내시의 공손한 인사"

      - source: "고려천조국"
        episode: 17
        character: "정영"
        quote: "전하의 옥체가 걱정이옵니다. 벌써 이틀째 거의 아무것도 드시지 않으시지 않으셨습니까?"
        context: "왕의 건강을 걱정하며 조심스럽게 간언"

      - source: "고려천조국"
        episode: 32
        character: "정영"
        quote: "정인도 아니시온데 그러하옵니까?"
        context: "왕의 과도한 행동에 당혹한 반응"

      - source: "갑신정변"
        episode: 5
        character: "유재현"
        quote: "혹여, 오늘의 일과 관련된 이야기입니까?"
        context: "신중하게 눈치를 살피며. 낮은 목소리에 충성심이 담김"

  평민_상인:
    description: "평민/상인 아키타입 - 서민·장사꾼·하인들"
    speech_pattern_analysis: |
      [진교룡 (고려천조국)]
      - 노련한 상인의 정중하되 계산적인 화법
      - 위기 속에서도 흥정을 멈추지 않는 상인 본능
      - 어느 편에도 속하지 않는다는 중립적 자기 규정
      [김덕준 (갑신정변)]
      - 거칠지만 정이 넘치는 형제간 화법
      - 상인다운 실용적 발언과 감정적 폭발이 교차
      [복돌 (갑신정변)]
      - 순박하고 충직한 몸종의 존대+사투리 혼합
      [금수동 (갑신정변)]
      - 과장되고 능글맞은 청국 상인 화법
    dialogue_excerpts:
      - source: "고려천조국"
        episode: 38
        character: "진교룡"
        quote: "저는 상인입니다. 상인을 이문을 좇는 자들, 그런 만큼 어느 한 곳에 속해 있는 자가 아닙니다."
        context: "왕과의 대면에서 상인의 정체성을 선언"

      - source: "고려천조국"
        episode: 38
        character: "진교룡"
        quote: "원하는 것이 있으십니까? 저는 독점권을 원합니다."
        context: "왕에게 거래를 제안하며. 상인다운 직설"

      - source: "갑신정변"
        episode: 20
        character: "김덕준"
        quote: "야 이 미친놈아!"
        context: "동생 김덕령에 대한 거친 애정 표현"

      - source: "갑신정변"
        episode: 19
        character: "복돌"
        quote: "아이고, 마님! 괜찮으시옵니까?"
        context: "순박한 충직함이 묻어나는 염려"

