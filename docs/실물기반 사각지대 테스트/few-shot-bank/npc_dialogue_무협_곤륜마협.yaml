# NPC 대사 패턴 뱅크 - 무협_곤륜마협 (ep001~ep100)
# 작품: 곤륜마협
# 장르: 무협 (회귀/환생물)
# 분석 기준: 100화 전체 대사 발췌 및 말투 분석

archetypes:

  사부_장로:
    description: "사부/장로 아키타입 - 제자와 사문을 아끼는 어른들의 말투"
    speech_pattern_analysis: |
      - 허허, 흘흘 등 웃음 감탄사를 자주 사용
      - '~느냐', '~거라', '~이니라' 등 고어체 종결어미 사용
      - '무량수불', '원시천존' 등 도교적 감탄사 빈번
      - 제자에 대한 자애로운 어조와 걱정이 묻어남
      - 사문(곤륜)에 대한 자부심과 애정이 대사에 녹아있음
      - 어른스럽고 진중하지만 때로는 팔불출 같은 면모
    dialogue_excerpts:
      - episode: 1
        character: "운후 (곤륜삼성 덕성, 대장로)"
        quote: "보이느냐? 이게 바로 곤륜이니라."
        context: "갓난아이 정광을 안고 곤륜파를 소개하는 장면"

      - episode: 1
        character: "운후"
        quote: "정정하마. 네가 바르다 믿는 일은 끝까지 지키는 사람이 되어다오."
        context: "정광에게 바르게 살라는 부탁 대신 바른 기준을 스스로 세우라는 당부"

      - episode: 2
        character: "운후"
        quote: "허허허. 녀석. 잘못이라. 내 밑천을 매일 털어가는 게 잘못이라면 잘못이겠지."
        context: "정광의 빠른 성장에 대해 허청과 나누는 대화"

      - episode: 5
        character: "운후"
        quote: "사내가 멋져 보이고 싶은 건 당연한 일 아닌가."
        context: "정광이 제기한 멋진 무공 논쟁에서 정광을 거드는 장면"

      - episode: 14
        character: "운후"
        quote: "나는 이만 가마. 곤륜을 부탁한다. 아니지. 그냥 너희가 즐겁게 살았으면 좋겠구나."
        context: "임종 직전의 유언"

  주인공_귀환자_천재:
    description: "주인공(귀환자/천재) 아키타입 - 전생 천마신교 교주였던 정광"
    speech_pattern_analysis: |
      - 반말과 존댓말을 상황에 따라 자유롭게 전환
      - 짧고 직설적인 문장 선호 ('되는데요', '뭘요', '네')
      - 귀찮음과 무심함이 기본 톤이나, 관심 있는 대상에겐 적극적
      - 전생의 마교 교주답게 거침없고 당돌한 어투
      - 도사 생활로 인해 존댓말이 입에 붙었으나 본성은 거친 말투
      - 내면 독백에서는 욕설과 속어 자연스럽게 사용
      - 상대를 도발하거나 까딱거리는 여유로운 태도
    dialogue_excerpts:
      - episode: 2
        character: "정광"
        quote: "되는데요."
        context: "소청기공을 스스로 깨우친 것에 대해 운후가 놀라자 담담하게 답하는 장면"

      - episode: 4
        character: "정광"
        quote: "도사라고 멋지면 안 되나요?"
        context: "장로회의에서 곤륜 무공의 화려함을 주장하며"

      - episode: 9
        character: "정광"
        quote: "오세요."
        context: "한쪽 다리로 삐딱하게 서서 검지를 까닥거리며 팽강휘를 도발하는 기수식"

      - episode: 10
        character: "정광"
        quote: "더 오면 죽인다."
        context: "팽강휘가 집요하게 따라오자 살기 어린 목소리로 경고"

      - episode: 17
        character: "정광"
        quote: "그냥 다 죽일게요. 괜찮죠?"
        context: "백가상단을 습격한 혈사풍 도적들을 처리하기 전 허여민에게 양해 구함"

  적대_고수:
    description: "적대 고수 아키타입 - 정광과 대립하는 무림 고수들"
    speech_pattern_analysis: |
      - 자존심이 강하고 권위적인 어조
      - '~하마', '~느냐' 등 상대를 낮추는 종결어미
      - 도발에 쉽게 반응하며 감정적으로 변하는 패턴
      - 명문정파 출신은 예법을 중시하는 딱딱한 말투
      - 사파 출신은 상대를 깔보는 오만한 말투
      - 정광에게 당한 후 경악하며 말투가 급변하는 양상
    dialogue_excerpts:
      - episode: 30
        character: "영추자 (공동파 장로)"
        quote: "삼초(三招)를 양보하마. 오너라."
        context: "정광과의 비무에서 선배로서 삼초를 양보하겠다는 관례적 발언"

      - episode: 30
        character: "영추자"
        quote: "이런 살기를 뿜으면서 뭐가 어째?"
        context: "정광이 오래 놀고 싶다 하자 살기를 느끼며 반박"

      - episode: 17
        character: "혈사풍 부대주"
        quote: "네놈은 누구냐! 감히 우리가 누군지 알고 이런 짓을!"
        context: "정광에게 부하들이 몰살당하자 위세를 부리며 호통"

      - episode: 80
        character: "사파 사내 (진충)"
        quote: "대협! 전부 말씀드릴 테니 제발 살려주십시오!"
        context: "정광의 고문에 굴복하여 모든 정보를 토설하는 장면"

      - episode: 76
        character: "산적 두목"
        quote: "히, 히끅! 죄송합니다!"
        context: "정광에게 얻어맞은 후 공포에 질려 사죄하는 장면"

  동문_사형제:
    description: "동문/사형제 아키타입 - 곤륜파 정자배, 허자배 도사들"
    speech_pattern_analysis: |
      - 사형제 간 반말과 존댓말이 자연스럽게 혼용
      - '사형', '사제', '사백' 등 호칭이 빈번
      - 수련에 대한 고통과 보람이 대사에 반영
      - 정광에 대한 경외와 친근함이 공존
      - 도사답게 무량수불, 원시천존 등의 감탄사 사용
      - 유머러스하면서도 순박한 어조
    dialogue_excerpts:
      - episode: 3
        character: "정우 (대사형)"
        quote: "너 이 녀석. 정말 대단하구나."
        context: "정광에게 비무에서 얻어맞은 뒤 감탄"

      - episode: 4
        character: "허직 (사숙)"
        quote: "사형! 이 일을 어쩔 것이오!"
        context: "정광이 추운권을 변형한 것에 대해 허청에게 따지는 장면"

      - episode: 7
        character: "정소 (사형)"
        quote: "사부께서 몇 번이나 풀이해 주셨지만 이해가 안 간다니까."
        context: "내공심법 구결 해석에 막혀 정광에게 도움을 요청"

      - episode: 8
        character: "정현 (사형)"
        quote: "무량수불. 정진이라 합니다. 안 좋은 모습을 보여 드려 죄송합니다."
        context: "일주문에서 손님에게 인사하는 정자배 도사의 공손한 태도"

      - episode: 8
        character: "정진 (사형)"
        quote: "무량수불. 제가 지금 있는 이곳이 바로 선계(仙界)입니다."
        context: "곤륜에서 사는 것 자체가 행복이라는 도사다운 답변"

  문파_장문인:
    description: "문파 장문인 아키타입 - 곤륜파 장문인 운적"
    speech_pattern_analysis: |
      - 근엄하고 무게감 있는 말투
      - 장문인으로서의 책임감과 결단력이 대사에 반영
      - 겉으로는 무겁지만 내면은 소탈한 이중성
      - '~하오', '~겠소' 등 격식체 사용
      - 사형제들에겐 존대, 후배들에겐 자애로운 말투
      - 정광의 요구에 당황하면서도 수용하는 패턴
    dialogue_excerpts:
      - episode: 5
        character: "운적 (장문인)"
        quote: "나도 어린 시절엔 멋져 보이고 싶었다. 솔직히 아직도 그런 마음이 남아 있지."
        context: "정광의 멋진 무공 논쟁에서 솔직하게 자기 속마음을 밝히는 장면"

      - episode: 5
        character: "운적"
        quote: "정광아. 너를 믿는다."
        context: "장로회의의 마무리 발언으로 정광에 대한 신뢰 표명"

      - episode: 11
        character: "운적"
        quote: "그만들 하시오. 손님 앞에서 무슨 추태요?"
        context: "팽수원과의 비무를 서로 하겠다며 난장판이 된 장로들을 꾸짖음"

      - episode: 12
        character: "운적"
        quote: "맹을 재건한다면 맹주를 선출해야 할 터, 팽가주께서 그 자리에 앉으시려나 보군."
        context: "팽수원의 의도를 단번에 간파하는 날카로운 통찰"

      - episode: 15
        character: "운적"
        quote: "그래. 뭐든지 말해라."
        context: "정광이 운후를 살릴 수 있다 하자 무엇이든 지원하겠다는 결의"

  정파_사파_인사:
    description: "정파/사파 인사 아키타입 - 강호의 다양한 무림인들"
    speech_pattern_analysis: |
      - 정파 인사: 격식을 갖춘 정중한 어조, '소협', '도장' 등 존칭 사용
      - 사파 인사: 거칠고 직설적, 욕설과 위협이 섞인 말투
      - 상인 출신: 실리적이고 계산적인 화법
      - 개방(거지): 소탈하고 허세 없는 직설적 말투
      - 세가 자제: 자부심 강하고 패기 있는 말투
    dialogue_excerpts:
      - episode: 8
        character: "허청 (정광의 사부)"
        quote: "내 제자는 천재 중의 천재 정도가 아니라 고금제일(古今第一)천재라네."
        context: "팽수원에게 정광을 소개하며 자랑하는 팔불출 사부의 전형"

      - episode: 9
        character: "팽강휘 (하북팽가, 패룡)"
        quote: "소형제. 살살 할 테니 걱정 말게나. 흐흐."
        context: "정광에게 비무를 신청하며 여유를 부리는 장면"

      - episode: 40
        character: "후위진 (옥기린)"
        quote: "넌 앞으로 무엇을 할 것이냐?"
        context: "정광에게 미래의 포부를 묻는 장면"

      - episode: 60
        character: "양회 (개방 방주, 비천의개)"
        quote: "거지는 항상 배고프지."
        context: "정광이 배고프냐 묻자 거지답게 담백하게 답변"

      - episode: 13
        character: "팽강휘"
        quote: "그대 같은 영웅은 강호의 부름을 받을 수밖에 없는 운명이지."
        context: "정광에 대한 경외심을 담아 전음으로 보내는 말"

  여성_캐릭터:
    description: "여성 캐릭터 아키타입 - 작중 등장하는 여성 인물들"
    speech_pattern_analysis: |
      - 도우(여도우)들: '꺄아', '어머' 등 감탄사, 정광에 열광하는 팬심 표현
      - 허여민(백진환 아내): 남편에게 다정하면서도 강단 있는 말투
      - 당예지(사천당가): 냉랭하고 절제된 말투, 감정 표현이 극도로 절제됨
      - 진옥룡수호단: 조직적이고 호전적인 팬클럽 특유의 강경 어조
      - 일반 여성들은 정광의 외모에 열광하는 반응이 주
    dialogue_excerpts:
      - episode: 2
        character: "여도우"
        quote: "꺄아아! 깨물어주고 싶어!"
        context: "어린 정광을 보고 여도우들이 열광하는 장면"

      - episode: 17
        character: "허여민 (백진환 아내)"
        quote: "당신과 함께 다니는 게 좋다는 말이에요."
        context: "사막 여행 중 남편에게 다정하게 말하는 장면"

      - episode: 17
        character: "허여민"
        quote: "왜? 네놈도 꽂아줄까?"
        context: "도적에게 도를 꽂은 뒤 나머지 적들에게 도발하는 강인한 모습"

      - episode: 10
        character: "진옥룡수호단 단원"
        quote: "제발 이러지 마라니까! 당신 같은 사람들 때문에 우리까지 욕먹잖아!"
        context: "난입하는 팬을 제지하는 조직적인 팬클럽 활동"

      - episode: 51
        character: "당예지 (사천당가)"
        quote: "맛은 모르겠지만 효과는 좋을 겁니다."
        context: "정광에게 독에 대해 설명하며 절제된 유머를 보이는 장면"

  사부_제자_관계:
    description: "사부-제자 관계에서 나오는 특유의 대화 패턴"
    speech_pattern_analysis: |
      - 허청(사부)은 정광에 대한 맹목적 자랑이 특징
      - 정광은 사부에게 존댓말을 쓰되 내용은 거침없음
      - 서로에 대한 애정이 대사에 묻어나되 직접 표현은 꺼림
      - 허청의 팔불출 기질이 다른 인물과의 대화에서 극대화
    dialogue_excerpts:
      - episode: 2
        character: "허청"
        quote: "사제! 정광은 진짜 천재라네!"
        context: "온 곤륜을 뛰어다니며 제자 자랑하는 장면"

      - episode: 8
        character: "허청"
        quote: "저 녀석이 바로 천재 중의 천재를 뛰어넘는 고금제일천재인 내 제자라네. 짧게 진옥룡(眞玉龍)이라 부르게나. 으하하하!"
        context: "팽수원에게 정광을 소개하며 극한의 팔불출"

      - episode: 9
        character: "허청"
        quote: "내 제자가 바꾸었네."
        context: "곤륜 무공이 달라진 이유를 팽수원에게 설명하며"

      - episode: 13
        character: "허청"
        quote: "너라면...... 너라면 사부님을 살릴 수 있을 거다!"
        context: "운후가 쓰러지자 정광에게 달려가며"

      - episode: 4
        character: "허청"
        quote: "그래서 묻는 걸세. 어쩌라고?"
        context: "허직의 항의에 능구렁이처럼 대응하는 모습"
