# 파공검제 Few-shot 성공 예시 뱅크
# 100화 전문 분석 기반 선별 (2026-03-17)
# 카테고리별 2-3개, ★★★/★★ 등급만 수록

카테고리:

  전투_묘사:
    - episode: "EP004"
      등급: "★★★"
      원문: |
        동시에 윤종승의 단전 부위에서 붉은빛이 일어나더니 가슴께에서 크기가 증폭되며
        빠르게 뻗어가기 시작했다. 붉은 기운은 체내에서 일어나는 기의 흐름을 고스란히
        보여주듯 수태양소장경(手太陽小腸經)을 따라 순식간에 이동한다. 마침내 목검까지
        다다른 붉은빛이 그대로 이어질 경로를 밝히듯 허공을 가르며 떨어져 내렸다.
        물론, 이는 초견파공안이라는 능력을 가진 남궁천에게만 보이는 현상.
      선정_이유: >-
        초견파공안의 작동 원리를 시각적으로 묘사하면서 전투 예측과 회피를 자연스럽게
        연결. 경맥 명칭 활용으로 무협 고증 깊이를 더하며, 주인공의 고유 능력이 전투에서
        어떻게 발현되는지 최초로 보여주는 핵심 장면.

    - episode: "EP029"
      등급: "★★★"
      원문: |
        창궁대연검법의 검초와 막무가내식 개싸움이 뒤죽박죽 섞였다. 퍽! 촤악! 빠악!
        퍽! 촤촤악. '크악!' '아악!' 적을 때리는 타격감과 살을 베는 감각은 늘 짜릿하다.
        피비린내가 코끝을 스치니 전신의 감각이 깨어나며 환호성을 지르는 듯하다.
      선정_이유: >-
        다수 대결에서 명문 검법과 도망자식 날것의 싸움이 혼합되는 장면. 감각어(후각·촉각)의
        밀도가 높고, 주인공의 전생 도망자 정체성이 전투 스타일에서 폭발적으로 드러남.

    - episode: "EP093"
      등급: "★★★"
      원문: |
        은은한 붉은 기운이 꽃잎처럼 휘날리고 물방울이 사방에서 튀어오르니, 마치 수정
        알갱이 사이에서 매화가 흩날리는 듯하다.
      선정_이유: >-
        수중전의 시각적 아름다움과 전투의 아수라를 동시에 포착하는 이율배반적 묘사.
        감각어(시각·청각·촉각) 삼중 밀도. 화산파 검술의 미감을 배경으로 녹여낸 방식이
        수준급.

  경지_돌파:
    - episode: "EP017"
      등급: "★★★"
      원문: |
        단환을 우적우적 씹고 나자 배 속에서부터 대번 묵직한 기운이 느껴진다.
        구우우우우. 좋아. 딱 이 느낌이야. 단전에서부터 솟구쳐 오른 기운이 거침없이
        질주하기 시작한다. 확실히 거칠다. 천독노가 만든 영단은 대환단이나 소환단처럼
        부드럽지 않다. 전신 십이경맥을 마치 제집 안마당인 것처럼 뛰어다니며 마구
        설친다. 고삐 풀린 망아지가 따로 없다. 순간 백회혈에 다다른 거센 기운이
        정수리에서 꽝! 폭음을 울린다. 관자놀이를 타고 식은땀이 주르륵 흘러내린다.
      선정_이유: >-
        영단 복용으로 인한 공력 확장 과정을 신체 감각으로 생생하게 묘사. '고삐 풀린
        망아지'라는 비유가 직관적이며 독자 몰입을 유도. 주화입마 직전의 위기감까지
        함께 전달.

    - episode: "EP040"
      등급: "★★★"
      원문: |
        동시에 자리에 털썩 주저앉아서 내공을 운기하기 시작했다. 배 속에서 소화되기
        시작한 내단이 용트림을 하듯 기운을 뿜어낸다. (중략) 항문에 힘을 바짝 주자
        황금 기운이 생난리를 치면서 마지못해 끌려올라간다. 등줄기 쪽의 독맥을 타고
        천천히…… 하지만 확실하게 치고 오른다.
      선정_이유: >-
        대주천·소주천을 통한 내단 소화 과정을 생리적인 유머와 긴장감을 병치시키며 묘사.
        영약 복용 후 경지 돌파 씬을 유머러스하게 쓰면서도 무공 이론을 정확히 담아낸 사례.

    - episode: "EP098"
      등급: "★★★"
      원문: |
        '화의 극으로 금을 녹여 제련한다!' 심상을 떠올리자 남궁천의 전신 혈맥을 따라
        흐르는 공력이 점점 뜨거우면서도 단단하게 다져지는 듯하다. 창궁검법이 아무리
        기초 검법이라지만, 하나의 검법을 대성한다는 게 말처럼 쉬운 일이 아니다.
        웬만한 중소방파의 장문인들도 검법 하나를 대성하지 못한 채 팔 성 정도에 다다라
        생을 마감하는 경우가 허다하다.
      선정_이유: >-
        경지 돌파를 직접 선언하지 않고 관전자(남궁검)의 경악과 해설로 간접 제시하는
        방식이 탁월. 오행 심상법(화계로 금계를 제련)이라는 구체적 방법론 제시.

  사제_문파_관계:
    - episode: "EP002"
      등급: "★★★"
      원문: |
        '틀렸다.' 남궁천이 멈칫하고 돌아보았다. 남궁검은 그에게 시선조차 던지지 않은
        채 서책을 펼치며 말을 이었다. '하나가 틀렸으니 네 말은 모두 틀렸다.' '뭐가
        틀렸습니까?' 사락. 남궁검이 책장을 넘기며 무심한 목소리로 답했다. '네 아비는
        대살성이 아니었다.' '……!' 남궁천은 물론, 남궁화도 상기된 표정으로 그를
        돌아보았다. 이윽고 남궁검이 고개를 들고 남궁천과 두 눈을 마주했다. '세상이
        뭐라 해도 그 말은 믿어도 된다. 내가 직접 보았으니.' '……감사합니다.' 남궁천이
        허리를 깊이 숙였다. 영감, 막판에 감동 먹이네.
      선정_이유: >-
        냉랭하기만 하던 어른이 마지막에 아끼는 것을 드러내는 구조. 무심한 척 가족을
        보호하는 노인의 속내가 단 두 줄로 폭발적으로 표현됨.

    - episode: "EP023"
      등급: "★★★"
      원문: |
        '만약 죄 없는 내 생도들을 건드린다면…… 전 그게 누구든 용서할 생각이
        없습니다.' 순간 호덕창은 뻣뻣하게 굳은 채로 침을 꿀꺽 삼켰다. 아주 짧은
        순간이었지만, 비량의 눈빛이 휘몰아치는 북풍한설처럼 차갑게 느껴진 탓이다.
      선정_이유: >-
        평소엔 낭창하고 어벙하던 교관 비량이 생도 보호를 선언하는 순간 본모습을
        드러내는 장면. 사제 관계에서 교관의 진정한 책임감을 극적으로 구현.

    - episode: "EP085"
      등급: "★★"
      원문: |
        피가 물보다 진한 것을. '하여튼 영감이 꼭 막판에 감동을 먹인다니까.'
      선정_이유: >-
        조손 관계의 냉랭함과 혈육 정 사이의 긴장을 단 두 마디로 완성. 찻물
        소리→침묵→일격 한마디 구조가 절제미의 정수.

  음모_암투:
    - episode: "EP022"
      등급: "★★★"
      원문: |
        고양이 가면이 먼저 입을 열었다. 놀랍게도 옥구슬이 구르듯 아름다운 여인의
        목소리. 하나 목소리에 실린 기운은 북풍한설만큼이나 냉랭하다. '이러면 수지가
        안 맞아. 흑사.' '내가 할 말이다, 백묘. 계 교관은 낫질하는 녀석에게 당한 것
        같군.'
      선정_이유: >-
        정체불명의 복면 이인조가 시체를 감식하며 나누는 대화. 가면 이름(백묘·흑사)만으로
        캐릭터성을 구축하고 음모의 층위를 자연스럽게 열어젖힘. 간결하면서도 긴장감 있는
        암투 묘사의 교과서적 예.

    - episode: "EP063"
      등급: "★★★"
      원문: |
        '알겠느냐? 세상은 처음부터 기울어진 땅이다. 그 기울어진 땅을 평탄하게
        만들기 위해서라도 너는 우승을 해선 안 될 아이다. 그러니 너는 이 대회에서
        절대 우승할 수 없을 것이다.'
      선정_이유: >-
        표면적으로는 온화한 연설 뒤에 속내를 독자에게만 공개하는 극적 아이러니 기법의
        완성형. 맹주의 웃는 얼굴과 살의를 담은 독백의 대비가 악역의 음모를 가장
        효율적으로 드러냄.

    - episode: "EP095"
      등급: "★★★"
      원문: |
        사실과 거짓이 뒤섞인. 하나 거짓은 가려내기 힘들 정도로 희미하다. 때문에
        모든 것이 사실처럼 들린다. 그리고 맹주라는 신분은 이를 사실로 강요할 수
        있는 힘이 있었다. 사람들은 진실에 별로 관심이 없다네. 진실처럼 보이는
        행동에만 관심을 가질 뿐.
      선정_이유: >-
        권력자의 서사 조작 능력을 메타적으로 분석하는 드문 장면. 마지막 대사는 작품
        전체의 주제 의식을 한 문장으로 압축.

  화_도입부:
    - episode: "EP001"
      등급: "★★★"
      원문: |
        어차피 뒈지기 직전이니까 어디 한번 따져나 보자. 도대체 내가 뭘 그리
        잘못했나? 천하대살성(天下大殺性). 씹어 먹어도 시원찮을 무림맹은 나를 그렇게
        낙인찍었다.
      선정_이유: >-
        죽음 직전의 주인공이 독자에게 직접 말을 거는 파격적 도입부. 첫 문장부터
        구어체와 욕설을 섞어 강렬한 인상을 남기며, 세계관과 주인공 성격을 동시에
        소개. 웹소설 도입부의 교과서적 훅.

    - episode: "EP028"
      등급: "★★★"
      원문: |
        무한을 가로지르는 장강이 한눈에 들어오는 용천루 최상층. 꼴꼴꼴……. 술병을
        기울이자 화주가 맑은 소리를 내며 잔을 채운다. 모용강이 잔을 들고는 저 멀리
        펼쳐진 장강의 노을을 바라보았다. '아름답군.'
      선정_이유: >-
        배경(장강·노을·술)과 인물(모용강의 냉혹한 아름다움)을 절묘하게 겹치면서
        주변의 신음소리와 대비시켜 안타고니스트의 성격을 단번에 구축.

    - episode: "EP083"
      등급: "★★★"
      원문: |
        꿈을 꿨다. 남궁천은 전생으로 돌아가 다시 도망자의 삶을 살고 있었다. 이름도
        모를 어느 마을에서 이름도 모를 허름한 객잔에 앉아 국수 한 젓가락을 막 들
        때였다. 익숙한 냄새가 났다.
      선정_이유: >-
        꿈→현실→꿈의 중첩 구조로 전생 설정을 자연스럽게 재도입. "이름도 모를"의
        반복 구문이 도망자의 무명성을 강조. "국수 한 젓가락"이라는 생활 감각이
        서스펜스와 이질적으로 배치되어 긴장감 증폭.

  클리프행어:
    - episode: "EP040"
      등급: "★★★"
      원문: |
        '저, 저, 저 미친 새끼가 특급 영물을 처먹었어!' '뭐……?' 윤종승이 들고
        있던 금창약을 툭 떨어뜨렸다.
      선정_이유: >-
        금혈서 내단 복용이라는 위험천만한 행동을 클리프행어로 활용. 경악+코믹+서스펜스가
        동시에 작동하여 다음 화 기대감을 극대화.

    - episode: "EP096"
      등급: "★★★"
      원문: |
        전신에 흙먼지가 잔뜩 묻은 남궁천이 고개를 들더니 대연무장이 쩌렁쩌렁
        흔들리도록 외쳤다. '누구 마음대로 실격이래!'
      선정_이유: >-
        장례 연설 직후의 생환 등장이라는 최고 수준의 극적 반전. 대사 한 마디가
        캐릭터 전체를 규정.

    - episode: "EP063"
      등급: "★★"
      원문: |
        묵천악의 입가에 어딘지 야비한 미소가 걸렸다.
      선정_이유: >-
        맹주의 내면이 처음으로 노출되는 결정적 순간. 단 한 문장이지만 "야비한"이라는
        형용사가 맹주의 이미지를 완전히 뒤집음.

  정보_전달_무공체계:
    - episode: "EP003"
      등급: "★★★"
      원문: |
        초견파공안은 세 단계로 구분된다. 일행여초(一行如招). 이행각의(二行覺意).
        삼행일체(三行一體). 즉, 한 번 보고 행하면 초식을 어지간히 똑같이 흉내 낼
        수 있고, 두 번 행하면 진의를 깨우치며, 세 번째는 무공과 하나가 될 수
        있다는 뜻이다.
      선정_이유: >-
        주인공의 핵심 능력을 한자어 체계로 3단계로 나누어 설명하는 고전 무협 방식.
        정보량과 가독성의 균형이 뛰어남.

    - episode: "EP051"
      등급: "★★★"
      원문: |
        초견파공안이 색안(色眼)의 단계에 들어섰다는 점. 지금까지는 모든 상대의
        내공이 붉은빛으로 보였다면, 이젠 상대의 내공 성질에 따라 그 기운의 색이
        다르게 보인다.
      선정_이유: >-
        이능의 성장을 단계별로 설명하는 방식이 독자가 따라가기 쉬움. 독고진의 금계
        기운 탐지→화계 역용이라는 실전 활용까지 자연스럽게 연결.

    - episode: "EP072"
      등급: "★★★"
      원문: |
        무당파는 공력의 흐름을 최대한 자연스럽게 두며 몸과 조화를 이루고자 한다.
        물처럼, 바람처럼, 바위처럼. 그야말로 무위자연을 추구한다. 하나 무당파의
        무공이 점점 강맹해지면서 그들 역시 공력의 흐름에 인위성이 더해질 수밖에
        없었다.
      선정_이유: >-
        무당파 무공 체계를 도가 철학(무위자연)과 연결하여 설명하면서, 그 한계까지
        함께 서술. 리듬감 있는 직유가 독자의 이해를 도움.
