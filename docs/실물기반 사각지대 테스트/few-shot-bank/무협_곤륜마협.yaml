# 곤륜마협 few-shot 예시 뱅크
# 전 100화 분석 기반, 카테고리별 대표 장면 선별

카테고리:

  전투_묘사:
    - grade: "★★★"
      episode: 9
      excerpt: |
        투욱.
        정광이 검지를 까딱거리던 왼손으로 팽강휘의 주먹을 우아하게 젖혔다.
        쿵.
        그의 오른발이 반걸음 나가며 위엄 있게 진각을 밟았다.
        뽀각!
        오른팔이 접히며 멋지게 솟아오른 팔꿈치가 팽강휘의 옆구리를 찔렀다.
        "끄아아악!"
        뻔히 보이는데도 피할 수 없는 연환식!
        무언가 부러지는 듯한 소리와 함께 비명을 지르며 튕겨 나가는 팽강휘에게 정광의 신형이 쇄도했다.
        "저, 저런!"
        팽수원이 경악했다.
        마치 구름을 쫓는 용과 같은 모습 아닌가!
        정광은 진옥룡이라는 별호에 걸맞게 목소리마저 맑고 아름다웠다.
        "이 꽉 깨무세요!"
      reason: >
        추운권이라는 곤륜 기본 권법을 정광 특유의 화려한 방식으로 펼치는 첫 실전 장면이다.
        의성어와 짧은 동작 묘사를 교차하며 속도감을 만들고, '구름을 쫓는 용'이라는 비유로
        곤륜 무공의 미학을 시각적으로 전달한다. 마지막 대사 '이 꽉 깨무세요'가 정광의
        여유와 잔인함을 동시에 보여주는 인상적인 마무리다.

    - grade: "★★★"
      episode: 30
      excerpt: |
        정광은 눈앞에 있는 '복마'라는 이름을 지우기로 했다.
        허리에 찬 검을 뽑고 상청무상신공(上淸無上神功)을 일으켰다. 검신이 그 기운을 오롯이 머금어 희미하게 빛났다.
        정광은 검을 횡으로 그었다.
        일체의 변식도 없는 단순한 초식. 하지만 그 결과는 놀라웠다.
        촤아아아악-
        비단이 찢어지는 듯한 소리와 함께 고슴도치처럼 찔러오던 검들이 갈라졌다.
        그 틈으로 영추자의 하얗게 질린 얼굴이 드러났다.
      reason: >
        72초 복마신검이라는 상대의 대기를 일검으로 갈라버리는 압도적 격차의 전투 묘사.
        화려한 기술 대결이 아니라 '단순한 초식' 하나로 승부를 결정짓는 방식이
        정광의 경지를 극적으로 드러낸다. '비단이 찢어지는 듯한 소리'라는 청각 이미지가
        검기의 날카로움을 효과적으로 전달한다.

    - grade: "★★"
      episode: 18
      excerpt: |
        이건 싸움이 아니었다.
        일방적인 살육이었다.
        정광이 움직일 때마다 팔다리가 날아가고 피분수가 솟구쳤다.
        백가상단 사람들은 이런 생각을 했다.
        혈사풍, 지금에 딱 어울리는 이름이라고.
        그들의 피가 누런 모래를 붉게 물들였다.
        그 위를 정광이 바람처럼 휩쓸었다.
        차라리 웃으면서 살육을 벌이면 소름이 덜 끼치련만.
        정광의 표정은 담담했다.
        그저 할 일을 하는 모습이었다.
        그 모습이 더 두렵게 다가왔다.
      reason: >
        전생 진천마의 면모가 드러나는 학살 장면으로, 무협 전투 묘사의 극단을 보여준다.
        화려한 초식명 없이 결과만을 건조하게 나열하는 문체가 오히려 정광의 무서움을 부각시키며,
        '담담한 표정'이라는 역설적 묘사가 공포감을 극대화한다.

  경지_돌파:
    - grade: "★★★"
      episode: 6
      excerpt: |
        정광은 상청무상신공을 운기했다.
        내공을 움직여 그의 내부로 들어오고 있는 네 개의 진기를 건드렸다.
        크게 힘을 주는 건 아니다.
        톡톡 건드려서 방향만 바꿔준다.
        노도사들의 진기가 정광에 의해 다른 길로 향했다.
        장로1의 것이 장로2에게.
        장로2의 것은 장로3에게.
        장로3의 것이 장로4에게.
        장로4의 것은 장로1에게.
        그야말로 돌고 돌아 태극이다.
      reason: >
        태극회춘신공 창안 장면. 격체전력을 역이용하여 진기를 순환시키는 발상의 전환이
        정광의 전생 경험(태극검존)과 현생 지식(곤륜 무공)의 융합으로 탄생한다.
        '톡톡 건드려서 방향만 바꿔준다'는 담백한 서술이 오히려 기술의 정교함을 강조하며,
        1-2-3-4-1 순환 구조의 시각적 나열이 태극의 원리를 직관적으로 전달한다.

    - grade: "★★★"
      episode: 2
      excerpt: |
        운후가 정광의 명문혈에 손을 댔다.
        정광이 운기를 시작하자 그의 눈이 점점 커졌다.
        '소주천도 아니고 대주천을?'
        순식간에 대주천을 이룬 정광이 다음 단계로 나아갔다.
        진기가 돌고 돌아 합쳐지며 소청(小淸)이 아닌 태청(太淸)을 이루었다.
        '말도 안 돼!'
        운후가 경악하는데 정광이 운기를 멈췄다.
        시작도 마무리도 뜻이 서면 이루어지는 의념의 경지였다.
        "사조님. 이게 태청이죠?"
        운후가 얼빠진 얼굴로 고개를 끄덕였다.
        "그럼 태청기공은 배울 필요 없겠네요. 한 번에 가게 상청무상신공(上淸無上神功) 가르쳐 주세요."
      reason: >
        소청기공을 독학으로 태청까지 도달한 정광의 비범함이 드러나는 핵심 경지 돌파 장면.
        '뜻이 서면 이루어지는 의념의 경지'라는 한 문장이 전생 천마신교 교주였던
        정광의 내공 운용 수준을 압축적으로 보여주며, 단계를 건너뛰겠다는 당돌한 요청이
        이 작품 특유의 유머와 천재성을 동시에 전달한다.

    - grade: "★★"
      episode: 80
      excerpt: |
        정광은 삼청합일신공(三淸合一神功)의 구결을 떠올렸다.
        곤륜의 개파조사가 창안한 내공심법으로 지금껏 익힌 이가 없는 괴공(怪功)이었다.
        '뜬구름도 적당히 잡아야지.'
        이놈의 구결은 도통 무슨 말인지 알아들을 수가 없을 지경이었다.
        하지만 정광은 달랐으니.
        삼청이 합쳐진 게 자신이라는 개파조사의 오만한 자랑질이 가득한 무공서였다.
        '조금만 기다리시오. 내가 더 좋게 탈바꿈시킬 테니.'
        단전의 진기가 모두 깨어나 전신의 기맥을 타고 휘돌기 시작했다.
      reason: >
        삼청합일신공이라는 최상위 내공심법의 진의를 간파하는 장면. 다른 도사들이
        도경으로만 이해했던 것을 정광이 '개파조사의 자랑질'이라 꿰뚫어보는 시각이
        전생의 경험에서 나온 통찰력을 보여주며, 개파조사와의 가상 대화 형식이
        이 작품 특유의 위트를 살린다.

  사제_문파_관계:
    - grade: "★★★"
      episode: 1
      excerpt: |
        "바르게 커다오."
        "……웅?"
        "허허. 녀석, 놀라기는. 너무 무리한 부탁이더냐?"
        "……."
        "그래. 욕심이 과했구나. 사람마다 기준이 다른데 바르다는 건 정말 어려운 일이지."
        그의 눈매가 부드럽게 휘었다.
        "정정하마. 네가 바르다 믿는 일은 끝까지 지키는 사람이 되어다오."
        그는 정광의 대답을 듣지 않고 머리를 부드럽게 쓰다듬었다.
        "부탁한다."
        부탁이라기보단 그렇게 커줬으면 하는 바람이었다.
      reason: >
        운후가 갓난아이 정광에게 건네는 첫 부탁이자 작품 전체를 관통하는 주제의 씨앗.
        '바르게 커다오'에서 '네가 바르다 믿는 일을 끝까지 지켜라'로 정정하는 과정이
        곤륜의 덕성(德聖)다운 겸양과 지혜를 보여준다. 이 대사는 14화의 운후 치료 장면,
        75화의 중원행 결정 등 작품 전체에서 반복 인용되며 정광의 행동 원칙이 된다.

    - grade: "★★★"
      episode: 75
      excerpt: |
        허청은 뒤돌아보지 않았다.
        대신 그의 입에서 약간 떨리는 목소리가 흘러나왔다.
        "……그래. 강호는 험하다. 항상 몸조심하거라."
      reason: >
        정광과 백승무를 강호로 떠나보내는 허청의 이별 장면. 단 두 문장으로 사부의
        복잡한 감정 - 걱정, 믿음, 아쉬움 - 을 압축한다. '뒤돌아보지 않았다'는
        행동 묘사와 '약간 떨리는 목소리'의 대비가 무인다운 절제와 인간적 감정을
        동시에 전달하는 수작이다.

    - grade: "★★"
      episode: 40
      excerpt: |
        허청은 마음을 비우고 가르쳤다. 간혹 답답하고 허탈할 때도 있었지만 백승무는 이를 악물고 따라왔다.
        사실 허청으로서는 당연한 일이었다. 정광이라는 천재를 제자로 두어 가르치는 재미를 못 느꼈었던 그였다. 그런 그에게 백승무라는 범재는 하늘이 내린 최고의 제자였던 것이다.
        "자! 이렇게 하는 거다, 제자야!"
        "죄송합니다. 아직도 이해가……."
        "으하하! 사람다워서 좋구나! 걱정하지 말고 천천히 따라 해봐라."
      reason: >
        천재 제자(정광) 다음에 범재 제자(백승무)를 받은 허청의 사부로서의 성장을
        보여주는 장면. 가르치는 재미를 못 느꼈던 사부가 '사람다워서 좋다'며 기뻐하는
        반전이 사제 관계의 본질 - 서로를 통해 성장한다 - 을 담백하게 전달한다.

  음모_암투:
    - grade: "★★★"
      episode: 70
      excerpt: |
        정광의 몸이 흐릿해지더니 어둠과 동화되었다.
        전생에 익혔던 무공, 칠야마영(漆夜魔影)이었다.
        전생에는 어둠 속에 몸을 숨긴 채 적을 쳐 죽이는 용도로 사용한 마공이었건만.
        '나도 정파인 다 됐네.'
        현생에는 남의 짐을 덜어주는 공명정대한 무공으로 사용하는 정광이었다.
      reason: >
        남궁세가의 뇌물을 가로채는 장면에서 정광의 이중성이 극적으로 드러난다.
        마공 칠야마영을 '남의 짐을 덜어주는 공명정대한 무공'이라 자기합리화하는
        내면 독백이 이 작품 특유의 블랙 유머를 완성하며, 전생의 마도 기술을
        현생의 정파적 목적에 전용하는 설정이 캐릭터의 복합성을 보여준다.

    - grade: "★★"
      episode: 25
      excerpt: |
        정광의 입이 열리고 모두가 기함할 만한 말이 흘러나왔다.
        "내가 저들을 다치게 했다? 증거 있어요?"
        "……이 참상은 그럼 누구의 소행이란 말이오!"
        "내가 어떻게 알아요? 와보니 자기들끼리 알아서 쓰러지고 있던데."
        "말도 안 되는 소리! 그대가 나타나며 섬광이 터졌소이다. 검광이 분명하지 않소?"
        정광이 콧방귀를 뀌었다.
        "검광은 무슨. 따가운 햇살이지."
        모두 하늘을 쳐다봤다.
        먹구름만 가득했다.
      reason: >
        주연표국(사파 위장 조직)과의 대치에서 정광이 뻔뻔한 논리전을 펼치는 장면.
        상대의 수법을 그대로 되돌려주는 구성이 정파 세계의 위선적 논리 구조를 풍자하며,
        '따가운 햇살' 뒤에 '먹구름만 가득했다'는 상황 묘사가 날카로운 웃음을 선사한다.

    - grade: "★★"
      episode: 100
      excerpt: |
        정광은 장원 중앙에 있는 높은 전각을 보며 중얼거렸다.
        "이래도 안 나오시겠다?"
        그의 발이 경쾌하게 움직였다.
        "내가 가지 뭐."
      reason: >
        사마련 본거지를 단독으로 습격하기 직전, 마공으로 전환한 정광의 담담한 선전포고.
        '경쾌하게'라는 부사가 학살 직전의 분위기와 극적으로 대비되며,
        전생 진천마의 행동 양식이 현생에서 재현되는 순간을 짧고 강렬하게 포착한다.

  화_도입부:
    - grade: "★★★"
      episode: 17
      excerpt: |
        가도 가도 똑같았다.
        모래로 된 수평선이 끝없이 이어졌다.
        백진환은 내심 한숨을 쉬었다.
        '정말 못 할 짓이군.'
        그만 그런 마음이 아니었나 보다.
        옆에서 나란히 가던 아내 허여민이 농을 던졌다.
        "사막도 계속 걸으면 멀미가 나는 줄 몰랐네요."
        "저런. 등이라도 두드려 주오?"
        "벌써 몇 번 토했는걸요."
        "하하. 농을 하는 걸 보니 아직 기운이 있나 보오."
        "어머. 진짠데."
      reason: >
        주인공 정광이 아닌 백진환 부부의 시점으로 시작하는 파격적인 도입부.
        사막이라는 극한 환경에서 부부가 농담을 주고받는 장면이 일상적 따뜻함을 전달하면서도,
        이후 벌어질 혈사풍과의 전투를 위한 평화로운 대비를 만든다.
        새로운 인물 소개와 세계관 확장을 자연스럽게 수행하는 도입의 교본이다.

    - grade: "★★"
      episode: 8
      excerpt: |
        곤륜산은 높고 험했다.
        안 그래도 불만이 많았던 장대한 체구의 청년은 자신도 모르게 투덜거렸다.
