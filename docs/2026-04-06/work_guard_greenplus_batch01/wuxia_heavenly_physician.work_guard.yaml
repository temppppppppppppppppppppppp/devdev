work_identity:
  work_type: wuxia
  family: wuxguide
  one_line_truth: >-
    무공 자질 없는 명문 무가 막내가 침술=무공의 의무일체를 개척해,
    치료할 수 있는 손의 희소가치로 가문·무림·독역의 관문을 동시에 장악한다
  protagonist_weapon:
    - 의맥으로 환자의 독맥·경혈·독역 경로를 동시에 읽는 진단력
    - 활침과 살침이 같은 기술이라는 사실을 아는 유일한 인과
    - 치료 4단계(진단→처방→시술→경과) 전 과정을 전투에 전용하는 실행력
  business_axes:
    - 경지 돌파 (침의→혈의→맥의→신의→의성→의신→천의)
    - 약재 확보·배합 (약왕곡 쟁탈)
    - 환자 네트워크 (치료 실적 → 세력·정보·비급 접근권)
  control_axes:
    - 가문 내 공인 의원 자격 · 약방 접근권 · 서고 접근권
    - 무림 의선 반열 (의선 대회 우승 → 천하 명의 인정)
    - 독역 치료 독점권 (유일한 해법 보유자)
    - 진가장 발언권 (의술 가치에 비례하는 위계 상승)
  mandatory_lexicon:
    - 의무일체
    - 활침
    - 살침
    - 칠성침법
    - 경지
    - 독역
    - 경혈
    - 약침
    - 의맥
    - 보호패 (가문 내 조건부 공인 자격)
  forbidden_flattenings:
    - 회개물 스타트
    - 비굴한 해명 / 인정 구걸
    - 자기연민 소비 (성인군자형 호구 포함)
    - success → pure punishment spiral
    - 주인공 고유성 없는 대형 성과
    - 활약 후 태도 변화 없음
    - 위기 때 빈손 / 무대응 / 무보상
    - 치료 장면을 한 줄 기적치료로 처리
    - 침술·경혈 명칭 임의 창작
    - 의술 비무를 일반 전투로 환원
    - 독역 확산 메커니즘 편의 변경
    - 약재 획득·배합 추상화
    - wuxia에 business-power vocabulary 이식
    - 가문 갈등을 치정 가족극으로 변질
  tracking_slots:
    - 저평가(사술쟁이 낙인) → 고평가(천하 명의) 전환
    - 가문 내 권한 회수 (축출 대상 → 공인 의원 → 핵심 발언권)
    - 경지 7단계 돌파 진행
    - 독역 치료 독점 병목 형성 (소백 없이 해결 불가)
  mandatory_scene_engines:
    - 치료 씬에서 진단→처방→시술→경과 4단계가 온전히 구동되며, 활침의 고유 인과가 증명되는 장면
    - 의술 비무에서 경혈 공방+독/해독 공방의 이중 레이어가 활침=살침 동일 기술임을 증명하는 장면
    - 치료 성공 직후 평가 수정이 찍히는 장면 (호칭·자격·접근권·경계 수위 변화)
  protagonist_evaluation:
    admiration_axes:
      - 남들보다 먼저 독맥·경혈 패턴을 읽음
      - 비굴하지 않음 — 오만할 수 있어도 구걸하지 않음
      - 치료와 전투를 하나의 기술로 집행하는 유일한 존재
      - 위기에서 최소 피해를 통제하며 반격 자산을 확보함
      - 결과로 인정을 강제함 — 설명 대신 침으로 증명
    forbidden_praise_patterns:
      - 불쌍해서 챙겨준다
      - 착해서 인정한다
      - 성실해서 언젠가 보답받는다
      - 우연히 잘 풀렸다
      - 참고 견뎌서 대단하다
    observer_tiers:
      - 넷째 형 진소풍 (첫 환자 → 최대 아군)
      - 둘째 누나 진혜란 (가문 내 방패)
      - 정파 의선 엽천수 (정통 의술 스승)
      - 적대자 독왕 사마련 (경계 → 경외)
      - 아버지 진천웅 (냉대 → 묵인 → 화해)
      - 무림 전체 (사술쟁이 → 천하 명의)
    evaluation_thresholds:
      - 3~6화 내 형 치료 성공 + 조건부 공인 의원 자격 획득
      - 첫 치료 직후 호칭·접근권·보호 태도 변화
      - 큰 피해(경맥 손상·스승 상실) 뒤 즉시 새 경지 돌파 또는 다음 카드 확보
  role_fit_constraints:
    - name: 스승 대행 금지
      role: 백무명 / 엽천수
      disallowed_actions:
        - 주인공 대신 핵심 진단·처방 완성
        - 경지 돌파를 스승이 직접 시켜 줌
      exceptions:
        - 힌트·단서 제공은 허용하되 최종 실행은 소백이 한다
    - name: 조력자 감화 선행 금지
      role: 조력자 전반
      disallowed_actions:
        - 이유 없는 선의 지원
        - 감화 이전에 소백 편에 서기
      exceptions:
        - 계산상 소백 편에 서는 선택
    - name: 적대자 바보 패배 금지
      role: 사마련 / 좌천명
      disallowed_actions:
        - 바보처럼 져주기
        - 동기 없는 악행
      exceptions:
        - 인센티브·구조·타이밍에 의한 합리적 패배
custom_rules:
  - 치료는 항상 자기이익(경지·비급·세력·원수 제거·정보)과 연결된다 — 대의명분만의 치료 금지
  - 위기는 피해 연출보다 우선순위 선택권 증명으로 사용한다
  - 반격 예약 없는 손해는 금지
  - 설명이 리듬을 깨면 '운이 좋군'으로 절감할 수 있다
  - 독역은 내공이 높을수록 치명적이라는 역전 법칙을 편의상 흐리지 않는다
