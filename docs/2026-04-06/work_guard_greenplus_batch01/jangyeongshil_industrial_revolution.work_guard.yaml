work_identity:
  work_id: jangyeongshil_industrial_revolution
  work_type: althistory_possession
  family: blockguide
  one_line_truth: 현대 공학 교수가 관노 장영실으로 빙의해, 경험칙 3년을 도면 한 장으로 이기고, 신분이 아니라 설계의 정확도로 평가를 뒤집어 발언권과 설계권과 검수권을 쥐고, 끝내 이 사람 없이는 나라 인프라가 안 돌아가는 자리까지 올라간다
  protagonist_weapon:
    - 현대 열역학/유체역학/재료공학에 기반한 설계 역산 — 원리에서 출발해 부품 공차까지 지정하는 도면
    - 경험칙으로 3��� 걸릴 시행착오를 도면 한 장으로 건너뛰는 정보격차
    - 15세기 재료 한계를 이해한 적응 설계 — 현대 지식만이 아니라 당대 제약 안에서의 최적해
  authority_axes:
    - 설계 책임권 (도면에 "장영실 제(製)"가 붙는다)
    - 도면 표준 제정권 (궁중 기술 문서의 공식 표기법)
    - 기술 보안 결재권 (핵심 도면 열람/복제 승인)
    - 핵심 부품 검수 최종 결재권 (조정 규칙)
    - 기술소 제조(提調) 직권 (관청 수장)
    - 자재 배분 결재권 (기술 자재가 기술소 경유)
  control_axes:
    - 도면 표준 독점 (영실을 빼면 기존 도면 해독 불가)
    - 검수 결재선 제도화 (가마 사건 이후 조정이 만든 안전장치)
    - 제자 라인 (김순 등이 영실 표기법으로만 훈련)
    - 자재 배분 경로 (기술 자재가 기술소 경유)
    - 부서 의존도 (호조/공조/관상감/병기창/광산/인쇄소가 영실 없이 움직이지 못함)
  mandatory_lexicon:
    - 도면
    - 공차
    - 설계 역산
    - 검수
    - 결재선
    - 기술소
    - 표준
    - 면천
    - 제조(提調)
    - 승인
  forbidden_flattenings:
    - 왕의 총애 미담 (세종은 은인이 아니라 기술의 실용가치를 아는 투자자)
    - 문명건설 카탈로그 (발명품 나열이 목적이 되면 안 됨)
    - 감동 위인전 (조선의 레오나르도 다빈치 서사 금지)
    - 자기연민 소비 (세종 없으면 나는 아무것도 못 한다)
    - 장광설 (주인공이 자기 유능함을 설명)
    - 도덕적 거부 (윤리만으로 군사화 압력에 대응)
    - 회개물 스타트
    - 비굴한 해명 / 인정 구걸
    - success → pure punishment spiral
    - 주인공 고유성 없는 대형 성과 (설계 역산 인과 없는 승리)
    - 활약 후 태도 변화 없음 (성과 뒤 서열/권한 보상 누락)
    - 위기 때 빈손 / 무대응 / 무보상
    - 소재 설명이 주인공 얼굴을 먹음 (기�� 해설 > 주인공 행동)
    - 세종 사후 무력화 (4축 제도 인프라가 작동해야 함)
  tracking_slots:
    - 도면 승리 진척 (경험칙을 도면으로 이기는 장면 카운트)
    - 서열 변화 영수증 (매 발명 뒤 누가 허락을 구하게 됐는가)
    - 4축 제도 인프라 진척 (도��� 표준/검수 결재선/제자 라인/자재 배분권)
    - 부서 의존도 확장 (영실 없이 움직이지 못하는 부서 수)
    - 세종 의존 → 제도 의존 전환도
  mandatory_scene_engines:
    - 도면 한 장으로 경험칙을 이기는 장면 (매 Arc 최소 1회)
    - 발명 직후 태도 변화 + 자리 변화 + 다음 문이 붙는 장면 (발명→태도→자리→문 4단 공식)
    - 위기에서 물증/산출표를 제출하고 입을 닫는 장면 (도면이 말하고 주인공은 침묵)
    - 성과 직후 보상 부착 (이름/자리/결재권/접근권 중 하나 + 다음 전장 입장권)
  protagonist_evaluation:
    admiration_axes:
      - 남들보다 먼저 읽음 (응력 집중점, 유출 징후, 정치 신호)
      - 도면의 정확도로 평가��� 강제함 (경험칙을 이기는 결과)
      - 설명하지 않음 (도면이 말하고 입을 닫는 태도)
      - 15세기 제약 안에서의 최적 적응 설계
      - 제도로 자리를 심음 (세종 개인이 아니라 조정 시스템에 권한을 고정)
    forbidden_praise_patterns:
      - 불쌍해서 챙겨준다
      - 착해서 인정한다
      - 세종이 좋아해서 당연하다
      - 우연히 잘 풀렸다
      - 참고 견뎌서 대단하다
      - 현대 지식을 외웠으니 당연하다
    observer_tiers:
      - 이천 / 관상감 기술자 (첫 재평가 — 도면이 경험을 이김)
      - 호조 / 공조 / 집현전 관리 (의존도 체감 — 영실 없이 보고서 못 올림)
      - 보수파 / 최만리 (경계 → 제도의 필요성 인정)
      - 세종 (투자자의 검증 — 총애가 아니라 결과 확인)
      - 수양대군 (위험한 인정 — 영실 없이 안 돌아간다는 현실)
    evaluation_thresholds:
      - Block 7 도면으로 이천의 태도 전환 → 첫 재평가
      - Block 9 자격루 설계 책임자 이름 등재 → 첫 이름
      - Block 18 종3품 + 제안권 → 공식 자리
      - Block 40 기술소 관청화 → 제도적 보장
      - Block 49 검수 결재선 조정 규칙 → 4축 완성
      - Block 67 세종 사후 기술소 존속 → 독립 엔진 검증
  role_fit_constraints:
    - name: 세종 선행 금지
      role: 세종
      disallowed_actions:
        - 영실 대신 핵심 기술 판단을 완성
        - 영실 없이 기술 프로젝��를 독립 추진
        - 은혜를 베푸는 성군 미담
      exceptions:
        - 영실의 도면이 맞은 것을 확인하고 다음 무대를 여는 것은 허용
        - 탄핵 논의를 조정에 부치는 것은 허용 (혼자 결정하지 않음)
    - name: 이천 캐리커처 금지
      role: 이천
      disallowed_actions:
        - 무능해서 지는 장면
        - 시기심만으로 동기 부여
      exceptions:
        - 경험칙이 도면에 진 것은 허용 — 무능이 아니라 방법의 차이
        - 손익 계산으로 협력하는 것은 허용
    - name: 최만리 캐리커처 금지
      role: 최만리
      disallowed_actions:
        - 멍청한 수구꼴통으로 묘사
        - 개인적 악의만으로 동기 부여
      exceptions:
        - 이전 시대의 정답을 믿어서 저항하는 것은 허용
        - 가마 사건 후 제도의 필요성을 인정하는 것은 허용
    - name: 조력자 감화 금지
      role: 조력자 (김순, 정인지, 신숙주 등)
      disallowed_actions:
        - 이유 없는 선의 지원
        - 감화 이전에 붙는 동맹
      exceptions:
        - 도면 결과를 보고 계산상 영실 편에 서는 선택
custom_rules:
  - 매 발명은 반드시 '발명 → 태도 변화 → 자리 변화 → 다음 문' 4단 공식을 거친다
  - 매 블록의 질문은 '뭘 만들었나'가 아니라 '누가 허락을 구하게 됐나'
  - 반격 예약 없는 손해는 금지
  - 설명이 리듬을 깨면 '운이 좋군'으로 절감할 수 있다
  - 위기에서 물증/산출표를 제출하고 입을 닫는다 (장광설 금지)
  - 세종 의존을 제도 의존으로 전환하는 축을 매 Arc에서 진행한다
  - 세종 사후에도 4축 독립 엔진이 작동해야 한다
  - 도덕적 거부가 아니라 산출(피해 > 이득)로 밀어붙인다
  - 대체역사 설명이 주인공 행동보다 길어지면 안 된다
