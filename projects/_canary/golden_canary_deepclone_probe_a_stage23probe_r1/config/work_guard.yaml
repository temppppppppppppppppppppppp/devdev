  one_line_truth: 고독사한 재벌가 막내가 18년치 경제 캘린더와 exit 설계 감각으로 모두가 늦었다고 할 때 먼저 사고 먼저 팔며, 첫 proof를 private receipt와 접근권으로 잠가 결국 가문이 막내의 방화벽과 운용 규칙 안으로 들어오게 만든다
  protagonist_weapon:
    - 18년치 경제 캘린더 기억과 이벤트가 가격에 반영되기 전 출구부터 먼저 설계하는 감각
    - 과열장에서는 먼저 팔고 붕괴장에서는 먼저 유동성을 쥐는 cycle reading
    - 가족 자산과 개인 자산 사이에 방화벽을 세우고 도움과 운용권을 분리하는 거버넌스 집착
  business_axes:
    - 매크로 이벤트 선점 (원자재, 금융위기, 플랫폼, 크립토, 테슬라, AI)
    - 자본 운용 (선물, 주식, CDS, OTC, ETF)
    - 디스트레스 유동성 우위
    - 패밀리오피스 구조화
    - 자산을 관계와 거버넌스로 환전하는 후반 전환
  control_axes:
    - 포지션 진입/청산 결정권
    - 배분 우선권과 딜 접근권
    - 독립 법인과 운용 방화벽
    - 패밀리오피스 운용권
    - 가족 자산 유입 조건 설정권
    - named seat와 우선 응답권
  mandatory_lexicon:
